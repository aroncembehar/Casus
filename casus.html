 translations:{
   fr:{
     abstract:{
       issue:"Un ressortissant d'un État membre, résidant légalement en tant qu'étudiant dans un autre État membre, peut-il invoquer la citoyenneté de l'Union pour prétendre à la même aide sociale que les propres ressortissants de l'État d'accueil ?",
       rule:"La citoyenneté de l'Union a vocation à être le statut fondamental des ressortissants des États membres, permettant à ceux qui se trouvent dans la même situation de bénéficier du même traitement juridique, indépendamment de leur nationalité, sous réserve des exceptions expressément prévues.",
       application:"M. Grzelczyk résidant légalement en Belgique en tant qu'étudiant, il pouvait invoquer le principe de non-discrimination attaché à ce statut de citoyen, et la Belgique ne pouvait lui refuser le minimex au seul motif qu'il n'était pas belge."},
     intermediate:{
       issue:"Rudy Grzelczyk, ressortissant français, s'installa en Belgique en 1995 pour étudier l'éducation physique à l'Université catholique de Louvain-la-Neuve. Il finança lui-même ses trois premières années d'études, grâce à des emplois d'appoint et à des facilités de crédit, sans recourir à une prestation sociale belge.<br><br>Sa quatrième et dernière année d'études ne lui laissa pas la même possibilité de travailler ; il sollicita donc du centre public d'aide sociale local (le CPAS) le bénéfice du minimex, l'allocation belge de revenu minimum. Le CPAS la lui accorda — mais le ministre belge compétent l'informa ensuite qu'il n'en serait pas remboursé, M. Grzelczyk, étudiant étranger, ne relevant d'aucune catégorie que le droit belge reconnaissait comme ouvrant droit au minimex. Le CPAS retira alors la prestation pour le même motif.<br><br>M. Grzelczyk contesta ce retrait devant une juridiction du travail belge, qui demanda à la Cour de justice si la citoyenneté de l'Union et le droit de la libre circulation obligeaient la Belgique à le traiter comme un étudiant belge placé dans sa situation.",
       rule:"La Cour jugea qu'un citoyen de l'Union résidant légalement dans un autre État membre, comme l'était M. Grzelczyk, relève de la protection du traité contre la discrimination fondée sur la nationalité, sans devoir démontrer un lien économique distinct avec l'État d'accueil.<br><br>Elle alla plus loin, qualifiant la citoyenneté de l'Union de statut « ayant vocation à être le statut fondamental des ressortissants des États membres », permettant à ceux qui se trouvent dans la même situation d'obtenir le même traitement juridique, indépendamment de leur nationalité. Sur cette base, la Belgique ne pouvait subordonner une prestation telle que le minimex, pour un ressortissant d'un autre État membre légalement résident, à la qualité de « travailleur » — une condition qu'elle n'imposait pas à ses propres ressortissants.<br><br>La directive régissant le droit de séjour de M. Grzelczyk en tant qu'étudiant ne lui garantissait pas elle-même le minimex, mais elle ne l'empêchait pas non plus de recourir à l'aide sociale belge en cas de difficultés réelles et temporaires — la directive elle-même admettant, selon les termes de la Cour, « un certain degré de solidarité financière » entre les ressortissants de l'État d'accueil et ceux des autres États membres.",
       application:"M. Grzelczyk avait droit au minimex dans les mêmes conditions qu'un étudiant belge placé dans sa situation ; sa seule nationalité ne pouvait justifier le retrait.<br><br>L'arrêt n'accorda pas pour autant aux citoyens économiquement inactifs un droit inconditionnel aux prestations sociales de l'État d'accueil — les États peuvent toujours exiger, en amont, la preuve de ressources suffisantes, et peuvent toujours agir dès lors que le recours d'un étudiant à l'aide publique cesse de paraître simplement temporaire."},
     detailed:{
       issue:"Rudy Grzelczyk, ressortissant français, entama des études universitaires en éducation physique à l'Université catholique de Louvain-la-Neuve en 1995, et s'établit en Belgique à cette fin. Durant ses trois premières années d'études, il subvint à ses besoins grâce à divers emplois d'appoint et à des facilités de crédit, sans recourir à une prestation sociale belge.<br><br>Sa quatrième et dernière année d'études, en 1998-1999, plus exigeante, ne lui laissa pas la même possibilité de travailler. Il sollicita du Centre public d'aide sociale (CPAS) d'Ottignies-Louvain-la-Neuve le bénéfice du minimex, l'allocation belge de revenu minimum garanti, non contributive. Le CPAS la lui accorda à compter du 5 octobre 1998.<br><br>Le droit belge prévoyait normalement un remboursement par l'État fédéral de 50 % des sommes versées par le CPAS au titre du minimex, mais le ministre compétent refusa ce remboursement au motif que M. Grzelczyk, étudiant étranger, ne relevait d'aucune des catégories — ressortissants belges, apatrides, réfugiés, ou personnes couvertes par le règlement n° 1612/68 relatif à la libre circulation des travailleurs — que le droit belge exigeait pour l'octroi du minimex. Face à ce refus, le CPAS décida lui-même de retirer le minimex à M. Grzelczyk, avec effet au 1er janvier 1999, pour le même motif.<br><br>M. Grzelczyk contesta ce retrait devant le Tribunal du travail de Nivelles, qui sursit à statuer et posa deux questions préjudicielles à la Cour de justice sur le fondement de l'article 234 CE, portant sur l'interprétation des articles 6, 8 et 8 bis du traité CE — respectivement le principe général de non-discrimination, la citoyenneté de l'Union, et le droit de circuler et de séjourner librement — ainsi que de la directive 93/96/CEE du Conseil relative au droit de séjour des étudiants.",
       rule:`La Cour affirma d'abord qu'un ressortissant d'un État membre séjournant légalement sur le territoire d'un autre État membre, comme l'était M. Grzelczyk en vertu de la directive 93/96, relève du champ d'application ratione materiae du traité aux fins du principe de non-discrimination de l'article 6 CE, sans devoir démontrer un lien économique supplémentaire avec l'État d'accueil, tel que la qualité de travailleur.<br><br>Elle énonça ensuite ce qui est devenu la formule emblématique de l'arrêt : le statut de citoyen de l'Union, introduit par l'article 8 CE, « a vocation à être le statut fondamental des ressortissants des États membres permettant à ceux parmi ces derniers qui se trouvent dans la même situation d'obtenir, indépendamment de leur nationalité et sans préjudice des exceptions expressément prévues à cet égard, le même traitement juridique » (point 31). Sur cette base, les articles 6 et 8 CE s'opposaient à ce qu'un État membre subordonne l'octroi d'une prestation non contributive telle que le minimex, pour des ressortissants d'autres États membres légalement résidents, à la condition de relever du champ d'application du règlement n° 1612/68, alors qu'aucune condition équivalente n'était imposée aux propres ressortissants de l'État d'accueil.<br><br>S'agissant spécifiquement de la directive 93/96, la Cour jugea que si celle-ci ne confère par elle-même aucun droit au minimex, elle n'empêche pas non plus un étudiant légalement résident d'avoir ultérieurement recours au régime d'aide sociale de l'État d'accueil. Un État membre peut exiger, comme condition du droit de séjour initial, une déclaration attestant que l'étudiant dispose de ressources suffisantes pour ne pas devenir une charge — mais cette appréciation ne doit être portée qu'au moment où la déclaration est faite, la situation financière d'un étudiant pouvant évoluer dans le temps pour des raisons indépendantes de sa volonté. Lue avec les directives parallèles 90/364 et 90/365 relatives au droit de séjour d'autres citoyens économiquement inactifs, la directive 93/96 « admet ainsi un certain degré de solidarité financière entre les ressortissants de l'État membre d'accueil et ceux des autres États membres, en particulier lorsque les difficultés rencontrées par le bénéficiaire du droit de séjour sont d'ordre temporaire » (point 44).`,
       application:"M. Grzelczyk avait droit au minimex dans les mêmes conditions qu'un étudiant belge placé dans une situation identique ; le CPAS et le ministre compétent ne pouvaient le lui retirer au seul motif qu'il était français.<br><br>L'arrêt ne priva pas pour autant les États d'accueil de tout moyen de maîtriser l'exposition budgétaire de leurs systèmes sociaux à l'égard des étudiants étrangers — un État conserve la faculté d'exiger une déclaration de ressources suffisantes lors de l'octroi initial du séjour, et la directive 93/96 (comme la directive 2004/38 qui lui a succédé) permet toujours à l'État d'accueil de tirer des conséquences du recours ultérieur d'un étudiant à l'aide sociale. Ce que l'arrêt Grzelczyk exclut, c'est que la nationalité elle-même, plutôt qu'une appréciation individualisée des ressources ou un changement de circonstances, constitue le critère déterminant."},
     holistic:`L'arrêt Grzelczyk fut rendu en septembre 2001, neuf ans après que le traité de Maastricht eut introduit la citoyenneté de l'Union à l'article 8 CE, sans que l'on perçoive alors clairement jusqu'où ce concept pourrait s'étendre. Jusque-là, le droit de la libre circulation parlait pour l'essentiel le langage des acteurs économiques — travailleurs, indépendants, prestataires et destinataires de services —, le même paradigme que <a class="case-link" onclick="jumpToCase('konstantinidis')">Konstantinidis</a> avait mis à l'épreuve huit ans plus tôt seulement, à travers le prisme plus étroit de la liberté d'établissement.<br><br>Grzelczyk rompit directement avec ce paradigme : sa solution ne dépend pas de ce que M. Grzelczyk soit un acteur économique d'une quelconque manière. C'est un étudiant, dépendant pendant un an du système social de l'État d'accueil, et la Cour fonde son raisonnement anti-discriminatoire directement sur la citoyenneté elle-même. La formule du point 31 — la citoyenneté comme « statut fondamental » des ressortissants des États membres — compte aujourd'hui parmi les phrases les plus citées de toute la jurisprudence de la Cour, et fournit l'ouverture doctrinale sur laquelle s'appuieront, dans des contextes factuels différents, des arrêts ultérieurs relatifs à la citoyenneté, dont <span class="case-link-pending" title="Pas encore ajouté à Casus">Zhu et Chen</span>.<br><br>La Cour n'accorda cependant pas aux citoyens économiquement inactifs un droit inconditionnel aux systèmes sociaux de l'État d'accueil. Sa formule du « certain degré de solidarité financière », au point 44, trace une limite délibérément étroite : la solidarité est attendue face à des difficultés temporaires, non indéfiniment, et la directive 93/96 (comme ses successeures) permet toujours aux États d'accueil de réexaminer le séjour dès lors que ce recours à l'aide cesse de paraître temporaire. Cette frontière non résolue — la solidarité que doit un État d'accueil à un citoyen ayant migré pour des raisons étrangères au travail — est précisément ce que les contentieux ultérieurs relatifs au « tourisme social », sous l'empire de la directive relative aux droits des citoyens, allaient trancher.<br><br>Sur le plan structurel, Grzelczyk se range aux côtés de <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne</a> et de <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> comme un nouvel exemple où la Cour lut dans une disposition du traité une portée dépassant ce qu'en attendaient ses rédacteurs — là, l'effet direct horizontal et vertical de l'égalité de traitement ; ici, un droit à l'égalité fondé sur la citoyenneté, détaché de toute participation au marché.`,
     citations:[
       {phrase:"le statut de citoyen de l'Union a vocation à être le statut fondamental des ressortissants des États membres permettant à ceux parmi ces derniers qui se trouvent dans la même situation d'obtenir, indépendamment de leur nationalité et sans préjudice des exceptions expressément prévues à cet égard, le même traitement juridique", paragraphs:"point 31", note:"Texte français authentique (le français était la langue de procédure de cette affaire), vérifié via une source secondaire (commentaire juridique citant l'arrêt) ; la récupération directe du texte primaire sur EUR-Lex a échoué (page renvoyée vide) — signalé conformément à la convention retenue.", primary:true},
       {phrase:"admet ainsi un certain degré de solidarité financière entre les ressortissants de l'État membre d'accueil et ceux des autres États membres, en particulier lorsque les difficultés rencontrées par le bénéficiaire du droit de séjour sont d'ordre temporaire", paragraphs:"point 44", note:"Traduction non officielle établie à partir du passage anglais vérifié (point 44) ; le texte français authentique de ce passage précis n'a pas pu être consulté (échec de la récupération EUR-Lex) — à vérifier contre le texte officiel.", primary:false}
     ]
   },
   de:{
     abstract:{
       issue:"Kann sich ein Staatsangehöriger eines Mitgliedstaats, der sich rechtmäßig als Student in einem anderen Mitgliedstaat aufhält, auf die Unionsbürgerschaft berufen, um dieselbe Sozialhilfe wie die eigenen Staatsangehörigen des Aufnahmestaats zu beanspruchen?",
       rule:"Die Unionsbürgerschaft ist dazu berufen, der grundlegende Status der Staatsangehörigen der Mitgliedstaaten zu sein, der es denjenigen, die sich in der gleichen Situation befinden, ermöglicht, unabhängig von ihrer Staatsangehörigkeit die gleiche rechtliche Behandlung zu erfahren, vorbehaltlich der insoweit ausdrücklich vorgesehenen Ausnahmen.",
       application:"Da sich Herr Grzelczyk rechtmäßig als Student in Belgien aufhielt, konnte er sich auf den mit diesem Status verbundenen Grundsatz der Nichtdiskriminierung berufen, und Belgien durfte ihm das Minimex nicht allein deshalb verweigern, weil er nicht Belgier war."},
     intermediate:{
       issue:"Rudy Grzelczyk, ein französischer Staatsangehöriger, zog 1995 nach Belgien, um an der Katholischen Universität Löwen-la-Neuve Sportwissenschaften zu studieren. Die ersten drei Studienjahre finanzierte er selbst, durch Gelegenheitsjobs und Kreditmöglichkeiten, ohne belgische Sozialleistungen in Anspruch zu nehmen.<br><br>Sein viertes und letztes Studienjahr ließ ihm keine vergleichbare Möglichkeit zu arbeiten, sodass er beim örtlichen Sozialhilfezentrum (CPAS) das Minimex beantragte, die belgische Mindestexistenzhilfe. Das CPAS gewährte sie zunächst — wurde dann aber vom zuständigen belgischen Minister darüber informiert, dass die Kosten nicht erstattet würden, da Herr Grzelczyk als ausländischer Student keiner der Kategorien angehörte, die das belgische Recht für einen Anspruch auf das Minimex anerkannte. Das CPAS entzog ihm die Leistung aus demselben Grund.<br><br>Herr Grzelczyk focht diesen Entzug vor einem belgischen Arbeitsgericht an, das dem Gerichtshof die Frage vorlegte, ob die Unionsbürgerschaft und das Recht der Freizügigkeit Belgien verpflichteten, ihn wie einen belgischen Studenten in seiner Lage zu behandeln.",
       rule:"Der Gerichtshof entschied, dass sich ein Unionsbürger, der sich — wie Herr Grzelczyk — rechtmäßig in einem anderen Mitgliedstaat aufhält, auf den vertraglichen Schutz vor Diskriminierung aus Gründen der Staatsangehörigkeit berufen kann, ohne eine zusätzliche wirtschaftliche Verbindung zum Aufnahmestaat nachweisen zu müssen.<br><br>Er ging weiter und bezeichnete die Unionsbürgerschaft als dazu berufen, 'der grundlegende Status der Angehörigen der Mitgliedstaaten' zu sein, der es Personen in der gleichen Situation ermöglicht, unabhängig von ihrer Staatsangehörigkeit dieselbe rechtliche Behandlung zu erfahren. Auf dieser Grundlage durfte Belgien eine Leistung wie das Minimex für einen rechtmäßig ansässigen Angehörigen eines anderen Mitgliedstaats nicht von der Arbeitnehmereigenschaft abhängig machen — eine Voraussetzung, die es den eigenen Staatsangehörigen nicht auferlegte.<br><br>Die Richtlinie, die Herrn Grzelczyks Aufenthaltsrecht als Student regelte, garantierte ihm das Minimex nicht selbst, hinderte ihn aber auch nicht daran, bei echten, vorübergehenden Schwierigkeiten auf belgische Sozialhilfe zurückzugreifen — die Richtlinie selbst akzeptiere, so der Gerichtshof, 'einen gewissen Grad an finanzieller Solidarität' zwischen den Angehörigen des Aufnahmestaats und denen anderer Mitgliedstaaten.",
       application:"Herr Grzelczyk hatte Anspruch auf das Minimex zu denselben Bedingungen wie ein belgischer Student in seiner Lage; seine Staatsangehörigkeit allein konnte den Entzug nicht rechtfertigen.<br><br>Das Urteil verschaffte wirtschaftlich nicht aktiven Unionsbürgern keinen unbedingten Anspruch auf die Sozialleistungen des Aufnahmestaats — die Staaten können weiterhin von vornherein den Nachweis ausreichender Mittel verlangen und tätig werden, sobald der Rückgriff eines Studenten auf öffentliche Unterstützung nicht mehr nur vorübergehend erscheint."},
     detailed:{
       issue:"Rudy Grzelczyk, ein französischer Staatsangehöriger, begann 1995 ein Studium der Sportwissenschaften an der Katholischen Universität Löwen-la-Neuve und nahm zu diesem Zweck seinen Wohnsitz in Belgien. Während seiner ersten drei Studienjahre finanzierte er sich durch verschiedene Gelegenheitsjobs und Kreditmöglichkeiten, ohne auf eine belgische Sozialleistung zurückzugreifen.<br><br>Sein viertes und letztes Studienjahr 1998/99 war anspruchsvoller und ließ ihm nicht dieselbe Möglichkeit, zu arbeiten. Er beantragte beim Centre public d'aide sociale (CPAS) von Ottignies-Louvain-la-Neuve das Minimex, die nicht beitragsabhängige belgische Mindestexistenzhilfe. Das CPAS bewilligte sie ab dem 5. Oktober 1998.<br><br>Das belgische Recht sah grundsätzlich eine Erstattung von 50 % der vom CPAS gezahlten Minimex-Beträge durch den belgischen Staat vor; der zuständige Minister verweigerte diese Erstattung jedoch mit der Begründung, Herr Grzelczyk falle als ausländischer Student in keine der Kategorien — belgische Staatsangehörige, Staatenlose, Flüchtlinge oder von der Verordnung Nr. 1612/68 über die Freizügigkeit der Arbeitnehmer erfasste Personen —, die das belgische Recht für einen Anspruch auf das Minimex voraussetzte. Daraufhin entzog das CPAS Herrn Grzelczyk das Minimex mit Wirkung zum 1. Januar 1999 aus demselben Grund.<br><br>Herr Grzelczyk focht diesen Entzug vor dem Tribunal du travail de Nivelles an, das das Verfahren aussetzte und dem Gerichtshof gemäß Artikel 234 EG zwei Fragen zur Auslegung der Artikel 6, 8 und 8a EG-Vertrag — des allgemeinen Diskriminierungsverbots, der Unionsbürgerschaft und des Rechts auf Freizügigkeit und Aufenthalt — sowie der Richtlinie 93/96/EWG des Rates über das Aufenthaltsrecht der Studierenden vorlegte.",
       rule:`Der Gerichtshof stellte zunächst fest, dass ein Angehöriger eines Mitgliedstaats, der sich — wie Herr Grzelczyk aufgrund der Richtlinie 93/96 — rechtmäßig im Hoheitsgebiet eines anderen Mitgliedstaats aufhält, in den sachlichen Anwendungsbereich des Vertrags für die Zwecke des Diskriminierungsverbots des Artikels 6 EG fällt, ohne eine weitere wirtschaftliche Verbindung zum Aufnahmestaat, etwa die Arbeitnehmereigenschaft, nachweisen zu müssen.<br><br>Er formulierte sodann den für dieses Urteil kennzeichnenden Grundsatz: Die durch Artikel 8 EG eingeführte Unionsbürgerschaft sei dazu berufen, "der grundlegende Status der Angehörigen der Mitgliedstaaten" zu sein, der es denjenigen unter ihnen, die sich in der gleichen Situation befinden, ermögliche, unabhängig von ihrer Staatsangehörigkeit und vorbehaltlich der insoweit ausdrücklich vorgesehenen Ausnahmen die gleiche rechtliche Behandlung zu erfahren (Randnr. 31). Auf dieser Grundlage standen die Artikel 6 und 8 EG dem entgegen, dass ein Mitgliedstaat den Anspruch auf eine beitragsunabhängige Leistung wie das Minimex für rechtmäßig ansässige Angehörige anderer Mitgliedstaaten von deren Zugehörigkeit zum Anwendungsbereich der Verordnung Nr. 1612/68 abhängig machte, während er den eigenen Staatsangehörigen keine entsprechende Voraussetzung auferlegte.<br><br>Zur Richtlinie 93/96 im Besonderen entschied der Gerichtshof, dass diese zwar selbst keinen Anspruch auf das Minimex begründe, einen rechtmäßig ansässigen Studenten aber auch nicht daran hindere, in der Folge auf die Sozialhilfe des Aufnahmestaats zurückzugreifen. Ein Mitgliedstaat dürfe als Voraussetzung für das anfängliche Aufenthaltsrecht eine Erklärung verlangen, wonach der Student über ausreichende Mittel verfüge, um nicht zur Last zu fallen — diese Beurteilung sei jedoch nur zum Zeitpunkt der Abgabe der Erklärung vorzunehmen, da sich die finanzielle Lage eines Studenten im Laufe der Zeit aus Gründen ändern könne, die sich seinem Einfluss entzögen. Zusammen mit den parallelen Richtlinien 90/364 und 90/365 über das Aufenthaltsrecht anderer wirtschaftlich nicht aktiver Unionsbürger gelesen, akzeptiere die Richtlinie 93/96 "damit einen gewissen Grad an finanzieller Solidarität zwischen den Angehörigen des Aufnahmemitgliedstaats und denen anderer Mitgliedstaaten, insbesondere wenn die Schwierigkeiten, auf die ein Aufenthaltsberechtigter stößt, vorübergehender Art sind" (Randnr. 44).`,
       application:"Herr Grzelczyk hatte Anspruch auf das Minimex zu denselben Bedingungen wie ein belgischer Student in einer identischen Lage; das CPAS und der zuständige Minister durften ihm die Leistung nicht allein deshalb entziehen, weil er Franzose war.<br><br>Das Urteil nahm den Aufnahmestaaten jedoch nicht jedes Mittel, die haushaltsmäßige Belastung ihrer Sozialsysteme durch ausländische Studierende zu steuern — ein Staat kann bei der erstmaligen Gewährung des Aufenthaltsrechts weiterhin eine Erklärung über ausreichende Mittel verlangen, und die Richtlinie 93/96 (ebenso wie ihre Nachfolgerin, die Richtlinie 2004/38) erlaubt dem Aufnahmestaat weiterhin, aus einem späteren Rückgriff eines Studenten auf Sozialhilfe Konsequenzen zu ziehen. Was das Urteil Grzelczyk ausschließt, ist, allein die Staatsangehörigkeit — statt einer individuellen Prüfung der Mittel oder einer veränderten Sachlage — zum entscheidenden Kriterium zu machen."},
     holistic:`Grzelczyk erging im September 2001, neun Jahre nachdem der Vertrag von Maastricht mit Artikel 8 EG die Unionsbürgerschaft eingeführt hatte, ohne dass zu jener Zeit recht klar war, wie weit dieses Konzept reichen würde. Bis dahin sprach das unionsrechtliche Freizügigkeitsrecht überwiegend die Sprache wirtschaftlicher Akteure — Arbeitnehmer, Selbständige, Erbringer und Empfänger von Dienstleistungen —, dasselbe Paradigma, das <a class="case-link" onclick="jumpToCase('konstantinidis')">Konstantinidis</a> nur acht Jahre zuvor durch die engere Linse der Niederlassungsfreiheit auf die Probe gestellt hatte.<br><br>Grzelczyk brach mit diesem Paradigma unmittelbar: Die Entscheidung hängt nicht davon ab, dass Herr Grzelczyk in irgendeiner Weise wirtschaftlich aktiv war. Er ist Student, für ein Jahr auf das Sozialsystem des Aufnahmestaats angewiesen, und der Gerichtshof stützt seine Nichtdiskriminierungsargumentation stattdessen unmittelbar auf die Unionsbürgerschaft selbst. Die Formulierung aus Randnummer 31 — die Unionsbürgerschaft als "grundlegender Status" der Angehörigen der Mitgliedstaaten — gehört heute zu den meistzitierten Sätzen der gesamten Rechtsprechung des Gerichtshofs und lieferte den dogmatischen Ansatzpunkt, auf dem spätere Urteile zur Unionsbürgerschaft, darunter <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Zhu und Chen</span>, in anderen Sachverhalten aufbauten.<br><br>Der Gerichtshof gewährte wirtschaftlich nicht aktiven Unionsbürgern damit aber keinen unbedingten Anspruch auf die Sozialsysteme des Aufnahmestaats. Seine Formel vom "gewissen Grad an finanzieller Solidarität" in Randnummer 44 zieht bewusst eine enge Grenze: Solidarität wird für vorübergehende Schwierigkeiten erwartet, nicht auf unbestimmte Zeit, und die Richtlinie 93/96 (wie ihre Nachfolgerinnen) erlaubt es den Aufnahmestaaten weiterhin, das Aufenthaltsrecht neu zu bewerten, sobald der Rückgriff auf Sozialhilfe nicht mehr vorübergehend erscheint. Genau diese ungeklärte Grenze — wie viel Solidarität ein Aufnahmestaat einem Unionsbürger schuldet, der aus anderen als arbeitsbezogenen Gründen zugewandert ist — war später Gegenstand der Streitigkeiten um "Sozialtourismus" unter der Unionsbürgerrichtlinie.<br><br>Strukturell reiht sich Grzelczyk neben <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne</a> und <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> ein — ein weiterer Fall, in dem der Gerichtshof eine Vertragsbestimmung weiter reichen ließ, als es ihre Verfasser unmittelbar erwartet hatten: dort in die horizontale und vertikale unmittelbare Wirkung des Gleichbehandlungsgrundsatzes; hier in ein von wirtschaftlicher Teilnahme losgelöstes, auf der Unionsbürgerschaft beruhendes Gleichheitsrecht.`,
     citations:[
       {phrase:"die Unionsbürgerschaft sei dazu berufen, der grundlegende Status der Angehörigen der Mitgliedstaaten zu sein, der es denjenigen unter ihnen, die sich in der gleichen Situation befinden, ermögliche, unabhängig von ihrer Staatsangehörigkeit und vorbehaltlich der insoweit ausdrücklich vorgesehenen Ausnahmen die gleiche rechtliche Behandlung zu erfahren", paragraphs:"Randnr. 31", note:"Inoffizielle Übersetzung des verifizierten französischen Originaltexts (Verfahrenssprache Französisch), Randnr. 31; die amtliche deutsche Fassung der Sammlung wurde nicht abgeglichen (EUR-Lex-Abruf fehlgeschlagen). Gegen den amtlichen Text zu prüfen.", primary:true},
       {phrase:"akzeptiert damit einen gewissen Grad an finanzieller Solidarität zwischen den Angehörigen des Aufnahmemitgliedstaats und denen anderer Mitgliedstaaten, insbesondere wenn die Schwierigkeiten, auf die ein Aufenthaltsberechtigter stößt, vorübergehender Art sind", paragraphs:"Randnr. 44", note:"Inoffizielle Übersetzung des verifizierten englischen Passus (Randnr. 44) — weder der authentische französische Text noch die amtliche deutsche Fassung konnten eingesehen werden (EUR-Lex-Abruf fehlgeschlagen). Gegen den amtlichen Text zu prüfen.", primary:false}
     ]

{id:"fransson", name:"Åkerberg Fransson", originalName:"Åklagaren mot Hans Åkerberg Fransson", citation:"Case C-617/10", jurisdiction:"CJUE", themes:["Fundamental rights"], articleIds:["art51charter","art50charter","art267tfeu"],
 abstract:{
   issue:"When a member state's own measure implements EU law only indirectly — enforcing VAT rules that also help fund the EU budget — does the EU Charter of Fundamental Rights still apply, and does it bar combining a tax penalty with a criminal prosecution for the same conduct?",
   rule:"The Charter applies whenever national legislation falls within the scope of EU law, with no further threshold beyond that connection; the ne bis in idem principle in Article 50 bars a second, criminal prosecution for the same acts only if an earlier penalty already imposed was itself criminal in nature and had become final.",
   application:"Because Sweden's tax penalties for VAT misreporting served to protect the EU's own resources, the Charter applied to Fransson's case; whether his prior tax penalty was criminal enough to block the later prosecution was left for the Swedish court to decide, using the Court's own criteria."},
 intermediate:{
   issue:"Hans Åkerberg Fransson, a Swedish fisherman, understated his income and VAT liability for the 2004 and 2005 tax years. The Swedish tax authority imposed tax surcharges on him in 2007. In 2009, prosecutors separately charged him with criminal tax fraud, based on the very same false declarations.<br><br>Fransson argued the second, criminal case violated the ne bis in idem principle — the right not to be punished twice for the same conduct — now guaranteed by Article 50 of the EU Charter of Fundamental Rights.<br><br>The Swedish court hearing the criminal case had two doubts. First, did the Charter even apply here, given Sweden's own rules on VAT and tax penalties are national measures, only loosely connected to EU law? Second, if it did, did combining a tax surcharge with a criminal conviction for the same acts breach Article 50?",
   rule:"The Court held the Charter applies whenever national legislation falls within the scope of EU law, with no additional threshold. Since part of the VAT actually collected funds the EU's own budget, and EU law requires member states to counteract VAT fraud effectively, Sweden's tax-penalty and criminal-fraud regime both counted as implementing EU law.<br><br>On the substance, Article 50 does not automatically bar combining a tax penalty and a criminal conviction for the same acts. It only bars a second prosecution if the earlier penalty was itself criminal in nature — assessed using three criteria: its legal classification under national law, the real nature of the offence, and the severity of the penalty actually risked — and had already become final.<br><br>The Court also confirmed, echoing its own established doctrine on primacy, that a national court must set aside any national rule conflicting with EU law immediately, on its own authority, without having to wait for or request a prior ruling from a constitutional court, even where domestic practice normally requires that step.",
   application:"Whether Fransson's tax surcharges were themselves criminal in nature — engaging Article 50 to block the later prosecution — was a question of fact and Swedish law for the referring court to resolve using the three-part test. The Charter clearly applied to the underlying dispute either way."},
 detailed:{
   issue:"Hans Åkerberg Fransson, a self-employed fisherman on Sweden's Kalix river, submitted incorrect information in his tax returns for 2004 and 2005, understating income subject to tax and value added tax and failing to declare employer's contributions correctly, resulting in a loss of tax revenue including VAT.<br><br>In 2007, the Swedish Tax Agency imposed tax surcharges on Fransson for these inaccuracies, alongside an ordinary tax reassessment. In 2009, the Public Prosecutor's Office separately brought criminal proceedings against him before the Haparanda tingsrätt, alleging tax offences based on exactly the same conduct underlying the 2007 surcharges.<br><br>Fransson argued the criminal charges should be dismissed under the ne bis in idem principle in Article 4 of Protocol No. 7 to the ECHR and Article 50 of the EU Charter, since he had already been penalised for the same acts. The Haparanda tingsrätt referred several questions to the Court of Justice: whether the Charter applied to national rules with only an indirect connection to EU law such as these; and, if so, whether Article 50 precluded criminal proceedings for acts already subject to a tax penalty. It also asked whether Swedish case law — requiring 'clear support' in the ECHR or the Swedish Supreme Court's own case law before a national court could disapply a national provision as incompatible with the Charter — was itself compatible with EU law.",
   rule:`The Court, sitting as a Grand Chamber, addressed the scope question first. Article 51(1) of the Charter states it applies to member states "only when they are implementing Union law." The Court read this as confirming, not narrowing, its settled pre-Charter case law: fundamental rights guaranteed by the EU legal order apply in all situations governed by EU law, but not outside such situations. As the Court put it, "since the fundamental rights guaranteed by the Charter must therefore be complied with where national legislation falls within the scope of European Union law, situations cannot exist which are covered in that way by European Union law without those fundamental rights being applicable. The applicability of European Union law entails applicability of the fundamental rights guaranteed by the Charter" (para. 21).<br><br>Applying this, the Court found that Sweden's tax penalties and criminal proceedings for VAT-related conduct do implement EU law: member states are required, under Article 4(3) TEU and the EU's VAT Directive, to take all measures needed to ensure collection of VAT due and to counter fraud effectively, including through effective, proportionate, and dissuasive penalties — and since part of VAT revenue funds the EU's own resources, a link to the protection of the EU's financial interests exists too.<br><br>On ne bis in idem, the Court held Article 50 does not, by itself, preclude a member state from imposing a combination of tax and criminal penalties for the same acts of failing to comply with VAT declaration obligations. It only bars the second, criminal proceedings if the tax penalty already imposed is itself criminal in nature, for these purposes — assessed against three criteria: the legal classification of the offence in national law, the intrinsic nature of the offence, and the degree of severity of the penalty the person risks (para. 35) — and has already become final. Whether Sweden's tax surcharges met that description was left to the national court.<br><br>Finally, on the Swedish "clear support" requirement, the Court held it incompatible with the primacy, unity, and effectiveness of EU law: a national court entrusted with applying EU law must be able to disapply any conflicting national provision immediately, of its own motion, without being required to request or await its prior disapplication by constitutional review or another judicial process — the same doctrine <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> established decades earlier for conflicts between EU and national law generally.`,
   application:"The Charter applied to Fransson's case, and the Court gave the referring court what it needed to resolve the ne bis in idem question itself: check whether the 2007 tax surcharges counted as 'criminal' under the three-part test, and if so, whether they had already become final before the 2009 prosecution began. The Swedish courts subsequently found the tax surcharges were indeed criminal in nature, and the criminal proceedings against Fransson for the same conduct were later discontinued.<br><br>Separately, Sweden's 'clear support' rule for disapplying national law could no longer be applied as a precondition — Swedish courts, like every national court applying EU law, had to set aside conflicting rules immediately on their own authority."},
 holistic:`Decided on 26 February 2013 by the Grand Chamber, Åkerberg Fransson resolved a question the Charter's own text had left genuinely unclear since it became binding in 2009: does "implementing Union law" in Article 51(1) mean something narrower than the Court's own pre-Charter case law on when fundamental rights review applies? The Court's answer, in paragraph 21, was decisively no — the two formulas mean the same thing, and there is no separate, narrower Charter-specific test.<br><br>The case reached that conclusion through an unusually indirect route: Swedish VAT penalties and a domestic tax-fraud prosecution, connected to EU law only because VAT partly funds the EU's own budget and EU law requires member states to enforce it effectively. That thin, structural connection was enough — a result some later commentary read as pulling a great deal of ordinary national criminal and tax law within the Charter's reach.<br><br>The judgment's second holding is easy to miss beside the headline scope question, but structurally significant: the Court applied <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a>'s doctrine — that any national court must set aside conflicting national law immediately, on its own authority — to conflicts between national law and the Charter specifically, closing off Sweden's own procedural precondition that a national court first find "clear support" before doing so.<br><br>Decided the same year as <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, the two judgments were handed down within months of each other and are often read together: Fransson defines how far the Charter's protection reaches into national law in the first place, Melloni then limits how much higher a national constitutional standard can rise once that protection applies. Both, in different ways, are about policing the boundary the Charter drew around member states' own residual autonomy.`,
 citations:[
   {phrase:"since the fundamental rights guaranteed by the Charter must therefore be complied with where national legislation falls within the scope of European Union law, situations cannot exist which are covered in that way by European Union law without those fundamental rights being applicable. The applicability of European Union law entails applicability of the fundamental rights guaranteed by the Charter", paragraphs:"para. 21", note:"The Charter's defining scope statement. Verified via secondary source (cross-checked academic/case-law commentary); direct EUR-Lex fetch of the primary judgment text failed (page returned empty) — flagged per standing convention.", primary:true},
   {phrase:"the legal classification of the offence under national law, the intrinsic nature of the offence, and the degree of severity of the penalty that the person concerned is liable to incur", paragraphs:"para. 35", note:"The three-criteria test for whether an ostensibly 'administrative' penalty is criminal in nature for ne bis in idem purposes. Verified via secondary source; primary EUR-Lex fetch failed — same flag as above.", primary:false}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Lorsqu'une mesure d'un État membre ne met en œuvre le droit de l'Union que de façon indirecte — en assurant l'application de règles de TVA qui contribuent aussi au financement du budget de l'Union —, la Charte des droits fondamentaux de l'Union s'applique-t-elle néanmoins, et s'oppose-t-elle au cumul d'une sanction fiscale et de poursuites pénales pour les mêmes faits ?",
       rule:"La Charte s'applique dès lors qu'une réglementation nationale relève du champ d'application du droit de l'Union, sans qu'aucun autre seuil ne s'ajoute à ce rattachement ; le principe ne bis in idem de l'article 50 ne s'oppose à de nouvelles poursuites pénales pour les mêmes faits que si une sanction déjà infligée revêtait elle-même un caractère pénal et était devenue définitive.",
       application:"Les sanctions fiscales suédoises réprimant les erreurs de déclaration de TVA protégeant les ressources propres de l'Union, la Charte s'appliquait à l'affaire de M. Åkerberg Fransson ; il appartenait à la juridiction suédoise de déterminer, à l'aide des critères dégagés par la Cour, si la sanction fiscale antérieure revêtait un caractère suffisamment pénal pour faire obstacle aux poursuites ultérieures."},
     intermediate:{
       issue:"Hans Åkerberg Fransson, pêcheur suédois, avait sous-déclaré ses revenus et sa TVA due au titre des exercices fiscaux 2004 et 2005. L'administration fiscale suédoise lui infligea des majorations d'impôt en 2007. En 2009, le ministère public engagea séparément des poursuites pénales pour fraude fiscale, fondées sur ces mêmes déclarations inexactes.<br><br>M. Åkerberg Fransson soutint que ces secondes poursuites, pénales, violaient le principe ne bis in idem — le droit de ne pas être puni deux fois pour les mêmes faits —, désormais garanti par l'article 50 de la Charte des droits fondamentaux de l'Union.<br><br>La juridiction suédoise saisie des poursuites pénales éprouvait deux doutes. D'abord, la Charte s'appliquait-elle seulement ici, alors que les règles suédoises de TVA et de majorations fiscales sont des mesures nationales, seulement indirectement rattachées au droit de l'Union ? Ensuite, dans l'affirmative, le cumul d'une majoration fiscale et d'une condamnation pénale pour les mêmes faits violait-il l'article 50 ?",
       rule:"La Cour jugea que la Charte s'applique dès lors qu'une réglementation nationale relève du champ d'application du droit de l'Union, sans seuil supplémentaire. Une partie de la TVA effectivement perçue finançant le budget propre de l'Union, et le droit de l'Union imposant aux États membres de lutter efficacement contre la fraude à la TVA, le régime suédois des majorations fiscales et des poursuites pénales relevait, l'un comme l'autre, de la mise en œuvre du droit de l'Union.<br><br>Sur le fond, l'article 50 ne s'oppose pas, par lui-même, au cumul d'une sanction fiscale et d'une condamnation pénale pour les mêmes faits de manquement aux obligations déclaratives de TVA. Il ne fait obstacle à de nouvelles poursuites pénales que si la sanction fiscale déjà infligée revêt elle-même un caractère pénal — apprécié à l'aune de trois critères : la qualification juridique de l'infraction en droit national, la nature réelle de l'infraction, et le degré de sévérité de la sanction encourue — et est déjà devenue définitive.<br><br>La Cour confirma également, dans le prolongement de sa jurisprudence établie en matière de primauté, qu'une juridiction nationale doit écarter immédiatement, de sa propre autorité, toute règle nationale contraire au droit de l'Union, sans devoir attendre ou solliciter au préalable une décision d'une juridiction constitutionnelle, même lorsque la pratique interne exige normalement cette étape.",
       application:"Il appartenait à la juridiction de renvoi de déterminer, en fait et au regard du droit suédois, à l'aide du critère en trois branches, si les majorations fiscales infligées à M. Åkerberg Fransson revêtaient elles-mêmes un caractère pénal de nature à faire obstacle, sur le fondement de l'article 50, aux poursuites ultérieures. La Charte s'appliquait en tout état de cause au litige au principal."},
     detailed:{
       issue:"Hans Åkerberg Fransson, pêcheur indépendant sur le fleuve Kalix en Suède, fournit des informations inexactes dans ses déclarations fiscales au titre des exercices 2004 et 2005, sous-déclarant des revenus imposables et la TVA due et omettant de déclarer correctement des cotisations patronales, ce qui entraîna une perte de recettes fiscales, y compris de TVA.<br><br>En 2007, l'administration fiscale suédoise lui infligea des majorations d'impôt pour ces inexactitudes, parallèlement à un redressement fiscal ordinaire. En 2009, le ministère public engagea séparément des poursuites pénales à son encontre devant le Haparanda tingsrätt, pour des infractions fiscales fondées exactement sur les mêmes faits que ceux ayant donné lieu aux majorations de 2007.<br><br>M. Åkerberg Fransson soutint que les poursuites pénales devaient être abandonnées en application du principe ne bis in idem consacré par l'article 4 du protocole n° 7 à la CEDH et par l'article 50 de la Charte, dès lors qu'il avait déjà été sanctionné pour les mêmes faits. Le Haparanda tingsrätt posa plusieurs questions préjudicielles à la Cour de justice : la Charte s'appliquait-elle à des règles nationales n'ayant qu'un rattachement indirect au droit de l'Union, telles que celles-ci ; et, dans l'affirmative, l'article 50 s'opposait-il à des poursuites pénales pour des faits déjà sanctionnés fiscalement. Il demanda également si la jurisprudence suédoise — exigeant un « soutien clair » dans la CEDH ou dans la propre jurisprudence de la Cour suprême suédoise avant qu'une juridiction nationale puisse écarter une disposition nationale comme incompatible avec la Charte — était elle-même compatible avec le droit de l'Union.",
       rule:`La Cour, siégeant en grande chambre, traita d'abord la question du champ d'application. L'article 51, paragraphe 1, de la Charte énonce qu'elle s'applique aux États membres « uniquement lorsqu'ils mettent en œuvre le droit de l'Union ». La Cour interpréta cette formule comme confirmant, et non restreignant, sa jurisprudence antérieure établie : les droits fondamentaux garantis par l'ordre juridique de l'Union s'appliquent dans toutes les situations régies par le droit de l'Union, mais non en dehors de telles situations. Comme le formula la Cour, « dès lors que les droits fondamentaux garantis par la Charte doivent, par conséquent, être respectés lorsqu'une réglementation nationale entre dans le champ d'application du droit de l'Union, il ne saurait exister de cas de figure qui relèvent ainsi du droit de l'Union sans que lesdits droits fondamentaux trouvent à s'appliquer. L'applicabilité du droit de l'Union implique celle des droits fondamentaux garantis par la Charte » (point 21).<br><br>Appliquant ce principe, la Cour jugea que les sanctions fiscales et les poursuites pénales suédoises relatives à des faits liés à la TVA mettent bien en œuvre le droit de l'Union : les États membres sont tenus, en vertu de l'article 4, paragraphe 3, TUE et de la directive TVA de l'Union, de prendre toute mesure nécessaire pour garantir la perception de la TVA due et pour lutter efficacement contre la fraude, y compris au moyen de sanctions effectives, proportionnées et dissuasives — et une partie des recettes de TVA finançant les ressources propres de l'Union, un lien avec la protection des intérêts financiers de celle-ci existe également.<br><br>Sur le principe ne bis in idem, la Cour jugea que l'article 50 ne s'oppose pas, par lui-même, à ce qu'un État membre inflige une combinaison de sanctions fiscales et pénales pour les mêmes faits de manquement aux obligations déclaratives de TVA. Il ne fait obstacle à de nouvelles poursuites pénales que si la sanction fiscale déjà infligée revêt elle-même, à ces fins, un caractère pénal — apprécié à l'aune de trois critères : la qualification juridique de l'infraction en droit national, la nature intrinsèque de l'infraction, et le degré de sévérité de la sanction encourue par l'intéressé (point 35) — et est déjà devenue définitive. Il appartenait à la juridiction nationale de déterminer si les majorations fiscales suédoises répondaient à cette description.<br><br>Enfin, s'agissant de l'exigence suédoise d'un « soutien clair », la Cour la jugea incompatible avec la primauté, l'unité et l'effectivité du droit de l'Union : une juridiction nationale chargée d'appliquer le droit de l'Union doit pouvoir écarter immédiatement, d'office, toute disposition nationale contraire, sans être tenue de solliciter ou d'attendre son inapplication préalable par la voie d'un contrôle de constitutionnalité ou d'une autre procédure juridictionnelle — la même doctrine que <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> avait établie des décennies plus tôt pour les conflits entre droit de l'Union et droit national en général.`,
       application:"La Charte s'appliquait à l'affaire de M. Åkerberg Fransson, et la Cour fournit à la juridiction de renvoi les éléments nécessaires pour trancher elle-même la question du ne bis in idem : vérifier si les majorations fiscales de 2007 revêtaient un caractère « pénal » au regard du critère en trois branches, et, dans l'affirmative, si elles étaient déjà devenues définitives avant l'engagement des poursuites de 2009. Les juridictions suédoises constatèrent par la suite que les majorations fiscales revêtaient effectivement un caractère pénal, et les poursuites pénales engagées contre M. Åkerberg Fransson pour les mêmes faits furent ultérieurement abandonnées.<br><br>Par ailleurs, l'exigence suédoise d'un « soutien clair » pour écarter le droit national ne pouvait plus être appliquée comme condition préalable — les juridictions suédoises, comme toute juridiction nationale appliquant le droit de l'Union, devaient écarter immédiatement, de leur propre autorité, les règles contraires."},
     holistic:`Rendu le 26 février 2013 par la grande chambre, l'arrêt Åkerberg Fransson trancha une question que le texte même de la Charte avait laissée véritablement incertaine depuis qu'elle était devenue contraignante en 2009 : l'expression « mettent en œuvre le droit de l'Union » à l'article 51, paragraphe 1, signifie-t-elle quelque chose de plus étroit que la jurisprudence antérieure de la Cour sur les conditions d'application du contrôle des droits fondamentaux ? La réponse de la Cour, au point 21, fut nettement négative — les deux formules recouvrent la même réalité, et il n'existe pas de test distinct, plus étroit, propre à la Charte.<br><br>L'arrêt parvint à cette conclusion par une voie singulièrement indirecte : des sanctions suédoises en matière de TVA et des poursuites pénales internes pour fraude fiscale, rattachées au droit de l'Union pour la seule raison que la TVA finance en partie le budget propre de l'Union et que le droit de l'Union impose aux États membres de la faire respecter efficacement. Ce rattachement structurel ténu suffit — un résultat que certains commentaires ultérieurs ont lu comme faisant entrer une grande partie du droit pénal et fiscal national ordinaire dans le champ de la Charte.<br><br>Le second apport de l'arrêt est facile à négliger derrière la question du champ d'application, mais revêt une portée structurelle : la Cour appliqua la doctrine de <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> — selon laquelle toute juridiction nationale doit écarter immédiatement, de sa propre autorité, le droit national contraire — spécifiquement aux conflits entre droit national et Charte, mettant fin à la condition procédurale suédoise exigeant qu'une juridiction nationale constate d'abord un « soutien clair » avant de le faire.<br><br>Rendu la même année que <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, à quelques mois d'intervalle, ces deux arrêts sont souvent lus ensemble : Fransson définit jusqu'où s'étend, d'abord, la protection de la Charte en droit national ; Melloni limite ensuite jusqu'à quel niveau une norme constitutionnelle nationale peut s'élever une fois cette protection applicable. Tous deux, chacun à sa manière, portent sur la délimitation de la frontière que la Charte a tracée autour de l'autonomie résiduelle propre des États membres.`,
     citations:[
       {phrase:"dès lors que les droits fondamentaux garantis par la Charte doivent, par conséquent, être respectés lorsqu'une réglementation nationale entre dans le champ d'application du droit de l'Union, il ne saurait exister de cas de figure qui relèvent ainsi du droit de l'Union sans que lesdits droits fondamentaux trouvent à s'appliquer. L'applicabilité du droit de l'Union implique celle des droits fondamentaux garantis par la Charte", paragraphs:"point 21", note:"La langue de procédure de cette affaire était le suédois ; cette traduction française a été établie à partir du texte anglais vérifié, sans que le texte suédois authentique ni la version française officielle du Recueil n'aient pu être consultés dans cette session — à vérifier contre le texte officiel.", primary:true},
       {phrase:"la qualification juridique de l'infraction en droit national, la nature intrinsèque de l'infraction, et le degré de sévérité de la sanction encourue par l'intéressé", paragraphs:"point 35", note:"Traduction non officielle établie à partir du texte anglais vérifié ; non vérifiée contre la version française officielle du Recueil dans cette session.", primary:false}

   de:{
     abstract:{
       issue:"Wenn eine Maßnahme eines Mitgliedstaats das Unionsrecht nur mittelbar umsetzt — durch die Durchsetzung von Mehrwertsteuervorschriften, die auch zur Finanzierung des Unionshaushalts beitragen —, gilt dann dennoch die Charta der Grundrechte der Union, und steht sie der Kombination aus einer steuerlichen Sanktion und einer Strafverfolgung wegen desselben Verhaltens entgegen?",
       rule:"Die Charta gilt immer dann, wenn nationale Rechtsvorschriften in den Anwendungsbereich des Unionsrechts fallen, ohne dass ein weiteres Erfordernis hinzutreten müsste; der Grundsatz ne bis in idem aus Artikel 50 steht einer erneuten Strafverfolgung wegen derselben Tat nur entgegen, wenn eine bereits verhängte frühere Sanktion selbst strafrechtlicher Natur war und rechtskräftig geworden ist.",
       application:"Da die schwedischen Steuerzuschläge wegen fehlerhafter Mehrwertsteuererklärungen dem Schutz der Eigenmittel der Union dienten, war die Charta auf den Fall von Herrn Åkerberg Fransson anwendbar; ob sein früherer Steuerzuschlag strafrechtlicher Natur genug war, um die spätere Verfolgung zu sperren, war vom schwedischen Gericht anhand der vom Gerichtshof aufgestellten Kriterien zu beurteilen."},
     intermediate:{
       issue:"Hans Åkerberg Fransson, ein schwedischer Fischer, hatte sein Einkommen und seine Mehrwertsteuerschuld für die Steuerjahre 2004 und 2005 zu niedrig angegeben. Die schwedische Steuerbehörde verhängte 2007 Steuerzuschläge gegen ihn. 2009 erhob die Staatsanwaltschaft gesondert Anklage wegen Steuerbetrugs, gestützt auf dieselben falschen Angaben.<br><br>Herr Åkerberg Fransson machte geltend, das zweite, strafrechtliche Verfahren verstoße gegen den Grundsatz ne bis in idem — das Recht, nicht zweimal für dasselbe Verhalten bestraft zu werden —, der nunmehr durch Artikel 50 der Charta der Grundrechte der Union gewährleistet werde.<br><br>Das mit dem Strafverfahren befasste schwedische Gericht hatte zwei Zweifel. Erstens: Galt die Charta hier überhaupt, da Schwedens eigene Vorschriften zur Mehrwertsteuer und zu Steuerzuschlägen nationale Maßnahmen sind, die nur locker mit dem Unionsrecht verbunden sind? Zweitens: Falls ja, verstieß die Kombination aus Steuerzuschlag und strafrechtlicher Verurteilung für dieselben Handlungen gegen Artikel 50?",
       rule:"Der Gerichtshof entschied, dass die Charta immer dann gilt, wenn nationale Rechtsvorschriften in den Anwendungsbereich des Unionsrechts fallen, ohne weitere Schwelle. Da ein Teil der tatsächlich erhobenen Mehrwertsteuer den Eigenhaushalt der Union finanziert und das Unionsrecht von den Mitgliedstaaten verlangt, Mehrwertsteuerbetrug wirksam zu bekämpfen, stellten sowohl die schwedische Steuerzuschlags- als auch die Strafverfolgungsregelung eine Durchführung des Unionsrechts dar.<br><br>In der Sache steht Artikel 50 der Kombination aus einer steuerlichen Sanktion und einer strafrechtlichen Verurteilung für dieselben Handlungen der Verletzung von Mehrwertsteuer-Erklärungspflichten nicht automatisch entgegen. Er steht einer zweiten, strafrechtlichen Verfolgung nur entgegen, wenn die bereits verhängte steuerliche Sanktion selbst strafrechtlicher Natur ist — beurteilt anhand dreier Kriterien: ihrer rechtlichen Einordnung nach nationalem Recht, der tatsächlichen Art der Zuwiderhandlung und der Schwere der tatsächlich drohenden Sanktion — und bereits rechtskräftig geworden ist.<br><br>Der Gerichtshof bestätigte zudem, im Einklang mit seiner eigenen gefestigten Rechtsprechung zum Vorrang, dass ein nationales Gericht jede dem Unionsrecht entgegenstehende nationale Vorschrift unverzüglich aus eigener Befugnis unangewendet lassen muss, ohne eine vorherige Entscheidung eines Verfassungsgerichts abwarten oder beantragen zu müssen, selbst wenn die innerstaatliche Praxis diesen Schritt normalerweise verlangt.",
       application:"Ob die Steuerzuschläge gegen Herrn Åkerberg Fransson selbst strafrechtlicher Natur waren — sodass Artikel 50 die spätere Verfolgung sperrte —, war eine Tat- und Rechtsfrage des schwedischen Rechts, die das vorlegende Gericht anhand des dreiteiligen Tests zu klären hatte. Die Charta war auf den Ausgangsrechtsstreit in jedem Fall anwendbar."},
     detailed:{
       issue:"Hans Åkerberg Fransson, ein selbständiger Fischer am schwedischen Fluss Kalix, machte in seinen Steuererklärungen für 2004 und 2005 unrichtige Angaben, indem er steuerpflichtiges Einkommen und geschuldete Mehrwertsteuer zu niedrig auswies und Arbeitgeberbeiträge nicht ordnungsgemäß angab, was zu Steuerausfällen einschließlich der Mehrwertsteuer führte.<br><br>2007 verhängte die schwedische Steuerbehörde wegen dieser Unrichtigkeiten Steuerzuschläge gegen Herrn Åkerberg Fransson, zusätzlich zu einer gewöhnlichen steuerlichen Neuveranlagung. 2009 erhob die Staatsanwaltschaft gesondert Anklage gegen ihn vor dem Haparanda tingsrätt wegen Steuerstraftaten, gestützt auf genau dasselbe Verhalten, das den Zuschlägen von 2007 zugrunde lag.<br><br>Herr Åkerberg Fransson machte geltend, die Strafverfolgung müsse nach dem Grundsatz ne bis in idem gemäß Artikel 4 des Protokolls Nr. 7 zur EMRK und Artikel 50 der Charta eingestellt werden, da er für dieselben Handlungen bereits sanktioniert worden sei. Das Haparanda tingsrätt legte dem Gerichtshof mehrere Fragen vor: ob die Charta auf nationale Vorschriften mit nur mittelbarem Bezug zum Unionsrecht wie diese anwendbar sei; und, falls ja, ob Artikel 50 einer Strafverfolgung wegen bereits steuerlich sanktionierter Handlungen entgegenstehe. Es fragte zudem, ob die schwedische Rechtsprechung — die eine „klare Grundlage“ in der EMRK oder in der eigenen Rechtsprechung des schwedischen Obersten Gerichtshofs verlangte, bevor ein nationales Gericht eine nationale Vorschrift wegen Unvereinbarkeit mit der Charta unangewendet lassen konnte — selbst mit dem Unionsrecht vereinbar sei.",
       rule:`Der Gerichtshof, tagend als Große Kammer, behandelte zunächst die Frage des Anwendungsbereichs. Artikel 51 Absatz 1 der Charta bestimmt, dass sie für die Mitgliedstaaten „ausschließlich bei der Durchführung des Rechts der Union“ gilt. Der Gerichtshof legte dies als Bestätigung, nicht als Einschränkung, seiner gefestigten vor-Charta-Rechtsprechung aus: Die von der Unionsrechtsordnung gewährleisteten Grundrechte gelten in allen unionsrechtlich geregelten Situationen, nicht aber außerhalb solcher Situationen. Wie es der Gerichtshof formulierte: „Da somit die durch die Charta garantierten Grundrechte zu beachten sind, wenn eine nationale Regelung in den Geltungsbereich des Unionsrechts fällt, kann es im Geltungsbereich des Unionsrechts geregelte nationale Sachverhalte, auf die diese Grundrechte keine Anwendung fänden, nicht geben. Die Anwendbarkeit des Unionsrechts umfasst somit die Anwendbarkeit der durch die Charta garantierten Grundrechte“ (Randnr. 21).<br><br>Auf dieser Grundlage entschied der Gerichtshof, dass die schwedischen Steuersanktionen und die Strafverfolgung wegen mehrwertsteuerbezogenen Verhaltens tatsächlich eine Durchführung des Unionsrechts darstellen: Die Mitgliedstaaten sind nach Artikel 4 Absatz 3 EUV und der Mehrwertsteuerrichtlinie der Union verpflichtet, alle erforderlichen Maßnahmen zu treffen, um die Erhebung der geschuldeten Mehrwertsteuer sicherzustellen und Betrug wirksam zu bekämpfen, unter anderem durch wirksame, verhältnismäßige und abschreckende Sanktionen — und da ein Teil der Mehrwertsteuereinnahmen die Eigenmittel der Union finanziert, besteht zudem ein Zusammenhang mit dem Schutz der finanziellen Interessen der Union.<br><br>Zum Grundsatz ne bis in idem entschied der Gerichtshof, dass Artikel 50 es einem Mitgliedstaat nicht bereits an sich verwehrt, für dieselben Handlungen der Verletzung mehrwertsteuerlicher Erklärungspflichten eine Kombination aus steuerlichen und strafrechtlichen Sanktionen zu verhängen. Er steht einer erneuten Strafverfolgung nur entgegen, wenn die bereits verhängte steuerliche Sanktion zu diesem Zweck selbst strafrechtlicher Natur ist — beurteilt anhand dreier Kriterien: der rechtlichen Einordnung der Zuwiderhandlung nach nationalem Recht, der Art der Zuwiderhandlung selbst und des Schweregrads der der betroffenen Person drohenden Sanktion (Randnr. 35) — und bereits rechtskräftig geworden ist. Ob die schwedischen Steuerzuschläge diese Voraussetzungen erfüllten, war Sache des nationalen Gerichts.<br><br>Zum schwedischen Erfordernis einer „klaren Grundlage“ schließlich entschied der Gerichtshof, dass dieses mit dem Vorrang, der Einheit und der Wirksamkeit des Unionsrechts unvereinbar sei: Ein mit der Anwendung des Unionsrechts betrautes nationales Gericht muss jede entgegenstehende nationale Vorschrift unverzüglich, von Amts wegen, unangewendet lassen können, ohne deren vorherige Unanwendbarkeit durch eine verfassungsgerichtliche Kontrolle oder ein anderes gerichtliches Verfahren beantragen oder abwarten zu müssen — dieselbe Doktrin, die <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> Jahrzehnte zuvor allgemein für Konflikte zwischen Unionsrecht und nationalem Recht aufgestellt hatte.`,
       application:"Die Charta war auf den Fall von Herrn Åkerberg Fransson anwendbar, und der Gerichtshof gab dem vorlegenden Gericht das Erforderliche an die Hand, um die Frage des ne bis in idem selbst zu klären: zu prüfen, ob die Steuerzuschläge von 2007 nach dem dreiteiligen Test als „strafrechtlich“ zu qualifizieren waren, und, falls ja, ob sie bereits vor Beginn der Strafverfolgung 2009 rechtskräftig geworden waren. Die schwedischen Gerichte stellten in der Folge fest, dass die Steuerzuschläge tatsächlich strafrechtlicher Natur waren, und das Strafverfahren gegen Herrn Åkerberg Fransson wegen desselben Verhaltens wurde später eingestellt.<br><br>Getrennt davon konnte die schwedische Regel einer „klaren Grundlage“ für die Unanwendbarkeit nationalen Rechts nicht länger als Vorbedingung angewendet werden — schwedische Gerichte mussten, wie jedes nationale Gericht bei der Anwendung des Unionsrechts, entgegenstehende Vorschriften unverzüglich aus eigener Befugnis unangewendet lassen."},
     holistic:`Das am 26. Februar 2013 von der Großen Kammer entschiedene Urteil Åkerberg Fransson klärte eine Frage, die der Text der Charta selbst seit ihrer Verbindlichkeit im Jahr 2009 offengelassen hatte: Bedeutet „Durchführung des Rechts der Union“ in Artikel 51 Absatz 1 etwas Engeres als die eigene Rechtsprechung des Gerichtshofs vor der Charta zur Anwendbarkeit der Grundrechtsprüfung? Die Antwort des Gerichtshofs in Randnummer 21 lautete entschieden nein — beide Formeln bedeuten dasselbe, und es gibt keinen eigenständigen, engeren, chartaspezifischen Test.<br><br>Der Fall erreichte diese Schlussfolgerung auf einem ungewöhnlich mittelbaren Weg: schwedische Mehrwertsteuersanktionen und eine innerstaatliche Strafverfolgung wegen Steuerbetrugs, mit dem Unionsrecht nur deshalb verbunden, weil die Mehrwertsteuer teilweise den Eigenhaushalt der Union finanziert und das Unionsrecht von den Mitgliedstaaten deren wirksame Durchsetzung verlangt. Diese schwache, strukturelle Verbindung genügte — ein Ergebnis, das spätere Kommentare teilweise so lasen, dass ein erheblicher Teil des gewöhnlichen nationalen Straf- und Steuerrechts in die Reichweite der Charta gezogen werde.<br><br>Der zweite Kernpunkt des Urteils gerät neben der zentralen Frage des Anwendungsbereichs leicht in Vergessenheit, ist aber strukturell bedeutsam: Der Gerichtshof wandte die Doktrin aus <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> — wonach jedes nationale Gericht entgegenstehendes nationales Recht unverzüglich aus eigener Befugnis unangewendet lassen muss — speziell auf Konflikte zwischen nationalem Recht und der Charta an und beendete damit die schwedische verfahrensrechtliche Vorbedingung, wonach ein nationales Gericht zunächst eine „klare Grundlage“ feststellen musste, bevor es so vorgehen konnte.<br><br>Im selben Jahr wie <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> entschieden, ergingen beide Urteile innerhalb weniger Monate und werden oft zusammen gelesen: Fransson legt fest, wie weit der Schutz der Charta überhaupt in das nationale Recht hineinreicht; Melloni begrenzt sodann, wie hoch ein nationaler Verfassungsstandard steigen darf, sobald dieser Schutz greift. Beide betreffen, auf je unterschiedliche Weise, die Absteckung der Grenze, die die Charta um die verbleibende Autonomie der Mitgliedstaaten gezogen hat.`,
     citations:[
       {phrase:"da somit die durch die Charta garantierten Grundrechte zu beachten sind, wenn eine nationale Regelung in den Geltungsbereich des Unionsrechts fällt, kann es im Geltungsbereich des Unionsrechts geregelte nationale Sachverhalte, auf die diese Grundrechte keine Anwendung fänden, nicht geben. Die Anwendbarkeit des Unionsrechts umfasst somit die Anwendbarkeit der durch die Charta garantierten Grundrechte", paragraphs:"Randnr. 21", note:"Die Verfahrenssprache dieser Rechtssache war Schwedisch; diese Übersetzung wurde aus dem verifizierten englischen Text erstellt, ohne dass der schwedische Originaltext oder die amtliche deutsche Fassung der Sammlung in dieser Sitzung eingesehen werden konnten — gegen den amtlichen Text zu prüfen.", primary:true},

{id:"francovich", name:"Francovich and Bonifaci v Italy", originalName:"Andrea Francovich e Danila Bonifaci e altri contro Repubblica italiana", citation:"Joined Cases C-6/90 and C-9/90", jurisdiction:"CJCE", themes:["Infringement actions","Non-contractual liability"], articleIds:["dir80987","art4tue","art267tfeu"],
 abstract:{
   issue:"When a member state fails entirely to transpose a directive, and the directive's own terms are too imprecise about who owes the money for it to have direct effect, can the individuals it was meant to protect still recover anything from the state?",
   rule:"A member state that breaches EU law, including by failing to transpose a directive, is liable to compensate individuals for the loss this causes, provided the directive was intended to confer rights on them, the content of those rights can be identified from the directive, and there is a causal link between the breach and the loss.",
   application:"Because Italy had never set up the wage-guarantee scheme Directive 80/987 required, Francovich and Bonifaci could not invoke the Directive itself against their insolvent employers or the state directly, but could instead sue Italy for damages equal to what the guarantee scheme would have paid them."},
 intermediate:{
   issue:"Directive 80/987/EEC required member states to set up an institution guaranteeing payment of employees' unpaid wages if their employer became insolvent. Italy was supposed to have this in place by 1983, and the Court of Justice had already condemned Italy for the failure in a separate case in 1989. By 1990, Italy still had no such scheme.<br><br>Andrea Francovich was owed wages by his insolvent employer and recovered almost nothing in the liquidation. Danila Bonifaci and 33 co-workers were in the same position after their own employer's bankruptcy. Both sued in Italian courts, seeking either the guaranteed payments the Directive should have provided, or damages from the Italian state for failing to introduce the scheme.<br><br>The Italian courts asked the Court of Justice two things: could the workers rely on the Directive directly, given Italy's total failure to transpose it? And if not, could they instead claim damages from the state itself?",
   rule:"The Court found the Directive's provisions were not precise enough to be relied on directly against the state as guarantor, since the Directive left member states real discretion over which body would act as guarantor and how it would be funded — someone still had to be identified to pay, and the Directive alone did not identify them.<br><br>But the Court went further. It held that a member state's liability for loss caused by its own breach of EU law is a principle inherent in the Treaty system, necessary to guarantee EU law's full effectiveness. This liability applies with particular force where a directive is not transposed at all.<br><br>Three conditions have to be met: the directive must be intended to confer rights on individuals; the content of those rights must be identifiable from the directive itself; and there must be a causal link between the state's failure and the loss suffered.",
   application:"Francovich and Bonifaci's group could not enforce the Directive's payment guarantee directly against Italy, since it left open who exactly was meant to pay. But they could sue Italy for damages instead, since all three conditions for state liability were met: the Directive was meant to guarantee them a minimum level of protection, its provisions let a court work out how much each was owed, and Italy's total failure to transpose the Directive caused their loss directly."},
 detailed:{
   issue:"Council Directive 80/987/EEC of 20 October 1980 required member states to establish guarantee institutions ensuring payment of employees' outstanding claims arising from their employer's insolvency, up to a ceiling member states could set. The transposition deadline was 23 October 1983. Italy missed it, and the Commission successfully brought infringement proceedings against Italy over the failure in Case 22/87, decided 2 February 1989. By the time the present proceedings arose, Italy still had not transposed the Directive.<br><br>Andrea Francovich had worked for CDN Elettronica Snc in Vicenza and was owed around 6 million lire in unpaid wages when the company became insolvent; enforcement proceedings against the company recovered nothing. Danila Bonifaci and 33 former colleagues were owed a combined 253 million lire after their employer, Gaia Confezioni Srl, went into compulsory liquidation, with no assets left for ordinary creditors.<br><br>Both brought proceedings in Italy, Francovich before the Pretura di Vicenza and Bonifaci's group before the Pretura di Bassano del Grappa, seeking either the payments the Directive should have guaranteed or, failing that, damages from the Italian Republic for its failure to transpose the Directive. Both Italian courts referred questions to the Court of Justice on whether the Directive's provisions were sufficiently precise and unconditional to be relied on directly, given Italy's total non-transposition, and, if not, whether EU law required the state itself to make good the loss.",
   rule:`On direct effect, the Court held that while the Directive's provisions identifying who was protected and what was guaranteed were sufficiently precise, the provisions on who was to bear the obligation to pay — the identity of the guarantor — left member states real discretion as to that institution's organisation, powers, and financing. Individuals could not, therefore, rely on the Directive itself to identify the person liable to provide the guarantee, so it lacked direct effect on this point in the absence of transposing measures.<br><br>Turning to whether EU law nonetheless required a remedy, the Court held that "the full effectiveness of Community rules would be impaired and the protection of the rights which they grant would be weakened if individuals were unable to obtain redress when their rights are infringed by a breach of Community law for which a Member State can be held responsible" (para. 33). It concluded that "the principle whereby a State must be liable for loss and damage caused to individuals as a result of breaches of Community law for which the State can be held responsible is inherent in the system of the Treaty" (para. 35), grounding this partly in Article 5 EEC's duty of sincere cooperation.<br><br>The Court set out three conditions for this liability to arise: "the result prescribed by the directive should entail the grant of rights to individuals," that "it should be possible to identify the content of those rights on the basis of the provisions of the directive," and "the existence of a causal link between the breach of the State's obligation and the loss and damage suffered by the injured parties" (para. 40). Where these conditions are met, the state must make good the loss, with the detailed procedural rules for the claim governed by national law, subject to the ordinary requirements that those rules be no less favourable than for similar domestic claims and not make recovery practically impossible or excessively difficult.`,
   application:"Francovich and Bonifaci's group could not invoke Directive 80/987 directly against Italy or their former employers to obtain the guaranteed payments, since the Directive did not itself identify who was to pay. But all three conditions for state liability were satisfied on the facts: the Directive plainly intended to guarantee a minimum level of protection to employees in their position; its provisions let a court calculate the amount each was owed; and Italy's total failure to transpose the Directive was the direct cause of their inability to recover anything. They were accordingly entitled to sue Italy for damages equivalent to what the guarantee scheme would have paid them, under whatever procedure Italian law provided for such claims."},
 holistic:`Decided on 19 November 1991, Francovich answered a question <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> had left open five years earlier: if a directive cannot bind a private employer directly, and a public employer happens not to be involved at all, is the individual simply out of luck? Francovich said no — a state that fails to transpose a directive can be sued for damages instead, regardless of who the individual's own employer was.<br><br>This filled the gap Marshall's vertical-only limit on direct effect had created, and did so through a different EU law doctrine entirely: not direct effect, but a free-standing principle of state liability, grounded in the Treaty's own logic of effectiveness and sincere cooperation. The Court was careful to keep the two doctrines separate — state liability does not depend on the breached provision itself being directly effective, which is exactly why it could rescue Francovich's claim where direct effect had already failed.<br><br>The three Francovich conditions were later refined and tightened, in <span class="case-link-pending" title="Not yet added to Casus">Brasserie du Pêcheur and Factortame III</span>, into a "sufficiently serious breach" test modelled on the Court's own standard for EU institutional liability — showing state liability maturing from a doctrine built for one specific failure (total non-transposition) into a general remedy against member states across many kinds of EU law violation.<br><br>Structurally, Francovich is why an unimplemented directive is never quite a dead end for the people it was meant to protect: if the Marshall route through direct effect is closed, the Francovich route through state liability may still be open, subject to its own three conditions rather than the <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> test for direct effect.`,
