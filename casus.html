 translations:{
   fr:{
     abstract:{
       issue:"Lorsqu'un État membre s'abstient totalement de transposer une directive, et que les termes mêmes de celle-ci restent trop imprécis quant à l'identité du débiteur pour produire un effet direct, les particuliers qu'elle visait à protéger peuvent-ils néanmoins obtenir quelque chose de l'État ?",
       rule:"Un État membre qui viole le droit de l'Union, y compris en s'abstenant de transposer une directive, est tenu de réparer le préjudice ainsi causé aux particuliers, dès lors que la directive visait à leur conférer des droits, que le contenu de ces droits peut être identifié à partir de la directive, et qu'il existe un lien de causalité entre la violation et le préjudice.",
       application:"L'Italie n'ayant jamais mis en place le régime de garantie salariale exigé par la directive 80/987, MM. Francovich et Bonifaci ne pouvaient invoquer directement la directive à l'encontre de leurs employeurs insolvables ou de l'État, mais pouvaient en revanche agir contre l'Italie en réparation, à hauteur de ce que le régime de garantie leur aurait versé."},
     intermediate:{
       issue:"La directive 80/987/CEE imposait aux États membres de mettre en place un organisme garantissant le paiement des salaires impayés des travailleurs en cas d'insolvabilité de leur employeur. L'Italie devait s'y conformer dès 1983, et la Cour de justice l'avait déjà condamnée pour ce manquement dans une affaire distincte en 1989. En 1990, l'Italie n'avait toujours mis en place aucun dispositif de ce type.<br><br>Andrea Francovich, à qui son employeur insolvable devait des salaires, ne recouvra presque rien lors de la liquidation. Danila Bonifaci et 33 collègues se trouvaient dans la même situation après la faillite de leur propre employeur. Tous deux saisirent les juridictions italiennes, sollicitant soit les paiements que la directive aurait dû garantir, soit des dommages-intérêts de l'État italien pour ne pas avoir instauré ce régime.<br><br>Les juridictions italiennes posèrent deux questions à la Cour de justice : les travailleurs pouvaient-ils invoquer directement la directive, compte tenu de l'absence totale de transposition par l'Italie ? Et, dans la négative, pouvaient-ils réclamer des dommages-intérêts à l'État lui-même ?",
       rule:"La Cour jugea que les dispositions de la directive n'étaient pas suffisamment précises pour être invoquées directement à l'encontre de l'État en tant que garant, la directive laissant aux États membres une réelle marge d'appréciation quant à l'organisme appelé à jouer ce rôle et à son financement — encore fallait-il identifier qui devait payer, ce que la directive seule ne permettait pas.<br><br>Mais la Cour alla plus loin. Elle jugea que la responsabilité d'un État membre pour le préjudice causé par sa propre violation du droit de l'Union est un principe inhérent au système du traité, nécessaire pour garantir la pleine efficacité du droit de l'Union. Cette responsabilité s'impose avec une force particulière lorsqu'une directive n'est pas transposée du tout.<br><br>Trois conditions doivent être réunies : la directive doit avoir pour objet de conférer des droits aux particuliers ; le contenu de ces droits doit pouvoir être identifié à partir de la directive elle-même ; et il doit exister un lien de causalité entre le manquement de l'État et le préjudice subi.",
       application:"Le groupe de MM. Francovich et Bonifaci ne pouvait faire valoir directement à l'encontre de l'Italie la garantie de paiement prévue par la directive, celle-ci laissant ouverte la question de savoir qui, précisément, devait payer. Mais ils pouvaient agir contre l'Italie en réparation, les trois conditions de la responsabilité de l'État étant réunies : la directive visait à leur garantir un niveau minimal de protection, ses dispositions permettaient à un juge de déterminer le montant dû à chacun, et l'absence totale de transposition par l'Italie était directement à l'origine de leur préjudice."},
     detailed:{
       issue:"La directive 80/987/CEE du Conseil, du 20 octobre 1980, imposait aux États membres d'instituer des organismes de garantie assurant le paiement des créances impayées des travailleurs résultant de l'insolvabilité de leur employeur, dans la limite d'un plafond que les États membres pouvaient fixer. Le délai de transposition expirait le 23 octobre 1983. L'Italie ne le respecta pas, et la Commission introduisit avec succès un recours en manquement contre elle à ce sujet dans l'affaire 22/87, tranchée le 2 février 1989. Au moment où survint le présent litige, l'Italie n'avait toujours pas transposé la directive.<br><br>Andrea Francovich avait travaillé pour la CDN Elettronica Snc à Vicence et se voyait devoir environ 6 millions de lires de salaires impayés lorsque l'entreprise devint insolvable ; les voies d'exécution engagées contre celle-ci ne permirent de rien recouvrer. Danila Bonifaci et 33 anciens collègues se voyaient devoir, ensemble, 253 millions de lires après la mise en liquidation judiciaire de leur employeur, Gaia Confezioni Srl, qui ne laissait aucun actif pour les créanciers ordinaires.<br><br>Tous deux engagèrent une procédure en Italie, M. Francovich devant la Pretura de Vicence et le groupe de Mme Bonifaci devant la Pretura de Bassano del Grappa, sollicitant soit les paiements que la directive aurait dû garantir, soit, à défaut, des dommages-intérêts de la République italienne pour son défaut de transposition. Les deux juridictions italiennes posèrent des questions préjudicielles à la Cour de justice, demandant si les dispositions de la directive étaient suffisamment précises et inconditionnelles pour être invoquées directement, compte tenu de l'absence totale de transposition par l'Italie, et, dans la négative, si le droit de l'Union exigeait que l'État lui-même répare le préjudice.",
       rule:`Sur l'effet direct, la Cour jugea que si les dispositions de la directive identifiant les bénéficiaires et l'objet de la garantie étaient suffisamment précises, celles relatives à l'identité du débiteur de l'obligation de paiement laissaient aux États membres une réelle marge d'appréciation quant à l'organisation, aux pouvoirs et au financement de cet organisme. Les particuliers ne pouvaient donc invoquer la directive elle-même pour identifier le débiteur de la garantie, de sorte qu'elle était dépourvue d'effet direct sur ce point en l'absence de mesures de transposition.<br><br>Examinant si le droit de l'Union exigeait néanmoins une voie de droit, la Cour jugea que « la pleine efficacité des normes communautaires serait mise en cause et la protection des droits qu'elles reconnaissent serait affaiblie si les particuliers n'avaient pas la possibilité d'obtenir réparation lorsque leurs droits sont lésés par une violation du droit communautaire imputable à un État membre » (point 33). Elle en conclut que « le principe de la responsabilité de l'État pour des dommages causés aux particuliers par des violations du droit communautaire qui lui sont imputables est inhérent au système du traité » (point 35), fondant cette solution en partie sur le devoir de coopération loyale de l'article 5 CEE.<br><br>La Cour énonça trois conditions pour que cette responsabilité soit engagée : « le résultat prescrit par la directive comporte l'attribution de droits au profit de particuliers », « le contenu de ces droits peut être identifié sur la base des dispositions de la directive », et « l'existence d'un lien de causalité entre la violation de l'obligation qui incombe à l'État et le dommage subi par les personnes lésées » (point 40). Ces conditions réunies, l'État est tenu de réparer le préjudice, les modalités procédurales de l'action relevant du droit national, sous réserve des exigences habituelles selon lesquelles ces modalités ne doivent pas être moins favorables que celles concernant des réclamations similaires de nature interne, ni rendre pratiquement impossible ou excessivement difficile l'obtention de la réparation.`,
       application:"Le groupe de MM. Francovich et Bonifaci ne pouvait invoquer directement la directive 80/987 à l'encontre de l'Italie ou de leurs anciens employeurs pour obtenir les paiements garantis, la directive ne désignant pas elle-même le débiteur. Mais les trois conditions de la responsabilité de l'État étaient réunies en l'espèce : la directive visait manifestement à garantir un niveau minimal de protection aux travailleurs placés dans leur situation ; ses dispositions permettaient à un juge de calculer le montant dû à chacun ; et l'absence totale de transposition par l'Italie était directement à l'origine de leur impossibilité de recouvrer quoi que ce soit. Ils étaient en conséquence fondés à agir contre l'Italie en réparation, à hauteur de ce que le régime de garantie leur aurait versé, selon la procédure que le droit italien prévoyait pour de telles actions."},
     holistic:`Rendu le 19 novembre 1991, l'arrêt Francovich répondit à une question que <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> avait laissée ouverte cinq ans plus tôt : si une directive ne peut lier directement un employeur privé, et qu'aucun employeur public ne se trouve impliqué, le particulier est-il simplement privé de tout recours ? Francovich répondit par la négative — un État qui s'abstient de transposer une directive peut être poursuivi en réparation à la place, quel que soit l'employeur du particulier concerné.<br><br>Cet arrêt combla la lacune que la limite strictement verticale de l'effet direct posée par Marshall avait créée, et le fit au moyen d'une doctrine entièrement distincte du droit de l'Union : non l'effet direct, mais un principe autonome de responsabilité de l'État, fondé sur la logique propre du traité en matière d'effectivité et de coopération loyale. La Cour prit soin de maintenir ces deux doctrines séparées — la responsabilité de l'État ne dépend pas de l'effet direct de la disposition violée, ce qui explique précisément pourquoi elle put sauver la demande de M. Francovich là où l'effet direct avait déjà échoué.<br><br>Les trois conditions posées par Francovich furent plus tard affinées et durcies, dans <span class="case-link-pending" title="Pas encore ajouté à Casus">Brasserie du Pêcheur et Factortame III</span>, en un critère de « violation suffisamment caractérisée » calqué sur le standard propre de la Cour en matière de responsabilité des institutions de l'Union — signe que la responsabilité de l'État mûrit, passant d'une doctrine conçue pour un manquement bien précis (l'absence totale de transposition) à une voie de droit générale contre les États membres, applicable à de nombreux types de violations du droit de l'Union.<br><br>Sur le plan structurel, Francovich explique pourquoi une directive non transposée n'est jamais tout à fait une impasse pour les personnes qu'elle visait à protéger : si la voie Marshall de l'effet direct est fermée, la voie Francovich de la responsabilité de l'État peut encore rester ouverte, sous réserve de ses propres trois conditions plutôt que du test de <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> applicable à l'effet direct.`,
     citations:[
       {phrase:"le principe de la responsabilité de l'État pour des dommages causés aux particuliers par des violations du droit communautaire qui lui sont imputables est inhérent au système du traité", paragraphs:"point 35", note:"Texte français authentique probable (le français est la langue de travail interne habituelle de la Cour), mais traduit ici à partir du texte anglais vérifié sans nouvelle consultation directe du texte italien authentique (langue de procédure) ni de la version française officielle du Recueil dans cette session — à vérifier contre le texte officiel.", primary:true},

   de:{
     abstract:{
       issue:"Kann der Einzelne, den eine Richtlinie schützen sollte, vom Staat noch etwas erlangen, wenn dieser die Richtlinie vollständig nicht umgesetzt hat und deren eigener Wortlaut hinsichtlich des Schuldners zu unbestimmt für eine unmittelbare Wirkung ist?",
       rule:"Ein Mitgliedstaat, der gegen das Unionsrecht verstößt, unter anderem durch Nichtumsetzung einer Richtlinie, haftet für den dadurch verursachten Schaden des Einzelnen, sofern die Richtlinie ihm Rechte verleihen sollte, der Inhalt dieser Rechte aus der Richtlinie bestimmt werden kann und ein ursächlicher Zusammenhang zwischen dem Verstoß und dem Schaden besteht.",
       application:"Da Italien die von der Richtlinie 80/987 geforderte Lohngarantieeinrichtung nie geschaffen hatte, konnten sich Herr Francovich und Frau Bonifaci nicht unmittelbar auf die Richtlinie gegenüber ihren insolventen Arbeitgebern oder dem Staat berufen, konnten aber stattdessen Italien auf Schadensersatz in Höhe der Leistungen verklagen, die die Garantieeinrichtung erbracht hätte."},
     intermediate:{
       issue:"Die Richtlinie 80/987/EWG verpflichtete die Mitgliedstaaten, eine Einrichtung zu schaffen, die die Zahlung ausstehender Lohnansprüche von Arbeitnehmern im Falle der Zahlungsunfähigkeit ihres Arbeitgebers garantiert. Italien hätte dies bis 1983 umsetzen müssen, und der Gerichtshof hatte Italien für dieses Versäumnis bereits 1989 in einem gesonderten Verfahren verurteilt. 1990 verfügte Italien noch immer über keine solche Regelung.<br><br>Andrea Francovich standen von seinem insolventen Arbeitgeber Lohnzahlungen zu, die er im Liquidationsverfahren fast vollständig nicht erhielt. Danila Bonifaci und 33 Arbeitskollegen befanden sich nach dem Konkurs ihres eigenen Arbeitgebers in derselben Lage. Beide erhoben Klage vor italienischen Gerichten und verlangten entweder die Zahlungen, die die Richtlinie hätte garantieren sollen, oder Schadensersatz vom italienischen Staat wegen dessen Versäumnisses, die Regelung einzuführen.<br><br>Die italienischen Gerichte legten dem Gerichtshof zwei Fragen vor: Konnten sich die Arbeitnehmer angesichts der vollständigen Nichtumsetzung durch Italien unmittelbar auf die Richtlinie berufen? Und, falls nicht, konnten sie stattdessen Schadensersatz vom Staat selbst verlangen?",
       rule:"Der Gerichtshof stellte fest, dass die Bestimmungen der Richtlinie nicht hinreichend genau waren, um unmittelbar gegenüber dem Staat als Garanten geltend gemacht zu werden, da die Richtlinie den Mitgliedstaaten einen echten Gestaltungsspielraum hinsichtlich der Einrichtung, die als Garant fungieren sollte, und ihrer Finanzierung beließ — es musste noch bestimmt werden, wer zu zahlen hatte, und die Richtlinie allein bestimmte dies nicht.<br><br>Der Gerichtshof ging jedoch weiter. Er entschied, dass die Haftung eines Mitgliedstaats für Schäden, die durch seinen eigenen Verstoß gegen das Unionsrecht verursacht werden, ein dem System des Vertrags innewohnender Grundsatz sei, der zur Gewährleistung der vollen Wirksamkeit des Unionsrechts erforderlich sei. Diese Haftung greift mit besonderer Kraft, wenn eine Richtlinie überhaupt nicht umgesetzt wird.<br><br>Drei Voraussetzungen müssen erfüllt sein: Die Richtlinie muss dem Einzelnen Rechte verleihen sollen; der Inhalt dieser Rechte muss sich aus der Richtlinie selbst bestimmen lassen; und es muss ein ursächlicher Zusammenhang zwischen dem Versäumnis des Staates und dem erlittenen Schaden bestehen.",
       application:"Die Gruppe um Herrn Francovich und Frau Bonifaci konnte die Zahlungsgarantie der Richtlinie nicht unmittelbar gegenüber Italien durchsetzen, da offenblieb, wer genau zahlen sollte. Sie konnten Italien jedoch stattdessen auf Schadensersatz verklagen, da alle drei Voraussetzungen der Staatshaftung erfüllt waren: Die Richtlinie sollte ihnen ein Mindestschutzniveau garantieren, ihre Bestimmungen erlaubten es einem Gericht, den jeweils geschuldeten Betrag zu berechnen, und Italiens vollständiges Versäumnis, die Richtlinie umzusetzen, verursachte ihren Schaden unmittelbar."},
     detailed:{
       issue:"Die Richtlinie 80/987/EWG des Rates vom 20. Oktober 1980 verpflichtete die Mitgliedstaaten, Garantieeinrichtungen zu schaffen, die die Zahlung ausstehender Ansprüche von Arbeitnehmern aus der Zahlungsunfähigkeit ihres Arbeitgebers sicherstellen, bis zu einer von den Mitgliedstaaten festzulegenden Obergrenze. Die Umsetzungsfrist endete am 23. Oktober 1983. Italien versäumte sie, und die Kommission erhob erfolgreich eine Vertragsverletzungsklage gegen Italien wegen dieses Versäumnisses in der Rechtssache 22/87, entschieden am 2. Februar 1989. Zum Zeitpunkt des vorliegenden Verfahrens hatte Italien die Richtlinie noch immer nicht umgesetzt.<br><br>Andrea Francovich hatte für die CDN Elettronica Snc in Vicenza gearbeitet und wurden bei deren Zahlungsunfähigkeit rund 6 Millionen Lire an ausstehendem Lohn geschuldet; Vollstreckungsmaßnahmen gegen das Unternehmen brachten keinerlei Erlös. Danila Bonifaci und 33 ehemalige Kolleginnen und Kollegen wurden nach der Zwangsliquidation ihres Arbeitgebers, der Gaia Confezioni Srl, zusammen 253 Millionen Lire geschuldet, wobei für gewöhnliche Gläubiger kein Vermögen mehr verblieb.<br><br>Beide erhoben Klage in Italien, Herr Francovich vor der Pretura di Vicenza und die Gruppe um Frau Bonifaci vor der Pretura di Bassano del Grappa, und verlangten entweder die von der Richtlinie zu garantierenden Zahlungen oder, hilfsweise, Schadensersatz von der Italienischen Republik wegen deren Versäumnisses, die Richtlinie umzusetzen. Beide italienischen Gerichte legten dem Gerichtshof die Frage vor, ob die Bestimmungen der Richtlinie angesichts der vollständigen Nichtumsetzung durch Italien hinreichend genau und unbedingt waren, um unmittelbar geltend gemacht zu werden, und, falls nicht, ob das Unionsrecht verlangte, dass der Staat selbst den Schaden ersetzt.",
       rule:`Zur unmittelbaren Wirkung entschied der Gerichtshof, dass zwar die Bestimmungen der Richtlinie, die die Begünstigten und den Gegenstand der Garantie festlegten, hinreichend genau waren, die Bestimmungen darüber, wer die Zahlungspflicht zu tragen hatte — die Identität des Garanten —, den Mitgliedstaaten jedoch einen echten Gestaltungsspielraum hinsichtlich Organisation, Befugnisse und Finanzierung dieser Einrichtung beließen. Der Einzelne konnte sich daher nicht auf die Richtlinie selbst berufen, um den zur Erbringung der Garantie Verpflichteten zu bestimmen, sodass ihr insoweit mangels Umsetzungsmaßnahmen die unmittelbare Wirkung fehlte.<br><br>Zur Frage, ob das Unionsrecht dennoch einen Rechtsbehelf verlangte, entschied der Gerichtshof, dass „die volle Wirksamkeit der Gemeinschaftsvorschriften beeinträchtigt würde und der Schutz der durch sie begründeten Rechte geschwächt würde, wenn der Einzelne keine Möglichkeit hätte, Ersatz zu erlangen, wenn seine Rechte durch einen dem Mitgliedstaat zurechenbaren Verstoß gegen das Gemeinschaftsrecht verletzt werden“ (Randnr. 33). Er kam zu dem Schluss, dass „der Grundsatz, wonach die Mitgliedstaaten verpflichtet sind, den Schaden zu ersetzen, der dem Einzelnen durch ihnen zuzurechnende Verstöße gegen das Gemeinschaftsrecht entsteht, dem System des Vertrages immanent ist“ (Randnr. 35), und stützte dies teilweise auf die Pflicht zu loyaler Zusammenarbeit aus Artikel 5 EWG-Vertrag.<br><br>Der Gerichtshof stellte drei Voraussetzungen für diese Haftung auf: „das durch die Richtlinie vorgeschriebene Ergebnis muss die Verleihung von Rechten an Einzelne beinhalten“, „der Inhalt dieser Rechte muss anhand der Richtlinie bestimmt werden können“ und es müsse „ein ursächlicher Zusammenhang zwischen dem Verstoß gegen die dem Staat obliegende Verpflichtung und dem den Geschädigten entstandenen Schaden“ bestehen (Randnr. 40). Seien diese Voraussetzungen erfüllt, müsse der Staat den Schaden ersetzen, wobei sich die verfahrensrechtlichen Einzelheiten der Klage nach nationalem Recht richteten, vorbehaltlich der üblichen Anforderungen, dass diese Regeln nicht ungünstiger sein dürften als für vergleichbare innerstaatliche Ansprüche und die Erlangung des Ersatzes nicht praktisch unmöglich oder übermäßig erschweren dürften.`,
       application:"Die Gruppe um Herrn Francovich und Frau Bonifaci konnte die Richtlinie 80/987 nicht unmittelbar gegenüber Italien oder ihren früheren Arbeitgebern geltend machen, um die garantierten Zahlungen zu erlangen, da die Richtlinie selbst nicht bestimmte, wer zu zahlen hatte. Doch alle drei Voraussetzungen der Staatshaftung waren im vorliegenden Fall erfüllt: Die Richtlinie sollte Arbeitnehmern in ihrer Lage eindeutig ein Mindestschutzniveau garantieren; ihre Bestimmungen erlaubten es einem Gericht, den jeweils geschuldeten Betrag zu berechnen; und Italiens vollständiges Versäumnis, die Richtlinie umzusetzen, war die unmittelbare Ursache dafür, dass sie nichts erlangen konnten. Sie waren daher berechtigt, Italien auf Schadensersatz in Höhe der Leistungen zu verklagen, die die Garantieeinrichtung erbracht hätte, nach dem im italienischen Recht für solche Klagen vorgesehenen Verfahren."},
     holistic:`Das am 19. November 1991 ergangene Urteil Francovich beantwortete eine Frage, die <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> fünf Jahre zuvor offengelassen hatte: Hat der Einzelne einfach Pech, wenn eine Richtlinie einen privaten Arbeitgeber nicht unmittelbar binden kann und zufällig gar kein öffentlicher Arbeitgeber beteiligt ist? Francovich antwortete: Nein — ein Staat, der eine Richtlinie nicht umsetzt, kann stattdessen auf Schadensersatz verklagt werden, unabhängig davon, wer der Arbeitgeber des Einzelnen war.<br><br>Dies schloss die Lücke, die die rein vertikale Beschränkung der unmittelbaren Wirkung aus Marshall geschaffen hatte, und zwar durch eine gänzlich andere unionsrechtliche Doktrin: nicht die unmittelbare Wirkung, sondern einen eigenständigen Grundsatz der Staatshaftung, gestützt auf die dem Vertrag eigene Logik der Wirksamkeit und der loyalen Zusammenarbeit. Der Gerichtshof achtete sorgfältig darauf, beide Doktrinen getrennt zu halten — die Staatshaftung hängt nicht davon ab, dass die verletzte Bestimmung selbst unmittelbare Wirkung entfaltet, was genau erklärt, weshalb sie den Anspruch von Herrn Francovich retten konnte, nachdem die unmittelbare Wirkung bereits gescheitert war.<br><br>Die drei Francovich-Voraussetzungen wurden später, in <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Brasserie du Pêcheur und Factortame III</span>, verfeinert und zu einem Kriterium der „hinreichend qualifizierten Verletzung“ verschärft, das dem eigenen Maßstab des Gerichtshofs für die Haftung der Unionsorgane nachgebildet ist — ein Zeichen dafür, dass sich die Staatshaftung von einer für ein einziges spezifisches Versäumnis (die vollständige Nichtumsetzung) geschaffenen Doktrin zu einem allgemeinen Rechtsbehelf gegen Mitgliedstaaten bei vielerlei Arten von Verstößen gegen das Unionsrecht entwickelte.<br><br>Strukturell erklärt Francovich, weshalb eine nicht umgesetzte Richtlinie für die Personen, die sie schützen sollte, nie ganz eine Sackgasse ist: Ist der Marshall-Weg über die unmittelbare Wirkung versperrt, kann der Francovich-Weg über die Staatshaftung noch offenstehen, vorbehaltlich seiner eigenen drei Voraussetzungen anstelle des <a class="case-link" onclick="jumpToCase('vangend')">Van-Gend-en-Loos</a>-Tests für die unmittelbare Wirkung.`,
     citations:[
       {phrase:"der Grundsatz, wonach die Mitgliedstaaten verpflichtet sind, den Schaden zu ersetzen, der dem Einzelnen durch ihnen zuzurechnende Verstöße gegen das Gemeinschaftsrecht entsteht, ist dem System des Vertrages immanent", paragraphs:"Randnr. 35", note:"Inoffizielle Übersetzung des verifizierten englischen Textes. Die Verfahrenssprache dieser Rechtssache war Italienisch; weder der italienische Originaltext noch die amtliche deutsche Fassung der Sammlung wurden in dieser Sitzung eingesehen — gegen den amtlichen Text zu prüfen.", primary:true},
       {phrase:"das durch die Richtlinie vorgeschriebene Ergebnis muss die Verleihung von Rechten an Einzelne beinhalten... der Inhalt dieser Rechte muss anhand der Richtlinie bestimmt werden können... [und es muss] ein ursächlicher Zusammenhang zwischen dem Verstoß und dem entstandenen Schaden bestehen", paragraphs:"Randnr. 40", note:"Inoffizielle Übersetzung des verifizierten englischen Textes; nicht gegen die amtliche deutsche Fassung der Sammlung abgeglichen.", primary:false}
     ]
   }
 }}
];

const JURISDICTION_SLUG = {"CJCE":"cjce","CJUE":"cjue","CourEDH":"couredh","BVerfGE":"bverfge","ATF":"atf","AG":"ag"};
function jurisdictionBadge(c){
  if(!c.jurisdiction) return '';
  const slug = JURISDICTION_SLUG[c.jurisdiction] || 'cjue';
  return `<span class="jurisdiction-badge jur-${slug}" title="${c.jurisdiction}">${c.jurisdiction}</span>`;
}
function getCaseContent(c, lang){
  const l = lang || currentLang;
  if(l!=='en' && c.translations && c.translations[l]) return c.translations[l];
  return {abstract:c.abstract, intermediate:c.intermediate, detailed:c.detailed, holistic:c.holistic, citations:c.citations};
}
function hasTranslation(c, lang){
  return !!(c.translations && c.translations[lang]);
}
function setLang(l){
  currentLang = l;
  renderLangSwitch(); renderNav(); renderMain();
}
function renderLangSwitch(){
  const el = document.getElementById('lang-switch');
  if(!el) return;
  const langs = [['en','EN'],['fr','FR'],['de','DE'],['it','IT']];
  el.innerHTML = langs.map(([code,label])=>`<span onclick="setLang('${code}')" style="cursor:pointer;font-size:12px;padding:3px 7px;border-radius:6px;color:${currentLang===code?'var(--red)':'var(--gold-light)'};background:${currentLang===code?'var(--gold-light)':'transparent'};">${label}</span>`).join('');
}

let state = { weekNotes: {}, weekCases: {}, progress: {}, exams: [
  {id:'exam-1', name:'Exam 1/01', caseIds:[]},
  {id:'exam-2', name:'Exam 2/02', caseIds:[]}
]};

async function loadState(){
  try{
    const r = await window.storage.get('casus-state');
    if(r && r.value) state = Object.assign({weekNotes:{},weekCases:{},progress:{},exams:[]}, JSON.parse(r.value));
  }catch(e){ /* no saved state yet */ }
}
async function saveState(){
  try{ await window.storage.set('casus-state', JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}

const TABS = [
  {id:'home', label:'Home'},
  {id:'subjects', label:'My subjects'},
  {id:'diagrams', label:'Diagrams'},
  {id:'week', label:'This week'},
  {id:'exams', label:'My exams'}
];
let activeTab = 'home';

function renderNav(){
  const el = document.getElementById('nav');
  el.innerHTML = TABS.map(t=>`<button class="${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}
function switchTab(id){ activeTab = id; renderNav(); renderMain(); }
function goHome(){ window._filters = {name:'',keyword:'',theme:'',related:''}; switchTab('home'); }
function jumpToCase(id){
  const c = CASES.find(x=>x.id===id); if(!c) return;
  window._filters = {name:c.name,keyword:'',theme:'',related:''};
  if(!window._cardLevel) window._cardLevel={};
  window._cardLevel[id]=3;
  activeTab='home'; renderNav(); renderMain();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showArticle(id){
  const a = ARTICLES.find(x=>x.id===id); if(!a) return;
  const card = document.getElementById('article-modal-card');
  card.innerHTML = `
    <span class="modal-close" onclick="closeArticleModal()">✕</span>
    <h3>${a.label}</h3>
    <p style="color:var(--muted);font-size:13.5px;line-height:1.6;">${a.covers}</p>
    ${a.changed ? `<div class="changed-banner"><b>This provision has changed.</b> At the time of the relevant judgment it was cited as ${a.historicalLabel}. ${a.historicalNote}</div>` : ''}
    <div class="article-links">
      ${a.changed ? `<a href="${a.historicalUrl}" target="_blank" rel="noopener">→ View ${a.historicalLabel}, the version cited in the case</a>` : ''}
      <a href="${a.currentUrl}" target="_blank" rel="noopener">→ View the current text on EUR-Lex</a>
    </div>`;
  document.getElementById('article-modal').style.display='flex';
}
function closeArticleModal(){ document.getElementById('article-modal').style.display='none'; }

function findCitations(caseId, selectedText){
  const c = CASES.find(x=>x.id===caseId);
  const content = c ? getCaseContent(c) : null;
  if(!c || !content.citations) return [];
  const q = selectedText.trim().toLowerCase();
  if(!q) return [];
  let matches = content.citations.filter(ct => ct.phrase.toLowerCase().includes(q) || q.includes(ct.phrase.toLowerCase()));
  const exact = matches.length>0;
  if(!matches.length) matches = content.citations;
  matches = matches.slice().sort((a,b)=>(b.primary?1:0)-(a.primary?1:0));
  return {matches, exact};
}
function showCitationPopup(caseId, selectedText, rect){
  const popup = document.getElementById('citation-popup');
  const result = findCitations(caseId, selectedText);
  if(!result.matches || !result.matches.length){ popup.style.display='none'; return; }
  const t = {
    en:{cited:'Cited from the judgment', sourced:'Sourced passages for this case', primary:'Most relevant — '},
    fr:{cited:'Cité du jugement', sourced:'Passages sourcés pour cet arrêt', primary:'Le plus pertinent — '},
    de:{cited:'Aus dem Urteil zitiert', sourced:'Belegte Passagen zu diesem Fall', primary:'Am relevantesten — '},
    it:{cited:'Citato dalla sentenza', sourced:'Passaggi documentati per questo caso', primary:'Il più rilevante — '}
  }[currentLang] || {cited:'Cited from the judgment', sourced:'Sourced passages for this case', primary:'Most relevant — '};
  popup.innerHTML = `<div class="cp-head">${result.exact ? t.cited : t.sourced}</div>`
    + result.matches.map(m=>`<div class="cp-item ${m.primary?'primary':''}">
        <div class="cp-para">${m.primary?t.primary:''}${m.paragraphs}</div>
        <div class="cp-note">${m.note}</div>
      </div>`).join('');
  const top = Math.min(rect.bottom + 8, window.innerHeight - 200);
  const left = Math.min(Math.max(8, rect.left), window.innerWidth - 290);
  popup.style.top = top+'px';
  popup.style.left = left+'px';
  popup.style.display = 'block';
}

function progressSummary(){
  let mastered=0, started=0;
  CASES.forEach(c=>{ const p=state.progress[c.id]||0; if(p>=3) mastered++; else if(p>=1) started++; });
  return {mastered, started, notStarted: CASES.length-mastered-started};
}

function levelTabsHtml(id){
  const lvl = (window._cardLevel && window._cardLevel[id]) || 1;
  const p = state.progress[id]||0;
  const labels = [[1,'Abstract'],[2,'Intermediate'],[3,'Detailed'],[4,'Holistic']];
  return `<div class="level-tabs">
    ${labels.map(([n,l])=>`<span class="lvl-btn ${lvl===n?'active':''}" onclick="setLevel('${id}',${n})">${l}</span>`).join('')}
    <span class="dots">${[1,2,3].map(n=>`<span class="dot ${n<=p?'filled':''}"></span>`).join('')}</span>
  </div>`;
}
function articleChips(c){
  if(!c.articleIds || !c.articleIds.length) return '';
  return `<div class="legal-basis"><span class="lb-label">Legal basis</span>${c.articleIds.map(aid=>{
    const a = ARTICLES.find(x=>x.id===aid); if(!a) return '';
    return `<span class="article-chip" onclick="showArticle('${aid}')">${a.label}</span>`;
  }).join('')}</div>`;
}
function fallbackNote(){
  const t = {fr:'Traduction française pas encore disponible — texte anglais affiché.', de:'Deutsche Übersetzung noch nicht verfügbar — englischer Text wird angezeigt.', it:'Traduzione italiana non ancora disponibile — viene mostrato il testo inglese.'};
  return currentLang!=='en' ? `<p class="advanced-hint">${t[currentLang]}</p>` : '';
}
function levelContentHtml(c){
  const lvl = (window._cardLevel && window._cardLevel[c.id]) || 1;
  const content = getCaseContent(c);
  const note = (currentLang!=='en' && !hasTranslation(c,currentLang)) ? fallbackNote() : '';
  if(lvl===4){
    const legal = articleChips(c);
    return `<div class="detail">${content.holistic}</div>${legal}${note}`;
  }
  const src = lvl===1 ? content.abstract : (lvl===2 ? content.intermediate : content.detailed);
  const body = `<div class="detail"><b>Issue</b> — ${src.issue}<br><br><b>Rule</b> — ${src.rule}<br><br><b>Application</b> — ${src.application}</div>`;
  const legal = lvl>=2 ? articleChips(c) : '';
  if(lvl===3){
    return `<div class="citable" data-case="${c.id}">${body}</div>${legal}<p class="advanced-hint">Highlight any phrase above to see where it comes from in the judgment.</p>${note}`;
  }
  return body + legal + note;
}
function setLevel(id, lvl){
  if(!window._cardLevel) window._cardLevel={};
  window._cardLevel[id]=lvl;
  renderMain();
}

function caseCard(c, extra){
  return `<div class="card">
    <div class="row"><span class="name">${c.name}</span>${jurisdictionBadge(c)}<span class="cite">${c.citation}</span></div>
    ${c.originalName ? `<div style="color:var(--muted);font-size:12px;font-style:italic;margin-top:2px;">${c.originalName}</div>` : ''}
    ${levelTabsHtml(c.id)}
    ${levelContentHtml(c)}
    ${extra !== undefined ? extra : c.themes.map(t=>`<span class="theme-tag">${themeLabel(t)}</span>`).join(' ') + (c.legacyThemes ? c.legacyThemes.map(t=>`<span class="legacy-tag">${legacyThemeLabel(t)}</span>`).join(' ') : '')}
  </div>`;
}

function sectionCard(tab,title,desc){
  return `<div class="section-card" onclick="switchTab('${tab}')"><div class="t">${title}</div><div class="d">${desc}</div></div>`;
}

function filterField(key,label,placeholder,sourceList,big){
  const value = (window._filters && window._filters[key]) || '';
  const q = value.toLowerCase();
  const exact = sourceList && sourceList.some(s=>s.toLowerCase()===q);
  const matches = (sourceList && q && !exact) ? sourceList.filter(s=>s.toLowerCase().includes(q)).slice(0,5) : [];
  return `<div class="filter-field${big?' big':''}">
    <label class="field-label">${label}</label>
    <input id="filter-${key}" type="text" placeholder="${placeholder}" value="${value}" oninput="window._filters['${key}']=this.value;renderMain()">
    ${matches.length? `<div class="suggestions">${matches.map(s=>`<div class="suggestion" onclick="window._filters['${key}']='${s.replace(/'/g,"\\'")}';renderMain()">${s}</div>`).join('')}</div>` : ''}
  </div>`;
}

function computeResults(){
  const f = window._filters || {};
  let results = CASES;
  if(f.name) results = results.filter(c=>c.name.toLowerCase().includes(f.name.toLowerCase()));
  if(f.keyword){
    const kq = f.keyword.toLowerCase();
    results = results.filter(c=>{
      const text = [c.abstract,c.intermediate,c.detailed].map(l=>l.issue+' '+l.rule+' '+l.application).join(' ').toLowerCase();
      return text.includes(kq);
    });
  }
  if(f.theme) results = results.filter(c=>c.themes.some(t=>themeLabel(t).toLowerCase().includes(f.theme.toLowerCase())) || (c.legacyThemes||[]).some(t=>legacyThemeLabel(t).toLowerCase().includes(f.theme.toLowerCase())));
  if(f.related){
    const base = CASES.find(c=>c.name.toLowerCase()===f.related.toLowerCase());
    if(base) results = results.filter(c=>c.id!==base.id && c.themes.some(t=>base.themes.includes(t)));
  }
  return results;
}

function renderHome(){
  if(!window._filters) window._filters = {name:'',keyword:'',theme:'',related:''};
  const active = Object.values(window._filters).some(v=>v&&v.trim());
  const s = progressSummary();
  const results = active ? computeResults() : [];
  return `<div class="hero"><div class="hero-rule"></div><p class="hero-sub">Start small. Become great.</p></div>
    <p class="progress-line">${s.mastered} mastered · ${s.started} in progress · ${s.notStarted} not started</p>
    <div class="search-row">
      ${filterField('name','Case name','e.g. Rottmann', CASES.map(c=>c.name), true)}
      <div id="cat-mascot" class="cat-mascot"></div>
    </div>
    <div class="filter-row">
      ${filterField('keyword','Keywords','e.g. direct effect', null)}
      ${filterField('theme','Key theme','e.g. citizenship', THEMES.map(themeLabel))}
      ${filterField('related','Related to','e.g. Van Gend en Loos', CASES.map(c=>c.name))}
    </div>
    ${active ? `<div style="margin-top:14px;">${results.length? results.map(c=>caseCard(c)).join('') : '<p class="empty">No cases match yet — try different criteria.</p>'}</div>`
        : `<div class="section-grid">
            ${sectionCard('subjects','My subjects','Browse cases by article and theme')}
            ${sectionCard('diagrams','Diagrams','Visual maps of each theme')}
            ${sectionCard('week','This week','Log what you studied, day by day')}
            ${sectionCard('exams','My exams','Define your exam scope')}
           </div>`}`;
}

function renderSubjects(){
  if(!window._openSubjects) window._openSubjects = {};
  return `<h1>My subjects</h1>` + THEMES.map((t,i)=>{
    const cases = CASES.filter(c=>c.themes.includes(t));
    const mastered = cases.filter(c=>(state.progress[c.id]||0)>=3).length;
    const open = !!window._openSubjects[t];
    return `<div class="theme-block">
      <div class="theme-head" style="cursor:pointer;" onclick="toggleSubjectOpen(${i})">
        <span class="t"><span style="display:inline-block;width:14px;color:var(--gold);">${open?'▾':'▸'}</span>${themeLabel(t)}</span><span class="n">${mastered}/${cases.length} mastered</span>
      </div>
      ${open ? `<div class="theme-body">${cases.map(c=>caseCard(c,'')).join('')}</div>` : ''}
    </div>`;
  }).join('');
}
function toggleSubjectOpen(i){
  const t = THEMES[i];
  window._openSubjects[t] = !window._openSubjects[t];
  renderMain();
}

function wrapTextLines(str, maxChars){
  const tokens = str.replace(/\s*\(No 2\)\s*/,' ').trim().split(/\s+/).flatMap(w=>{
    if(w.length<=maxChars) return [w];
    const parts = w.split(/(?<=[\/-])/);
    return parts.length>1 ? parts : [w];
  });
  let lines = [], current = '';
  for(let w of tokens){
    if(w.length>maxChars){
      if(current){ lines.push(current); current=''; }
      let remaining = w;
      while(remaining.length>maxChars){ lines.push(remaining.slice(0,maxChars)); remaining = remaining.slice(maxChars); }
      current = remaining;
      continue;
    }
    const test = current ? current+' '+w : w;
    if(test.length <= maxChars || !current) current = test;
    else { lines.push(current); current = w; }
  }
  if(current) lines.push(current);
  return lines;
}
function wrapThemeLabel(theme){
  const lines = wrapTextLines(theme, 16);
  const lineHeight = 12;
  const startY = 170 - ((lines.length-1)*lineHeight)/2;
  return lines.map((line,i)=>`<text x="280" y="${(startY+i*lineHeight).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#FDFBF6" font-family="Averia Serif Libre, serif">${line}</text>`).join('');
}

function renderDiagramSVG(theme, themeIndex, cases){
  const W=560,H=340,cx=280,cy=170,R=118;
  const nodes = cases.map((c,i)=>{
    const angle = -90 + i*(360/cases.length);
    const rad = angle*Math.PI/180;
    return Object.assign({}, c, {x: cx + R*Math.cos(rad), y: cy + R*Math.sin(rad)});
  });
  const selected = (window._diagramSelected && window._diagramSelected[theme]) || null;
  const lines = nodes.map(n=>`<line x1="${cx}" y1="${cy}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="${selected===n.id?'#2E7BAE':'#F0DFC0'}" stroke-width="2"/>`).join('');
  const dots = nodes.map(n=>{
    const isSel = selected===n.id;
    const nodeLines = wrapTextLines(n.name, 13);
    const lineHeight = 10.5;
    const startY = n.y - ((nodeLines.length-1)*lineHeight)/2;
    const tspans = nodeLines.map((l,i)=>`<text x="${n.x.toFixed(1)}" y="${(startY+i*lineHeight).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="9" fill="${isSel?'#FFFFFF':'#3A362F'}" font-family="Inter,sans-serif">${l}</text>`).join('');
    return `<g style="cursor:pointer" onclick="selectDiagram(${themeIndex},'${n.id}')">
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="36" fill="${isSel?'#2E7BAE':'#FFFFFF'}" stroke="${isSel?'#2E7BAE':'#6E1B24'}" stroke-width="2"/>
      ${tspans}
    </g>`;
  }).join('');
  const detail = selected ? CASES.find(c=>c.id===selected) : null;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    ${lines}


    <circle cx="${cx}" cy="${cy}" r="58" fill="#6E1B24"/>
    ${wrapThemeLabel(themeLabel(theme))}
    ${dots}
  </svg>
  ${detail ? `<div class="diagram-detail">
      <div class="row"><span class="name">${detail.name}</span><span class="cite">${detail.citation}</span></div>
      ${detail.originalName ? `<div style="color:var(--muted);font-size:12px;font-style:italic;margin-top:2px;">${detail.originalName}</div>` : ''}
      ${levelTabsHtml(detail.id)}
      ${levelContentHtml(detail)}
    </div>` : `<p class="empty">Click a case to see its details.</p>`}`;
}
function selectDiagram(themeIndex,id){
  const theme = THEMES[themeIndex];
  if(!window._diagramSelected) window._diagramSelected={};
  window._diagramSelected[theme] = window._diagramSelected[theme]===id? null : id;
  renderMain();
}

function renderDiagrams(){
  return `<h1>Diagrams</h1>` + THEMES.map((t,i)=>{
    const cases = CASES.filter(c=>c.themes.includes(t));
    const mastered = cases.filter(c=>(state.progress[c.id]||0)>=3).length;
    return `<div class="diag-block">
      <div class="diag-head"><span class="t">${themeLabel(t)}</span><span class="n">${mastered}/${cases.length} mastered</span></div>
      ${renderDiagramSVG(t,i,cases)}
    </div>`;
  }).join('');
}

function computeWeekDays(offset){
  const today = new Date();
  const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay()+6)%7) + offset*7);
  return [...Array(7)].map((_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });
}
function renderCaseAutocomplete(selKey){
  const q = (window._caseInput||'').toLowerCase();
  const tagged = (state.weekCases[selKey]||[]).map(id=>CASES.find(c=>c.id===id)).filter(Boolean);
  const matches = q ? CASES.filter(c=>c.name.toLowerCase().includes(q) && !(state.weekCases[selKey]||[]).includes(c.id)).slice(0,5) : [];
  return `<div class="case-log">
    <div class="case-log-label">Cases studied</div>
    <div class="case-chips">${tagged.map(c=>`<span class="chip active">${c.name} <span onclick="removeWeekCase('${selKey}','${c.id}')" style="cursor:pointer;margin-left:4px;">✕</span></span>`).join('')}</div>
    <input id="case-log-input" type="text" placeholder="Type a case name..." value="${window._caseInput||''}"
      oninput="window._caseInput=this.value;renderMain()"
      onkeydown="if(event.key==='Enter'){handleCaseEnter('${selKey}')}">
    ${matches.length? `<div class="suggestions">${matches.map(c=>`<div class="suggestion" onclick="addWeekCase('${selKey}','${c.id}')">${c.name} <span style="color:var(--blue);font-size:11px;">${c.citation}</span></div>`).join('')}</div>` : ''}
  </div>`;
}
function addWeekCase(dateKey, caseId){
  if(!state.weekCases[dateKey]) state.weekCases[dateKey]=[];
  if(!state.weekCases[dateKey].includes(caseId)) state.weekCases[dateKey].push(caseId);
  window._caseInput='';
  saveState(); renderMain();
}
function removeWeekCase(dateKey, caseId){
  state.weekCases[dateKey] = (state.weekCases[dateKey]||[]).filter(id=>id!==caseId);
  saveState(); renderMain();
}
function handleCaseEnter(selKey){
  const q = (window._caseInput||'').toLowerCase();
  const m = CASES.find(c=>c.name.toLowerCase().includes(q) && !(state.weekCases[selKey]||[]).includes(c.id));
  if(m) addWeekCase(selKey, m.id);
}

function renderWeek(){
  const days = computeWeekDays(window._weekOffset||0);
  if(!window._agendaDate) window._agendaDate = new Date().toISOString().slice(0,10);
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const rangeLabel = `${days[0].toLocaleDateString(undefined,{day:'numeric',month:'short'})} – ${days[6].toLocaleDateString(undefined,{day:'numeric',month:'short'})}`;
  const selectedDate = days.find(d=>d.toISOString().slice(0,10)===window._agendaDate) || days[0];
  const selKey = selectedDate.toISOString().slice(0,10);
  const fullLabel = selectedDate.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  return `<h1>This week</h1>
    <div class="week-nav">
      <span class="arrow" onclick="window._weekOffset=(window._weekOffset||0)-1;renderMain()">‹</span>
      <span class="range">${rangeLabel}</span>
      <span class="arrow" onclick="window._weekOffset=(window._weekOffset||0)+1;renderMain()">›</span>
    </div>
    <div class="day-strip">${days.map((d,i)=>{
      const key=d.toISOString().slice(0,10);
      const isSel = key===selKey;
      const hasNote = !!((state.weekNotes[key]&&state.weekNotes[key].trim()) || (state.weekCases[key]&&state.weekCases[key].length));
      return `<div class="day-pill ${isSel?'active':''}" onclick="window._agendaDate='${key}';window._caseInput='';renderMain()">
        <div class="dn">${dayNames[i]}</div><div class="dd">${d.getDate()}</div>${hasNote?'<div class="mark"></div>':''}
      </div>`;
    }).join('')}</div>
    <div class="agenda-page">
      <div class="agenda-date">${fullLabel}</div>
      ${renderCaseAutocomplete(selKey)}
      <textarea class="agenda" placeholder="Other notes..." onchange="state.weekNotes['${selKey}']=this.value;saveState()">${state.weekNotes[selKey]||''}</textarea>
    </div>`;
}

function renderExams(){
  return `<h1>My exams</h1>
    <p style="color:var(--muted);font-size:13.5px;margin-top:-8px;">Create an exam, then add subjects or individual cases to its scope.</p>
    <div style="margin:14px 0;"><span class="chip active" style="cursor:pointer;" onclick="addExam()">+ Add exam</span></div>
    ${state.exams.length? state.exams.map(ex=>renderExamBlock(ex)).join('') : '<p class="empty">No exams yet — add one to start scoping.</p>'}`;
}
function examSuggestions(ex, query){
  const q = (query||'').trim().toLowerCase();
  if(!q) return [];
  const themeMatches = THEMES.filter(t=>{
    if(!themeLabel(t).toLowerCase().includes(q)) return false;
    return CASES.some(c=>c.themes.includes(t) && !ex.caseIds.includes(c.id));
  }).map(t=>({type:'theme', idx:THEMES.indexOf(t)}));
  const caseMatches = CASES.filter(c=>c.name.toLowerCase().includes(q) && !ex.caseIds.includes(c.id)).map(c=>({type:'case', id:c.id}));
  return [...themeMatches, ...caseMatches].slice(0,6);
}
function renderExamScope(ex){
  const inScope = CASES.filter(c=>ex.caseIds.includes(c.id));
  if(!inScope.length) return '<p class="empty">No cases yet — search above to add a subject or a case.</p>';
  return THEMES.filter(t=>inScope.some(c=>c.themes.includes(t))).map(t=>{
    const cases = inScope.filter(c=>c.themes.includes(t));
    return `<div style="margin:12px 0;">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">${themeLabel(t)}</div>
      <div class="case-chips">${cases.map(c=>`<span class="chip active">${c.name} <span onclick="toggleExamCase('${ex.id}','${c.id}')" style="cursor:pointer;margin-left:4px;">✕</span></span>`).join('')}</div>
    </div>`;
  }).join('');
}
function renderExamBlock(ex){
  const count = ex.caseIds.length;
  const query = (window._examInput && window._examInput[ex.id]) || '';
  const suggestions = examSuggestions(ex, query);
  return `<div class="theme-block" style="margin-bottom:14px;">
    <div class="theme-head">
      <input type="text" value="${ex.name}" onchange="renameExam('${ex.id}',this.value)" style="border:none;background:transparent;font-family:'Averia Serif Libre',serif;color:var(--red);font-size:17px;padding:0;width:55%;">
      <span style="display:flex;align-items:center;gap:12px;">
        <span class="n">${count} case${count===1?'':'s'}</span>
        <span onclick="deleteExam('${ex.id}')" style="cursor:pointer;color:var(--muted);">✕</span>
      </span>
    </div>
    <div class="theme-body">
      <div class="case-log">
        <input id="exam-search-${ex.id}" type="text" placeholder="Add a subject or a case..." value="${query}" oninput="setExamInput('${ex.id}',this.value)">
        ${suggestions.length? `<div class="suggestions">${suggestions.map(s=>{
          if(s.type==='theme'){
            const themeKey = THEMES[s.idx];
            const cnt = CASES.filter(c=>c.themes.includes(themeKey) && !ex.caseIds.includes(c.id)).length;
            return `<div class="suggestion" onclick="addSubjectToExam('${ex.id}',${s.idx})"><b>${themeLabel(themeKey)}</b> — add ${cnt} case${cnt===1?'':'s'}</div>`;
          }
          const c = CASES.find(x=>x.id===s.id);
          return `<div class="suggestion" onclick="addCaseToExamSearch('${ex.id}','${s.id}')">${c.name} <span style="color:var(--blue);font-size:11px;">${c.citation}</span></div>`;
        }).join('')}</div>` : ''}
      </div>
      <div style="margin-top:14px;">${renderExamScope(ex)}</div>
    </div>
  </div>`;
}
function setExamInput(examId, val){
  if(!window._examInput) window._examInput={};
  window._examInput[examId]=val;
  renderMain();
}
function addSubjectToExam(examId, themeIndex){
  const ex = state.exams.find(e=>e.id===examId); if(!ex) return;
  const themeKey = THEMES[themeIndex];
  CASES.filter(c=>c.themes.includes(themeKey)).forEach(c=>{ if(!ex.caseIds.includes(c.id)) ex.caseIds.push(c.id); });
  if(window._examInput) window._examInput[examId]='';
  saveState(); renderMain();
}
function addCaseToExamSearch(examId, caseId){
  const ex = state.exams.find(e=>e.id===examId); if(!ex) return;
  if(!ex.caseIds.includes(caseId)) ex.caseIds.push(caseId);
  if(window._examInput) window._examInput[examId]='';
  saveState(); renderMain();
}
function addExam(){
  state.exams.push({id:'exam-'+Date.now(), name:'Exam '+(state.exams.length+1), caseIds:[]});
  saveState(); renderMain();
}
function renameExam(id, name){
  const ex = state.exams.find(e=>e.id===id); if(ex) ex.name=name;
  saveState(); renderMain();
}
function deleteExam(id){
  state.exams = state.exams.filter(e=>e.id!==id);
  saveState(); renderMain();
}
function toggleExamCase(examId, caseId){
  const ex = state.exams.find(e=>e.id===examId); if(!ex) return;
  const i = ex.caseIds.indexOf(caseId);
  if(i>-1) ex.caseIds.splice(i,1); else ex.caseIds.push(caseId);
  saveState(); renderMain();
}

function renderMain(){
  const active = document.activeElement;
  const activeId = active && active.id;
  let selStart=null, selEnd=null;
  if(active && typeof active.selectionStart === 'number'){ selStart=active.selectionStart; selEnd=active.selectionEnd; }
  const map = {home:renderHome, subjects:renderSubjects, diagrams:renderDiagrams, week:renderWeek, exams:renderExams};
  const mainEl = document.getElementById('main');
  document.body.classList.toggle('home-bg', activeTab==='home');
  mainEl.className = '';
  mainEl.innerHTML = map[activeTab]();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  if(activeTab==='home'){
    const catEl = document.getElementById('cat-mascot');
    if(window._catAnim){ window._catAnim.destroy(); window._catAnim=null; }
    if(catEl && window.lottie){
      window._catAnim = lottie.loadAnimation({container:catEl, renderer:'svg', loop:true, autoplay:true, animationData:CAT_ANIMATION_DATA});
    }
  } else if(window._catAnim){
    window._catAnim.destroy(); window._catAnim=null;
  }
}

document.addEventListener('mouseup', function(e){
  const popup = document.getElementById('citation-popup');
  if(popup.contains(e.target)) return;
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  if(!text || !sel.rangeCount){ popup.style.display='none'; return; }
  const node = sel.anchorNode;
  const el = node && node.nodeType===3 ? node.parentElement : node;
  const citable = el ? el.closest('.citable') : null;
  if(!citable){ popup.style.display='none'; return; }
  showCitationPopup(citable.getAttribute('data-case'), text, sel.getRangeAt(0).getBoundingClientRect());
});
document.addEventListener('mousedown', function(e){
  const popup = document.getElementById('citation-popup');
  if(!popup.contains(e.target)) popup.style.display='none';
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ document.getElementById('citation-popup').style.display='none'; closeArticleModal(); }
});

(async function init(){
  await loadState();
  renderLangSwitch();
  renderNav();
  renderMain();
})();
</script>
</body>
