<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Casus — EU case law</title>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
<style>
  :root{
    --red:#6E1B24; --red-dark:#4F1219; --gold:#C9A227; --gold-light:#F0DFC0;
    --cream:#FDFBF6; --white:#FFFFFF; --blue:#2E7BAE; --blue-light:#EAF4FB;
    --ink:#3A362F; --muted:#5B564C; --line:#E4DCC8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;}
  header{background:var(--red);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);}
  header .logo{color:var(--cream);font-size:20px;font-family:'Averia Serif Libre',serif;cursor:pointer;}
  nav{display:flex;align-items:center;gap:4px;background:var(--white);border-bottom:1px solid var(--line);padding:0 28px;min-height:38px;}
  nav button{background:none;border:none;padding:10px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-family:'Inter',sans-serif;}
  nav button.active{color:var(--red);border-bottom-color:var(--gold);font-weight:500;}
  nav .nav-toggle{padding:10px 0;color:var(--muted);font-size:13px;cursor:pointer;}
  main{max-width:760px;margin:0 auto;padding:28px;}
  body.home-bg{background:var(--red);}
  .home-bg .hero-sub{color:#F7DCDC;}
  .home-bg .progress-line{color:#F0C2C2;}
  .home-bg .field-label{color:#F5D2D2;}
  .search-row{display:flex;align-items:center;gap:16px;}
  .search-row .filter-field{flex:1;margin-bottom:0;}
  .cat-mascot{width:150px;height:81px;flex-shrink:0;}
  h1{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:24px;font-weight:400;margin:0 0 16px;}
  h3{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:16px;font-weight:400;margin:0 0 10px;}
  .hero{text-align:center;padding:12px 0 6px;}
  .hero-rule{width:52px;height:3px;background:var(--gold);margin:0 auto 14px;}
  .hero-sub{color:var(--muted);font-size:15px;margin:0;}
  .progress-line{text-align:center;color:var(--muted);font-size:12.5px;margin:10px 0 20px;}
  .field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .filter-field{margin-bottom:10px;position:relative;}
  .filter-field input[type=text]{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--white);color:var(--ink);}
  .filter-field.big input[type=text]{padding:17px 20px;font-size:16.5px;}
  .filter-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
  .section-card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:20px;cursor:pointer;}
  .section-card .t{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:18px;margin-bottom:6px;}
  .section-card .d{color:var(--muted);font-size:13px;}
  .section-card:hover{border-left-color:var(--blue);}
  .card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:14px 18px;margin-bottom:10px;}
  .card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .card .name{color:var(--red);font-size:16px;font-family:'Averia Serif Libre',serif;}
  .card .cite{color:var(--blue);font-size:12px;white-space:nowrap;}
  .detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.75;}
  .detail b{color:var(--red);}
  .citable{cursor:text;}
  .citable::selection, .citable *::selection{background:var(--gold-light);}
  .case-link{color:var(--blue);cursor:pointer;text-decoration:underline;}
  .case-link:hover{color:var(--red);}
  .case-link-pending{color:var(--muted);border-bottom:1px dashed var(--muted);cursor:help;}
  .theme-tag{display:inline-block;font-size:11px;color:var(--gold);background:#FBF3DD;border:1px solid var(--gold-light);padding:2px 8px;border-radius:10px;margin-top:8px;}
  .level-tabs{display:flex;align-items:center;gap:6px;margin-top:10px;}
  .lvl-btn{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:12px;cursor:pointer;}
  .lvl-btn.active{background:var(--red);color:var(--cream);border-color:var(--red);}
  .dots{display:inline-flex;gap:4px;margin-left:auto;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;}
  .dot.filled{background:var(--blue);}
  .legal-basis{margin-top:10px;font-size:12px;}
  .lb-label{color:var(--muted);margin-right:6px;}
  .article-chip{display:inline-block;font-size:12px;color:var(--blue);background:var(--blue-light);border-radius:12px;padding:3px 10px;margin:2px 4px 2px 0;cursor:pointer;}
  .advanced-hint{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:8px;}
  .theme-block{margin-bottom:22px;}
  .theme-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .theme-head span.t{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:17px;}
  .theme-head span.n{font-size:12px;color:var(--muted);}
  .theme-body{padding-top:12px;}
  .diag-block{margin-bottom:18px;}
  .diag-head{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .diag-head .t{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:17px;}
  .diag-head .n{font-size:12px;color:var(--muted);}
  .diagram-detail{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:14px 18px;margin-top:10px;}
  .diagram-detail .row{display:flex;justify-content:space-between;}
  .diagram-detail .name{color:var(--red);font-family:'Averia Serif Libre',serif;font-size:16px;}
  .diagram-detail .cite{color:var(--blue);font-size:12px;}
  .week-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;}
  .week-nav .arrow{cursor:pointer;color:var(--red);font-size:18px;padding:2px 10px;user-select:none;}
  .week-nav .range{color:var(--muted);font-size:13px;}
  .day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px;}
  .day-pill{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;}
  .day-pill.active{border-color:var(--red);background:#FBF0EC;}
  .day-pill .dn{font-size:11px;color:var(--muted);}
  .day-pill .dd{font-size:15px;color:var(--ink);font-family:'Averia Serif Libre',serif;}
  .day-pill .mark{width:5px;height:5px;border-radius:50%;background:var(--gold);margin:4px auto 0;}
  .agenda-page{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 20px;}
  .agenda-date{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:17px;margin-bottom:10px;}
  .case-log{margin-top:16px;}
  .case-log-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
  .case-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--white);font-size:13px;color:var(--muted);cursor:pointer;}
  .chip.active{background:var(--blue);color:var(--blue-light);border-color:var(--blue);}
  .suggestions{background:var(--white);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;}
  .suggestion{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .suggestion:last-child{border-bottom:none;}
  .suggestion:hover{background:var(--blue-light);}
  .exam-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .exam-row input{accent-color:var(--blue);}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
  .col h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin:0 0 8px;font-family:'Inter',sans-serif;}
  .col .item{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink);}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:10px 0;}
  textarea.agenda{
    width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;
    padding:14px 20px 14px 56px;font-family:'Inter',sans-serif;font-size:14.5px;line-height:28px;
    color:var(--ink);resize:vertical;background-attachment:local;
    background-image:
      linear-gradient(to right, transparent 40px, rgba(110,27,36,0.28) 40px, rgba(110,27,36,0.28) 41px, transparent 41px),
      repeating-linear-gradient(#FFFFFF, #FFFFFF 27px, var(--line) 27px, var(--line) 28px);
  }
  #citation-popup{position:fixed;display:none;width:270px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(58,54,47,0.18);z-index:1100;}
  .cp-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .cp-item{padding:8px 0;border-top:1px solid var(--line);}
  .cp-item:first-child{border-top:none;padding-top:0;}
  .cp-para{font-size:12.5px;font-weight:500;color:var(--ink);}
  .cp-item.primary .cp-para{color:var(--red);}
  .cp-note{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .modal-overlay{position:fixed;inset:0;background:rgba(58,54,47,0.45);display:none;align-items:center;justify-content:center;z-index:1200;padding:20px;}
  .modal-card{background:var(--white);border-radius:12px;padding:22px 24px;max-width:420px;width:100%;max-height:80vh;overflow:auto;position:relative;}
  .modal-close{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:14px;}
  .changed-banner{background:#FBF3DD;border:1px solid var(--gold-light);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin:12px 0;line-height:1.6;}
  .article-links{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .article-links a{color:var(--blue);font-size:13px;}
</style>
</head>

const CASES = [
{id:"costaenel", name:"Costa v ENEL", originalName:"Flaminio Costa contro E.N.E.L.", citation:"Case 6/64", themes:["Primacy of EU law"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Could Italy's later nationalisation law override its earlier obligations under the EEC Treaty?",
   rule:"Community law, once in force, forms an integral part of the legal systems of the member states and takes precedence over their national law, including later national legislation.",
   application:"The Italian court could not apply the ordinary 'later law prevails' rule to give the nationalisation statute priority over the EEC Treaty."},
 intermediate:{
   issue:"Italy nationalised its electricity sector in 1962. Flaminio Costa held shares in a company swept into that nationalisation.<br><br>He disputed a small bill from ENEL, the new state monopoly. Costa argued the nationalisation law broke several EEC Treaty rules.<br><br>Under ordinary Italian law, a later statute simply overrides an earlier one. So the 1962 nationalisation law would beat Italy's 1957 law bringing in the EEC Treaty.",
   rule:"The Court disagreed with that ordinary approach. The EEC Treaty was not like an ordinary international treaty.<br><br>It created its own legal system. Once in force, that system became part of every member state's own legal order. It bound national courts directly.<br><br>By joining the Community, states had given up some of their sovereign powers. This applied across ever-wider areas. States could not then pass a later law and let it override this shared legal system.",
   application:"Community law could not be overridden by domestic rules, however those rules were framed. So the Italian court could not use its usual 'later law wins' approach here.<br><br>The nationalisation statute could not take priority over the earlier Treaty."},
 detailed:{
   issue:"Flaminio Costa was a small shareholder in Edison Volta, a company absorbed into Italy's 1962 nationalisation of the electricity sector.<br><br>Costa disputed a modest bill from ENEL, the new state monopoly. He argued the nationalisation law broke EEC Treaty rules on competition and state monopolies.<br><br>Italy's own Constitutional Court had already ruled on this, weeks earlier. It said ordinary statutory interpretation applied: a later Italian law simply displaces an earlier one. So the 1962 statute would win over Italy's 1957 law bringing in the Treaty.<br><br>The Milan magistrate still referred questions to the Court of Justice, asking for an interpretation of the Treaty articles said to be infringed, under Article 177 EEC.",
   rule:`The Court's answer went further than expected. It said the Community had unlimited duration, its own institutions, and real powers.<br><br>These powers came from a limitation of sovereignty. Member states had transferred some of their own powers to the Community. This meant they had limited their sovereign rights, in ever wider fields.<br><br>This created a body of law binding on states and on their people. Because of this special and original nature, the law could not be overridden by domestic rules — however those rules were framed.<br><br>Overriding EU law this way would strip it of its character as Community law. It would also call into question the Community's own legal basis.`,
   application:"The Italian court could not use its 'later law wins' rule here. It could not let the nationalisation statute override the earlier Treaty.<br><br>One detail worth noting: the Treaty of Lisbon never wrote primacy into the Treaties as an article. It only added a Declaration recalling this judgment.<br><br>Primacy remains a principle the Court itself created — never codified as a Treaty rule."},
 holistic:`Costa v ENEL was decided in 1964, just a year after <span class="case-link-pending" title="Not yet added to Casus">Van Gend en Loos</span> (1963) established that EU law can create rights individuals rely on directly. Together, these two cases form the twin foundations of EU constitutional law. Van Gend en Loos said EU law reaches people directly. Costa said that where EU law conflicts with national law, EU law wins.<br><br>Later cases pushed primacy further. <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> extended it to survive conflicts with a member state's own constitutional fundamental rights — the hardest test for the doctrine. <span class="case-link-pending" title="Not yet added to Casus">Simmenthal</span> later required national courts to set aside conflicting national law themselves, immediately, without waiting for a domestic court to strike it down first.<br><br>Even fifty years on, the tension Costa created is still alive. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> shows the same basic question — EU law versus a member state's own higher standards — playing out today under the modern Charter of Fundamental Rights.<br><br>Structurally, primacy is one of two pillars holding up the whole EU legal order, alongside direct effect. Neither is written into the Treaties as an article. Both are judge-made.`,
 citations:[
   {phrase:"could not be overridden by domestic legal provisions, however framed, without being deprived of its character as Community law", paragraphs:"[1964] ECR 585, at pp. 593–594 (this judgment predates paragraph numbering)", note:"The core primacy holding — cited by page, since paragraph numbering wasn't yet standard practice in 1964.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"L'Italie pouvait-elle, par une loi de nationalisation postérieure, faire échec à ses engagements antérieurs découlant du traité CEE ?",
       rule:"Le droit communautaire, une fois entré en vigueur, fait partie intégrante des systèmes juridiques des États membres et prime sur leur droit national, y compris une législation nationale postérieure.",
       application:"Le juge italien ne pouvait pas appliquer la règle ordinaire « la loi postérieure prévaut » pour faire primer la loi de nationalisation sur le traité CEE."},
     intermediate:{
       issue:"L'Italie a nationalisé son secteur électrique en 1962. Flaminio Costa détenait des actions d'une société touchée par cette nationalisation.<br><br>Il contesta une petite facture d'électricité émise par ENEL, le nouveau monopole d'État. Costa soutenait que la loi de nationalisation violait plusieurs dispositions du traité CEE.<br><br>Selon le droit italien ordinaire, une loi postérieure l'emporte simplement sur une loi antérieure. La loi de 1962 aurait donc dû l'emporter sur la loi italienne de 1957 ayant incorporé le traité CEE.",
       rule:"La Cour a écarté cette approche ordinaire. Le traité CEE n'était pas un traité international comme les autres.<br><br>Il a créé un ordre juridique propre. Une fois en vigueur, cet ordre est devenu partie intégrante de l'ordre juridique de chaque État membre. Il liait directement les juridictions nationales.<br><br>En adhérant à la Communauté, les États avaient renoncé à une partie de leurs pouvoirs souverains, dans un domaine toujours plus large. Ils ne pouvaient donc plus adopter une loi postérieure qui prévaudrait sur cet ordre juridique commun.",
       application:"Le droit communautaire ne pouvait pas être écarté par des règles nationales, quelle que soit leur forme. Le juge italien ne pouvait donc pas appliquer sa règle habituelle « la loi postérieure prévaut ». La loi de nationalisation ne pouvait pas primer sur le traité antérieur."},
     detailed:{
       issue:"Flaminio Costa était un petit actionnaire d'Edison Volta, une société absorbée par la nationalisation du secteur électrique italien en 1962.<br><br>Costa contesta une facture modeste émise par ENEL, le nouveau monopole d'État, en soutenant que la loi de nationalisation violait des dispositions du traité CEE relatives à la concurrence et aux monopoles d'État.<br><br>La Cour constitutionnelle italienne avait déjà jugé, quelques semaines plus tôt, que l'interprétation ordinaire des lois s'appliquait : une loi italienne postérieure déplace simplement une loi antérieure. La loi de 1962 devait donc l'emporter sur la loi de 1957 incorporant le traité.<br><br>Le juge de paix de Milan a néanmoins saisi la Cour de justice, sur le fondement de l'article 177 CEE, de questions portant sur l'interprétation des articles du traité prétendument violés.",
       rule:`La réponse de la Cour est allée plus loin qu'attendu. Elle a jugé que la Communauté, instituée pour une durée illimitée, dotée d'institutions propres et de pouvoirs réels découlant d'une limitation de souveraineté ou d'un transfert d'attributions des États vers la Communauté, impliquait que les États membres avaient limité leurs droits souverains, dans des domaines certes limités, et créé un corps de droit liant aussi bien leurs ressortissants qu'eux-mêmes.<br><br>En raison de cette nature propre et originale, le droit issu du traité ne pouvait pas se voir opposer des dispositions internes, quelle que soit leur forme, sans perdre son caractère communautaire et sans que la base juridique même de la Communauté ne soit remise en cause.`,
       application:"Le juge italien ne pouvait pas appliquer sa règle « la loi postérieure prévaut » pour faire primer la loi de nationalisation sur le traité antérieurement incorporé.<br><br>Un détail à noter : le traité de Lisbonne n'a jamais inscrit la primauté dans les traités sous forme d'article. Il s'est contenté d'ajouter une déclaration rappelant cet arrêt.<br><br>La primauté demeure un principe forgé par la Cour elle-même, jamais codifié comme règle du traité."},
     holistic:`Costa contre ENEL a été rendu en 1964, un an seulement après <span class="case-link-pending" title="Pas encore ajouté à Casus">Van Gend en Loos</span> (1963), qui avait établi que le droit de l'Union peut créer des droits que les particuliers peuvent invoquer directement. Ensemble, ces deux arrêts forment les deux piliers du droit constitutionnel de l'Union.<br><br>Des arrêts ultérieurs ont poussé la primauté plus loin. <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> l'a étendue pour qu'elle résiste même à un conflit avec les droits fondamentaux constitutionnels propres à un État membre — l'épreuve la plus difficile pour cette doctrine. <span class="case-link-pending" title="Pas encore ajouté à Casus">Simmenthal</span> a ensuite exigé que les juridictions nationales écartent elles-mêmes, immédiatement, le droit national contraire.<br><br>Même cinquante ans plus tard, la tension créée par Costa demeure vive. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> illustre la même question fondamentale, transposée aujourd'hui dans le cadre de la Charte des droits fondamentaux.<br><br>Sur le plan structurel, la primauté constitue l'un des deux piliers de tout l'ordre juridique de l'Union, aux côtés de l'effet direct. Aucun des deux n'est inscrit dans les traités. Tous deux sont d'origine prétorienne.`,
     citations:[
       {phrase:"ne pouvait pas se voir opposer des dispositions internes, quelle que soit leur forme", paragraphs:"[1964] Rec. 585, p. 593-594 (cet arrêt est antérieur à la numérotation par paragraphe)", note:"La formulation centrale sur la primauté — citée par page, la numérotation par paragraphe n'étant pas encore en usage en 1964.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Konnte Italien mit einem späteren Verstaatlichungsgesetz seine früheren Verpflichtungen aus dem EWG-Vertrag außer Kraft setzen?",
       rule:"Gemeinschaftsrecht wird nach seinem Inkrafttreten fester Bestandteil der Rechtsordnungen der Mitgliedstaaten und geht ihrem nationalen Recht vor, auch späterem nationalen Recht.",
       application:"Das italienische Gericht durfte nicht die gewöhnliche Regel „späteres Gesetz geht vor“ anwenden, um dem Verstaatlichungsgesetz Vorrang vor dem EWG-Vertrag einzuräumen."},
     intermediate:{
       issue:"Italien verstaatlichte 1962 seinen Elektrizitätssektor. Flaminio Costa hielt Aktien an einem davon betroffenen Unternehmen.<br><br>Er focht eine kleine Stromrechnung von ENEL, dem neuen Staatsmonopol, an. Costa machte geltend, das Verstaatlichungsgesetz verstoße gegen mehrere Bestimmungen des EWG-Vertrags.<br><br>Nach gewöhnlichem italienischem Recht verdrängt ein späteres Gesetz einfach ein früheres. Das Gesetz von 1962 hätte damit das italienische Gesetz von 1957, mit dem der EWG-Vertrag umgesetzt wurde, verdrängen müssen.",
       rule:"Der Gerichtshof lehnte diesen gewöhnlichen Ansatz ab. Der EWG-Vertrag war kein gewöhnlicher völkerrechtlicher Vertrag.<br><br>Er schuf eine eigene Rechtsordnung. Mit ihrem Inkrafttreten wurde diese Bestandteil der Rechtsordnung jedes Mitgliedstaats und band die nationalen Gerichte unmittelbar.<br><br>Mit dem Beitritt zur Gemeinschaft hatten die Staaten einen Teil ihrer souveränen Rechte abgegeben, in einem immer weiteren Bereich. Sie konnten daher nicht später ein Gesetz erlassen, das dieser gemeinsamen Rechtsordnung vorginge.",
       application:"Gemeinschaftsrecht konnte nicht durch innerstaatliche Vorschriften verdrängt werden, gleich in welcher Form. Das italienische Gericht durfte daher nicht seine übliche Regel „späteres Gesetz geht vor“ anwenden. Das Verstaatlichungsgesetz konnte dem früheren Vertrag nicht vorgehen."},
     detailed:{
       issue:"Flaminio Costa war ein Kleinaktionär der Edison Volta, eines Unternehmens, das 1962 von der Verstaatlichung des italienischen Elektrizitätssektors erfasst wurde.<br><br>Costa focht eine bescheidene Rechnung von ENEL, dem neuen Staatsmonopol, an und machte geltend, das Verstaatlichungsgesetz verstoße gegen Bestimmungen des EWG-Vertrags über Wettbewerb und staatliche Monopole.<br><br>Der italienische Verfassungsgerichtshof hatte wenige Wochen zuvor bereits entschieden, dass die gewöhnliche Gesetzesauslegung gelte: Ein späteres italienisches Gesetz verdränge schlicht ein früheres. Das Gesetz von 1962 sollte damit das Gesetz von 1957, mit dem der Vertrag umgesetzt wurde, verdrängen.<br><br>Der Friedensrichter von Mailand legte dem Gerichtshof dennoch Fragen zur Auslegung der angeblich verletzten Vertragsartikel vor, gestützt auf Artikel 177 EWG.",
       rule:`Die Antwort des Gerichtshofs ging weiter als erwartet. Er entschied, dass die Gemeinschaft, auf unbegrenzte Zeit gegründet, mit eigenen Organen und echten Hoheitsrechten ausgestattet, die aus einer Beschränkung der Souveränität oder einer Übertragung von Befugnissen der Staaten auf die Gemeinschaft herrühren, bedeutet, dass die Mitgliedstaaten ihre souveränen Rechte, wenn auch in begrenzten Bereichen, eingeschränkt und einen Rechtskörper geschaffen haben, der sowohl ihre Angehörigen als auch sie selbst bindet.<br><br>Gerade wegen dieser besonderen und ursprünglichen Natur konnte dem aus dem Vertrag hervorgegangenen Recht keine wie auch immer geartete innerstaatliche Vorschrift entgegengesetzt werden, ohne dass es seinen Charakter als Gemeinschaftsrecht verlöre und ohne dass die Rechtsgrundlage der Gemeinschaft selbst in Frage gestellt würde.`,
       application:"Das italienische Gericht durfte seine Regel „späteres Gesetz geht vor“ nicht anwenden, um dem Verstaatlichungsgesetz Vorrang vor dem zuvor umgesetzten Vertrag einzuräumen.<br><br>Bemerkenswert: Der Vertrag von Lissabon hat den Vorrang nie als eigenen Artikel in die Verträge aufgenommen, sondern nur eine Erklärung hinzugefügt, die an dieses Urteil erinnert.<br><br>Der Vorrang bleibt ein vom Gerichtshof selbst geschaffener Grundsatz, niemals als Vertragsregel kodifiziert."},
     holistic:`Costa/ENEL erging 1964, nur ein Jahr nach <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Van Gend en Loos</span> (1963), das feststellte, dass Unionsrecht Rechte schaffen kann, auf die sich Einzelne unmittelbar berufen können. Zusammen bilden diese beiden Urteile die zwei Säulen des EU-Verfassungsrechts.<br><br>Spätere Urteile trieben den Vorrang weiter voran. <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> dehnte ihn so aus, dass er sogar einen Konflikt mit den verfassungsrechtlichen Grundrechten eines Mitgliedstaats übersteht — die härteste Bewährungsprobe für diese Doktrin. <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Simmenthal</span> verlangte später, dass nationale Gerichte entgegenstehendes nationales Recht selbst und sofort unangewendet lassen.<br><br>Auch fünfzig Jahre später ist die von Costa geschaffene Spannung noch lebendig. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> zeigt dieselbe Grundfrage, heute im Rahmen der Grundrechtecharta.<br><br>Strukturell ist der Vorrang eine von zwei Säulen der gesamten EU-Rechtsordnung, neben der unmittelbaren Wirkung. Keine von beiden ist als Artikel in die Verträge aufgenommen. Beide sind richterrechtlich geschaffen.`,
     citations:[
       {phrase:"konnte dem aus dem Vertrag hervorgegangenen Recht keine wie auch immer geartete innerstaatliche Vorschrift entgegengesetzt werden", paragraphs:"[1964] Slg. 585, S. 593-594 (dieses Urteil liegt vor der Randnummer-Nummerierung)", note:"Die zentrale Aussage zum Vorrang — nach Seite zitiert, da 1964 die Nummerierung nach Randnummern noch nicht üblich war.", primary:true}
     ]
   }
 }},

{id:"handelsgesellschaft", name:"Internationale Handelsgesellschaft", originalName:"Internationale Handelsgesellschaft mbH gegen Einfuhr- und Vorratsstelle für Getreide und Futtermittel", citation:"Case 11/70", themes:["Primacy of EU law","Fundamental rights"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Can a company challenge the validity of an EU measure by invoking fundamental rights guaranteed under its own national constitution?",
   rule:"The validity of EU measures can only be judged in the light of EU law itself, not national constitutional law — but respect for fundamental rights is itself part of EU law's general principles.",
   application:"Germany's constitutional fundamental-rights guarantees could not be used to override the validity of the EU licensing system, though the Court checked the system against fundamental rights as an EU-law matter anyway."},
 intermediate:{
   issue:"The Common Agricultural Policy required a licence to export cereals, backed by a deposit. If the export wasn't completed in time, the exporter lost the deposit.<br><br>Internationale Handelsgesellschaft lost its deposit this way. The company argued this system broke its right to freely run a business — a right protected by the German Basic Law, Germany's constitution.<br><br>A German court asked the Court of Justice a bigger question: can an EU rule be struck down for breaking a national constitution?",
   rule:"The Court said no, not directly. An EU measure's validity can only be judged against EU law itself.<br><br>Using national law, even constitutional law, would break the uniform and effective application of EU law. So national constitutions cannot invalidate EU rules on their own.<br><br>But the Court added something important: respect for fundamental rights is itself part of EU law's general principles, inspired by the constitutions common to member states. Fundamental rights protection didn't disappear — it just moved inside EU law itself.",
   application:"Germany's constitutional guarantees could not, by themselves, strike down the EU licensing system.<br><br>But the Court still checked the system against fundamental rights, as a matter of EU law, and found no violation. The deposit system was a proportionate way to manage agricultural markets."},
 detailed:{
   issue:"A German company, Internationale Handelsgesellschaft, exported cereals under the Common Agricultural Policy. This required an EU export licence, backed by a deposit.<br><br>The company failed to complete its exports within the licence's validity period, and forfeited its deposit as a result.<br><br>Before the Verwaltungsgericht Frankfurt, the company argued the system was disproportionate — that it broke its freedom to run a business and its freedom of disposition, both rights from the German Basic Law.<br><br>The German court referred the question of the EU measure's validity to the Court of Justice, under Article 177 EEC.",
   rule:`The Court held that EU law is an independent source of law. Because of its very nature, it cannot be overridden by national rules, however those rules are framed.<br><br>Doing so would strip EU law of its character as EU law, and call the Community's own legal basis into question. So the validity of an EU measure can only be judged against EU law itself — including against national fundamental rights, even ones written into a national constitution.<br><br>But the Court immediately balanced this: respect for fundamental rights is itself part of EU law's general principles, inspired by the constitutional traditions common to the member states. Protecting them must fit within the Community's own structure and goals.<br><br>This was the Court's first clear statement that primacy is not blind to fundamental rights. It built its own fundamental rights review directly into EU law — a move widely read as pre-empting national courts, especially Germany's own constitutional court, from claiming their own review power over EU measures.`,
   application:"The German court could not use the Basic Law's fundamental rights guarantees to directly challenge the EU system's validity.<br><br>But the Court of Justice still examined the deposit system against fundamental rights protected within EU law itself, and found it necessary and proportionate for managing agricultural markets — not a violation."},
 holistic:`This case came in 1970, six years after <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a> first established primacy. Handelsgesellschaft answered the question Costa left open: does primacy survive a clash with a state's own constitutional rights, not just an ordinary law?<br><br>Germany's own Constitutional Court didn't accept this straight away. In its <span class="case-link-pending" title="Not yet added to Casus">Solange I and Solange II</span> decisions, it agreed to accept EU primacy only 'as long as' (Solange, in German) EU rights protection stayed adequate — later relaxing this once satisfied the EU offered real protection.<br><br>The tension this case raised never fully closed. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> revisits the exact same question decades later, this time under the Charter of Fundamental Rights rather than unwritten general principles.<br><br>This case effectively built the EU's own unwritten bill of rights — later written down properly in the Charter of Fundamental Rights, agreed in 2000 and made legally binding in 2009.`,
 citations:[
   {phrase:"respect for fundamental rights forms an integral part of the general principles of law protected by the Court of Justice", paragraphs:"para. 4", note:"The foundational statement that fundamental rights are themselves part of EU law's general principles — independently confirmed by later Advocate General opinions citing this exact paragraph.", primary:true}
 ]},

{id:"melloni", name:"Melloni v Ministerio Fiscal", originalName:"Stefano Melloni contra Ministerio Fiscal", citation:"Case C-399/11", themes:["Primacy of EU law","Fundamental rights"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Can a member state refuse to execute a European Arrest Warrant by applying a higher national fundamental-rights standard than the EU one?",
   rule:"Article 53 of the Charter does not allow member states to apply a higher national standard of fundamental-rights protection where doing so would compromise the primacy, unity, and effectiveness of EU law.",
   application:"Spain could not refuse to surrender Melloni by relying on a Spanish constitutional right to be present at retrial, since the EU Framework Decision had already struck that balance."},
 intermediate:{
   issue:"Stefano Melloni was convicted in Italy without being present at his trial, though he had lawyers representing him throughout.<br><br>He later moved to Spain. Italy issued a European Arrest Warrant to get him back.<br><br>Spanish law normally required a guarantee of a retrial before surrendering someone convicted this way. But the EU's own rules on the Arrest Warrant had already removed that requirement, for cases where the person had legal representation.<br><br>Spain's Constitutional Court asked: can Spain still apply its own, stricter, standard?",
   rule:"The Court said no. The Charter's Article 53 lets states keep their own fundamental rights standards — but only in areas the EU hasn't already fully harmonised.<br><br>Here, the EU had already harmonised exactly this question, in the Arrest Warrant rules. Letting Spain apply a stricter standard would undermine EU law.<br><br>Different countries could then apply different levels of protection — breaking the uniform, EU-wide system the Arrest Warrant depends on.",
   application:"Spain could not demand a guaranteed retrial as a condition for surrendering Melloni.<br><br>The EU rules had already dealt with exactly this situation. There was no gap left for a stricter national rule to fill."},
 detailed:{
   issue:"Stefano Melloni was tried and convicted in Italy for bankruptcy fraud, in his absence. He had appointed lawyers who represented him throughout the trial.<br><br>Melloni later fled to Spain. Italy issued a European Arrest Warrant asking Spain to send him back.<br><br>Under Spanish constitutional case law, surrendering someone convicted in absentia normally required a guarantee of a retrial. But the EU's own Framework Decision on the Arrest Warrant, updated in 2009, had removed that ground for refusal — specifically when the person had chosen their own lawyers and been represented throughout.<br><br>Spain's Constitutional Court sent three questions to the Court of Justice. In essence: does Article 53 of the Charter let Spain apply its own, higher, constitutional standard instead of the EU one?",
   rule:`The Court said that where an area is fully harmonised at EU level, any fundamental rights check must stay inside that harmonised framework. It cannot fall back on a member state's own, potentially stricter, constitutional standard.<br><br>Here, the grounds for refusing to execute an Arrest Warrant were exactly that kind of fully harmonised area. Article 53 of the Charter, properly read, only lets states apply their own standards in areas still within their own competence — it is not a licence to override an already-harmonised EU rule.<br><br>Reading Article 53 the way Spain wanted would undermine the principle of primacy. Protection levels could then vary from state to state, threatening the uniform application of EU law and, ultimately, mutual trust between different countries' criminal justice systems — the whole basis the Arrest Warrant system runs on.`,
   application:"Spain could not demand a guaranteed retrial as a condition for surrendering Melloni. The Framework Decision had already dealt with this exact scenario: an in-absentia conviction, with prior legal representation. There was no gap left for a stricter Spanish rule to fill.<br><br>Many read this judgment as the Court drawing a firm line: Article 53 cannot become a back door for national courts resisting EU criminal justice cooperation. This sits in real tension with the more accommodating tone of Internationale Handelsgesellschaft, decided over 40 years earlier."},
 holistic:`Melloni was decided in 2013, the same year as <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, and shortly after the <span class="case-link-pending" title="Not yet added to Casus">Åkerberg Fransson</span> judgment, which asked a related question about the Charter's reach.<br><br>This case continues the line running through <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>: how far can national fundamental rights push back against EU primacy? The difference is the legal source — Handelsgesellschaft relied on unwritten general principles, Melloni applies the same logic under the Charter, now written EU law in its own right.<br><br>The case also touches the EU's system of mutual trust — the assumption that every member state's courts meet a shared minimum standard, the same assumption underlying the European Arrest Warrant. That assumption was tested again later, in cases about whether mutual trust still holds when a member state's judiciary comes under political pressure.<br><br>Structurally, Melloni confirms a pattern: the more an area of EU law is harmonised, the less room member states keep for their own, higher, standards.`,
 citations:[
   {phrase:"would undermine the principle of primacy by allowing the level of protection to vary from state to state", paragraphs:"para. 60", note:"The Court's central holding on Article 53 — independently confirmed, since the later Åkerberg Fransson judgment cites Melloni at this exact paragraph.", primary:true}
 ]},

{id:"bavarianlager", name:"Commission v Bavarian Lager", citation:"Case C-28/08 P", themes:["Primacy of EU law"], articleIds:[],
 abstract:{
   issue:"When someone requests an EU institution's documents and those documents contain other people's names, which EU rule governs — the access-to-documents rule or the data-protection rule?",
   rule:"Where a request for documents under the access-to-documents regulation would disclose personal data, the data-protection regulation applies in full, not merely as a general exception to be weighed case by case.",
   application:"The Commission was entitled to withhold the names of individuals who attended a meeting, since disclosure had to satisfy the data-protection regulation's own conditions, not just the access regulation's public-interest test."},
 intermediate:{
   issue:"Bavarian Lager, a UK beer importer, complained to the Commission about UK rules restricting its sales. This led to a Commission investigation, including a 1996 meeting.<br><br>Bavarian Lager later asked for the full minutes of that meeting, including the names of everyone who attended.<br><br>The Commission gave out the minutes but hid five names, citing EU data protection rules.<br><br>Which rule wins here: the right to see EU documents, or the right to data protection?",
   rule:"The Court said data protection isn't just one factor to weigh against openness. A request for documents containing personal data must follow the data protection rules in full — it's not a general balancing test, it's a direct handover to a different, stricter set of rules.<br><br>A name can count as personal data, even in a professional context, since the person can still be identified from it.",
   application:"The Commission was allowed to keep the five names hidden.<br><br>Bavarian Lager hadn't shown why it actually needed those specific names. Without that justification, the data protection rules meant the names could stay hidden."},
 detailed:{
   issue:"Bavarian Lager, a UK company importing German beer, complained to the Commission that UK tied-house rules stopped it selling to pubs.<br><br>This triggered an investigation, including a 1996 meeting between the Commission, UK officials, and industry representatives. Bavarian Lager later asked for the full minutes, including every attendee's name.<br><br>The Commission released almost everything, but hid five names — two people had objected to being named, three could not be reached for consent. The Commission cited the EU's Data Protection Regulation.<br><br>The General Court sided with Bavarian Lager, reasoning that just naming someone as a meeting attendee didn't meaningfully threaten their private life. The Commission appealed.",
   rule:`The Court rejected the General Court's approach. Personal data protection isn't just one interest to weigh against openness, case by case.<br><br>Instead, the Access to Documents Regulation works by direct referral: whenever a document request would reveal personal data, the full Data Protection Regulation applies, including its own strict test for whether sharing the data with someone else is actually necessary.<br><br>A name and forename can count as personal data, even when someone is acting in a professional role — the person is still identifiable.<br><br>Bavarian Lager hadn't given any real justification for needing those specific names. Without that justification, the Commission could not properly weigh the competing interests, so it was entitled, arguably required, to withhold them.`,
   application:"The Commission's refusal was upheld. The person asking for documents has to show why they actually need someone else's personal data — it's not the institution's job to justify hiding it by default.<br><br>This case set up a real hierarchy between two EU rules of equal legal rank. It's not about EU law beating national law, like the other cases in this group. It's about which EU rule takes priority when two of them point in different directions."},
 holistic:`Bavarian Lager was decided in 2010, while the older Data Protection Directive still governed EU privacy law — years before the GDPR replaced it in 2018.<br><br>This case sits apart from the others in this batch. <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a>, <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a>, <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, and the Kadi cases are all about EU law beating national or international law. Bavarian Lager is different: it's about two EU rules of equal rank, and which one controls when they clash.<br><br>Later cases picked up the same balancing act between openness and privacy, as EU data protection law grew much stronger under the GDPR. The 'right to be forgotten' line of cases, starting with <span class="case-link-pending" title="Not yet added to Casus">Google Spain</span>, extended this same tension into search engines and the wider internet.<br><br>Structurally, this case shows that 'primacy' questions in EU law aren't only about states versus Brussels. Sometimes the EU has to referee between its own rules.`,
 citations:[
   {phrase:"can constitute personal data even in a professional context, since the individual is identifiable", paragraphs:"para. 68", note:"The Court's holding that names of meeting attendees, even acting professionally, count as personal data.", primary:true},
   {phrase:"had not put forward any express, legitimate justification demonstrating the necessity", paragraphs:"para. 78", note:"The reasoning placing the burden of justifying necessity on the person requesting the data, not the institution withholding it."}
 ]},

{id:"kadi1", name:"Kadi I", originalName:"Kadi and Al Barakaat International Foundation v Council and Commission", citation:"Joined Cases C-402/05 P & C-415/05 P", themes:["Primacy of EU law","EU legal order"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Must EU measures implementing binding UN Security Council resolutions still comply with EU fundamental rights?",
   rule:"EU courts must ensure full review of the lawfulness of EU acts in light of fundamental rights, including acts that implement UN Security Council resolutions.",
   application:"The regulation freezing Kadi's assets was annulled because it gave him no way to know or challenge the reasons for his listing, violating his rights of defence and to effective judicial protection."},
 intermediate:{
   issue:"Yassin Kadi, a Saudi businessman, had his assets frozen across the EU, under an EU rule implementing a UN Security Council resolution.<br><br>The UN wanted all countries to freeze funds linked to Al-Qaeda. Kadi was never told exactly why he was on the list, and had no real way to challenge it.<br><br>He argued this broke his rights: his right to defend himself, his right to a fair legal challenge, his right to property.<br><br>The lower EU court refused to even check this. It said reviewing the EU rule would indirectly review the UN resolution itself, and that was mostly off-limits.",
   rule:"The Court of Justice disagreed, strongly. EU courts must review the lawfulness of all EU measures against fundamental rights — in principle, full review.<br><br>This applies even to measures that carry out UN Security Council resolutions. Being legally required by a binding UN resolution doesn't exempt the EU's own rule from this check.",
   application:"Kadi was never given the grounds for his listing, and never had a genuine chance to be heard.<br><br>His rights of defence and to effective judicial protection had been broken. So the regulation freezing his assets was struck down, as it applied to him.<br><br>The Court let the rule stay in force briefly, just long enough for the Council to fix the problem."},
 detailed:{
   issue:"Yassin Kadi and the Al Barakaat International Foundation had their funds frozen across the EU, under a Council Regulation implementing UN Security Council resolutions.<br><br>Those resolutions required every country to freeze assets linked to Al-Qaeda, the Taliban, and Usama bin Laden. Kadi was placed on the relevant UN list, and was never told the specific reasons why.<br><br>He had no way to challenge his listing, not before the UN Sanctions Committee, not in any court. He challenged the EU regulation directly, arguing it broke his rights of defence, his right to effective judicial protection, and his right to property.<br><br>At first instance, the Court of First Instance refused to review the measure properly. It reasoned that checking the EU rule against fundamental rights would indirectly question the UN resolution behind it, and said EU courts had no power to do that except for the most extreme violations of international law (jus cogens norms).",
   rule:`The Court of Justice firmly rejected this reasoning. It said the Community is based on the rule of law: neither member states nor EU institutions can escape review of whether their own acts respect the Community's own constitutional foundations.<br><br>An international agreement cannot change how powers are divided under the Treaties, and cannot touch the autonomy of the EU's own legal system.<br><br>So EU courts must review the lawfulness of all EU acts against fundamental rights, in principle fully — including a regulation designed to carry out a binding UN Security Council resolution.<br><br>This didn't mean reviewing the UN resolution itself, only the EU's own implementing measure. But in practice, this came to the same thing: an EU act cannot escape EU fundamental rights review just because it's carrying out an international obligation.<br><br>The Court found Kadi's rights had clearly been broken. He was given no statement of reasons, and no genuine chance to be heard, before or after the freeze.`,
   application:"The regulation was struck down, as far as it applied to Kadi and Al Barakaat.<br><br>The Court paused the effect of this annulment for a short period, giving the Council a chance to fix the problems rather than letting the sanctions lapse entirely.<br><br>Many read this judgment as the Court's clearest statement yet that the EU legal order is autonomous, even from binding UN Security Council obligations. After this ruling, the Security Council itself started publishing a 'summary of reasons' for terrorism listings."},
 holistic:`Kadi I came in 2008, decades after <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a> and <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a> built the basic architecture of primacy inside the EU. This case took that same idea and pointed it outward, at international law rather than national law.<br><br>It set up a direct sequel: <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, five years later, tests whether the EU's fix actually worked.<br><br>The case also connects to <span class="case-link-pending" title="Not yet added to Casus">Opinion 2/13</span>, decided a few years later. Both are about defending the autonomy of the EU legal order against an outside legal system — here it's the UN framework, there it's the European Convention on Human Rights.<br><br>Structurally, Kadi I is arguably the boldest of the group. Costa asserted EU law beats national law. Kadi I asserted EU fundamental rights review applies even against the UN Security Council, one of the most powerful bodies in international law.`,
 citations:[
   {phrase:"neither its member states nor its institutions can avoid review of whether their acts are consistent with the Community's constitutional charter", paragraphs:"paras 281-285 (region)", note:"The Court's foundational statement on the EU as a rule-of-law based legal order not exempted by international obligations. Flagged with lower confidence: I could not independently corroborate this exact paragraph range against a second source, only the general holding.", primary:false},
   {phrase:"ensure the review, in principle the full review, of the lawfulness of all EU acts in the light of fundamental rights", paragraphs:"para. 326", note:"The central review-standard holding, corroborated across multiple academic sources discussing this judgment.", primary:true}
 ]},

{id:"kadi2", name:"Kadi II", originalName:"Commission and Others v Yassin Abdullah Kadi", citation:"Joined Cases C-584/10 P, C-593/10 P & C-595/10 P", themes:["Primacy of EU law","EU legal order"], articleIds:["art267tfeu"],
 abstract:{
   issue:"After the EU tried to fix the procedural defects Kadi I identified, was the revised listing process now good enough?",
   rule:"The Court reaffirmed its Kadi I standard of full judicial review, and required that at least some evidence, not just an unsubstantiated summary of reasons, actually support a listing decision.",
   application:"The Commission's re-adopted listing of Kadi was annulled again, since it still relied on unsubstantiated allegations he had no real opportunity to rebut."},
 intermediate:{
   issue:"After Kadi I, the Commission tried again. It re-froze Kadi's assets, this time giving him a 'summary of reasons' from the UN and a chance to respond first.<br><br>Kadi challenged this new listing too, and the General Court agreed with him again — it said the summary of reasons was still too vague, and Kadi still couldn't properly defend himself.<br><br>The Commission, Council, and UK appealed, arguing the courts were demanding too much, given this was a sensitive security area.",
   rule:"The Court of Justice confirmed its own Kadi I standard: courts must fully review EU sanctions measures against fundamental rights.<br><br>This applies even in sensitive security cases. A security-sensitive area doesn't lower the standard, though it can justify hiding truly sensitive evidence.",
   application:"Most of the specific claims against Kadi were never backed up by actual evidence, even after he challenged them.<br><br>So the re-adopted listing was struck down again — the second time Kadi's assets were unfrozen through EU courts."},
 detailed:{
   issue:"After Kadi I struck down the original freeze, the Commission tried again with a new process. It gave Kadi the UN Sanctions Committee's published 'summary of reasons,' and invited his comments before deciding whether to keep the EU freeze.<br><br>Kadi challenged this second listing too. In 2010, the General Court annulled it again, in a separate judgment (Kadi v Commission). It found the summary of reasons still too vague, meaning Kadi still couldn't properly defend himself, and said the security-sensitive nature of terrorism cases doesn't lower this standard of review.<br><br>The Commission, Council, and UK appealed to the Court of Justice, arguing the General Court's standard was unrealistic given this area depends on international security cooperation.",
   rule:`The Court of Justice, sitting as a Grand Chamber, dismissed the appeals, confirming its own approach from Kadi I.<br><br>EU courts must review the lawfulness of all EU measures against fundamental rights, fully in principle — including measures in the sanctions and terrorism area. This obligation doesn't shrink just because the underlying measure is international or security-sensitive.<br><br>The Court accepted that genuinely sensitive evidence doesn't always need to be shown to the person affected — courts can use closed procedures to test such evidence privately.<br><br>But at least the substance of the reasons and evidence must be shared, in a way that lets the person actually defend themselves. A listing cannot survive on bare assertions alone, ones the government or UN committee won't or can't back up when challenged.`,
   application:"Most of the specific claims behind Kadi's listing were never backed by any disclosed evidence, even after he directly challenged them.<br><br>So the re-adopted freeze on his assets was struck down a second time. Read together, Kadi I and Kadi II form a two-part doctrine: the EU legal order will always review sanctions against fundamental rights, no matter the international pressure (Kadi I), and that review has real teeth — an unsubstantiated listing will not survive it twice (Kadi II)."},
 holistic:`Kadi II came in 2013, five years after <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>, the same year as <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>. This timing matters: the Court was, in the same year, defending both the EU's autonomy from the UN (Kadi II) and its own internal primacy against national constitutional standards (Melloni).<br><br>This case is the direct sequel to Kadi I. Where Kadi I set the standard, Kadi II tests whether the EU institutions had actually met it. They hadn't.<br><br>Later cases in the sanctions and terrorism space kept refining exactly how much evidence has to be disclosed, and how — this remains a live, developing area of EU law.<br><br>Structurally, Kadi I and Kadi II together are the clearest example of the EU asserting fundamental rights review over measures carrying out binding international obligations — arguably the outer edge of how far EU legal autonomy reaches.`,
 citations:[
   {phrase:"is not displaced by the international or security-sensitive character of the underlying measure", paragraphs:"general holding, precise paragraph not independently confirmed", note:"I could not corroborate a specific paragraph number for this 2013 Court of Justice text from independent sources — the paragraph citations I found for this stage of the Kadi saga trace to the related 2010 General Court judgment (T-85/09), not this appeal judgment itself. Treat this as an unconfirmed reference pending direct verification against the judgment text.", primary:false}
 ]}
,
{id:"vangend", name:"Van Gend en Loos", originalName:"N.V. Algemene Transport- en Expeditie Onderneming van Gend & Loos v Nederlandse Administratie der Belastingen", citation:"Case 26/62", themes:["Direct effect of EU law","EU legal order"], articleIds:["art30tfeu"],
 abstract:{
   issue:"Could a private company invoke a Treaty provision directly against the Dutch customs authority?",
   rule:"A Treaty provision that is clear, precise and unconditional produces direct effect regardless of implementing legislation.",
   application:"Van Gend en Loos could rely on the Treaty article directly against the state."},
 intermediate:{
   issue:"Van Gend en Loos imported a chemical product from Germany into the Netherlands. Dutch customs placed it in a tariff category carrying a higher duty than before the EEC Treaty took effect in 1958.<br><br>The company argued this breached Article 12 EEC. That article stopped member states introducing new duties, or raising existing ones, between themselves.<br><br>The Dutch tribunal asked the Court of Justice whether a private company could rely on this Treaty article directly, even though the Treaty seemed to bind only states.",
   rule:"The Court said the EEC Treaty was not an ordinary agreement between states. It created a new legal order.<br><br>States had limited their own sovereign rights under it, in certain fields. This new order didn't just bind states. It also had individuals as its subjects.<br><br>So a Treaty provision could give people rights directly, if it was clear, precise, and unconditional, and needed no further national law to work.",
   application:"Article 12 met that test. So Van Gend en Loos could rely on it directly before the Dutch tribunal, without waiting for Dutch implementing legislation."},
 detailed:{
   issue:"Van Gend en Loos, a Dutch company, imported a chemical product from Germany. Dutch customs reclassified it under the tariff, into a category with a higher duty than before the EEC Treaty took effect in 1958.<br><br>The company said this reclassification broke Article 12 EEC. That article was a standstill clause. It stopped member states raising customs duties between each other.<br><br>The referring tribunal asked the Court whether a private individual could invoke Article 12 directly. On its face, the Treaty seemed to impose obligations only on states, not individuals.",
   rule:`The Court's answer became the most famous passage in EU law. It held the EEC Treaty was more than an ordinary international agreement.<br><br>It created a new legal order of international law. For its benefit, states had limited their sovereign rights, in limited fields. This order's subjects were not just the member states. They included their nationals too.<br><br>So EU law could give people rights independently of national legislation. National courts had a duty to protect those rights. This depended on the provision being clear, precise, and unconditional, and leaving states no real room for discretion.<br><br>This single doctrine became the foundation for everything that followed. It was later extended to horizontally-applicable Treaty articles in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne v Sabena</a>. A narrower, vertical-only version was applied to directives in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>.`,
   application:"Article 12 was clear, precise, and unconditional. So Van Gend en Loos could invoke it directly, without any Dutch implementing legislation.<br><br>This judgment is widely seen as the single most important foundation of the EU's distinctive legal order."},
 holistic:`Van Gend en Loos was decided on 5 February 1963, a year before <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a>. Together, the two cases form the twin pillars of EU constitutional law: this one established that EU law reaches individuals directly, Costa established that it wins when it conflicts with national law.<br><br>The provision at issue, Article 12 EEC, no longer exists today. It was a transitional standstill clause, deleted once the customs union was completed. Its permanent successor sits in Article 30 TFEU, though that is a different, later provision, not simply a renumbering.<br><br>This case's direct-effect doctrine was extended to horizontal relationships between private parties in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne v Sabena</a>, then deliberately limited for directives in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>. Both cases exist because this one first asked whether a Treaty could reach individuals at all.<br><br>Structurally, this is the starting point for the entire EU legal order — everything else in this database, in a sense, is downstream of this single 1963 judgment.`,
 citations:[
   {phrase:"new legal order of international law", paragraphs:"[1963] ECR 1, at p. 12 (this judgment predates paragraph numbering)", note:"The most quoted passage in EU constitutional law, cited by page since 1963 judgments were not yet paragraph-numbered.", primary:true}
 ]},

{id:"defrenne", name:"Defrenne v Sabena (No 2)", originalName:"Gabrielle Defrenne contre Société anonyme belge de navigation aérienne Sabena", citation:"Case 43/75", themes:["Direct effect of EU law","Non-discrimination"], articleIds:["art157tfeu"],
 abstract:{
   issue:"Can an air hostess invoke Article 119 EEC directly against her private employer for pay discrimination?",
   rule:"Treaty provisions imposing a clear, unconditional obligation can have horizontal direct effect, reaching disputes between private parties.",
   application:"Defrenne could rely on the equal pay principle directly against Sabena, a private company."},
 intermediate:{
   issue:"Gabrielle Defrenne worked as an air hostess for Sabena, Belgium's national airline. Between 1963 and 1966, she was paid less than male cabin stewards doing identical work.<br><br>Both sides agreed the work was identical and the pay gap was real. Defrenne sued relying directly on Article 119 EEC, the Treaty's equal pay principle.<br><br>Belgium had no legislation putting this principle into domestic law. So the case turned on whether Article 119 could be enforced without one, and against a private employer specifically.",
   rule:"The Court held Article 119 was clear, precise, and unconditional enough to work without any implementing measures.<br><br>It went further than that. Direct discrimination, identifiable using only the criteria in Article 119 itself, could be relied on directly. This applied even more where men and women received unequal pay for equal work in the same workplace, public or private.<br><br>So this effect was not limited to disputes against the state. Because equal pay needed no state action to deliver, private employers were bound by it too.",
   application:"Defrenne could rely on Article 119 directly against Sabena, a private employer, despite the absence of any Belgian implementing law."},
 detailed:{
   issue:"Gabrielle Defrenne, an air hostess for Sabena, was paid substantially less than male cabin stewards doing broadly the same work. She also faced compulsory retirement at 40, well below the age applied to male staff.<br><br>She claimed under Article 119 EEC, the Treaty's equal pay guarantee. Belgium had not enacted legislation implementing it.<br><br>The case reached the Court via the Cour du Travail of Brussels, under Article 177 EEC. The central question: could Article 119 be enforced directly, against a private-sector employer, without waiting for national legislation?",
   rule:`Building on the direct-effect doctrine from <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, the Court held Article 119 imposed a clear, unconditional obligation. This applied at least to direct discrimination — the kind identifiable solely by reference to the criteria in Article 119 itself, without needing more detailed EU or national measures to flesh it out.<br><br>The Court went further than Van Gend en Loos in one key respect. It held this effect was not confined to disputes against the state. Because delivering equal pay required no intervening state act — an employer could simply pay equally — the obligation could reach private employers directly too.<br><br>This made Defrenne one of the clearest early examples of horizontal direct effect for a Treaty provision. The doctrine was later extended, far more controversially, to unwritten general principles of EU law in <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, where no such reference source existed.`,
   application:"Defrenne could rely on Article 119 directly against Sabena to claim equal pay, notwithstanding the total absence of Belgian implementing legislation.<br><br>The judgment became a foundation of EU gender-equality law, prompting further legislation and decades of litigation, including the later Barber judgment on pension-age discrimination."},
 holistic:`Decided on 8 April 1976, this case came thirteen years after <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> first established that Treaty provisions can create rights individuals can enforce. Defrenne answered a question Van Gend en Loos left open: can that effect reach disputes between two private parties, not just a citizen against the state?<br><br>The answer here — yes, for a sufficiently clear Treaty article — sits in deliberate contrast to <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>, decided a decade later, where the Court refused to extend the same horizontal reach to directives. Reading the two together shows the Court drawing a real line: Treaty articles can bind individuals directly, directives (on the Court's later view) generally cannot.<br><br>This case's reasoning was also the template later stretched, much more controversially, in <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, where the Court applied horizontal effect to an unwritten general principle rather than a Treaty article with express wording behind it.<br><br>Structurally, Defrenne sits at the foundation of two separate strands of EU law: the direct-effect architecture running from Van Gend en Loos, and the substantive equal-pay/non-discrimination law that followed it.`,
 citations:[
   {phrase:"unequal pay for equal work carried out in the same establishment or service, whether public or private", paragraphs:"para. 22", note:"The paragraph extending Article 119's direct effect to private-sector employers specifically.", primary:true},
   {phrase:"identifiable solely by reference to the criteria laid down by Article 119", paragraphs:"para. 21", note:"The Court's test for which kinds of pay discrimination are clear enough to be directly enforceable."}
 ]},

{id:"dominguez", name:"Dominguez", originalName:"Maribel Dominguez contre Centre informatique du Centre Ouest Atlantique", citation:"Case C-282/10", themes:["Direct effect of EU law","Non-discrimination","Worker's rights"], articleIds:["dir200388","art267tfeu"],
 abstract:{
   issue:"Can a worker rely on the Working Time Directive's paid-leave guarantee directly against her employer, a social security body?",
   rule:"A directive can be relied on directly against the state, or a body treated as an emanation of the state, once its deadline has passed and its terms are clear enough.",
   application:"Because her employer was a social security body, Dominguez could rely on the paid annual leave guarantee against it directly."},
 intermediate:{
   issue:"Maribel Dominguez worked for CICOA, a French social security body. She was off work for 14 months after an accident travelling to work.<br><br>Under French rules, paid annual leave depended on having actually worked a minimum period, 10 days or a month, within the reference year. Her long absence meant she fell short of that.<br><br>She argued this broke Article 7 of the Working Time Directive, which guarantees every worker at least four weeks' paid leave, with no such precondition attached.",
   rule:"The Court held Article 7(1) does not let states make the very existence of the leave right conditional on any minimum period of actual work. States can regulate how the right is exercised, but not whether it exists at all.<br><br>Where a directive's provision is clear enough, it can be relied on directly, once its transposition deadline has passed. But this direct effect only reaches the state, or a body treated as an emanation of the state.<br><br>A directive still cannot, by itself, impose an obligation directly on a purely private individual.",
   application:"CICOA was found to be a body operating in the field of social security. That made it capable of counting as an emanation of the state. So Dominguez could rely on Article 7 directly against it."},
 detailed:{
   issue:"Maribel Dominguez worked for the Centre informatique du Centre Ouest Atlantique (CICOA), a French social security body. She was unable to work for fourteen months following an accident on her journey to work.<br><br>Under the applicable French collective agreement and Code du travail, entitlement to paid annual leave required the worker to have actually worked a minimum qualifying period, ten days or one month, during the reference year. Dominguez's long absence meant she did not meet it.<br><br>She argued this precondition breached Article 7(1) of Directive 2003/88, the Working Time Directive, which guarantees every worker at least four weeks' paid annual leave. The Cour de cassation referred the question to the Court of Justice.",
   rule:`The Court held that while member states are free to set the conditions for exercising the right to paid annual leave, they cannot make the very existence of that right, for all workers, conditional on any precondition at all. A minimum-work requirement of the kind French law imposed went beyond regulating the right — it denied it altogether to some workers.<br><br>On the question of direct effect: since Article 7(1) was clear, precise, and unconditional, it could be relied on directly once the transposition deadline had passed. But the Court reaffirmed its settled position, tracing back through cases like Faccini Dori and Kücükdeveci, that a directive cannot of itself impose an obligation on a private individual and cannot be relied upon as such against one.<br><br>It could, however, be relied on against the state, in whatever capacity the state was acting — including as an employer. CICOA, as a body operating in the field of social security, was found capable of counting as an emanation of the state for this purpose, echoing the reasoning in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> decades earlier.`,
   application:"Because CICOA counted as an emanation of the state, Dominguez could rely on Article 7(1) directly against it, disapplying the conflicting French precondition.<br><br>Had her employer been a genuinely private company instead, the same directive provision would not have been directly enforceable against it — she would have had to fall back on indirect effect, or a state liability claim under the Francovich line of cases, which the Court expressly flagged as a fallback route."},
 holistic:`Decided on 24 January 2012, Dominguez sits nearly four decades after <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> first drew the vertical-only line for directives, and applies that same distinction to a completely different subject matter: paid leave rather than sex discrimination in retirement age.<br><br>The case is a clean, modern illustration of exactly the gap Marshall created and <span class="case-link-pending" title="Not yet added to Casus">Francovich</span> was designed to soften. Dominguez could win directly because her employer happened to be a public body; a worker in an identical situation at a private company could not have relied on the directive the same way, and would have needed the state-liability route instead.<br><br>It also connects forward to <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a> in an interesting way: both cases are about employment rights reaching into disputes involving something less than a fully private, ordinary employer, though Mangold pushed further by binding a genuinely private party through an unwritten general principle rather than the emanation-of-the-state route used here.<br><br>Structurally, this case shows the vertical/horizontal directive distinction is still very much alive in modern EU social law, not just a historical relic of 1980s judgments.`,
 citations:[
   {phrase:"they are not entitled to make the very existence of that right subject to any preconditions whatsoever", paragraphs:"para. 17 (paraphrased holding; exact wording per case summary)", note:"The core holding on Article 7(1)'s guarantee of the right's existence, not merely its exercise.", primary:true},
   {phrase:"a body operating in the field of social security", paragraphs:"para. 36", note:"The Court's finding that CICOA's public social-security function made it capable of being an emanation of the state."}
 ]},

{id:"opinion213", name:"Opinion 2/13", originalName:"Avis 2/13 de la Cour", citation:"Opinion 2/13", themes:["EU legal order"], articleIds:["art218tfeu"],
 abstract:{
   issue:"Would the EU's planned accession to the European Convention on Human Rights be compatible with EU law?",
   rule:"An accession agreement that risks undermining the autonomy of the EU legal order, or the principle of mutual trust between member states, is incompatible with the Treaties.",
   application:"The Court found the draft accession agreement incompatible with EU law on several grounds, effectively blocking accession as then drafted."},
 intermediate:{
   issue:"The EU had negotiated a draft agreement to accede to the European Convention on Human Rights (ECHR), something Article 6(2) TEU commits it to pursuing. Before finalising it, the Commission asked the Court of Justice whether the draft was compatible with EU law.<br><br>All EU member states are already individually bound by the ECHR. The question was whether the EU itself joining, as an institution, would sit well alongside the EU's own legal architecture.",
   rule:"The Court found several problems. Mutual trust between member states, the assumption that each state's courts already meet a shared minimum standard, could be undermined if the ECHR required states to double-check each other's human rights compliance directly.<br><br>The agreement also risked letting an outside court, the European Court of Human Rights, rule on matters the CJEU considered its own preserve, including some areas of foreign and security policy where the CJEU itself has limited jurisdiction.<br><br>Taken together, these risks meant the draft agreement compromised the autonomy of the EU legal order.",
   application:"The Court declared the draft accession agreement incompatible with EU law. In practice, this stopped accession from proceeding on that text, and no agreement has replaced it since."},
 detailed:{
   issue:"Article 6(2) of the Treaty on European Union commits the EU to acceding to the ECHR. Following years of negotiation, a draft accession agreement was produced. Before it could be concluded, the Commission sought the Court of Justice's opinion, under what is now Article 218(11) TFEU, on whether the draft was compatible with the Treaties.<br><br>This was a genuinely unusual case: not a dispute between parties, but the Court reviewing a planned international agreement before it was signed, precisely so problems could be caught in advance.",
   rule:`The Court identified several distinct grounds of incompatibility. Central among them was mutual trust: EU law requires member states to presume, save in exceptional circumstances, that other member states observe fundamental rights and comply with EU law. The ECHR's own logic would require each state to check the others' actual compliance directly, which the Court held would undermine this presumption, particularly across the EU's area of freedom, security and justice, where instruments like the European Arrest Warrant depend on it.<br><br>The Court also found the draft agreement failed to properly exclude the European Court of Human Rights from ruling on matters within the Common Foreign and Security Policy, an area where the CJEU itself has only limited jurisdiction, creating a mismatch between the two courts' respective reach. A further concern was Protocol No. 16 to the ECHR, which would let national courts request advisory opinions from Strasbourg, creating a parallel channel that could bypass the EU's own preliminary reference procedure.<br><br>Taken together, the Court concluded these features risked the autonomy of the EU legal order — its capacity to interpret and apply its own law without external interference — a concern with deep roots in the Court's own prior case law, including <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>.`,
   application:"The Court declared the draft agreement, as it stood, incompatible with EU law. This did not close the door to accession in principle, since Article 6(2) TEU still commits the EU to it, but it required any future draft to address the mutual trust, CFSP jurisdiction, and Protocol 16 concerns directly. As of this writing, no revised agreement has been concluded."},
