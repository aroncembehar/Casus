   de:{
     abstract:{
       issue:"Kann sich eine Arbeitnehmerin unmittelbar auf die Urlaubsgarantie der Arbeitszeitrichtlinie gegenüber ihrem Arbeitgeber, einem Sozialversicherungsträger, berufen?",
       rule:"Eine Richtlinie kann unmittelbar gegenüber dem Staat oder einer als Emanation des Staates geltenden Einrichtung geltend gemacht werden, sobald ihre Umsetzungsfrist abgelaufen und ihre Bestimmungen hinreichend klar sind.",
       application:"Da ihr Arbeitgeber ein Sozialversicherungsträger war, konnte sich Frau Dominguez unmittelbar auf die Garantie des bezahlten Jahresurlaubs gegenüber diesem berufen."},
     intermediate:{
       issue:"Maribel Dominguez arbeitete für das CICOA, einen französischen Sozialversicherungsträger. Sie war nach einem Wegeunfall 14 Monate arbeitsunfähig.<br><br>Nach französischem Recht hing der Anspruch auf bezahlten Jahresurlaub davon ab, tatsächlich eine Mindestarbeitszeit — zehn Tage oder einen Monat — innerhalb des Bezugszeitraums geleistet zu haben. Ihre lange Abwesenheit bedeutete, dass sie diese Voraussetzung nicht erfüllte.<br><br>Sie machte geltend, dies verstoße gegen Artikel 7 der Arbeitszeitrichtlinie, der jedem Arbeitnehmer mindestens vier Wochen bezahlten Urlaub garantiert, ohne eine solche Vorbedingung.",
       rule:"Der Gerichtshof entschied, dass Artikel 7 Absatz 1 es den Staaten nicht erlaubt, das Bestehen des Urlaubsanspruchs selbst von einer Mindestarbeitszeit abhängig zu machen. Die Staaten können die Modalitäten der Ausübung dieses Anspruchs regeln, nicht aber sein Bestehen als solches.<br><br>Ist eine Bestimmung einer Richtlinie hinreichend klar, kann sie nach Ablauf der Umsetzungsfrist unmittelbar geltend gemacht werden. Diese unmittelbare Wirkung erfasst jedoch nur den Staat oder eine als Emanation des Staates geltende Einrichtung.<br><br>Eine Richtlinie kann nach wie vor nicht aus sich heraus eine Verpflichtung unmittelbar einem rein privaten Einzelnen auferlegen.",
       application:"Das CICOA wurde als eine im Bereich der sozialen Sicherheit tätige Einrichtung eingestuft. Dies erlaubte es, sie als Emanation des Staates anzusehen. Frau Dominguez konnte sich daher unmittelbar auf Artikel 7 gegenüber dem CICOA berufen."},
     detailed:{
       issue:"Maribel Dominguez arbeitete für das Centre informatique du Centre Ouest Atlantique (CICOA), einen französischen Sozialversicherungsträger. Sie war infolge eines Wegeunfalls vierzehn Monate arbeitsunfähig.<br><br>Nach dem anwendbaren Tarifvertrag und dem Code du travail setzte der Anspruch auf bezahlten Jahresurlaub voraus, dass die Arbeitnehmerin innerhalb des Bezugszeitraums tatsächlich eine Mindestzeit — zehn Tage oder einen Monat — gearbeitet hatte. Wegen ihrer langen Abwesenheit erfüllte Frau Dominguez diese Voraussetzung nicht.<br><br>Sie machte geltend, diese Vorbedingung verstoße gegen Artikel 7 Absatz 1 der Richtlinie 2003/88, der Arbeitszeitrichtlinie, die jedem Arbeitnehmer mindestens vier Wochen bezahlten Jahresurlaub garantiert. Die Cour de cassation legte die Frage dem Gerichtshof vor.",
       rule:`Der Gerichtshof entschied, dass die Mitgliedstaaten zwar die Modalitäten der Ausübung des Anspruchs auf bezahlten Jahresurlaub frei festlegen können, das Bestehen dieses Anspruchs für alle Arbeitnehmer jedoch nicht von irgendeiner Vorbedingung abhängig machen dürfen. Ein Mindestarbeitszeiterfordernis, wie es das französische Recht vorsah, ging über eine bloße Regelung des Anspruchs hinaus — es versagte ihn bestimmten Arbeitnehmern vollständig.<br><br>Zur Frage der unmittelbaren Wirkung: Da Artikel 7 Absatz 1 klar, eindeutig und nicht an Bedingungen geknüpft war, konnte er nach Ablauf der Umsetzungsfrist unmittelbar geltend gemacht werden. Der Gerichtshof bekräftigte jedoch seine ständige, bis zu Urteilen wie Faccini Dori und Kücükdeveci zurückreichende Rechtsprechung, wonach eine Richtlinie aus sich heraus keine Verpflichtung für einen Einzelnen begründen und ihm gegenüber nicht als solche geltend gemacht werden kann.<br><br>Sie konnte jedoch gegenüber dem Staat geltend gemacht werden, gleich in welcher Eigenschaft dieser handelte — auch als Arbeitgeber. Das CICOA wurde als eine im Bereich der sozialen Sicherheit tätige Einrichtung angesehen, die zu diesem Zweck als Emanation des Staates gelten konnte, was an die Begründung in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> Jahrzehnte zuvor anknüpfte.`,
       application:"Da das CICOA als Emanation des Staates galt, konnte sich Frau Dominguez unmittelbar auf Artikel 7 Absatz 1 gegenüber dem CICOA berufen und damit die entgegenstehende französische Vorbedingung unangewendet lassen.<br><br>Wäre ihr Arbeitgeber stattdessen ein echtes privates Unternehmen gewesen, wäre dieselbe Richtlinienbestimmung ihm gegenüber nicht unmittelbar durchsetzbar gewesen — sie hätte auf die mittelbare Wirkung oder auf eine Staatshaftungsklage nach der Francovich-Rechtsprechung zurückgreifen müssen, die der Gerichtshof ausdrücklich als Ausweichlösung anführte."},
     holistic:`Das am 24. Januar 2012 ergangene Urteil Dominguez folgte fast vier Jahrzehnte nach <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>, das erstmals die rein vertikale Grenze für Richtlinien zog, und wendet dieselbe Unterscheidung auf eine völlig andere Materie an: bezahlten Urlaub statt Geschlechterdiskriminierung beim Renteneintrittsalter.<br><br>Der Fall ist eine anschauliche, moderne Illustration genau der Lücke, die Marshall schuf und die <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Francovich</span> abmildern sollte. Frau Dominguez konnte unmittelbar obsiegen, weil ihr Arbeitgeber zufällig eine öffentliche Stelle war; eine Arbeitnehmerin in identischer Lage bei einem privaten Unternehmen hätte sich nicht in gleicher Weise auf die Richtlinie berufen können und hätte stattdessen den Weg der Staatshaftung beschreiten müssen.<br><br>Das Urteil verbindet sich auch auf interessante Weise mit <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>: Beide Fälle betreffen arbeitsrechtliche Ansprüche, die Streitigkeiten mit einem Arbeitgeber erfassen, der weniger als ein vollständig privater, gewöhnlicher Arbeitgeber ist, wobei Mangold weiterging, indem es einen tatsächlich privaten Beteiligten durch einen ungeschriebenen allgemeinen Grundsatz band, statt durch den hier verwendeten Weg der Emanation des Staates.<br><br>Strukturell zeigt dieser Fall, dass die vertikal/horizontal-Unterscheidung bei Richtlinien im modernen Sozialrecht der Union noch sehr lebendig ist, und kein bloßes historisches Relikt der Urteile der 1980er Jahre.`,
     citations:[
       {phrase:"sie sind nicht berechtigt, das Bestehen dieses Anspruchs selbst von irgendwelchen Vorbedingungen abhängig zu machen", paragraphs:"Randnr. 17 (paraphrasierte Kernaussage; genauer Wortlaut aus einer Fallzusammenfassung übernommen)", note:"Inoffizielle Übersetzung, die bereits in der ursprünglichen englischen Anmerkung als aus einer paraphrasierten Zusammenfassung stammend gekennzeichnet ist, nicht als wörtliches Urteilszitat. Französisch ist die authentische Verfahrenssprache dieser Rechtssache; weder der französische Originaltext noch die amtliche deutsche Fassung wurden in dieser Sitzung eingesehen — gegen den amtlichen Text zu prüfen.", primary:true},
       {phrase:"eine im Bereich der sozialen Sicherheit tätige Einrichtung", paragraphs:"Randnr. 36", note:"Inoffizielle Übersetzung des verifizierten englischen Textes; nicht gegen die amtliche deutsche Fassung der Sammlung abgeglichen, obwohl Französisch die authentische Verfahrenssprache dieser Rechtssache war."}
     ]
   },
   it:{
     abstract:{
       issue:"Una lavoratrice può invocare direttamente nei confronti del proprio datore di lavoro, un ente di previdenza sociale, la garanzia di ferie retribuite prevista dalla direttiva sull'orario di lavoro?",
       rule:"Una direttiva può essere invocata direttamente nei confronti dello Stato, o di un organismo assimilato a un'emanazione dello Stato, una volta scaduto il suo termine di attuazione e se i suoi termini sono sufficientemente chiari.",
       application:"Essendo il suo datore di lavoro un ente di previdenza sociale, la sig.ra Dominguez poteva invocare direttamente nei suoi confronti la garanzia delle ferie annuali retribuite."},
     intermediate:{
       issue:"Maribel Dominguez lavorava per il CICOA, un ente francese di previdenza sociale. Ella fu assente dal lavoro per 14 mesi a seguito di un infortunio occorsole nel tragitto casa-lavoro.<br><br>Secondo le norme francesi, il diritto alle ferie annuali retribuite dipendeva dall'aver effettivamente lavorato per un periodo minimo, dieci giorni o un mese, nel corso dell'anno di riferimento. La sua lunga assenza comportava che non soddisfacesse tale requisito.<br><br>Ella sostenne che ciò violasse l'articolo 7 della direttiva sull'orario di lavoro, che garantisce a ogni lavoratore almeno quattro settimane di ferie retribuite, senza alcuna condizione di questo tipo.",
       rule:"La Corte dichiarò che l'articolo 7, paragrafo 1, non consente agli Stati di subordinare l'esistenza stessa del diritto alle ferie a un qualsivoglia periodo minimo di lavoro effettivo. Gli Stati possono disciplinare le modalità di esercizio di tale diritto, ma non la sua stessa esistenza.<br><br>Quando una disposizione di una direttiva è sufficientemente chiara, essa può essere invocata direttamente, una volta scaduto il termine di attuazione. Ma tale effetto diretto raggiunge soltanto lo Stato, o un organismo assimilato a un'emanazione dello Stato.<br><br>Una direttiva non può comunque, da sola, imporre un obbligo direttamente a un soggetto puramente privato.",
       application:"Il CICOA fu ritenuto un organismo operante nel settore della previdenza sociale. Ciò gli consentiva di essere considerato un'emanazione dello Stato. La sig.ra Dominguez poteva quindi invocare direttamente l'articolo 7 nei suoi confronti."},
     detailed:{
       issue:"Maribel Dominguez lavorava per il Centre informatique du Centre Ouest Atlantique (CICOA), un ente francese di previdenza sociale. Ella si trovò nell'impossibilità di lavorare per quattordici mesi a seguito di un infortunio occorsole nel tragitto casa-lavoro.<br><br>In base al contratto collettivo applicabile e al Code du travail, il diritto alle ferie annuali retribuite richiedeva che la lavoratrice avesse effettivamente lavorato per un periodo minimo, dieci giorni o un mese, nel corso dell'anno di riferimento. La lunga assenza della sig.ra Dominguez comportava che ella non soddisfacesse tale requisito.<br><br>Ella sostenne che tale condizione preliminare violasse l'articolo 7, paragrafo 1, della direttiva 2003/88, la direttiva sull'orario di lavoro, che garantisce a ogni lavoratore almeno quattro settimane di ferie annuali retribuite. La Cour de cassation sottopose la questione alla Corte di giustizia.",
       rule:`La Corte dichiarò che, sebbene gli Stati membri siano liberi di fissare le condizioni di esercizio del diritto alle ferie annuali retribuite, essi non possono subordinare l'esistenza stessa di tale diritto, per tutti i lavoratori, a una qualsivoglia condizione preliminare. Un requisito di lavoro minimo del tipo imposto dal diritto francese andava oltre la mera disciplina del diritto — lo negava del tutto ad alcuni lavoratori.<br><br>Sulla questione dell'effetto diretto: poiché l'articolo 7, paragrafo 1, era chiaro, preciso e incondizionato, esso poteva essere invocato direttamente una volta scaduto il termine di attuazione. Ma la Corte riaffermò la propria posizione consolidata, risalente a sentenze quali Faccini Dori e Kücükdeveci, secondo cui una direttiva non può, da sola, imporre un obbligo a un soggetto privato né essere invocata come tale nei suoi confronti.<br><br>Essa poteva tuttavia essere invocata nei confronti dello Stato, quale che fosse la veste in cui questo agiva — anche come datore di lavoro. Il CICOA, quale organismo operante nel settore della previdenza sociale, fu ritenuto idoneo a essere considerato un'emanazione dello Stato a tal fine, riecheggiando il ragionamento seguito in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> decenni prima.`,
       application:"Poiché il CICOA era considerato un'emanazione dello Stato, la sig.ra Dominguez poteva invocare direttamente l'articolo 7, paragrafo 1, nei suoi confronti, disapplicando la contrastante condizione preliminare francese.<br><br>Se il suo datore di lavoro fosse stato invece una vera impresa privata, la stessa disposizione della direttiva non sarebbe stata direttamente azionabile nei suoi confronti — ella avrebbe dovuto ricorrere all'effetto indiretto, oppure a un'azione di responsabilità dello Stato secondo la giurisprudenza Francovich, soluzione di riserva che la Corte indicò espressamente."},
     holistic:`Decisa il 24 gennaio 2012, Dominguez giunge a quasi quattro decenni da quando <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> tracciò per la prima volta la linea rigorosamente verticale applicabile alle direttive, e applica questa stessa distinzione a una materia completamente diversa: le ferie retribuite anziché la discriminazione sessuale sull'età pensionabile.<br><br>La causa costituisce un'illustrazione chiara e moderna esattamente del divario creato da Marshall, che <span class="case-link-pending" title="Non ancora aggiunto a Casus">Francovich</span> era destinata ad attenuare. La sig.ra Dominguez poté vincere direttamente perché il suo datore di lavoro si trovava a essere un ente pubblico; una lavoratrice in situazione identica presso un'impresa privata non avrebbe potuto invocare la direttiva allo stesso modo, e avrebbe dovuto percorrere invece la via della responsabilità dello Stato.<br><br>La sentenza si ricollega inoltre, in modo interessante, a <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>: entrambe le cause riguardano diritti in materia di lavoro che investono controversie con un datore di lavoro non pienamente privato e ordinario, sebbene Mangold sia andata oltre, vincolando un soggetto realmente privato mediante un principio generale non scritto anziché la via dell'emanazione dello Stato qui seguita.<br><br>Sul piano strutturale, questa causa mostra che la distinzione verticale/orizzontale in materia di direttive è ancora molto viva nel moderno diritto sociale dell'Unione, e non un semplice relitto storico delle sentenze degli anni ottanta.`,
     citations:[
       {phrase:"essi non hanno il diritto di subordinare l'esistenza stessa di tale diritto a qualsivoglia condizione preliminare", paragraphs:"punto 17 (massima parafrasata; formulazione esatta ripresa da una sintesi della sentenza)", note:"Traduzione non ufficiale, già segnalata nella nota originale inglese come tratta da una sintesi parafrasata anziché dal testo letterale della sentenza. Il francese è la lingua di procedura autentica di questa causa; né il testo francese originale né la versione italiana ufficiale sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true},
       {phrase:"un organismo operante nel settore della previdenza sociale", paragraphs:"punto 36", note:"Traduzione non ufficiale del testo inglese verificato; non verificata rispetto alla versione italiana ufficiale della Raccolta, sebbene il francese sia la lingua di procedura autentica di questa causa."}
     ]
   }
 }},

{id:"opinion213", name:"Opinion 2/13", originalName:"Avis 2/13 de la Cour", citation:"Opinion 2/13", jurisdiction:"CJUE", themes:["ECHR / Convention rights","Legal order / primacy / direct effect","External relations / international law"], articleIds:["art218tfeu"],
 abstract:{
   issue:"Would the EU's planned accession to the European Convention on Human Rights be compatible with EU law?",
   rule:"An accession agreement that risks undermining the autonomy of the EU legal order, or the principle of mutual trust between member states, is incompatible with the Treaties.",
   application:"The Court found the draft accession agreement incompatible with EU law on several grounds, effectively blocking accession as then drafted."},
 intermediate:{
   issue:"The EU had negotiated a draft agreement to accede to the European Convention on Human Rights (ECHR), something Article 6(2) TEU commits it to pursuing. Before finalising it, the Commission asked the Court of Justice whether the draft was compatible with EU law.<br><br>All EU member states are already individually bound by the ECHR. The question was whether the EU itself joining, as an institution, would sit well alongside the EU's own legal architecture.",
   rule:"The Court found several problems. Mutual trust between member states, the assumption that each state's courts already meet a shared minimum standard, could be undermined if the ECHR required states to double-check each other's human rights compliance directly.<br><br>The agreement also risked letting an outside court, the European Court of Human Rights, rule on matters the CJEU considered its own preserve, including some areas of foreign and security policy where the CJEU itself has limited jurisdiction.<br><br>Taken together, these risks meant the draft agreement compromised the autonomy of the EU legal order.",
   application:"The Court declared the draft accession agreement incompatible with EU law. In practice, this stopped accession from proceeding on that text, and no agreement has replaced it since."},
 detailed:{
   issue:"Article 6(2) of the Treaty on European Union commits the EU to acceding to the ECHR. Following years of negotiation, a draft accession agreement was produced. Before it could be concluded, the Commission sought the Court of Justice's opinion, under what is now Article 218(11) TFEU, on whether the draft was compatible with the Treaties.<br><br>This was a genuinely unusual case: not a dispute between parties, but the Court reviewing a planned international agreement before it was signed, precisely so problems could be caught in advance.",
   rule:`The Court identified several distinct grounds of incompatibility. Central among them was mutual trust: EU law requires member states to presume, save in exceptional circumstances, that other member states observe fundamental rights and comply with EU law. The ECHR's own logic would require each state to check the others' actual compliance directly, which the Court held would undermine this presumption, particularly across the EU's area of freedom, security and justice, where instruments like the European Arrest Warrant depend on it.<br><br>The Court also found the draft agreement failed to properly exclude the European Court of Human Rights from ruling on matters within the Common Foreign and Security Policy, an area where the CJEU itself has only limited jurisdiction, creating a mismatch between the two courts' respective reach. A further concern was Protocol No. 16 to the ECHR, which would let national courts request advisory opinions from Strasbourg, creating a parallel channel that could bypass the EU's own preliminary reference procedure.<br><br>Taken together, the Court concluded these features risked the autonomy of the EU legal order — its capacity to interpret and apply its own law without external interference — a concern with deep roots in the Court's own prior case law, including <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>.`,
   application:"The Court declared the draft agreement, as it stood, incompatible with EU law. This did not close the door to accession in principle, since Article 6(2) TEU still commits the EU to it, but it required any future draft to address the mutual trust, CFSP jurisdiction, and Protocol 16 concerns directly. As of this writing, no revised agreement has been concluded."},
 holistic:`Delivered on 18 December 2014, Opinion 2/13 came six years after <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a> first asserted that the EU legal order is autonomous even from binding UN Security Council obligations. This Opinion applies the same underlying instinct to a different external system: not the UN, but the ECHR, an institution every single EU member state already individually belongs to.<br><br>The irony noted by many commentators is real: the Court blocked closer integration with a human-rights court partly to protect a human-rights-relevant principle, mutual trust, that underpins practical tools like the European Arrest Warrant — the same instrument at the centre of <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, decided the year before.<br><br>Structurally, Kadi I and Opinion 2/13 form a pair: both are about defending the autonomy of the EU legal order against an external legal system, one binding through the UN Charter, the other through a convention every member state already accepted individually. Read alongside <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a> and <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, they show the same autonomy principle extending outward from national law, to international law, to the EU's own closest human-rights counterpart.`,
 citations:[
   {phrase:"presume other Member States to be in compliance with EU law and particularly with the fundamental rights recognised by EU law", paragraphs:"para. 191", note:"The Court's definition of the mutual trust principle at the heart of its reasoning.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"L'adhésion envisagée de l'Union à la Convention européenne des droits de l'homme serait-elle compatible avec le droit de l'Union ?",
       rule:"Un accord d'adhésion qui risque de porter atteinte à l'autonomie de l'ordre juridique de l'Union, ou au principe de confiance mutuelle entre les États membres, est incompatible avec les traités.",
       application:"La Cour jugea le projet d'accord d'adhésion incompatible avec le droit de l'Union sur plusieurs points, bloquant en pratique l'adhésion sur la base de ce texte."},
     intermediate:{
       issue:"L'Union avait négocié un projet d'accord d'adhésion à la Convention européenne des droits de l'homme (CEDH), démarche à laquelle l'article 6, paragraphe 2, TUE l'engage. Avant de le conclure, la Commission demanda à la Cour de justice si ce projet était compatible avec le droit de l'Union.<br><br>Tous les États membres de l'Union sont déjà individuellement liés par la CEDH. La question était de savoir si l'adhésion de l'Union elle-même, en tant qu'institution, s'articulerait correctement avec sa propre architecture juridique.",
       rule:"La Cour releva plusieurs difficultés. La confiance mutuelle entre États membres, à savoir la présomption que les juridictions de chaque État respectent déjà un standard minimal commun, pourrait être compromise si la CEDH exigeait des États qu'ils vérifient directement le respect des droits de l'homme par les autres.<br><br>L'accord risquait également de permettre à une juridiction extérieure, la Cour européenne des droits de l'homme, de statuer sur des matières que la Cour de justice considère comme relevant de sa compétence propre, y compris certains domaines de la politique étrangère et de sécurité où la Cour de justice elle-même n'a qu'une compétence limitée.<br><br>Pris ensemble, ces risques signifiaient que le projet d'accord compromettait l'autonomie de l'ordre juridique de l'Union.",
       application:"La Cour déclara le projet d'accord d'adhésion incompatible avec le droit de l'Union. En pratique, cela empêcha l'adhésion de se poursuivre sur la base de ce texte, et aucun accord ne l'a remplacé depuis."},
     detailed:{
       issue:"L'article 6, paragraphe 2, du traité sur l'Union européenne engage l'Union à adhérer à la CEDH. Après plusieurs années de négociation, un projet d'accord d'adhésion fut élaboré. Avant sa conclusion, la Commission sollicita l'avis de la Cour de justice, sur le fondement de ce qui est aujourd'hui l'article 218, paragraphe 11, TFUE, sur la compatibilité de ce projet avec les traités.<br><br>Il s'agissait d'une affaire véritablement singulière : non un litige entre parties, mais un contrôle exercé par la Cour sur un accord international envisagé avant sa signature, précisément afin que d'éventuelles difficultés puissent être décelées à l'avance.",
       rule:`La Cour identifia plusieurs motifs distincts d'incompatibilité. Au premier rang figurait la confiance mutuelle : le droit de l'Union exige des États membres qu'ils présument, sauf circonstances exceptionnelles, que les autres États membres respectent les droits fondamentaux et se conforment au droit de l'Union. La logique propre de la CEDH exigerait de chaque État qu'il vérifie directement le respect effectif par les autres, ce que la Cour jugea de nature à compromettre cette présomption, en particulier dans l'espace de liberté, de sécurité et de justice de l'Union, où des instruments tels que le mandat d'arrêt européen en dépendent.<br><br>La Cour constata également que le projet d'accord n'excluait pas correctement la compétence de la Cour européenne des droits de l'homme pour statuer sur des matières relevant de la politique étrangère et de sécurité commune, domaine dans lequel la Cour de justice elle-même n'a qu'une compétence limitée, créant un décalage entre les compétences respectives des deux juridictions. Une autre préoccupation concernait le protocole n° 16 à la CEDH, qui permettrait aux juridictions nationales de solliciter des avis consultatifs auprès de Strasbourg, créant une voie parallèle susceptible de contourner le renvoi préjudiciel propre à l'Union.<br><br>Pris ensemble, la Cour conclut que ces caractéristiques compromettaient l'autonomie de l'ordre juridique de l'Union — sa capacité à interpréter et appliquer son propre droit sans ingérence extérieure —, une préoccupation profondément enracinée dans sa jurisprudence antérieure, y compris <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>.`,
       application:"La Cour déclara le projet d'accord, tel qu'il se présentait, incompatible avec le droit de l'Union. Cela ne fermait pas la porte à l'adhésion en principe, l'article 6, paragraphe 2, TUE continuant d'y engager l'Union, mais cela exigeait que tout projet futur traite directement les préoccupations relatives à la confiance mutuelle, à la compétence PESC et au protocole n° 16. À ce jour, aucun accord révisé n'a été conclu."},
     holistic:`Rendu le 18 décembre 2014, l'avis 2/13 intervint six ans après que <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a> eut affirmé pour la première fois que l'ordre juridique de l'Union est autonome, même à l'égard d'obligations contraignantes du Conseil de sécurité des Nations unies. Cet avis applique la même logique sous-jacente à un système extérieur différent : non l'ONU, mais la CEDH, une institution à laquelle chaque État membre de l'Union appartient déjà individuellement.<br><br>L'ironie relevée par de nombreux commentateurs est réelle : la Cour a fait obstacle à une intégration plus poussée avec une juridiction des droits de l'homme, en partie pour protéger un principe pertinent en matière de droits de l'homme, la confiance mutuelle, qui sous-tend des instruments pratiques tels que le mandat d'arrêt européen — le même instrument au cœur de <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, rendu l'année précédente.<br><br>Sur le plan structurel, Kadi I et l'avis 2/13 forment un couple : tous deux portent sur la défense de l'autonomie de l'ordre juridique de l'Union face à un système juridique extérieur, l'un s'imposant par la Charte des Nations unies, l'autre par une convention que chaque État membre a déjà acceptée individuellement. Lus aux côtés de <a class="case-link" onclick="jumpToCase('costaenel')">Costa contre ENEL</a> et de <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, ils montrent ce même principe d'autonomie s'étendre vers l'extérieur, du droit national au droit international, jusqu'au plus proche pendant de l'Union en matière de droits de l'homme.`,
     citations:[
       {phrase:"présumer que les autres États membres se conforment au droit de l'Union et, en particulier, aux droits fondamentaux reconnus par celui-ci", paragraphs:"point 191", note:"Traduction non officielle établie à partir du texte anglais vérifié (point 191). Un avis de la Cour n'a pas de langue de procédure unique comme un contentieux entre parties ; ni le texte français ni le texte allemand officiels n'ont été consultés dans cette session — à vérifier contre le texte officiel.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Wäre der geplante Beitritt der Union zur Europäischen Menschenrechtskonvention mit dem Unionsrecht vereinbar?",
       rule:"Ein Beitrittsabkommen, das die Autonomie der Unionsrechtsordnung oder den Grundsatz des gegenseitigen Vertrauens zwischen den Mitgliedstaaten zu untergraben droht, ist mit den Verträgen unvereinbar.",
       application:"Der Gerichtshof befand den Entwurf des Beitrittsabkommens aus mehreren Gründen für unvereinbar mit dem Unionsrecht und blockierte damit faktisch den Beitritt auf der Grundlage dieses Textes."},
     intermediate:{
       issue:"Die Union hatte einen Entwurf für ein Abkommen über den Beitritt zur Europäischen Menschenrechtskonvention (EMRK) ausgehandelt, wozu Artikel 6 Absatz 2 EUV sie verpflichtet. Vor dessen Abschluss ersuchte die Kommission den Gerichtshof um seine Stellungnahme, ob der Entwurf mit dem Unionsrecht vereinbar sei.<br><br>Alle Mitgliedstaaten der Union sind bereits einzeln an die EMRK gebunden. Die Frage war, ob der Beitritt der Union selbst, als Institution, mit ihrer eigenen Rechtsarchitektur vereinbar wäre.",
       rule:"Der Gerichtshof stellte mehrere Probleme fest. Das gegenseitige Vertrauen zwischen den Mitgliedstaaten — die Annahme, dass die Gerichte jedes Staates bereits einen gemeinsamen Mindeststandard erfüllen — könnte untergraben werden, wenn die EMRK von den Staaten verlangen würde, die Einhaltung der Menschenrechte durch die anderen unmittelbar zu überprüfen.<br><br>Das Abkommen drohte zudem, einem außenstehenden Gericht, dem Europäischen Gerichtshof für Menschenrechte, zu erlauben, über Angelegenheiten zu entscheiden, die der Gerichtshof der Europäischen Union als seine eigene Domäne ansieht, einschließlich bestimmter Bereiche der Außen- und Sicherheitspolitik, in denen der Gerichtshof selbst nur eingeschränkte Zuständigkeit besitzt.<br><br>Zusammengenommen bedeuteten diese Risiken, dass der Entwurf die Autonomie der Unionsrechtsordnung beeinträchtigte.",
       application:"Der Gerichtshof erklärte den Entwurf des Beitrittsabkommens für unvereinbar mit dem Unionsrecht. In der Praxis verhinderte dies, dass der Beitritt auf der Grundlage dieses Textes fortgesetzt wurde, und seither ist kein Abkommen an dessen Stelle getreten."},
     detailed:{
       issue:"Artikel 6 Absatz 2 des Vertrags über die Europäische Union verpflichtet die Union zum Beitritt zur EMRK. Nach jahrelangen Verhandlungen wurde ein Entwurf für ein Beitrittsabkommen erarbeitet. Vor dessen Abschluss ersuchte die Kommission den Gerichtshof, gestützt auf den heutigen Artikel 218 Absatz 11 AEUV, um eine Stellungnahme dazu, ob der Entwurf mit den Verträgen vereinbar sei.<br><br>Dies war ein wirklich ungewöhnlicher Fall: kein Rechtsstreit zwischen Parteien, sondern eine Prüfung eines geplanten internationalen Abkommens durch den Gerichtshof vor dessen Unterzeichnung, gerade damit Probleme im Voraus erkannt werden konnten.",
       rule:`Der Gerichtshof stellte mehrere eigenständige Gründe der Unvereinbarkeit fest. Im Zentrum stand das gegenseitige Vertrauen: Das Unionsrecht verlangt von den Mitgliedstaaten, außer unter außergewöhnlichen Umständen, zu vermuten, dass die anderen Mitgliedstaaten die Grundrechte beachten und das Unionsrecht einhalten. Die eigene Logik der EMRK würde von jedem Staat verlangen, die tatsächliche Einhaltung durch die anderen unmittelbar zu überprüfen, was nach Auffassung des Gerichtshofs diese Vermutung untergraben würde, insbesondere im Raum der Freiheit, der Sicherheit und des Rechts der Union, wo Instrumente wie der Europäische Haftbefehl davon abhängen.<br><br>Der Gerichtshof stellte zudem fest, dass der Entwurf es versäumte, den Europäischen Gerichtshof für Menschenrechte ordnungsgemäß von Entscheidungen über Angelegenheiten der Gemeinsamen Außen- und Sicherheitspolitik auszuschließen, einem Bereich, in dem der Gerichtshof selbst nur eingeschränkte Zuständigkeit besitzt, wodurch ein Missverhältnis zwischen den jeweiligen Zuständigkeiten der beiden Gerichte entstünde. Ein weiteres Anliegen betraf das Protokoll Nr. 16 zur EMRK, das es nationalen Gerichten erlauben würde, Gutachten aus Straßburg einzuholen, wodurch ein paralleler Kanal entstünde, der das eigene Vorabentscheidungsverfahren der Union umgehen könnte.<br><br>Zusammengenommen kam der Gerichtshof zu dem Schluss, dass diese Merkmale die Autonomie der Unionsrechtsordnung gefährdeten — ihre Fähigkeit, ihr eigenes Recht ohne äußere Einmischung auszulegen und anzuwenden —, ein Anliegen mit tiefen Wurzeln in der eigenen früheren Rechtsprechung des Gerichtshofs, einschließlich <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>.`,
       application:"Der Gerichtshof erklärte den Entwurf in seiner vorliegenden Fassung für unvereinbar mit dem Unionsrecht. Dies verschloss dem Beitritt nicht grundsätzlich die Tür, da Artikel 6 Absatz 2 EUV die Union weiterhin dazu verpflichtet, verlangte jedoch, dass ein künftiger Entwurf die Bedenken hinsichtlich des gegenseitigen Vertrauens, der GASP-Zuständigkeit und des Protokolls Nr. 16 unmittelbar berücksichtigt. Bis heute wurde kein überarbeitetes Abkommen geschlossen."},
     holistic:`Das am 18. Dezember 2014 ergangene Gutachten 2/13 folgte sechs Jahre nach <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>, das erstmals feststellte, dass die Unionsrechtsordnung selbst gegenüber verbindlichen Verpflichtungen des UN-Sicherheitsrats autonom ist. Dieses Gutachten wendet denselben zugrunde liegenden Gedanken auf ein anderes äußeres System an: nicht die UNO, sondern die EMRK, eine Institution, der jeder einzelne Mitgliedstaat der Union bereits individuell angehört.<br><br>Die von vielen Kommentatoren festgestellte Ironie ist real: Der Gerichtshof blockierte eine engere Integration mit einem Menschenrechtsgericht teilweise, um einen menschenrechtsrelevanten Grundsatz zu schützen, das gegenseitige Vertrauen, das praktische Instrumente wie den Europäischen Haftbefehl trägt — dasselbe Instrument, das im Mittelpunkt von <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> stand, ein Jahr zuvor entschieden.<br><br>Strukturell bilden Kadi I und Gutachten 2/13 ein Paar: Beide betreffen die Verteidigung der Autonomie der Unionsrechtsordnung gegenüber einem äußeren Rechtssystem, das eine verbindlich durch die UN-Charta, das andere durch eine Konvention, der jeder Mitgliedstaat bereits individuell beigetreten ist. Liest man sie zusammen mit <a class="case-link" onclick="jumpToCase('costaenel')">Costa/ENEL</a> und <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, zeigen sie denselben Autonomiegrundsatz, der sich vom nationalen Recht über das Völkerrecht bis hin zum engsten menschenrechtlichen Gegenstück der Union nach außen ausdehnt.`,
     citations:[
       {phrase:"vermuten, dass die anderen Mitgliedstaaten das Unionsrecht und insbesondere die durch das Unionsrecht anerkannten Grundrechte beachten", paragraphs:"Randnr. 191", note:"Inoffizielle Übersetzung des verifizierten englischen Textes (Randnr. 191). Ein Gutachten des Gerichtshofs hat, anders als ein Verfahren zwischen Parteien, keine einzelne Verfahrenssprache; weder der amtliche französische noch der amtliche deutsche Text wurden in dieser Sitzung eingesehen — gegen den amtlichen Text zu prüfen.", primary:true}
     ]
   },
   it:{
     abstract:{
       issue:"La prevista adesione dell'Unione alla Convenzione europea dei diritti dell'uomo sarebbe stata compatibile con il diritto dell'Unione?",
       rule:"Un accordo di adesione che rischi di compromettere l'autonomia dell'ordinamento giuridico dell'Unione, o il principio della fiducia reciproca tra gli Stati membri, è incompatibile con i trattati.",
       application:"La Corte ritenne il progetto di accordo di adesione incompatibile con il diritto dell'Unione per diversi motivi, bloccando di fatto l'adesione sulla base di tale testo."},
     intermediate:{
       issue:"L'Unione aveva negoziato un progetto di accordo di adesione alla Convenzione europea dei diritti dell'uomo (CEDU), impegno cui l'articolo 6, paragrafo 2, TUE la vincola. Prima di concluderlo, la Commissione chiese alla Corte di giustizia se il progetto fosse compatibile con il diritto dell'Unione.<br><br>Tutti gli Stati membri dell'Unione sono già individualmente vincolati dalla CEDU. La questione era se l'adesione dell'Unione stessa, in quanto istituzione, si conciliasse correttamente con la propria architettura giuridica.",
       rule:"La Corte rilevò diversi problemi. La fiducia reciproca tra Stati membri — la presunzione secondo cui i giudici di ciascuno Stato rispettano già uno standard minimo comune — potrebbe essere compromessa se la CEDU esigesse dagli Stati di verificare direttamente il rispetto dei diritti umani da parte degli altri.<br><br>L'accordo rischiava inoltre di consentire a un giudice esterno, la Corte europea dei diritti dell'uomo, di pronunciarsi su materie che la Corte di giustizia considera di propria competenza, compresi alcuni settori della politica estera e di sicurezza in cui la stessa Corte di giustizia dispone soltanto di una competenza limitata.<br><br>Nel loro insieme, questi rischi comportavano che il progetto di accordo compromettesse l'autonomia dell'ordinamento giuridico dell'Unione.",
       application:"La Corte dichiarò il progetto di accordo di adesione incompatibile con il diritto dell'Unione. In pratica, ciò impedì che l'adesione proseguisse sulla base di tale testo, e da allora nessun accordo l'ha sostituito."},
     detailed:{
       issue:"L'articolo 6, paragrafo 2, del trattato sull'Unione europea impegna l'Unione ad aderire alla CEDU. Dopo anni di negoziati, fu elaborato un progetto di accordo di adesione. Prima che potesse essere concluso, la Commissione chiese il parere della Corte di giustizia, ai sensi di quello che è oggi l'articolo 218, paragrafo 11, TFUE, sulla compatibilità del progetto con i trattati.<br><br>Si trattava di una causa autenticamente inconsueta: non una controversia tra parti, bensì un controllo esercitato dalla Corte su un accordo internazionale previsto prima della sua firma, proprio affinché eventuali problemi potessero essere individuati in anticipo.",
       rule:`La Corte individuò diversi motivi distinti di incompatibilità. Al centro di essi vi era la fiducia reciproca: il diritto dell'Unione impone agli Stati membri di presumere, salvo circostanze eccezionali, che gli altri Stati membri rispettino i diritti fondamentali e si conformino al diritto dell'Unione. La logica propria della CEDU richiederebbe a ciascuno Stato di verificare direttamente l'effettivo rispetto da parte degli altri, il che, secondo la Corte, comprometterebbe tale presunzione, in particolare nello spazio di libertà, sicurezza e giustizia dell'Unione, dove strumenti quali il mandato d'arresto europeo ne dipendono.<br><br>La Corte rilevò inoltre che il progetto di accordo non escludeva correttamente la competenza della Corte europea dei diritti dell'uomo a pronunciarsi su materie rientranti nella politica estera e di sicurezza comune, settore in cui la stessa Corte di giustizia dispone soltanto di una competenza limitata, creando uno squilibrio tra le rispettive competenze dei due giudici. Un'ulteriore preoccupazione riguardava il protocollo n. 16 alla CEDU, che avrebbe consentito ai giudici nazionali di richiedere pareri consultivi a Strasburgo, creando un canale parallelo suscettibile di eludere il rinvio pregiudiziale proprio dell'Unione.<br><br>Nel loro insieme, la Corte concluse che tali caratteristiche mettevano a rischio l'autonomia dell'ordinamento giuridico dell'Unione — la sua capacità di interpretare e applicare il proprio diritto senza ingerenze esterne —, una preoccupazione profondamente radicata nella sua giurisprudenza anteriore, compresa <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>.`,
       application:"La Corte dichiarò il progetto di accordo, nella sua formulazione, incompatibile con il diritto dell'Unione. Ciò non precludeva in linea di principio l'adesione, poiché l'articolo 6, paragrafo 2, TUE continua a impegnarvi l'Unione, ma richiedeva che ogni futuro progetto affrontasse direttamente le preoccupazioni relative alla fiducia reciproca, alla competenza PESC e al protocollo n. 16. Ad oggi, non è stato concluso alcun accordo rivisto."},
     holistic:`Reso il 18 dicembre 2014, il parere 2/13 giunse sei anni dopo che <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a> aveva affermato per la prima volta che l'ordinamento giuridico dell'Unione è autonomo persino rispetto a obblighi vincolanti del Consiglio di sicurezza delle Nazioni Unite. Questo parere applica lo stesso istinto di fondo a un diverso sistema esterno: non l'ONU, bensì la CEDU, un'istituzione cui ogni singolo Stato membro dell'Unione già appartiene individualmente.<br><br>L'ironia rilevata da molti commentatori è reale: la Corte ha ostacolato un'integrazione più stretta con un giudice dei diritti umani in parte per proteggere un principio rilevante in materia di diritti umani, la fiducia reciproca, che sorregge strumenti pratici quali il mandato d'arresto europeo — lo stesso strumento al centro di <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, decisa l'anno precedente.<br><br>Sul piano strutturale, Kadi I e il parere 2/13 formano una coppia: entrambi riguardano la difesa dell'autonomia dell'ordinamento giuridico dell'Unione nei confronti di un sistema giuridico esterno, l'uno vincolante tramite la Carta delle Nazioni Unite, l'altro tramite una convenzione che ogni Stato membro ha già accettato individualmente. Letti insieme a <a class="case-link" onclick="jumpToCase('costaenel')">Costa contro ENEL</a> e a <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, essi mostrano lo stesso principio di autonomia estendersi verso l'esterno, dal diritto nazionale al diritto internazionale, fino alla più prossima controparte dell'Unione in materia di diritti umani.`,
     citations:[
       {phrase:"presumere che gli altri Stati membri si conformino al diritto dell'Unione e, in particolare, ai diritti fondamentali riconosciuti da tale diritto", paragraphs:"punto 191", note:"Traduzione non ufficiale elaborata a partire dal testo inglese verificato (punto 191). Un parere della Corte non ha un'unica lingua di procedura come un contenzioso tra parti; né il testo francese né quello tedesco ufficiali sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true}
     ]
   }
 }},

{id:"stauder", name:"Stauder v City of Ulm", originalName:"Erich Stauder gegen Stadt Ulm – Sozialamt", citation:"Case 29/69", jurisdiction:"CJCE", themes:["Fundamental rights"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Did an EU measure requiring a welfare recipient to give his name to buy subsidised butter breach fundamental rights protected under Community law?",
   rule:"Fundamental human rights are enshrined in the general principles of Community law, and the Court of Justice ensures their protection.",
   application:"Properly interpreted, the measure did not require Stauder's name — only some means of identifying him — so it raised no fundamental rights problem."},
 intermediate:{
   issue:"A 1969 Commission Decision let member states sell surplus butter cheaply to certain welfare recipients, using coupons. The German-language version of the measure appeared to require the beneficiary's name to appear on the coupon, so the retailer could check it.<br><br>Erich Stauder, a war victim living on welfare in Ulm, objected. Having to hand over his name at the till, just to buy cheap butter, felt like a breach of his dignity and of equal treatment — rights he argued Community law had to respect.<br><br>The Verwaltungsgericht Stuttgart asked the Court of Justice whether the measure, read this way, was still compatible with the general principles of Community law.",
   rule:"The Court compared the different language versions of the Decision. Only the German text specifically mentioned a name; the other versions simply required a coupon that let the beneficiary be identified.<br><br>Read in light of every language version and the measure's real purpose — stopping the cheap butter from being resold — identification alone was enough; a number would do just as well as a name.<br><br>Understood this way, the Court said the measure raised no problem: fundamental human rights are part of the general principles of Community law, and the Court itself protects them.",
   application:"Stauder could not be required to hand over his name to buy the reduced-price butter — an identifying number was enough.<br><br>Because the measure could be read this way, it stayed in force; the Court found no need to strike anything down, only to interpret it correctly."},
 detailed:{
   issue:"Commission Decision 69/71/EEC of 12 February 1969 let member states sell butter from EEC surplus stocks at reduced prices to certain welfare recipients, financed through the EAGGF. Beneficiaries received a coupon to present when buying the butter.<br><br>The German-language version of the Decision appeared to require the coupon to show the beneficiary's name, so the retailer could verify that the right person was collecting it. Erich Stauder, a war victim receiving welfare in Ulm, was entitled to the reduced-price butter under this scheme.<br><br>Stauder objected to having to give his name to the shop just to complete the purchase, arguing this was incompatible with the general principles of Community law — in particular respect for human dignity and equal treatment, rights recognised under the German Basic Law which he argued Community law had to respect too.<br><br>The Verwaltungsgericht Stuttgart referred the question to the Court of Justice under Article 177 EEC, asking whether the Decision, so interpreted, was compatible with the general principles of Community law.",
   rule:`The Court held that a Community measure adopted in several languages must be interpreted uniformly, in light of the real intention of its author and the aim it pursues, rather than by reading just one language version literally.<br><br>Comparing every language version of the Decision, the Court found that only the German text specifically demanded the beneficiary's name; the other versions required only that the coupon let the retailer verify the beneficiary's identity, which an identifying number could do just as well.<br><br>The purpose behind identification was simply to prevent abuse of the scheme — stopping the cheap butter being bought up and resold. A numbering system fully served that purpose; a name was not necessary.<br><br>Read this way, the Court held that "the provision at issue contains nothing capable of prejudicing the fundamental human rights enshrined in the general principles of Community law and protected by the Court." This was the Court's first clear statement that fundamental rights form part of Community law's own general principles.`,
   application:"Stauder did not have to disclose his name to buy the reduced-price butter. Properly interpreted — using an identifying number rather than a name — the Commission Decision raised no fundamental rights problem, so it was not invalid.<br><br>This judgment is widely read as the moment the Court first recognised that it would itself protect fundamental rights as part of Community law, even though no Treaty text said so at the time."},
 holistic:`Stauder was decided on 12 November 1969, a year before <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> gave the same idea its fuller, more famous formulation — that respect for fundamental rights is inspired by the constitutional traditions common to the member states. Stauder came first, and said it in a single, quieter sentence, almost in passing, while resolving a dispute over a butter coupon.<br><br>The case set a pattern several later cases in this collection follow: an EU measure is challenged as breaching a right, and the Court, rather than striking the measure down, looks for a reading of it that avoids the conflict, protecting the right without giving up the primacy of EU law. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, decades later, shows what happens once that room to manoeuvre runs out.<br><br>Structurally, Stauder is the seed of an idea that eventually grew into the Charter of Fundamental Rights itself, agreed in 2000 and made legally binding in 2009 — proof that the EU's fundamental rights framework began as judge-made doctrine, not Treaty text.`,
 citations:[
   {phrase:"the provision at issue contains nothing capable of prejudicing the fundamental human rights enshrined in the general principles of Community law and protected by the Court", paragraphs:"para. 7", note:"The Court's founding statement that fundamental rights form part of the general principles of Community law — corroborated across multiple independent secondary sources quoting this judgment at paragraph 7, citation [1969] ECR 419.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Une mesure de l'Union imposant à un bénéficiaire de l'aide sociale de communiquer son nom pour acheter du beurre subventionné violait-elle des droits fondamentaux protégés par le droit communautaire ?",
       rule:"Les droits fondamentaux de la personne humaine sont consacrés par les principes généraux du droit communautaire, dont la Cour de justice assure le respect.",
       application:"Correctement interprétée, la mesure n'exigeait pas le nom de M. Stauder — seulement un moyen de l'identifier — de sorte qu'elle ne soulevait aucune difficulté au regard des droits fondamentaux."},
     intermediate:{
       issue:"Une décision de la Commission de 1969 autorisait les États membres à vendre à bas prix, au moyen de bons, du beurre excédentaire à certains bénéficiaires de l'aide sociale. La version en langue allemande de la mesure semblait exiger que le nom du bénéficiaire figure sur le bon, afin que le détaillant puisse le vérifier.<br><br>Erich Stauder, victime de guerre vivant de l'aide sociale à Ulm, s'y opposa. Devoir communiquer son nom à la caisse, simplement pour acheter du beurre à bas prix, lui paraissait porter atteinte à sa dignité et au principe d'égalité de traitement — des droits qu'il estimait devoir être respectés par le droit communautaire.<br><br>Le Verwaltungsgericht de Stuttgart demanda à la Cour de justice si la mesure, ainsi interprétée, demeurait compatible avec les principes généraux du droit communautaire.",
       rule:"La Cour compara les différentes versions linguistiques de la décision. Seul le texte allemand mentionnait spécifiquement un nom ; les autres versions exigeaient simplement un bon permettant d'identifier le bénéficiaire.<br><br>Lue à la lumière de toutes les versions linguistiques et de l'objet réel de la mesure — empêcher la revente du beurre à bas prix —, une simple identification suffisait ; un numéro convenait tout aussi bien qu'un nom.<br><br>Ainsi comprise, la Cour jugea que la mesure ne soulevait aucune difficulté : les droits fondamentaux de la personne humaine font partie des principes généraux du droit communautaire, et la Cour en assure elle-même le respect.",
       application:"M. Stauder ne pouvait être tenu de communiquer son nom pour acheter le beurre à prix réduit — un numéro d'identification suffisait.<br><br>La mesure pouvant être interprétée en ce sens, elle demeura en vigueur ; la Cour ne jugea pas nécessaire d'invalider quoi que ce soit, seulement de l'interpréter correctement."},
     detailed:{
       issue:"La décision 69/71/CEE de la Commission, du 12 février 1969, autorisait les États membres à vendre à prix réduit, à certains bénéficiaires de l'aide sociale, du beurre provenant des stocks excédentaires de la CEE, financé par le FEOGA. Les bénéficiaires recevaient un bon à présenter lors de l'achat du beurre.<br><br>La version en langue allemande de la décision semblait exiger que le bon fasse apparaître le nom du bénéficiaire, afin que le détaillant puisse vérifier que la bonne personne le retirait. Erich Stauder, victime de guerre bénéficiaire de l'aide sociale à Ulm, avait droit au beurre à prix réduit dans le cadre de ce dispositif.<br><br>M. Stauder s'opposa à devoir communiquer son nom au commerçant pour effectuer cet achat, faisant valoir que cela était incompatible avec les principes généraux du droit communautaire — en particulier le respect de la dignité humaine et l'égalité de traitement, droits reconnus par la Loi fondamentale allemande, qu'il estimait devoir également être respectés par le droit communautaire.<br><br>Le Verwaltungsgericht de Stuttgart posa la question à la Cour de justice sur le fondement de l'article 177 CEE, demandant si la décision, ainsi interprétée, était compatible avec les principes généraux du droit communautaire.",
       rule:`La Cour jugea qu'une mesure communautaire adoptée dans plusieurs langues doit être interprétée de manière uniforme, à la lumière de l'intention réelle de son auteur et de l'objectif qu'elle poursuit, plutôt qu'en s'en tenant littéralement à une seule version linguistique.<br><br>En comparant toutes les versions linguistiques de la décision, la Cour constata que seul le texte allemand exigeait spécifiquement le nom du bénéficiaire ; les autres versions exigeaient seulement que le bon permette au détaillant de vérifier l'identité du bénéficiaire, ce qu'un numéro d'identification pouvait tout aussi bien assurer.<br><br>L'objet de cette identification était simplement de prévenir les abus du dispositif — empêcher que le beurre à bas prix ne soit acheté en vue d'être revendu. Un système de numérotation servait pleinement cet objectif ; un nom n'était pas nécessaire.<br><br>Ainsi interprétée, la Cour jugea que « la disposition litigieuse ne contient aucun élément de nature à mettre en cause les droits fondamentaux de la personne, compris dans les principes généraux du droit communautaire dont la Cour assure le respect ». Ce fut la première affirmation nette, par la Cour, que les droits fondamentaux font partie des principes généraux propres au droit communautaire.`,
       application:"M. Stauder n'avait pas à révéler son nom pour acheter le beurre à prix réduit. Correctement interprétée — en recourant à un numéro d'identification plutôt qu'à un nom —, la décision de la Commission ne soulevait aucune difficulté au regard des droits fondamentaux et n'était donc pas invalide.<br><br>Cet arrêt est largement considéré comme le moment où la Cour reconnut pour la première fois qu'elle assurerait elle-même la protection des droits fondamentaux au titre du droit communautaire, alors même qu'aucun texte du traité ne le prévoyait à l'époque."},
     holistic:`L'arrêt Stauder fut rendu le 12 novembre 1969, un an avant que <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> ne donne à la même idée sa formulation plus complète et plus célèbre — selon laquelle le respect des droits fondamentaux s'inspire des traditions constitutionnelles communes aux États membres. Stauder vint le premier, et l'énonça en une seule phrase discrète, presque en passant, en réglant un litige portant sur un bon d'achat de beurre.<br><br>Cet arrêt instaura un schéma que suivront plusieurs arrêts ultérieurs de ce corpus : une mesure de l'Union est contestée comme violant un droit, et la Cour, plutôt que d'invalider la mesure, en recherche une interprétation qui évite le conflit, protégeant le droit sans renoncer à la primauté du droit de l'Union. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, des décennies plus tard, montre ce qui se produit une fois cette marge de manœuvre épuisée.<br><br>Sur le plan structurel, Stauder est la graine d'une idée qui devint plus tard la Charte des droits fondamentaux elle-même, adoptée en 2000 et rendue juridiquement contraignante en 2009 — preuve que le cadre des droits fondamentaux de l'Union est né d'une doctrine jurisprudentielle, et non d'un texte de traité.`,
     citations:[
       {phrase:"la disposition litigieuse ne contient aucun élément de nature à mettre en cause les droits fondamentaux de la personne, compris dans les principes généraux du droit communautaire dont la Cour assure le respect", paragraphs:"point 7", note:"Traduction non officielle établie à partir du texte anglais vérifié (point 7, [1969] Rec. 419). La langue de procédure de cette affaire était l'allemand ; ni le texte allemand authentique ni la version française officielle du Recueil n'ont pu être consultés dans cette session — à vérifier contre le texte officiel.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Verstieß eine unionsrechtliche Maßnahme, die einen Sozialhilfeempfänger verpflichtete, zum Kauf verbilligter Butter seinen Namen anzugeben, gegen durch das Gemeinschaftsrecht geschützte Grundrechte?",
       rule:"Die Grundrechte des Menschen gehören zu den allgemeinen Rechtsgrundsätzen des Gemeinschaftsrechts, deren Wahrung der Gerichtshof sichert.",
       application:"Bei richtiger Auslegung verlangte die Maßnahme nicht den Namen von Herrn Stauder — nur ein Mittel zu seiner Identifizierung —, sodass sie kein grundrechtliches Problem aufwarf."},
     intermediate:{
       issue:"Eine Entscheidung der Kommission von 1969 erlaubte den Mitgliedstaaten, überschüssige Butter mittels Gutscheinen verbilligt an bestimmte Sozialhilfeempfänger abzugeben. Die deutschsprachige Fassung der Maßnahme schien zu verlangen, dass der Name des Begünstigten auf dem Gutschein erscheine, damit der Händler ihn überprüfen könne.<br><br>Erich Stauder, ein von Sozialhilfe lebendes Kriegsopfer in Ulm, wandte sich dagegen. Seinen Namen an der Kasse angeben zu müssen, nur um billige Butter zu kaufen, empfand er als Verletzung seiner Würde und des Gleichbehandlungsgrundsatzes — Rechte, die seiner Auffassung nach auch vom Gemeinschaftsrecht zu achten waren.<br><br>Das Verwaltungsgericht Stuttgart fragte den Gerichtshof, ob die Maßnahme, so verstanden, weiterhin mit den allgemeinen Rechtsgrundsätzen des Gemeinschaftsrechts vereinbar sei.",
       rule:"Der Gerichtshof verglich die verschiedenen Sprachfassungen der Entscheidung. Nur der deutsche Text erwähnte ausdrücklich einen Namen; die anderen Fassungen verlangten lediglich einen Gutschein, der die Identifizierung des Begünstigten ermöglichte.<br><br>Im Licht sämtlicher Sprachfassungen und des eigentlichen Zwecks der Maßnahme — zu verhindern, dass die billige Butter weiterverkauft wird — gelesen, genügte eine bloße Identifizierung; eine Nummer erfüllte denselben Zweck wie ein Name.<br><br>So verstanden, so der Gerichtshof, werfe die Maßnahme kein Problem auf: Die Grundrechte des Menschen gehören zu den allgemeinen Rechtsgrundsätzen des Gemeinschaftsrechts, und der Gerichtshof selbst sichert deren Wahrung.",
       application:"Herr Stauder konnte nicht verpflichtet werden, seinen Namen anzugeben, um die verbilligte Butter zu kaufen — eine Identifikationsnummer genügte.<br><br>Da die Maßnahme in diesem Sinne ausgelegt werden konnte, blieb sie in Kraft; der Gerichtshof sah keine Notwendigkeit, etwas für ungültig zu erklären, sondern nur, sie richtig auszulegen."},
     detailed:{
       issue:"Die Entscheidung 69/71/EWG der Kommission vom 12. Februar 1969 erlaubte den Mitgliedstaaten, Butter aus EWG-Überschussbeständen, finanziert durch den EAGFL, zu verbilligten Preisen an bestimmte Sozialhilfeempfänger zu verkaufen. Die Begünstigten erhielten einen beim Kauf der Butter vorzulegenden Gutschein.<br><br>Die deutschsprachige Fassung der Entscheidung schien zu verlangen, dass der Gutschein den Namen des Begünstigten auswies, damit der Händler überprüfen konnte, dass die richtige Person ihn abholte. Erich Stauder, ein Sozialhilfe beziehendes Kriegsopfer in Ulm, war im Rahmen dieser Regelung zum Bezug der verbilligten Butter berechtigt.<br><br>Herr Stauder wandte sich dagegen, dem Geschäft seinen Namen nennen zu müssen, nur um den Kauf abzuschließen, und machte geltend, dies sei mit den allgemeinen Rechtsgrundsätzen des Gemeinschaftsrechts unvereinbar — insbesondere mit der Achtung der Menschenwürde und dem Gleichbehandlungsgrundsatz, Rechten, die im deutschen Grundgesetz anerkannt seien und die seiner Auffassung nach auch vom Gemeinschaftsrecht zu achten waren.<br><br>Das Verwaltungsgericht Stuttgart legte die Frage dem Gerichtshof gemäß Artikel 177 EWG vor, ob die Entscheidung, so ausgelegt, mit den allgemeinen Rechtsgrundsätzen des Gemeinschaftsrechts vereinbar sei.",
       rule:`Der Gerichtshof entschied, dass eine in mehreren Sprachen erlassene Gemeinschaftsmaßnahme einheitlich auszulegen ist, im Licht des tatsächlichen Willens ihres Urhebers und des von ihr verfolgten Ziels, statt anhand des wörtlichen Textes nur einer Sprachfassung.<br><br>Beim Vergleich sämtlicher Sprachfassungen der Entscheidung stellte der Gerichtshof fest, dass nur der deutsche Text ausdrücklich den Namen des Begünstigten verlangte; die anderen Fassungen verlangten lediglich, dass der Gutschein dem Händler erlaube, die Identität des Begünstigten zu überprüfen, was eine Identifikationsnummer ebenso gut leisten konnte.<br><br>Der Zweck der Identifizierung bestand lediglich darin, einen Missbrauch der Regelung zu verhindern — zu verhindern, dass die billige Butter aufgekauft und weiterverkauft wird. Ein Nummernsystem diente diesem Zweck vollständig; ein Name war nicht erforderlich.<br><br>So verstanden, entschied der Gerichtshof, dass „die fragliche Bestimmung nichts enthält, was geeignet wäre, die in den allgemeinen Grundsätzen des Gemeinschaftsrechts verankerten und vom Gerichtshof gesicherten Grundrechte der Person zu beeinträchtigen“. Dies war die erste klare Aussage des Gerichtshofs, dass die Grundrechte zu den eigenen allgemeinen Rechtsgrundsätzen des Gemeinschaftsrechts gehören.`,
       application:"Herr Stauder musste seinen Namen nicht offenlegen, um die verbilligte Butter zu kaufen. Bei richtiger Auslegung — unter Verwendung einer Identifikationsnummer statt eines Namens — warf die Entscheidung der Kommission kein grundrechtliches Problem auf und war daher nicht ungültig.<br><br>Dieses Urteil gilt weithin als der Moment, in dem der Gerichtshof erstmals anerkannte, dass er selbst die Grundrechte als Teil des Gemeinschaftsrechts schützen würde, obwohl damals kein Vertragstext dies vorsah."},
     holistic:`Das Urteil Stauder erging am 12. November 1969, ein Jahr bevor <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> derselben Idee ihre vollständigere, berühmtere Formulierung gab — dass die Achtung der Grundrechte von den gemeinsamen Verfassungsüberlieferungen der Mitgliedstaaten inspiriert sei. Stauder kam zuerst und formulierte dies in einem einzigen, unauffälligen Satz, beinahe beiläufig, bei der Entscheidung eines Streits über einen Buttergutschein.<br><br>Der Fall begründete ein Muster, dem mehrere spätere Fälle dieser Sammlung folgen: Eine Unionsmaßnahme wird als Verletzung eines Rechts angefochten, und der Gerichtshof sucht, statt die Maßnahme für ungültig zu erklären, nach einer Auslegung, die den Konflikt vermeidet und das Recht schützt, ohne den Vorrang des Unionsrechts aufzugeben. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, Jahrzehnte später, zeigt, was geschieht, sobald dieser Spielraum erschöpft ist.<br><br>Strukturell ist Stauder der Keim einer Idee, die sich später zur Charta der Grundrechte selbst entwickelte, vereinbart im Jahr 2000 und rechtsverbindlich seit 2009 — ein Beleg dafür, dass der grundrechtliche Rahmen der Union als richterrechtliche Doktrin begann, nicht als Vertragstext.`,
     citations:[
       {phrase:"die fragliche Bestimmung enthält nichts, was geeignet wäre, die in den allgemeinen Grundsätzen des Gemeinschaftsrechts verankerten und vom Gerichtshof gesicherten Grundrechte der Person zu beeinträchtigen", paragraphs:"Randnr. 7", note:"Rückübersetzung aus dem verifizierten englischen Text (Randnr. 7, [1969] Slg. 419); Deutsch ist die authentische Verfahrenssprache dieser Rechtssache, der amtliche deutsche Originalwortlaut wurde in dieser Sitzung jedoch nicht erneut eingesehen — gegen den amtlichen Text zu prüfen.", primary:true}
     ]
