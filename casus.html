   it:{
     abstract:{
       issue:"Una misura dell'Unione che imponeva a un beneficiario dell'assistenza sociale di comunicare il proprio nome per acquistare burro sovvenzionato violava i diritti fondamentali tutelati dal diritto comunitario?",
       rule:"I diritti fondamentali della persona umana sono sanciti dai principi generali del diritto comunitario, di cui la Corte di giustizia garantisce la tutela.",
       application:"Correttamente interpretata, la misura non richiedeva il nome del sig. Stauder — solo un mezzo per identificarlo — cosicché non sollevava alcun problema in materia di diritti fondamentali."},
     intermediate:{
       issue:"Una decisione della Commissione del 1969 autorizzava gli Stati membri a vendere a basso prezzo, mediante buoni, burro eccedentario a determinati beneficiari dell'assistenza sociale. La versione in lingua tedesca della misura sembrava richiedere che il nome del beneficiario comparisse sul buono, affinché il rivenditore potesse verificarlo.<br><br>Erich Stauder, vittima di guerra vivente d'assistenza sociale a Ulm, si oppose. Dover comunicare il proprio nome alla cassa, solo per acquistare burro a basso prezzo, gli sembrava ledere la sua dignità e il principio della parità di trattamento — diritti che, a suo avviso, il diritto comunitario doveva rispettare.<br><br>Il Verwaltungsgericht di Stoccarda chiese alla Corte di giustizia se la misura, così interpretata, restasse compatibile con i principi generali del diritto comunitario.",
       rule:"La Corte confrontò le diverse versioni linguistiche della decisione. Solo il testo tedesco menzionava specificamente un nome; le altre versioni richiedevano semplicemente un buono che consentisse di identificare il beneficiario.<br><br>Letta alla luce di tutte le versioni linguistiche e dell'obiettivo reale della misura — impedire la rivendita del burro a basso prezzo —, la sola identificazione era sufficiente; un numero sarebbe stato altrettanto idoneo di un nome.<br><br>Così intesa, la Corte dichiarò che la misura non sollevava alcun problema: i diritti fondamentali della persona umana fanno parte dei principi generali del diritto comunitario, e la Corte stessa ne garantisce la tutela.",
       application:"Al sig. Stauder non poteva essere richiesto di comunicare il proprio nome per acquistare il burro a prezzo ridotto — un numero identificativo era sufficiente.<br><br>Poiché la misura poteva essere interpretata in tal senso, essa rimase in vigore; la Corte non ritenne necessario invalidare alcunché, ma soltanto interpretarla correttamente."},
     detailed:{
       issue:"La decisione della Commissione 69/71/CEE, del 12 febbraio 1969, autorizzava gli Stati membri a vendere a prezzo ridotto, a determinati beneficiari dell'assistenza sociale, burro proveniente dalle scorte eccedentarie della CEE, finanziato tramite il FEAOG. I beneficiari ricevevano un buono da presentare all'atto dell'acquisto del burro.<br><br>La versione in lingua tedesca della decisione sembrava richiedere che il buono indicasse il nome del beneficiario, affinché il rivenditore potesse verificare che fosse la persona giusta a ritirarlo. Erich Stauder, vittima di guerra beneficiaria dell'assistenza sociale a Ulm, aveva diritto al burro a prezzo ridotto nell'ambito di tale regime.<br><br>Il sig. Stauder si oppose a dover comunicare il proprio nome al negoziante per completare l'acquisto, sostenendo che ciò fosse incompatibile con i principi generali del diritto comunitario — in particolare il rispetto della dignità umana e la parità di trattamento, diritti riconosciuti dalla Legge fondamentale tedesca, che a suo avviso dovevano essere rispettati anche dal diritto comunitario.<br><br>Il Verwaltungsgericht di Stoccarda sottopose la questione alla Corte di giustizia ai sensi dell'articolo 177 CEE, chiedendo se la decisione, così interpretata, fosse compatibile con i principi generali del diritto comunitario.",
       rule:`La Corte dichiarò che una misura comunitaria adottata in più lingue deve essere interpretata in modo uniforme, alla luce dell'intenzione reale del suo autore e dello scopo da essa perseguito, anziché attenendosi letteralmente a una sola versione linguistica.<br><br>Confrontando tutte le versioni linguistiche della decisione, la Corte constatò che solo il testo tedesco richiedeva espressamente il nome del beneficiario; le altre versioni richiedevano soltanto che il buono consentisse al rivenditore di verificare l'identità del beneficiario, ciò che un numero identificativo poteva assicurare altrettanto bene.<br><br>Lo scopo dell'identificazione era semplicemente prevenire abusi del regime — impedire che il burro a basso prezzo venisse acquistato per essere rivenduto. Un sistema di numerazione serviva pienamente tale scopo; un nome non era necessario.<br><br>Così interpretata, la Corte dichiarò che «la disposizione controversa non contiene alcun elemento atto a pregiudicare i diritti fondamentali della persona, contemplati nei principi generali del diritto comunitario e di cui la Corte garantisce l'osservanza». Questa fu la prima affermazione netta, da parte della Corte, che i diritti fondamentali fanno parte dei principi generali propri del diritto comunitario.`,
       application:"Il sig. Stauder non doveva rivelare il proprio nome per acquistare il burro a prezzo ridotto. Correttamente interpretata — ricorrendo a un numero identificativo anziché a un nome — la decisione della Commissione non sollevava alcun problema in materia di diritti fondamentali e non era quindi invalida.<br><br>Questa sentenza è ampiamente considerata il momento in cui la Corte riconobbe per la prima volta che essa stessa avrebbe tutelato i diritti fondamentali quale parte del diritto comunitario, sebbene all'epoca nessun testo del trattato lo prevedesse."},
     holistic:`La sentenza Stauder fu resa il 12 novembre 1969, un anno prima che <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> desse alla stessa idea la sua formulazione più compiuta e più celebre — secondo cui il rispetto dei diritti fondamentali si ispira alle tradizioni costituzionali comuni agli Stati membri. Stauder venne prima, ed espresse ciò in un'unica frase discreta, quasi di sfuggita, risolvendo una controversia relativa a un buono per l'acquisto di burro.<br><br>Questa causa instaurò uno schema che diverse cause successive di questa raccolta seguono: una misura dell'Unione viene contestata come lesiva di un diritto, e la Corte, anziché invalidare la misura, ne ricerca un'interpretazione che eviti il conflitto, tutelando il diritto senza rinunciare al primato del diritto dell'Unione. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, decenni più tardi, mostra cosa accade una volta esaurito tale margine di manovra.<br><br>Sul piano strutturale, Stauder è il seme di un'idea che sarebbe poi diventata la Carta dei diritti fondamentali stessa, adottata nel 2000 e resa giuridicamente vincolante nel 2009 — prova che il quadro dei diritti fondamentali dell'Unione nacque come dottrina giurisprudenziale, non come testo del trattato.`,
     citations:[
       {phrase:"la disposizione controversa non contiene alcun elemento atto a pregiudicare i diritti fondamentali della persona, contemplati nei principi generali del diritto comunitario e di cui la Corte garantisce l'osservanza", paragraphs:"punto 7", note:"Traduzione non ufficiale elaborata a partire dal testo inglese verificato (punto 7, [1969] Racc. 419). La lingua di procedura di questa causa era il tedesco; né il testo tedesco autentico né la versione italiana ufficiale della Raccolta sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true}
     ]
   }
 }},

{id:"konstantinidis", name:"Konstantinidis v Stadt Altensteig", originalName:"Christos Konstantinidis gegen Stadt Altensteig – Standesamt und Landratsamt Calw – Ordnungsamt", citation:"Case C-168/91", jurisdiction:"CJCE", themes:["Citizenship / free movement","Fundamental rights"], legacyThemes:["Market freedoms"], articleIds:["art49tfeu"],
 abstract:{
   issue:"Could Germany require a Greek national to use a transliteration of his name that distorted its pronunciation and risked confusing his clients, without breaching his freedom of establishment?",
   rule:"It is contrary to Article 52 of the Treaty for a member state to require a Greek national to use, in the pursuit of his occupation, a spelling of his name that changes its pronunciation and exposes him to a real risk that clients will confuse him with someone else.",
   application:"Konstantinidis could not be forced to use the ISO-transliterated spelling of his name, since it distorted his pronunciation and risked misleading his clients."},
 intermediate:{
   issue:"Christos Konstantinidis, a Greek national, worked in Altensteig, Germany, as a self-employed masseur and hydrotherapist.<br><br>When he married, the German civil status register recorded his name using a strict international transliteration standard, producing a spelling that changed how his name was pronounced and read nothing like the Greek original.<br><br>Konstantinidis argued this new spelling would confuse his clients and damage the professional reputation he had built under his real name. The German court hearing his case asked the Court of Justice whether EU free movement law had anything to say about this.",
   rule:"The Court said the Treaty does not stop a state transliterating a foreign name into its own alphabet, as such.<br><br>But it drew a line: if the transliteration is so distorting that it creates a genuine risk of clients confusing the person with someone else, it becomes an obstacle to that person's freedom to run a business in another member state.<br><br>At that point, the interference isn't just cosmetic — it makes it genuinely harder to exercise a Treaty right.",
   application:"Because the transliterated spelling changed the pronunciation of Konstantinidis's name and could confuse potential clients, Germany could not require him to use it in the course of his occupation.<br><br>The ruling was narrower than it is sometimes remembered: the Court decided the case on ordinary freedom-of-establishment grounds, not as a free-standing fundamental rights ruling."},
 detailed:{
   issue:"Christos Konstantinidis, a Greek national, worked as a self-employed masseur and assistant hydrotherapist in Altensteig, Germany.<br><br>When he married at the Altensteig registry office in 1983, his name was recorded using the transliteration required under a convention on civil status based on ISO Standard 18. This produced a spelling so literal that it changed how his name was actually pronounced, unlike the version on his passport and identity documents.<br><br>Konstantinidis asked the registry to correct this to a spelling that preserved the original pronunciation. When the dispute reached the Amtsgericht Tübingen, it referred questions to the Court of Justice, asking essentially whether Treaty provisions including on freedom of establishment (then Article 52 EEC) and freedom to provide services (Articles 59 and 60 EEC) precluded this kind of transliteration.",
   rule:`Advocate General Jacobs' Opinion went further than the Court itself: he argued a Community national moving to work in another member state is entitled to assume he will be treated according to a common code of fundamental values, including those in the European Convention on Human Rights, and can invoke that status — in a passage often summarised as "civis europeus sum" — to resist any breach of his fundamental rights. The Court's own judgment did not adopt this broader reasoning.<br><br>Instead, the Court held there is nothing in the Treaty to stop a member state transcribing a Greek name into Roman characters for its civil status registers, as such.<br><br>But it found a Treaty problem could arise where national legislation obliges a Greek national to use, in the pursuit of his occupation, a spelling of his name derived from the transliteration used in the registers of civil status, if that spelling modifies its pronunciation and the resulting distortion exposes him to the risk that potential clients may confuse him with other persons. That, the Court held, is a genuine obstacle to freedom of establishment under Article 52 of the Treaty.`,
   application:"Since the ISO-standard transliteration changed the pronunciation of Konstantinidis's name and could cause potential clients to confuse him with someone else, Germany could not require him to use that spelling in his occupation.<br><br>The Court left it to the national court to decide, on the facts, whether the distortion in Konstantinidis's own case actually met this threshold."},
 holistic:`Decided on 30 March 1993, Konstantinidis is remembered less for what the Court actually held than for what Advocate General Jacobs said along the way. His Opinion's "civis europeus sum" passage remains one of the most quoted lines by any Advocate General in the Court's history, imagining EU citizenship as carrying its own common code of fundamental values wherever a person moves to work.<br><br>The Court's own judgment was considerably narrower, deciding the case under freedom of establishment rather than adopting a free-standing fundamental rights test — much like <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> folded fundamental rights protection into an existing EU law category rather than creating a separate right of action.<br><br>The gap between the Opinion and the judgment became a rallying point for arguments that EU citizenship should carry more free-standing rights of its own — arguments later citizenship cases, including <a class="case-link" onclick="jumpToCase('grzelczyk')">Grzelczyk</a> and <span class="case-link-pending" title="Not yet added to Casus">Zhu and Chen</span>, would test in different contexts.<br><br>Structurally, Konstantinidis shows how much further an Advocate General has sometimes been willing to go than the Court itself on fundamental rights — a gap that later narrowed once the Charter of Fundamental Rights gave the Court its own firmer textual footing, visible in <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> two decades later.`,
 citations:[
   {phrase:"Such interference occurs if a Greek national is obliged by the legislation of the State in which he is established to use, in the pursuit of his occupation, a spelling of his name derived from the transliteration used in the registers of civil status if that spelling is such as to modify its pronunciation and if the resulting distortion exposes him to the risk that potential clients may confuse him with other persons", paragraphs:"para. 16", note:"The Court's interference test — corroborated verbatim across two independent secondary sources quoting the judgment at paragraph 16.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"L'Allemagne pouvait-elle imposer à un ressortissant grec d'utiliser une translittération de son nom qui en dénaturait la prononciation et risquait de créer une confusion chez sa clientèle, sans violer sa liberté d'établissement ?",
       rule:"Il est contraire à l'article 52 du traité qu'un État membre impose à un ressortissant grec d'utiliser, dans l'exercice de sa profession, une orthographe de son nom qui en modifie la prononciation et l'expose à un risque réel de confusion, dans l'esprit de la clientèle, avec une autre personne.",
       application:"M. Konstantinidis ne pouvait être contraint d'utiliser l'orthographe de son nom translittérée selon la norme ISO, celle-ci en dénaturant la prononciation et risquant d'induire sa clientèle en erreur."},
     intermediate:{
       issue:"Christos Konstantinidis, ressortissant grec, exerçait à Altensteig, en Allemagne, la profession indépendante de masseur et d'hydrothérapeute.<br><br>Lors de son mariage, l'état civil allemand enregistra son nom selon une norme stricte de translittération internationale, produisant une orthographe qui en modifiait la prononciation et ne ressemblait en rien à l'original grec.<br><br>M. Konstantinidis soutint que cette nouvelle orthographe créerait une confusion chez sa clientèle et nuirait à la réputation professionnelle qu'il avait bâtie sous son véritable nom. La juridiction allemande saisie de l'affaire demanda à la Cour de justice si le droit de l'Union relatif à la libre circulation avait quelque chose à dire sur ce point.",
       rule:"La Cour jugea que le traité n'empêche pas, en soi, un État de translittérer un nom étranger dans son propre alphabet.<br><br>Mais elle traça une limite : si la translittération est à ce point dénaturante qu'elle crée un risque réel de confusion de la personne avec une autre, elle devient un obstacle à la liberté de cette personne d'exercer une activité économique dans un autre État membre.<br><br>À ce stade, l'atteinte n'est plus simplement cosmétique — elle rend véritablement plus difficile l'exercice d'un droit tiré du traité.",
       application:"L'orthographe translittérée modifiant la prononciation du nom de M. Konstantinidis et pouvant créer une confusion chez des clients potentiels, l'Allemagne ne pouvait lui imposer de l'utiliser dans l'exercice de sa profession.<br><br>La solution retenue fut plus étroite qu'on ne s'en souvient parfois : la Cour trancha l'affaire sur le terrain classique de la liberté d'établissement, et non comme une décision autonome relative aux droits fondamentaux."},
     detailed:{
       issue:"Christos Konstantinidis, ressortissant grec, exerçait la profession indépendante de masseur et d'assistant hydrothérapeute à Altensteig, en Allemagne.<br><br>Lors de son mariage, célébré en 1983 au bureau d'état civil d'Altensteig, son nom fut enregistré selon la translittération exigée par une convention relative à l'état civil fondée sur la norme ISO 18. Cela produisit une orthographe si littérale qu'elle modifiait la prononciation réelle de son nom, à la différence de la version figurant sur son passeport et ses documents d'identité.<br><br>M. Konstantinidis demanda au bureau d'état civil de corriger cette orthographe pour en préserver la prononciation d'origine. Le litige parvenu devant l'Amtsgericht de Tübingen, celui-ci posa des questions préjudicielles à la Cour de justice, demandant en substance si les dispositions du traité relatives notamment à la liberté d'établissement (alors l'article 52 CEE) et à la libre prestation de services (articles 59 et 60 CEE) s'opposaient à ce type de translittération.",
       rule:`Les conclusions de l'avocat général Jacobs allèrent plus loin que la Cour elle-même : il soutint qu'un ressortissant communautaire s'installant pour travailler dans un autre État membre est en droit de s'attendre à être traité selon un code commun de valeurs fondamentales, y compris celles consacrées par la Convention européenne des droits de l'homme, et peut invoquer ce statut — dans un passage souvent résumé par la formule « civis europeus sum » — pour s'opposer à toute atteinte à ses droits fondamentaux. L'arrêt de la Cour lui-même ne retint pas ce raisonnement plus large.<br><br>La Cour jugea au contraire que rien dans le traité n'empêche, en soi, un État membre de transcrire un nom grec en caractères romains pour les besoins de ses registres d'état civil.<br><br>Mais elle estima qu'une difficulté au regard du traité pouvait surgir lorsqu'une législation nationale oblige un ressortissant grec à utiliser, dans l'exercice de sa profession, une orthographe de son nom issue de la translittération employée dans les registres d'état civil, si cette orthographe en modifie la prononciation et si la déformation qui en résulte l'expose au risque que des clients potentiels le confondent avec d'autres personnes. Cela constitue, jugea la Cour, un obstacle réel à la liberté d'établissement au sens de l'article 52 du traité.`,
       application:"La translittération selon la norme ISO modifiant la prononciation du nom de M. Konstantinidis et pouvant amener des clients potentiels à le confondre avec une autre personne, l'Allemagne ne pouvait lui imposer cette orthographe dans l'exercice de sa profession.<br><br>La Cour laissa à la juridiction nationale le soin de déterminer, au vu des faits, si la déformation constatée dans le cas de M. Konstantinidis atteignait effectivement ce seuil."},
     holistic:`Rendu le 30 mars 1993, l'arrêt Konstantinidis est resté dans les mémoires moins pour ce que la Cour jugea réellement que pour ce que l'avocat général Jacobs affirma au passage. Le passage « civis europeus sum » de ses conclusions demeure l'une des formules les plus citées de tout avocat général dans l'histoire de la Cour, envisageant la citoyenneté de l'Union comme porteuse de son propre code commun de valeurs fondamentales partout où une personne se déplace pour travailler.<br><br>L'arrêt de la Cour lui-même fut sensiblement plus étroit, tranchant l'affaire sur le terrain de la liberté d'établissement plutôt qu'en adoptant un test autonome fondé sur les droits fondamentaux — un peu à la manière dont <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> intégra la protection des droits fondamentaux dans une catégorie existante du droit de l'Union plutôt que de créer une voie de droit distincte.<br><br>L'écart entre les conclusions et l'arrêt devint un point de ralliement pour les arguments selon lesquels la citoyenneté de l'Union devrait porter des droits plus autonomes qui lui soient propres — arguments que des arrêts ultérieurs relatifs à la citoyenneté, dont <a class="case-link" onclick="jumpToCase('grzelczyk')">Grzelczyk</a> et <span class="case-link-pending" title="Pas encore ajouté à Casus">Zhu et Chen</span>, mettraient à l'épreuve dans des contextes différents.<br><br>Sur le plan structurel, Konstantinidis montre à quel point un avocat général a parfois été disposé à aller plus loin que la Cour elle-même en matière de droits fondamentaux — un écart qui se réduisit plus tard, une fois que la Charte des droits fondamentaux offrit à la Cour une assise textuelle plus ferme, visible dans <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> deux décennies plus tard.`,
     citations:[
       {phrase:"Une telle atteinte se produit lorsqu'un ressortissant grec est obligé, par la législation de l'État dans lequel il est établi, d'utiliser, dans l'exercice de sa profession, une orthographe de son nom dérivée de la translittération utilisée dans les registres de l'état civil, si cette orthographe est de nature à en modifier la prononciation, et si la déformation qui en résulte l'expose au risque que des clients potentiels le confondent avec d'autres personnes", paragraphs:"point 16", note:"Traduction non officielle établie à partir du texte anglais vérifié (point 16). La langue de procédure de cette affaire était l'allemand ; ni le texte allemand authentique ni la version française officielle du Recueil n'ont pu être consultés dans cette session — à vérifier contre le texte officiel.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Durfte Deutschland von einem griechischen Staatsangehörigen verlangen, eine Transliteration seines Namens zu verwenden, die dessen Aussprache verfälschte und die Gefahr einer Verwechslung bei seinen Kunden schuf, ohne dessen Niederlassungsfreiheit zu verletzen?",
       rule:"Es verstößt gegen Artikel 52 des Vertrags, wenn ein Mitgliedstaat von einem griechischen Staatsangehörigen verlangt, bei der Ausübung seines Berufs eine Schreibweise seines Namens zu verwenden, die dessen Aussprache verändert und ihn der echten Gefahr aussetzt, von Kunden mit einer anderen Person verwechselt zu werden.",
       application:"Herr Konstantinidis durfte nicht gezwungen werden, die nach ISO-Norm transliterierte Schreibweise seines Namens zu verwenden, da diese seine Aussprache verfälschte und seine Kunden in die Irre zu führen drohte."},
     intermediate:{
       issue:"Christos Konstantinidis, griechischer Staatsangehöriger, arbeitete in Altensteig, Deutschland, selbständig als Masseur und Hydrotherapeut.<br><br>Bei seiner Eheschließung trug das deutsche Personenstandsregister seinen Namen nach einem strengen internationalen Transliterationsstandard ein, was zu einer Schreibweise führte, die die Aussprache seines Namens veränderte und dem griechischen Original kaum noch ähnelte.<br><br>Herr Konstantinidis machte geltend, diese neue Schreibweise werde seine Kunden verwirren und den beruflichen Ruf schädigen, den er unter seinem echten Namen aufgebaut hatte. Das mit seinem Fall befasste deutsche Gericht fragte den Gerichtshof, ob das unionsrechtliche Freizügigkeitsrecht hierzu etwas zu sagen habe.",
       rule:"Der Gerichtshof entschied, dass der Vertrag einen Staat als solchen nicht daran hindert, einen ausländischen Namen in sein eigenes Alphabet zu transliterieren.<br><br>Er zog jedoch eine Grenze: Ist die Transliteration so verfälschend, dass sie eine echte Gefahr schafft, dass Kunden die Person mit einer anderen verwechseln, wird sie zu einem Hindernis für die Freiheit dieser Person, in einem anderen Mitgliedstaat eine wirtschaftliche Tätigkeit auszuüben.<br><br>An diesem Punkt ist der Eingriff nicht mehr bloß kosmetischer Natur — er erschwert die Ausübung eines vertraglich verbürgten Rechts tatsächlich.",
       application:"Da die transliterierte Schreibweise die Aussprache von Herrn Konstantinidis' Namen veränderte und potenzielle Kunden verwirren konnte, durfte Deutschland ihn nicht verpflichten, sie bei der Ausübung seines Berufs zu verwenden.<br><br>Das Urteil fiel enger aus, als es manchmal in Erinnerung ist: Der Gerichtshof entschied den Fall auf der Grundlage der gewöhnlichen Niederlassungsfreiheit, nicht als eigenständige grundrechtliche Entscheidung."},
     detailed:{
       issue:"Christos Konstantinidis, griechischer Staatsangehöriger, arbeitete selbständig als Masseur und Hydrotherapie-Assistent in Altensteig, Deutschland.<br><br>Bei seiner Eheschließung 1983 beim Standesamt Altensteig wurde sein Name nach der Transliteration eingetragen, die ein auf der ISO-Norm 18 beruhendes Personenstandsübereinkommen vorschrieb. Dies führte zu einer derart wörtlichen Schreibweise, dass sie die tatsächliche Aussprache seines Namens veränderte, anders als die Fassung in seinem Reisepass und seinen Ausweispapieren.<br><br>Herr Konstantinidis bat das Standesamt, dies in eine Schreibweise zu berichtigen, die die ursprüngliche Aussprache bewahrte. Als der Streit vor das Amtsgericht Tübingen gelangte, legte dieses dem Gerichtshof Fragen vor, im Kern, ob Vertragsbestimmungen, unter anderem zur Niederlassungsfreiheit (damals Artikel 52 EWG) und zum freien Dienstleistungsverkehr (Artikel 59 und 60 EWG), einer solchen Transliteration entgegenstünden.",
       rule:`Die Schlussanträge von Generalanwalt Jacobs gingen weiter als das Urteil des Gerichtshofs selbst: Er vertrat die Auffassung, ein Gemeinschaftsangehöriger, der sich zur Arbeitsaufnahme in einen anderen Mitgliedstaat begebe, dürfe erwarten, nach einem gemeinsamen Kodex grundlegender Werte behandelt zu werden, einschließlich jener der Europäischen Menschenrechtskonvention, und könne sich auf diesen Status — in einer oft mit der Formel „civis europeus sum“ zusammengefassten Passage — berufen, um jeder Verletzung seiner Grundrechte entgegenzutreten. Das Urteil des Gerichtshofs selbst übernahm diese weitergehende Begründung nicht.<br><br>Stattdessen entschied der Gerichtshof, dass nichts im Vertrag einen Mitgliedstaat als solchen daran hindere, einen griechischen Namen für seine Personenstandsregister in lateinische Schriftzeichen zu übertragen.<br><br>Er stellte jedoch fest, dass sich ein vertragsrechtliches Problem ergeben könne, wenn nationale Rechtsvorschriften einen griechischen Staatsangehörigen verpflichten, bei der Ausübung seines Berufs eine Schreibweise seines Namens zu verwenden, die sich aus der in den Personenstandsregistern verwendeten Transliteration ableitet, sofern diese Schreibweise dessen Aussprache verändert und die daraus resultierende Verfälschung ihn der Gefahr aussetzt, dass potenzielle Kunden ihn mit anderen Personen verwechseln. Dies stelle, so der Gerichtshof, ein echtes Hindernis für die Niederlassungsfreiheit nach Artikel 52 des Vertrags dar.`,
       application:"Da die nach ISO-Norm transliterierte Schreibweise die Aussprache von Herrn Konstantinidis' Namen veränderte und potenzielle Kunden dazu bringen konnte, ihn mit einer anderen Person zu verwechseln, durfte Deutschland ihm diese Schreibweise bei der Ausübung seines Berufs nicht vorschreiben.<br><br>Der Gerichtshof überließ es dem nationalen Gericht, anhand der Tatsachen zu beurteilen, ob die Verfälschung im konkreten Fall von Herrn Konstantinidis diese Schwelle tatsächlich erreichte."},
     holistic:`Das am 30. März 1993 ergangene Urteil Konstantinidis ist weniger für das in Erinnerung geblieben, was der Gerichtshof tatsächlich entschied, als für das, was Generalanwalt Jacobs auf dem Weg dorthin äußerte. Die Passage „civis europeus sum“ seiner Schlussanträge bleibt eine der meistzitierten Formulierungen eines Generalanwalts in der Geschichte des Gerichtshofs und stellt sich die Unionsbürgerschaft als Trägerin eines eigenen gemeinsamen Kodex grundlegender Werte vor, wohin auch immer sich eine Person zur Arbeit begibt.<br><br>Das Urteil des Gerichtshofs selbst fiel erheblich enger aus und entschied den Fall auf der Grundlage der Niederlassungsfreiheit, statt einen eigenständigen grundrechtlichen Prüfungsmaßstab anzunehmen — ähnlich wie <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> den Grundrechtsschutz in eine bestehende unionsrechtliche Kategorie einfügte, statt einen eigenständigen Rechtsbehelf zu schaffen.<br><br>Die Kluft zwischen den Schlussanträgen und dem Urteil wurde zu einem Sammelpunkt für Argumente, wonach die Unionsbürgerschaft eigenständigere Rechte tragen sollte — Argumente, die spätere Urteile zur Unionsbürgerschaft, darunter <a class="case-link" onclick="jumpToCase('grzelczyk')">Grzelczyk</a> und <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Zhu und Chen</span>, in unterschiedlichen Zusammenhängen auf die Probe stellten.<br><br>Strukturell zeigt Konstantinidis, wie viel weiter ein Generalanwalt in Grundrechtsfragen manchmal zu gehen bereit war als der Gerichtshof selbst — eine Kluft, die sich später verringerte, nachdem die Charta der Grundrechte dem Gerichtshof eine festere textliche Grundlage gab, sichtbar zwei Jahrzehnte später in <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>.`,
     citations:[
       {phrase:"Ein solcher Eingriff liegt vor, wenn ein griechischer Staatsangehöriger durch die Rechtsvorschriften des Staates, in dem er niedergelassen ist, verpflichtet wird, bei der Ausübung seines Berufs eine Schreibweise seines Namens zu verwenden, die sich aus der in den Personenstandsregistern verwendeten Transliteration ableitet, sofern diese Schreibweise geeignet ist, dessen Aussprache zu verändern, und die daraus resultierende Verfälschung ihn der Gefahr aussetzt, dass potenzielle Kunden ihn mit anderen Personen verwechseln", paragraphs:"Randnr. 16", note:"Rückübersetzung aus dem verifizierten englischen Text (Randnr. 16); Deutsch ist die authentische Verfahrenssprache dieser Rechtssache, der amtliche deutsche Originalwortlaut wurde in dieser Sitzung jedoch nicht erneut eingesehen — gegen den amtlichen Text zu prüfen.", primary:true}
     ]
   },
   it:{
     abstract:{
       issue:"La Germania poteva imporre a un cittadino greco di utilizzare una traslitterazione del proprio nome che ne alterava la pronuncia e rischiava di creare confusione presso la sua clientela, senza violare la sua libertà di stabilimento?",
       rule:"È contrario all'articolo 52 del trattato che uno Stato membro imponga a un cittadino greco di utilizzare, nell'esercizio della propria professione, una grafia del proprio nome che ne modifichi la pronuncia e lo esponga a un rischio reale che la clientela lo confonda con un'altra persona.",
       application:"Il sig. Konstantinidis non poteva essere costretto a utilizzare la grafia del proprio nome traslitterata secondo la norma ISO, poiché essa ne alterava la pronuncia e rischiava di trarre in inganno la sua clientela."},
     intermediate:{
       issue:"Christos Konstantinidis, cittadino greco, lavorava ad Altensteig, in Germania, come massaggiatore e idroterapeuta autonomo.<br><br>In occasione del suo matrimonio, l'anagrafe tedesca registrò il suo nome secondo un rigoroso standard internazionale di traslitterazione, producendo una grafia che ne modificava la pronuncia e non assomigliava affatto all'originale greco.<br><br>Il sig. Konstantinidis sostenne che questa nuova grafia avrebbe confuso la sua clientela e danneggiato la reputazione professionale che aveva costruito con il proprio vero nome. Il giudice tedesco investito della causa chiese alla Corte di giustizia se il diritto dell'Unione in materia di libera circolazione avesse qualcosa da dire al riguardo.",
       rule:"La Corte dichiarò che il trattato non impedisce, in sé, a uno Stato di traslitterare un nome straniero nel proprio alfabeto.<br><br>Ma tracciò un limite: se la traslitterazione è talmente snaturante da creare un rischio reale che la clientela confonda la persona con un'altra, essa diviene un ostacolo alla libertà di tale persona di svolgere un'attività economica in un altro Stato membro.<br><br>A quel punto, l'ingerenza non è più meramente formale — rende effettivamente più difficile l'esercizio di un diritto derivante dal trattato.",
       application:"Poiché la grafia traslitterata modificava la pronuncia del nome del sig. Konstantinidis e poteva confondere potenziali clienti, la Germania non poteva imporgliene l'uso nell'esercizio della sua professione.<br><br>La soluzione adottata fu più circoscritta di quanto talvolta si ricordi: la Corte decise la causa sul terreno ordinario della libertà di stabilimento, e non come una pronuncia autonoma in materia di diritti fondamentali."},
     detailed:{
       issue:"Christos Konstantinidis, cittadino greco, lavorava come massaggiatore e assistente idroterapeuta autonomo ad Altensteig, in Germania.<br><br>In occasione del suo matrimonio, celebrato nel 1983 presso l'ufficio dello stato civile di Altensteig, il suo nome fu registrato secondo la traslitterazione richiesta da una convenzione sullo stato civile fondata sulla norma ISO 18. Ciò produsse una grafia così letterale da modificare la pronuncia effettiva del suo nome, a differenza della versione riportata sul suo passaporto e sui suoi documenti d'identità.<br><br>Il sig. Konstantinidis chiese all'ufficio anagrafico di correggere tale grafia in una che preservasse la pronuncia originaria. Giunta la controversia dinanzi all'Amtsgericht di Tubinga, quest'ultimo sottopose questioni pregiudiziali alla Corte di giustizia, chiedendo in sostanza se le disposizioni del trattato relative, tra l'altro, alla libertà di stabilimento (allora articolo 52 CEE) e alla libera prestazione di servizi (articoli 59 e 60 CEE) ostassero a tale tipo di traslitterazione.",
       rule:`Le conclusioni dell'avvocato generale Jacobs andarono oltre la stessa sentenza della Corte: egli sostenne che un cittadino comunitario che si trasferisce per lavorare in un altro Stato membro ha diritto di attendersi di essere trattato secondo un codice comune di valori fondamentali, compresi quelli sanciti dalla Convenzione europea dei diritti dell'uomo, e può invocare tale status — in un passaggio spesso riassunto con la formula «civis europeus sum» — per opporsi a qualsiasi violazione dei propri diritti fondamentali. La sentenza della Corte stessa non accolse questo ragionamento più ampio.<br><br>La Corte dichiarò invece che nulla nel trattato impedisce, in sé, a uno Stato membro di trascrivere un nome greco in caratteri latini ai fini dei propri registri di stato civile.<br><br>Ma ritenne che potesse porsi un problema attinente al trattato qualora una normativa nazionale obblighi un cittadino greco a utilizzare, nell'esercizio della propria professione, una grafia del proprio nome derivante dalla traslitterazione impiegata nei registri dello stato civile, qualora tale grafia ne modifichi la pronuncia e la distorsione che ne risulta lo esponga al rischio che potenziali clienti lo confondano con altre persone. Ciò costituisce, dichiarò la Corte, un ostacolo reale alla libertà di stabilimento ai sensi dell'articolo 52 del trattato.`,
       application:"Poiché la traslitterazione secondo la norma ISO modificava la pronuncia del nome del sig. Konstantinidis e poteva indurre potenziali clienti a confonderlo con un'altra persona, la Germania non poteva imporgli tale grafia nell'esercizio della sua professione.<br><br>La Corte lasciò al giudice nazionale il compito di stabilire, sulla base dei fatti, se la distorsione riscontrata nel caso specifico del sig. Konstantinidis raggiungesse effettivamente tale soglia."},
     holistic:`Decisa il 30 marzo 1993, la sentenza Konstantinidis è ricordata meno per ciò che la Corte effettivamente statuì che per ciò che l'avvocato generale Jacobs affermò lungo il percorso. Il passaggio «civis europeus sum» delle sue conclusioni resta una delle formule più citate di qualsiasi avvocato generale nella storia della Corte, immaginando la cittadinanza dell'Unione come portatrice di un proprio codice comune di valori fondamentali ovunque una persona si sposti per lavorare.<br><br>La sentenza della Corte fu notevolmente più circoscritta, decidendo la causa sul terreno della libertà di stabilimento anziché adottare un test autonomo fondato sui diritti fondamentali — un po' come <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> integrò la tutela dei diritti fondamentali in una categoria già esistente del diritto dell'Unione anziché creare un'autonoma via di ricorso.<br><br>Il divario tra le conclusioni e la sentenza divenne un punto di riferimento per gli argomenti secondo cui la cittadinanza dell'Unione dovrebbe portare con sé diritti più autonomi — argomenti che cause successive in materia di cittadinanza, tra cui <a class="case-link" onclick="jumpToCase('grzelczyk')">Grzelczyk</a> e <span class="case-link-pending" title="Non ancora aggiunto a Casus">Zhu e Chen</span>, avrebbero messo alla prova in contesti diversi.<br><br>Sul piano strutturale, Konstantinidis mostra quanto più lontano un avvocato generale sia stato talvolta disposto a spingersi rispetto alla Corte stessa in materia di diritti fondamentali — un divario che si ridusse in seguito, una volta che la Carta dei diritti fondamentali offrì alla Corte un fondamento testuale più solido, visibile in <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> due decenni più tardi.`,
     citations:[
       {phrase:"Una simile ingerenza si verifica quando un cittadino greco è tenuto, in forza della normativa dello Stato in cui è stabilito, a utilizzare, nell'esercizio della propria professione, una grafia del proprio nome derivante dalla traslitterazione impiegata nei registri dello stato civile, qualora tale grafia sia idonea a modificarne la pronuncia e la distorsione che ne risulta lo esponga al rischio che potenziali clienti lo confondano con altre persone", paragraphs:"punto 16", note:"Traduzione non ufficiale elaborata a partire dal testo inglese verificato (punto 16). La lingua di procedura di questa causa era il tedesco; né il testo tedesco autentico né la versione italiana ufficiale della Raccolta sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true}
     ]
   }
 }},

{id:"simmenthal-ii", name:"Simmenthal II", originalName:"Amministrazione delle Finanze dello Stato v Simmenthal SpA", citation:"Case 106/77", jurisdiction:"CJCE", themes:["Implementation / procedural autonomy","Legal order / primacy / direct effect"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Must a national court immediately set aside a national law that conflicts with EU law, or must it first wait for that law to be struck down through the national constitutional process?",
   rule:"National courts must give full effect to EU law immediately, if necessary refusing of their own motion to apply any conflicting national provision, without waiting for its prior removal by legislative or constitutional means.",
   application:"The Pretore di Susa could disapply Italy's conflicting inspection-fee legislation himself, immediately, without referring the matter to Italy's Constitutional Court first."},
 intermediate:{
   issue:"Simmenthal SpA imported beef from France into Italy. Italian law charged a public health inspection fee on the meat at the border.<br><br>Simmenthal argued this fee broke EEC rules on the common market in beef and veal. In an earlier reference (Simmenthal I), the Court of Justice had already agreed: the fee was incompatible with Community law.<br><br>The Italian tax authority still resisted. Under Italy's own Constitutional Court case law, an ordinary court could not simply set aside a national law that conflicted with Community law — only the Constitutional Court itself could strike it down, through Italy's normal constitutional-review procedure. The Pretore di Susa asked the Court of Justice whether that was compatible with Community law.",
   rule:"The Court said no. Community law's primacy and direct effect would mean little if national courts had to wait for a conflicting national law to be removed first, through legislative repeal or constitutional annulment.<br><br>Every national court, within its own jurisdiction, must apply Community law in full and protect the rights it gives to individuals. It must set aside any conflicting national provision — whether that provision came before or after the Community rule.<br><br>If necessary, the court must do this on its own initiative. It does not need to ask for, or wait for, the conflicting law to be set aside by parliament or a constitutional court first.",
   application:"The Pretore di Susa did not need to send the matter to Italy's Constitutional Court and wait for its ruling.<br><br>He could, and had to, set aside the conflicting Italian legislation himself, immediately, and apply Community law directly to Simmenthal's case."},
 detailed:{
   issue:"Simmenthal SpA imported beef from France into Italy in the 1970s. Italian legislation — consolidated public health rules updated by a 1970 measure — required a veterinary and public health inspection at the frontier, backed by a fee charged to the importer.<br><br>Simmenthal challenged the fee before the Pretore di Susa, arguing it was incompatible with the Community rules on the common organisation of the market in beef and veal, and with the Community's own harmonised system of veterinary and public health checks, which by that point left no room for a separate, unilateral national charge of this kind.<br><br>The Pretore first referred the compatibility question to the Court of Justice. In Simmenthal I (Case 35/76, 1976), the Court agreed: charges of this kind were incompatible with Community law.<br><br>Back before the Pretore, the Amministrazione delle Finanze dello Stato resisted. It relied on a line of Italian Constitutional Court case law holding that a national law conflicting with a directly applicable Community rule was not simply void — only the Constitutional Court itself, applying Article 11 of the Italian Constitution, could strike it down through Italy's ordinary constitutional-review procedure. An ordinary court, on this view, had to refer the conflict for constitutional review rather than set aside the national law itself.<br><br>The Pretore made a second reference, asking whether Community law's primacy and direct effect required a national court to give Community law immediate effect on its own authority — setting aside the conflicting national law itself — rather than waiting for it to be removed by legislative repeal or by a constitutional court's ruling.",
   rule:`The Court held that a national court's duty runs directly from the primacy of Community law. Every national court, within its own jurisdiction, must apply Community law in its entirety and protect the rights it confers on individuals, and must set aside any provision of national law that may conflict with it — whether that provision is prior or subsequent to the Community rule.<br><br>Any provision of a national legal system, or any legislative, administrative, or judicial practice, that reduced the effectiveness of Community law by withholding from the national court the power to do this at the moment of application would be incompatible with the requirements of Community law's very nature.<br><br>This would be so, the Court said, even where such an obstacle to Community law's full effect were only temporary — for instance, requiring the national court to wait for the removal of the conflicting national provision by legislative or other constitutional means, such as a reference to a constitutional court. A national court called upon, within its jurisdiction, to apply provisions of Community law is under a duty to give full effect to those provisions, if necessary refusing of its own motion to apply any conflicting provision of national legislation, without it being necessary to request or await its prior removal by legislative or other constitutional means.`,
   application:"The Pretore di Susa did not need to refer the conflict to the Corte Costituzionale and wait for a ruling on the inspection fee's constitutionality.<br><br>He was both entitled and obliged to set aside the conflicting Italian legislation immediately, of his own motion, and to apply the Community rules directly in Simmenthal's case.<br><br>This decisively rejected Italy's constitutional-review model as a precondition for giving Community law effect — the ordinary national court itself became the frontline enforcer of Community law's primacy."},
 holistic:`Simmenthal II was decided in 1978, fourteen years after <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a> first established that Community law prevails over conflicting national law. Costa answered whether Community law wins; this case answered who gets to say so, and when.<br><br>Italy's own Constitutional Court had tried to keep that power for itself, requiring ordinary courts to refer conflicts for constitutional review rather than resolve them directly. This case closed that door: any national court, not just a specialised constitutional court, must set aside conflicting national law immediately, on its own authority.<br><br>The case built directly on the reasoning in <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, which had already held that not even a state's own constitutional guarantees could override Community law. Simmenthal II turned that principle into a working rule for every national judge, in every member state, to apply themselves.<br><br>Structurally, this case is what makes primacy real in practice. Costa v ENEL said Community law wins. Simmenthal II said every national court, acting alone and immediately, is the one that must make it win.`,
 citations:[

 translations:{
   fr:{
     abstract:{
       issue:"Une juridiction nationale doit-elle écarter immédiatement une loi nationale contraire au droit communautaire, ou doit-elle d'abord attendre que cette loi soit annulée par la voie constitutionnelle interne ?",
       rule:"Les juridictions nationales doivent donner plein effet au droit communautaire immédiatement, en refusant au besoin d'office d'appliquer toute disposition nationale contraire, sans attendre son élimination préalable par voie législative ou constitutionnelle.",
       application:"Le Pretore di Susa pouvait écarter lui-même, immédiatement, la législation italienne contraire relative aux redevances d'inspection, sans saisir au préalable la Cour constitutionnelle italienne."},
     intermediate:{
       issue:"Simmenthal SpA importait de la viande bovine de France vers l'Italie. La loi italienne prévoyait une redevance d'inspection sanitaire sur cette viande au passage de la frontière.<br><br>Simmenthal soutenait que cette redevance violait les règles CEE relatives à l'organisation commune du marché de la viande bovine. Dans un premier renvoi préjudiciel (Simmenthal I), la Cour de justice avait déjà tranché en ce sens : la redevance était incompatible avec le droit communautaire.<br><br>L'administration fiscale italienne résistait néanmoins. Selon la jurisprudence de la Cour constitutionnelle italienne, un juge ordinaire ne pouvait pas simplement écarter une loi nationale contraire au droit communautaire — seule la Cour constitutionnelle pouvait l'annuler, selon la procédure constitutionnelle ordinaire. Le Pretore di Susa demanda à la Cour de justice si cette exigence était compatible avec le droit communautaire.",
       rule:"La Cour répondit par la négative. La primauté et l'effet direct du droit communautaire perdraient tout leur sens si les juridictions nationales devaient attendre l'élimination préalable d'une loi nationale contraire, par voie législative ou constitutionnelle.<br><br>Toute juridiction nationale, dans le cadre de sa compétence, doit appliquer intégralement le droit communautaire et protéger les droits qu'il confère aux particuliers. Elle doit écarter toute disposition nationale contraire, que celle-ci soit antérieure ou postérieure à la règle communautaire.<br><br>Au besoin, elle doit le faire d'office. Elle n'a pas à demander ni à attendre l'élimination préalable de la loi contraire par le législateur ou par une juridiction constitutionnelle.",
       application:"Le Pretore di Susa n'avait pas à saisir la Cour constitutionnelle italienne ni à attendre sa décision.<br><br>Il pouvait, et devait, écarter lui-même, immédiatement, la législation italienne contraire, et appliquer directement le droit communautaire au litige de Simmenthal."},
     detailed:{
       issue:"Simmenthal SpA importait de la viande bovine de France vers l'Italie dans les années 1970. La réglementation sanitaire italienne, consolidée et actualisée par une mesure de 1970, exigeait un contrôle vétérinaire et sanitaire à la frontière, assorti d'une redevance à la charge de l'importateur.<br><br>Simmenthal contesta cette redevance devant le Pretore di Susa, en faisant valoir qu'elle était incompatible avec les règles communautaires relatives à l'organisation commune du marché de la viande bovine, ainsi qu'avec le système communautaire harmonisé de contrôles vétérinaires et sanitaires, qui ne laissait plus place à une redevance nationale unilatérale de ce type.<br><br>Le Pretore saisit d'abord la Cour de justice de la question de compatibilité. Dans l'arrêt Simmenthal I (affaire 35/76, 1976), la Cour jugea que de telles redevances étaient incompatibles avec le droit communautaire.<br><br>De retour devant le Pretore, l'Amministrazione delle Finanze dello Stato résista. Elle s'appuyait sur la jurisprudence de la Cour constitutionnelle italienne, selon laquelle une loi nationale contraire à une disposition communautaire directement applicable n'était pas simplement inapplicable : seule la Cour constitutionnelle, statuant sur le fondement de l'article 11 de la Constitution italienne, pouvait l'annuler selon la procédure constitutionnelle ordinaire. Un juge ordinaire devait donc, selon cette approche, renvoyer le conflit à un contrôle de constitutionnalité plutôt que d'écarter lui-même la loi nationale.<br><br>Le Pretore forma un second renvoi, demandant si la primauté et l'effet direct du droit communautaire imposaient à une juridiction nationale de donner elle-même, immédiatement, plein effet au droit communautaire — en écartant elle-même la loi nationale contraire — plutôt que d'attendre son élimination par voie législative ou par une décision de la Cour constitutionnelle.",
       rule:`La Cour jugea que l'obligation de la juridiction nationale découle directement de la primauté du droit communautaire. Toute juridiction nationale, dans le cadre de sa compétence, doit appliquer intégralement le droit communautaire et protéger les droits qu'il confère aux particuliers, et doit écarter toute disposition de droit national qui pourrait lui être contraire, que cette disposition soit antérieure ou postérieure à la règle communautaire.<br><br>Serait incompatible avec les exigences inhérentes à la nature même du droit communautaire toute disposition d'un ordre juridique national, ou toute pratique législative, administrative ou judiciaire, qui aurait pour effet de diminuer l'efficacité du droit communautaire en refusant au juge national le pouvoir de faire, au moment même de cette application, tout ce qui est nécessaire pour écarter les dispositions législatives nationales contraires.<br><br>Il en irait ainsi, précisa la Cour, même si l'obstacle ainsi fait à la pleine efficacité du droit communautaire n'était que temporaire — par exemple si le juge national devait attendre l'élimination de la disposition nationale contraire par voie législative ou par tout autre procédé constitutionnel, tel qu'un renvoi devant une juridiction constitutionnelle. Le juge national chargé d'appliquer les dispositions du droit communautaire a l'obligation d'assurer le plein effet de ces normes en laissant au besoin inappliquée, de sa propre autorité, toute disposition contraire de la législation nationale, sans qu'il ait à demander ou à attendre l'élimination préalable de celle-ci par voie législative ou par tout autre procédé constitutionnel.`,
       application:"Le Pretore di Susa n'avait pas à renvoyer le conflit à la Cour constitutionnelle italienne ni à attendre sa décision sur la constitutionnalité de la redevance d'inspection.<br><br>Il était à la fois habilité et tenu d'écarter lui-même, d'office et immédiatement, la législation italienne contraire, et d'appliquer directement les règles communautaires au litige de Simmenthal.<br><br>Cet arrêt écarta clairement le modèle italien de contrôle constitutionnel comme condition préalable à l'effectivité du droit communautaire — le juge national ordinaire devint lui-même le premier garant de la primauté du droit communautaire."},
     holistic:`L'arrêt Simmenthal II a été rendu en 1978, quatorze ans après que <a class="case-link" onclick="jumpToCase('costaenel')">Costa contre ENEL</a> a établi que le droit communautaire prime sur le droit national contraire. Costa répondait à la question de savoir si le droit communautaire l'emporte ; cet arrêt répond à celle de savoir qui peut le constater, et à quel moment.<br><br>La Cour constitutionnelle italienne avait tenté de conserver ce pouvoir pour elle-même, en exigeant que les juges ordinaires renvoient les conflits à un contrôle de constitutionnalité plutôt que de les trancher directement. Cet arrêt ferma cette voie : toute juridiction nationale, et non la seule juridiction constitutionnelle, doit écarter immédiatement la loi nationale contraire, de sa propre autorité.<br><br>L'arrêt s'appuie directement sur le raisonnement retenu dans <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, qui avait déjà jugé que même les garanties constitutionnelles propres à un État ne pouvaient primer sur le droit communautaire. Simmenthal II transforma ce principe en une règle opérationnelle, applicable par chaque juge national, dans chaque État membre.<br><br>Sur le plan structurel, cet arrêt rend la primauté effective en pratique. Costa contre ENEL a dit que le droit communautaire l'emporte. Simmenthal II a dit que c'est à chaque juge national, seul et immédiatement, de le faire prévaloir.`,

   de:{
     abstract:{
       issue:"Muss ein nationales Gericht ein unionsrechtswidriges nationales Gesetz sofort unangewendet lassen, oder muss es zunächst abwarten, bis dieses Gesetz auf verfassungsrechtlichem Weg beseitigt wird?",
       rule:"Nationale Gerichte müssen dem Unionsrecht sofort volle Wirkung verschaffen und dabei nötigenfalls von sich aus jede entgegenstehende nationale Vorschrift unangewendet lassen, ohne deren vorherige Beseitigung auf gesetzgeberischem oder verfassungsrechtlichem Weg abzuwarten.",
       application:"Der Pretore di Susa durfte die entgegenstehende italienische Regelung über die Untersuchungsgebühren selbst und sofort unangewendet lassen, ohne zuvor das italienische Verfassungsgericht anzurufen."},
     intermediate:{
       issue:"Simmenthal SpA importierte Rindfleisch aus Frankreich nach Italien. Das italienische Recht sah eine Gebühr für die gesundheitspolizeiliche Untersuchung dieses Fleisches an der Grenze vor.<br><br>Simmenthal machte geltend, diese Gebühr verstoße gegen die EWG-Vorschriften über die gemeinsame Marktorganisation für Rindfleisch. In einem ersten Vorabentscheidungsverfahren (Simmenthal I) hatte der Gerichtshof dem bereits zugestimmt: Die Gebühr war mit dem Gemeinschaftsrecht unvereinbar.<br><br>Die italienische Finanzverwaltung leistete dennoch Widerstand. Nach der Rechtsprechung des italienischen Verfassungsgerichts durfte ein ordentliches Gericht ein unionsrechtswidriges nationales Gesetz nicht einfach unangewendet lassen — nur das Verfassungsgericht selbst konnte es im ordentlichen verfassungsrechtlichen Verfahren für nichtig erklären. Der Pretore di Susa fragte den Gerichtshof, ob dies mit dem Gemeinschaftsrecht vereinbar sei.",
       rule:"Der Gerichtshof verneinte dies. Vorrang und unmittelbare Wirkung des Gemeinschaftsrechts wären bedeutungslos, müssten nationale Gerichte erst die vorherige Beseitigung eines entgegenstehenden nationalen Gesetzes abwarten, sei es auf gesetzgeberischem oder verfassungsrechtlichem Weg.<br><br>Jedes nationale Gericht muss im Rahmen seiner Zuständigkeit das Gemeinschaftsrecht vollständig anwenden und die Rechte schützen, die es dem Einzelnen verleiht. Es muss jede entgegenstehende nationale Vorschrift unangewendet lassen — gleich ob diese vor oder nach der Gemeinschaftsvorschrift erlassen wurde.<br><br>Nötigenfalls muss es dies von sich aus tun. Es muss die vorherige Beseitigung der entgegenstehenden Vorschrift durch den Gesetzgeber oder ein Verfassungsgericht weder beantragen noch abwarten.",
       application:"Der Pretore di Susa musste die Sache nicht dem italienischen Verfassungsgericht vorlegen und dessen Entscheidung abwarten.<br><br>Er durfte und musste die entgegenstehende italienische Regelung selbst, sofort, unangewendet lassen und das Gemeinschaftsrecht unmittelbar auf den Fall Simmenthal anwenden."},
     detailed:{
       issue:"Simmenthal SpA importierte in den 1970er Jahren Rindfleisch aus Frankreich nach Italien. Die italienische Gesundheitsregelung, konsolidiert und durch eine Maßnahme von 1970 aktualisiert, verlangte eine veterinär- und gesundheitspolizeiliche Untersuchung an der Grenze, verbunden mit einer vom Importeur zu tragenden Gebühr.<br><br>Simmenthal focht diese Gebühr vor dem Pretore di Susa an und machte geltend, sie sei mit den gemeinschaftsrechtlichen Vorschriften über die gemeinsame Marktorganisation für Rindfleisch sowie mit dem harmonisierten gemeinschaftlichen System veterinär- und gesundheitspolizeilicher Kontrollen unvereinbar, das für eine einseitige nationale Gebühr dieser Art keinen Raum mehr lasse.<br><br>Der Pretore legte die Vereinbarkeitsfrage zunächst dem Gerichtshof vor. Im Urteil Simmenthal I (Rechtssache 35/76, 1976) entschied der Gerichtshof, dass derartige Gebühren mit dem Gemeinschaftsrecht unvereinbar seien.<br><br>Vor dem Pretore leistete die Amministrazione delle Finanze dello Stato weiterhin Widerstand. Sie stützte sich auf die Rechtsprechung des italienischen Verfassungsgerichts, wonach ein nationales Gesetz, das einer unmittelbar anwendbaren Gemeinschaftsvorschrift entgegensteht, nicht einfach unanwendbar sei — nur das Verfassungsgericht könne es, gestützt auf Artikel 11 der italienischen Verfassung, im ordentlichen verfassungsrechtlichen Verfahren für nichtig erklären. Ein ordentliches Gericht müsse den Konflikt daher der Verfassungskontrolle vorlegen, statt das nationale Gesetz selbst unangewendet zu lassen.<br><br>Der Pretore legte eine zweite Frage vor: ob Vorrang und unmittelbare Wirkung des Gemeinschaftsrechts es erforderten, dass ein nationales Gericht dem Gemeinschaftsrecht selbst, sofort und aus eigener Befugnis volle Wirkung verschafft — indem es die entgegenstehende nationale Vorschrift selbst unangewendet lässt — statt deren Beseitigung durch den Gesetzgeber oder eine Entscheidung des Verfassungsgerichts abzuwarten.",
       rule:`Der Gerichtshof entschied, dass sich die Pflicht des nationalen Gerichts unmittelbar aus dem Vorrang des Gemeinschaftsrechts ergibt. Jedes nationale Gericht muss im Rahmen seiner Zuständigkeit das Gemeinschaftsrecht vollständig anwenden und die Rechte schützen, die es dem Einzelnen verleiht, und muss jede nationale Vorschrift unangewendet lassen, die ihm entgegenstehen könnte, gleich ob diese Vorschrift vor oder nach der Gemeinschaftsvorschrift erlassen wurde.<br><br>Mit den sich aus dem Wesen des Gemeinschaftsrechts ergebenden Erfordernissen wäre jede Bestimmung einer nationalen Rechtsordnung oder jede gesetzgeberische, administrative oder gerichtliche Praxis unvereinbar, die die Wirksamkeit des Gemeinschaftsrechts dadurch mindern würde, dass sie dem für dessen Anwendung zuständigen nationalen Gericht die Befugnis abspräche, im Zeitpunkt dieser Anwendung alles Erforderliche zu tun, um entgegenstehende nationale Rechtsvorschriften unangewendet zu lassen.<br><br>Dies gelte, so der Gerichtshof, selbst dann, wenn das Hindernis für die volle Wirksamkeit des Gemeinschaftsrechts nur vorübergehender Art wäre — etwa wenn das nationale Gericht die Beseitigung der entgegenstehenden nationalen Vorschrift auf gesetzgeberischem Weg oder durch ein anderes verfassungsrechtliches Verfahren, wie die Vorlage an ein Verfassungsgericht, abwarten müsste. Das mit der Anwendung des Gemeinschaftsrechts betraute nationale Gericht ist verpflichtet, dessen volle Wirksamkeit zu gewährleisten, indem es nötigenfalls aus eigener Entscheidungsbefugnis jede entgegenstehende Bestimmung des nationalen Rechts unangewendet lässt, ohne dass es deren vorherige Beseitigung auf gesetzgeberischem Weg oder durch ein anderes verfassungsrechtliches Verfahren beantragen oder abwarten müsste.`,
       application:"Der Pretore di Susa musste den Konflikt nicht dem italienischen Verfassungsgericht vorlegen und dessen Entscheidung über die Verfassungsmäßigkeit der Untersuchungsgebühr abwarten.<br><br>Er war sowohl berechtigt als auch verpflichtet, die entgegenstehende italienische Regelung von sich aus, sofort, unangewendet zu lassen und die gemeinschaftsrechtlichen Vorschriften unmittelbar auf den Fall Simmenthal anzuwenden.<br><br>Damit lehnte der Gerichtshof das italienische Modell der Verfassungskontrolle als Vorbedingung für die Wirksamkeit des Gemeinschaftsrechts eindeutig ab — das ordentliche nationale Gericht selbst wurde zum ersten Hüter des Vorrangs des Gemeinschaftsrechts."},
     holistic:`Simmenthal II erging 1978, vierzehn Jahre nachdem <a class="case-link" onclick="jumpToCase('costaenel')">Costa/ENEL</a> erstmals feststellte, dass Gemeinschaftsrecht entgegenstehendem nationalem Recht vorgeht. Costa beantwortete die Frage, ob das Gemeinschaftsrecht vorgeht; dieses Urteil beantwortete die Frage, wer das feststellen darf, und wann.<br><br>Das italienische Verfassungsgericht hatte versucht, dieses Recht für sich zu behalten, indem es von ordentlichen Gerichten verlangte, Konflikte der Verfassungskontrolle vorzulegen, statt sie selbst zu entscheiden. Dieses Urteil verschloss diesen Weg: Jedes nationale Gericht, nicht nur ein spezialisiertes Verfassungsgericht, muss entgegenstehendes nationales Recht sofort und aus eigener Befugnis unangewendet lassen.<br><br>Das Urteil baute unmittelbar auf der Begründung in <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> auf, die bereits entschieden hatte, dass selbst die eigenen verfassungsrechtlichen Garantien eines Staates dem Gemeinschaftsrecht nicht vorgehen können. Simmenthal II machte aus diesem Grundsatz eine praktisch anwendbare Regel für jeden nationalen Richter, in jedem Mitgliedstaat.<br><br>Strukturell ist dieses Urteil das, was den Vorrang in der Praxis wirksam macht. Costa/ENEL sagte, das Gemeinschaftsrecht gehe vor. Simmenthal II sagte, dass es an jedem nationalen Gericht allein liegt, dies sofort durchzusetzen.`,

   it:{
     abstract:{
       issue:"Un giudice nazionale deve disapplicare immediatamente una legge nazionale contrastante con il diritto dell'Unione, oppure deve prima attendere che tale legge venga rimossa attraverso il procedimento costituzionale nazionale?",
       rule:"I giudici nazionali devono garantire piena efficacia al diritto dell'Unione immediatamente, disapplicando all'occorrenza di propria iniziativa qualsiasi disposizione nazionale contrastante, senza attendere la sua previa rimozione per via legislativa o costituzionale.",
       application:"Il Pretore di Susa poteva disapplicare egli stesso, immediatamente, la normativa italiana contrastante sui diritti di visita sanitaria, senza dover prima rimettere la questione alla Corte costituzionale italiana."},
     intermediate:{
       issue:"La Simmenthal SpA importava carne bovina dalla Francia in Italia. La normativa italiana imponeva sulla carne, alla frontiera, un diritto per la visita sanitaria.<br><br>La Simmenthal sosteneva che tale diritto violasse le norme CEE sull'organizzazione comune del mercato delle carni bovine. In un precedente rinvio (Simmenthal I), la Corte di giustizia aveva già concordato: il diritto era incompatibile con il diritto comunitario.<br><br>L'amministrazione finanziaria italiana continuava tuttavia a resistere. Secondo la giurisprudenza della stessa Corte costituzionale italiana, un giudice ordinario non poteva semplicemente disapplicare una legge nazionale contrastante con il diritto comunitario — solo la Corte costituzionale poteva dichiararla invalida, attraverso il normale procedimento italiano di controllo di costituzionalità. Il Pretore di Susa chiese alla Corte di giustizia se ciò fosse compatibile con il diritto comunitario.",
       rule:"La Corte rispose negativamente. Il primato e l'effetto diretto del diritto comunitario avrebbero avuto scarso significato se i giudici nazionali avessero dovuto attendere che una legge nazionale contrastante fosse prima rimossa, tramite abrogazione legislativa o annullamento costituzionale.<br><br>Ogni giudice nazionale, nell'ambito della propria competenza, deve applicare integralmente il diritto comunitario e tutelare i diritti che esso attribuisce ai singoli. Deve disapplicare qualsiasi disposizione nazionale contrastante — sia essa anteriore o successiva alla norma comunitaria.<br><br>Se necessario, il giudice deve farlo di propria iniziativa. Non deve chiedere, né attendere, che la legge contrastante venga prima rimossa dal parlamento o da una corte costituzionale.",
       application:"Il Pretore di Susa non doveva rimettere la questione alla Corte costituzionale italiana e attenderne la pronuncia.<br><br>Egli poteva, e doveva, disapplicare egli stesso, immediatamente, la normativa italiana contrastante, e applicare direttamente il diritto comunitario al caso Simmenthal."},
     detailed:{
       issue:"Negli anni Settanta la Simmenthal SpA importava carne bovina dalla Francia in Italia. La normativa italiana — un testo unico sanitario aggiornato da un provvedimento del 1970 — richiedeva un controllo veterinario e sanitario alla frontiera, accompagnato da un diritto posto a carico dell'importatore.<br><br>La Simmenthal impugnò tale diritto dinanzi al Pretore di Susa, sostenendo che fosse incompatibile con le norme comunitarie sull'organizzazione comune del mercato delle carni bovine, nonché con il sistema comunitario ormai armonizzato di controlli veterinari e sanitari, che a quel punto non lasciava alcuno spazio a un onere nazionale unilaterale di tale natura.<br><br>Il Pretore sottopose dapprima la questione di compatibilità alla Corte di giustizia. Nella sentenza Simmenthal I (causa 35/76, 1976), la Corte concordò: oneri di tale natura erano incompatibili con il diritto comunitario.<br><br>Tornata dinanzi al Pretore, l'Amministrazione delle finanze dello Stato continuò a resistere. Essa si fondava su un orientamento della Corte costituzionale italiana secondo cui una legge nazionale contrastante con una norma comunitaria direttamente applicabile non era semplicemente inefficace — solo la Corte costituzionale stessa, applicando l'articolo 11 della Costituzione italiana, poteva dichiararla invalida attraverso l'ordinario procedimento italiano di controllo di costituzionalità. Un giudice ordinario, secondo tale impostazione, doveva rimettere il conflitto al controllo di costituzionalità anziché disapplicare esso stesso la legge nazionale.<br><br>Il Pretore effettuò un secondo rinvio, chiedendo se il primato e l'effetto diretto del diritto comunitario imponessero a un giudice nazionale di dare immediata efficacia al diritto comunitario di propria autorità — disapplicando esso stesso la legge nazionale contrastante — anziché attendere che essa fosse rimossa per abrogazione legislativa o per pronuncia di una corte costituzionale.",
       rule:`La Corte dichiarò che l'obbligo del giudice nazionale discende direttamente dal primato del diritto comunitario. Ogni giudice nazionale, nell'ambito della propria competenza, ha l'obbligo di applicare integralmente il diritto comunitario e di tutelare i diritti che questo attribuisce ai singoli, disapplicando le disposizioni eventualmente contrastanti della legge interna, sia essa anteriore o successiva alla norma comunitaria.<br><br>Sarebbe incompatibile con le esigenze inerenti alla natura stessa del diritto comunitario qualsiasi disposizione di un ordinamento giuridico nazionale, ovvero qualsiasi prassi legislativa, amministrativa o giudiziaria, che riducesse l'efficacia del diritto comunitario per il fatto di negare al giudice, competente ad applicare questo diritto, il potere di fare, all'atto stesso di tale applicazione, tutto quanto necessario per disapplicare le disposizioni legislative nazionali contrastanti.<br><br>Ciò varrebbe, dichiarò la Corte, anche se un simile ostacolo alla piena efficacia del diritto comunitario fosse soltanto temporaneo — ad esempio, se si imponesse al giudice nazionale di attendere la previa rimozione della disposizione nazionale contrastante in via legislativa o mediante qualsiasi altro procedimento costituzionale, quale il rinvio a una corte costituzionale. Il giudice nazionale, incaricato di applicare, nell'ambito della propria competenza, le disposizioni di diritto comunitario, ha l'obbligo di garantire la piena efficacia di tali norme, disapplicando all'occorrenza, di propria iniziativa, qualsiasi disposizione contrastante della legislazione nazionale, anche posteriore, senza doverne chiedere o attendere la previa rimozione in via legislativa o mediante qualsiasi altro procedimento costituzionale.`,
       application:"Il Pretore di Susa non doveva rimettere il conflitto alla Corte costituzionale e attenderne la pronuncia sulla costituzionalità del diritto di visita sanitaria.<br><br>Egli aveva sia la facoltà sia l'obbligo di disapplicare immediatamente, di propria iniziativa, la normativa italiana contrastante, e di applicare direttamente le norme comunitarie al caso Simmenthal.<br><br>Ciò respinse in modo decisivo il modello italiano di controllo di costituzionalità quale condizione preliminare per dare efficacia al diritto comunitario — il giudice nazionale ordinario divenne esso stesso il primo garante del primato del diritto comunitario."},
     holistic:`Simmenthal II fu decisa nel 1978, quattordici anni dopo che <a class="case-link" onclick="jumpToCase('costaenel')">Costa contro ENEL</a> aveva stabilito per la prima volta che il diritto comunitario prevale sul diritto nazionale contrastante. Costa rispose alla domanda se il diritto comunitario prevalga; questa causa rispose alla domanda su chi possa affermarlo, e quando.<br><br>La Corte costituzionale italiana aveva cercato di riservare a sé stessa tale potere, imponendo ai giudici ordinari di rimettere i conflitti al controllo di costituzionalità anziché risolverli direttamente. Questa causa chiuse quella via: ogni giudice nazionale, non soltanto una corte costituzionale specializzata, deve disapplicare immediatamente, di propria autorità, il diritto nazionale contrastante.<br><br>La causa si fondò direttamente sul ragionamento di <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, che aveva già stabilito che nemmeno le garanzie costituzionali proprie di uno Stato potessero prevalere sul diritto comunitario. Simmenthal II trasformò tale principio in una regola operativa che ogni giudice nazionale, in ogni Stato membro, doveva applicare da sé.<br><br>Sul piano strutturale, questa causa è ciò che rende il primato effettivo nella pratica. Costa contro ENEL affermò che il diritto comunitario prevale. Simmenthal II affermò che spetta a ogni giudice nazionale, agendo da solo e immediatamente, farlo prevalere.`,
     citations:[
       {phrase:"il giudice nazionale, incaricato di applicare, nell'ambito della propria competenza, le disposizioni di diritto comunitario, ha l'obbligo di garantire la piena efficacia di tali norme, disapplicando all'occorrenza, di propria iniziativa, qualsiasi disposizione contrastante della legislazione nazionale, anche posteriore, senza doverne chiedere o attendere la previa rimozione in via legislativa o mediante qualsiasi altro procedimento costituzionale", paragraphs:"punto 24", note:"Testo italiano autentico (l'italiano era la lingua della causa), reperito tramite fonte secondaria (giurcost.org) che riporta la sentenza; il recupero diretto del testo primario su EUR-Lex non è stato ritentato in questa sessione.", primary:true},
