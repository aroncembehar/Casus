<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Casus — EU case law</title>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
<style>
  :root{
    --red:#6E1B24; --red-dark:#4F1219; --gold:#C9A227; --gold-light:#F0DFC0;
    --cream:#FDFBF6; --white:#FFFFFF; --blue:#2E7BAE; --blue-light:#EAF4FB;
    --ink:#3A362F; --muted:#5B564C; --line:#E4DCC8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;}
  header{background:var(--red);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold);}
  header .logo{color:var(--cream);font-size:20px;font-family:'Averia Serif Libre',serif;cursor:pointer;}
  nav{display:flex;align-items:center;gap:4px;background:var(--white);border-bottom:1px solid var(--line);padding:0 28px;min-height:38px;}
  nav button{background:none;border:none;padding:10px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-family:'Inter',sans-serif;}
  nav button.active{color:var(--red);border-bottom-color:var(--gold);font-weight:500;}
  nav .nav-toggle{padding:10px 0;color:var(--muted);font-size:13px;cursor:pointer;}
  main{max-width:760px;margin:0 auto;padding:28px;}
  body.home-bg{background:var(--red);}
  .home-bg .hero-sub{color:#F7DCDC;}
  .home-bg .progress-line{color:#F0C2C2;}
  .home-bg .field-label{color:#F5D2D2;}
  .search-row{display:flex;align-items:center;gap:16px;}
  .search-row .filter-field{flex:1;margin-bottom:0;}
  .cat-mascot{width:150px;height:81px;flex-shrink:0;}
  h1{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:24px;font-weight:400;margin:0 0 16px;}
  h3{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:16px;font-weight:400;margin:0 0 10px;}
  .hero{text-align:center;padding:12px 0 6px;}
  .hero-rule{width:52px;height:3px;background:var(--gold);margin:0 auto 14px;}
  .hero-sub{color:var(--muted);font-size:15px;margin:0;}
  .progress-line{text-align:center;color:var(--muted);font-size:12.5px;margin:10px 0 20px;}
  .field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .filter-field{margin-bottom:10px;position:relative;}
  .filter-field input[type=text]{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--white);color:var(--ink);}
  .filter-field.big input[type=text]{padding:17px 20px;font-size:16.5px;}
  .filter-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .section-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
  .section-card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:20px;cursor:pointer;}
  .section-card .t{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:18px;margin-bottom:6px;}
  .section-card .d{color:var(--muted);font-size:13px;}
  .section-card:hover{border-left-color:var(--blue);}
  .card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:14px 18px;margin-bottom:10px;}
  .card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .card .name{color:var(--red);font-size:16px;font-family:'Averia Serif Libre',serif;}
  .card .cite{color:var(--blue);font-size:12px;white-space:nowrap;}
  .detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.75;}
  .detail b{color:var(--red);}
  .citable{cursor:text;}
  .citable::selection, .citable *::selection{background:var(--gold-light);}
  .case-link{color:var(--blue);cursor:pointer;text-decoration:underline;}
  .case-link:hover{color:var(--red);}
  .case-link-pending{color:var(--muted);border-bottom:1px dashed var(--muted);cursor:help;}
  .theme-tag{display:inline-block;font-size:11px;color:var(--gold);background:#FBF3DD;border:1px solid var(--gold-light);padding:2px 8px;border-radius:10px;margin-top:8px;}
  .legacy-tag{display:inline-block;font-size:11px;color:var(--muted);background:transparent;border:1px dashed var(--line);padding:2px 8px;border-radius:10px;margin-top:8px;}
  .jurisdiction-badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:0.02em;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:middle;}
  .jurisdiction-badge.jur-cjce,.jurisdiction-badge.jur-cjue{color:#1d4e8f;background:#E4ECF7;}
  .jurisdiction-badge.jur-couredh{color:#6b3fa0;background:#EFE6F7;}
  .jurisdiction-badge.jur-bverfge{color:#a03434;background:#F7E6E6;}
  .jurisdiction-badge.jur-atf{color:#2f7d4f;background:#E4F2E9;}
  .jurisdiction-badge.jur-ag{color:#7a6a3a;background:#F5EFDD;font-style:italic;}
  .level-tabs{display:flex;align-items:center;gap:6px;margin-top:10px;}
  .lvl-btn{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:12px;cursor:pointer;}
  .lvl-btn.active{background:var(--red);color:var(--cream);border-color:var(--red);}
  .dots{display:inline-flex;gap:4px;margin-left:auto;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;}
  .dot.filled{background:var(--blue);}
  .legal-basis{margin-top:10px;font-size:12px;}
  .lb-label{color:var(--muted);margin-right:6px;}
  .article-chip{display:inline-block;font-size:12px;color:var(--blue);background:var(--blue-light);border-radius:12px;padding:3px 10px;margin:2px 4px 2px 0;cursor:pointer;}
  .advanced-hint{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:8px;}
  .theme-block{margin-bottom:22px;}
  .theme-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .theme-head span.t{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:17px;}
  .theme-head span.n{font-size:12px;color:var(--muted);}
  .theme-body{padding-top:12px;}
  .diag-block{margin-bottom:18px;}
  .diag-head{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .diag-head .t{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:17px;}
  .diag-head .n{font-size:12px;color:var(--muted);}
  .diagram-detail{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:14px 18px;margin-top:10px;}
  .diagram-detail .row{display:flex;justify-content:space-between;}
  .diagram-detail .name{color:var(--red);font-family:'Averia Serif Libre',serif;font-size:16px;}
  .diagram-detail .cite{color:var(--blue);font-size:12px;}
  .week-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;}
  .week-nav .arrow{cursor:pointer;color:var(--red);font-size:18px;padding:2px 10px;user-select:none;}
  .week-nav .range{color:var(--muted);font-size:13px;}
  .day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px;}
  .day-pill{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;}
  .day-pill.active{border-color:var(--red);background:#FBF0EC;}
  .day-pill .dn{font-size:11px;color:var(--muted);}
  .day-pill .dd{font-size:15px;color:var(--ink);font-family:'Averia Serif Libre',serif;}
  .day-pill .mark{width:5px;height:5px;border-radius:50%;background:var(--gold);margin:4px auto 0;}
  .agenda-page{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 20px;}
  .agenda-date{font-family:'Averia Serif Libre',serif;color:var(--red);font-size:17px;margin-bottom:10px;}
  .case-log{margin-top:16px;}
  .case-log-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
  .case-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--white);font-size:13px;color:var(--muted);cursor:pointer;}
  .chip.active{background:var(--blue);color:var(--blue-light);border-color:var(--blue);}
  .suggestions{background:var(--white);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;}
  .suggestion{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .suggestion:last-child{border-bottom:none;}
  .suggestion:hover{background:var(--blue-light);}
  .exam-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .exam-row input{accent-color:var(--blue);}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
  .col h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin:0 0 8px;font-family:'Inter',sans-serif;}
  .col .item{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink);}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:10px 0;}
  textarea.agenda{
    width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;
    padding:14px 20px 14px 56px;font-family:'Inter',sans-serif;font-size:14.5px;line-height:28px;
    color:var(--ink);resize:vertical;background-attachment:local;
    background-image:
      linear-gradient(to right, transparent 40px, rgba(110,27,36,0.28) 40px, rgba(110,27,36,0.28) 41px, transparent 41px),
      repeating-linear-gradient(#FFFFFF, #FFFFFF 27px, var(--line) 27px, var(--line) 28px);
  }
  #citation-popup{position:fixed;display:none;width:270px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(58,54,47,0.18);z-index:1100;}
  .cp-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .cp-item{padding:8px 0;border-top:1px solid var(--line);}
  .cp-item:first-child{border-top:none;padding-top:0;}
  .cp-para{font-size:12.5px;font-weight:500;color:var(--ink);}
  .cp-item.primary .cp-para{color:var(--red);}
  .cp-note{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .modal-overlay{position:fixed;inset:0;background:rgba(58,54,47,0.45);display:none;align-items:center;justify-content:center;z-index:1200;padding:20px;}
  .modal-card{background:var(--white);border-radius:12px;padding:22px 24px;max-width:420px;width:100%;max-height:80vh;overflow:auto;position:relative;}
  .modal-close{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:14px;}
  .changed-banner{background:#FBF3DD;border:1px solid var(--gold-light);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin:12px 0;line-height:1.6;}
  .article-links{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .article-links a{color:var(--blue);font-size:13px;}
</style>
</head>

const CASES = [
{id:"costaenel", name:"Costa v ENEL", originalName:"Flaminio Costa contro E.N.E.L.", citation:"Case 6/64", jurisdiction:"CJCE", themes:["Legal order / primacy / direct effect"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Could Italy's later nationalisation law override its earlier obligations under the EEC Treaty?",
   rule:"Community law, once in force, forms an integral part of the legal systems of the member states and takes precedence over their national law, including later national legislation.",
   application:"The Italian court could not apply the ordinary 'later law prevails' rule to give the nationalisation statute priority over the EEC Treaty."},
 intermediate:{
   issue:"Italy nationalised its electricity sector in 1962. Flaminio Costa held shares in a company swept into that nationalisation.<br><br>He disputed a small bill from ENEL, the new state monopoly. Costa argued the nationalisation law broke several EEC Treaty rules.<br><br>Under ordinary Italian law, a later statute simply overrides an earlier one. So the 1962 nationalisation law would beat Italy's 1957 law bringing in the EEC Treaty.",
   rule:"The Court disagreed with that ordinary approach. The EEC Treaty was not like an ordinary international treaty.<br><br>It created its own legal system. Once in force, that system became part of every member state's own legal order. It bound national courts directly.<br><br>By joining the Community, states had given up some of their sovereign powers. This applied across ever-wider areas. States could not then pass a later law and let it override this shared legal system.",
   application:"Community law could not be overridden by domestic rules, however those rules were framed. So the Italian court could not use its usual 'later law wins' approach here.<br><br>The nationalisation statute could not take priority over the earlier Treaty."},
 detailed:{
   issue:"Flaminio Costa was a small shareholder in Edison Volta, a company absorbed into Italy's 1962 nationalisation of the electricity sector.<br><br>Costa disputed a modest bill from ENEL, the new state monopoly. He argued the nationalisation law broke EEC Treaty rules on competition and state monopolies.<br><br>Italy's own Constitutional Court had already ruled on this, weeks earlier. It said ordinary statutory interpretation applied: a later Italian law simply displaces an earlier one. So the 1962 statute would win over Italy's 1957 law bringing in the Treaty.<br><br>The Milan magistrate still referred questions to the Court of Justice, asking for an interpretation of the Treaty articles said to be infringed, under Article 177 EEC.",
   rule:`The Court's answer went further than expected. It said the Community had unlimited duration, its own institutions, and real powers.<br><br>These powers came from a limitation of sovereignty. Member states had transferred some of their own powers to the Community. This meant they had limited their sovereign rights, in ever wider fields.<br><br>This created a body of law binding on states and on their people. Because of this special and original nature, the law could not be overridden by domestic rules — however those rules were framed.<br><br>Overriding EU law this way would strip it of its character as Community law. It would also call into question the Community's own legal basis.`,
   application:"The Italian court could not use its 'later law wins' rule here. It could not let the nationalisation statute override the earlier Treaty.<br><br>One detail worth noting: the Treaty of Lisbon never wrote primacy into the Treaties as an article. It only added a Declaration recalling this judgment.<br><br>Primacy remains a principle the Court itself created — never codified as a Treaty rule."},
 holistic:`Costa v ENEL was decided in 1964, just a year after <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> (1963) established that EU law can create rights individuals rely on directly. Together, these two cases form the twin foundations of EU constitutional law. Van Gend en Loos said EU law reaches people directly. Costa said that where EU law conflicts with national law, EU law wins.<br><br>Later cases pushed primacy further. <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> extended it to survive conflicts with a member state's own constitutional fundamental rights — the hardest test for the doctrine. <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> later required national courts to set aside conflicting national law themselves, immediately, without waiting for a domestic court to strike it down first.<br><br>Even fifty years on, the tension Costa created is still alive. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> shows the same basic question — EU law versus a member state's own higher standards — playing out today under the modern Charter of Fundamental Rights.<br><br>Structurally, primacy is one of two pillars holding up the whole EU legal order, alongside direct effect. Neither is written into the Treaties as an article. Both are judge-made.`,
 citations:[
   {phrase:"could not be overridden by domestic legal provisions, however framed, without being deprived of its character as Community law", paragraphs:"[1964] ECR 585, at pp. 593–594 (this judgment predates paragraph numbering)", note:"The core primacy holding — cited by page, since paragraph numbering wasn't yet standard practice in 1964.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"L'Italie pouvait-elle, par une loi de nationalisation postérieure, faire échec à ses engagements antérieurs découlant du traité CEE ?",
       rule:"Le droit communautaire, une fois entré en vigueur, fait partie intégrante des systèmes juridiques des États membres et prime sur leur droit national, y compris une législation nationale postérieure.",
       application:"Le juge italien ne pouvait pas appliquer la règle ordinaire « la loi postérieure prévaut » pour faire primer la loi de nationalisation sur le traité CEE."},
     intermediate:{
       issue:"L'Italie a nationalisé son secteur électrique en 1962. Flaminio Costa détenait des actions d'une société touchée par cette nationalisation.<br><br>Il contesta une petite facture d'électricité émise par ENEL, le nouveau monopole d'État. Costa soutenait que la loi de nationalisation violait plusieurs dispositions du traité CEE.<br><br>Selon le droit italien ordinaire, une loi postérieure l'emporte simplement sur une loi antérieure. La loi de 1962 aurait donc dû l'emporter sur la loi italienne de 1957 ayant incorporé le traité CEE.",
       rule:"La Cour a écarté cette approche ordinaire. Le traité CEE n'était pas un traité international comme les autres.<br><br>Il a créé un ordre juridique propre. Une fois en vigueur, cet ordre est devenu partie intégrante de l'ordre juridique de chaque État membre. Il liait directement les juridictions nationales.<br><br>En adhérant à la Communauté, les États avaient renoncé à une partie de leurs pouvoirs souverains, dans un domaine toujours plus large. Ils ne pouvaient donc plus adopter une loi postérieure qui prévaudrait sur cet ordre juridique commun.",
       application:"Le droit communautaire ne pouvait pas être écarté par des règles nationales, quelle que soit leur forme. Le juge italien ne pouvait donc pas appliquer sa règle habituelle « la loi postérieure prévaut ». La loi de nationalisation ne pouvait pas primer sur le traité antérieur."},
     detailed:{
       issue:"Flaminio Costa était un petit actionnaire d'Edison Volta, une société absorbée par la nationalisation du secteur électrique italien en 1962.<br><br>Costa contesta une facture modeste émise par ENEL, le nouveau monopole d'État, en soutenant que la loi de nationalisation violait des dispositions du traité CEE relatives à la concurrence et aux monopoles d'État.<br><br>La Cour constitutionnelle italienne avait déjà jugé, quelques semaines plus tôt, que l'interprétation ordinaire des lois s'appliquait : une loi italienne postérieure déplace simplement une loi antérieure. La loi de 1962 devait donc l'emporter sur la loi de 1957 incorporant le traité.<br><br>Le juge de paix de Milan a néanmoins saisi la Cour de justice, sur le fondement de l'article 177 CEE, de questions portant sur l'interprétation des articles du traité prétendument violés.",
       rule:`La réponse de la Cour est allée plus loin qu'attendu. Elle a jugé que la Communauté, instituée pour une durée illimitée, dotée d'institutions propres et de pouvoirs réels découlant d'une limitation de souveraineté ou d'un transfert d'attributions des États vers la Communauté, impliquait que les États membres avaient limité leurs droits souverains, dans des domaines certes limités, et créé un corps de droit liant aussi bien leurs ressortissants qu'eux-mêmes.<br><br>En raison de cette nature propre et originale, le droit issu du traité ne pouvait pas se voir opposer des dispositions internes, quelle que soit leur forme, sans perdre son caractère communautaire et sans que la base juridique même de la Communauté ne soit remise en cause.`,
       application:"Le juge italien ne pouvait pas appliquer sa règle « la loi postérieure prévaut » pour faire primer la loi de nationalisation sur le traité antérieurement incorporé.<br><br>Un détail à noter : le traité de Lisbonne n'a jamais inscrit la primauté dans les traités sous forme d'article. Il s'est contenté d'ajouter une déclaration rappelant cet arrêt.<br><br>La primauté demeure un principe forgé par la Cour elle-même, jamais codifié comme règle du traité."},
     holistic:`Costa contre ENEL a été rendu en 1964, un an seulement après <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> (1963), qui avait établi que le droit de l'Union peut créer des droits que les particuliers peuvent invoquer directement. Ensemble, ces deux arrêts forment les deux piliers du droit constitutionnel de l'Union.<br><br>Des arrêts ultérieurs ont poussé la primauté plus loin. <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> l'a étendue pour qu'elle résiste même à un conflit avec les droits fondamentaux constitutionnels propres à un État membre — l'épreuve la plus difficile pour cette doctrine. <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> a ensuite exigé que les juridictions nationales écartent elles-mêmes, immédiatement, le droit national contraire.<br><br>Même cinquante ans plus tard, la tension créée par Costa demeure vive. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> illustre la même question fondamentale, transposée aujourd'hui dans le cadre de la Charte des droits fondamentaux.<br><br>Sur le plan structurel, la primauté constitue l'un des deux piliers de tout l'ordre juridique de l'Union, aux côtés de l'effet direct. Aucun des deux n'est inscrit dans les traités. Tous deux sont d'origine prétorienne.`,
     citations:[
       {phrase:"ne pouvait pas se voir opposer des dispositions internes, quelle que soit leur forme", paragraphs:"[1964] Rec. 585, p. 593-594 (cet arrêt est antérieur à la numérotation par paragraphe)", note:"La formulation centrale sur la primauté — citée par page, la numérotation par paragraphe n'étant pas encore en usage en 1964.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Konnte Italien mit einem späteren Verstaatlichungsgesetz seine früheren Verpflichtungen aus dem EWG-Vertrag außer Kraft setzen?",
       rule:"Gemeinschaftsrecht wird nach seinem Inkrafttreten fester Bestandteil der Rechtsordnungen der Mitgliedstaaten und geht ihrem nationalen Recht vor, auch späterem nationalen Recht.",
       application:"Das italienische Gericht durfte nicht die gewöhnliche Regel „späteres Gesetz geht vor“ anwenden, um dem Verstaatlichungsgesetz Vorrang vor dem EWG-Vertrag einzuräumen."},
     intermediate:{
       issue:"Italien verstaatlichte 1962 seinen Elektrizitätssektor. Flaminio Costa hielt Aktien an einem davon betroffenen Unternehmen.<br><br>Er focht eine kleine Stromrechnung von ENEL, dem neuen Staatsmonopol, an. Costa machte geltend, das Verstaatlichungsgesetz verstoße gegen mehrere Bestimmungen des EWG-Vertrags.<br><br>Nach gewöhnlichem italienischem Recht verdrängt ein späteres Gesetz einfach ein früheres. Das Gesetz von 1962 hätte damit das italienische Gesetz von 1957, mit dem der EWG-Vertrag umgesetzt wurde, verdrängen müssen.",
       rule:"Der Gerichtshof lehnte diesen gewöhnlichen Ansatz ab. Der EWG-Vertrag war kein gewöhnlicher völkerrechtlicher Vertrag.<br><br>Er schuf eine eigene Rechtsordnung. Mit ihrem Inkrafttreten wurde diese Bestandteil der Rechtsordnung jedes Mitgliedstaats und band die nationalen Gerichte unmittelbar.<br><br>Mit dem Beitritt zur Gemeinschaft hatten die Staaten einen Teil ihrer souveränen Rechte abgegeben, in einem immer weiteren Bereich. Sie konnten daher nicht später ein Gesetz erlassen, das dieser gemeinsamen Rechtsordnung vorginge.",
       application:"Gemeinschaftsrecht konnte nicht durch innerstaatliche Vorschriften verdrängt werden, gleich in welcher Form. Das italienische Gericht durfte daher nicht seine übliche Regel „späteres Gesetz geht vor“ anwenden. Das Verstaatlichungsgesetz konnte dem früheren Vertrag nicht vorgehen."},
     detailed:{
       issue:"Flaminio Costa war ein Kleinaktionär der Edison Volta, eines Unternehmens, das 1962 von der Verstaatlichung des italienischen Elektrizitätssektors erfasst wurde.<br><br>Costa focht eine bescheidene Rechnung von ENEL, dem neuen Staatsmonopol, an und machte geltend, das Verstaatlichungsgesetz verstoße gegen Bestimmungen des EWG-Vertrags über Wettbewerb und staatliche Monopole.<br><br>Der italienische Verfassungsgerichtshof hatte wenige Wochen zuvor bereits entschieden, dass die gewöhnliche Gesetzesauslegung gelte: Ein späteres italienisches Gesetz verdränge schlicht ein früheres. Das Gesetz von 1962 sollte damit das Gesetz von 1957, mit dem der Vertrag umgesetzt wurde, verdrängen.<br><br>Der Friedensrichter von Mailand legte dem Gerichtshof dennoch Fragen zur Auslegung der angeblich verletzten Vertragsartikel vor, gestützt auf Artikel 177 EWG.",
       rule:`Die Antwort des Gerichtshofs ging weiter als erwartet. Er entschied, dass die Gemeinschaft, auf unbegrenzte Zeit gegründet, mit eigenen Organen und echten Hoheitsrechten ausgestattet, die aus einer Beschränkung der Souveränität oder einer Übertragung von Befugnissen der Staaten auf die Gemeinschaft herrühren, bedeutet, dass die Mitgliedstaaten ihre souveränen Rechte, wenn auch in begrenzten Bereichen, eingeschränkt und einen Rechtskörper geschaffen haben, der sowohl ihre Angehörigen als auch sie selbst bindet.<br><br>Gerade wegen dieser besonderen und ursprünglichen Natur konnte dem aus dem Vertrag hervorgegangenen Recht keine wie auch immer geartete innerstaatliche Vorschrift entgegengesetzt werden, ohne dass es seinen Charakter als Gemeinschaftsrecht verlöre und ohne dass die Rechtsgrundlage der Gemeinschaft selbst in Frage gestellt würde.`,
       application:"Das italienische Gericht durfte seine Regel „späteres Gesetz geht vor“ nicht anwenden, um dem Verstaatlichungsgesetz Vorrang vor dem zuvor umgesetzten Vertrag einzuräumen.<br><br>Bemerkenswert: Der Vertrag von Lissabon hat den Vorrang nie als eigenen Artikel in die Verträge aufgenommen, sondern nur eine Erklärung hinzugefügt, die an dieses Urteil erinnert.<br><br>Der Vorrang bleibt ein vom Gerichtshof selbst geschaffener Grundsatz, niemals als Vertragsregel kodifiziert."},
     holistic:`Costa/ENEL erging 1964, nur ein Jahr nach <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> (1963), das feststellte, dass Unionsrecht Rechte schaffen kann, auf die sich Einzelne unmittelbar berufen können. Zusammen bilden diese beiden Urteile die zwei Säulen des EU-Verfassungsrechts.<br><br>Spätere Urteile trieben den Vorrang weiter voran. <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> dehnte ihn so aus, dass er sogar einen Konflikt mit den verfassungsrechtlichen Grundrechten eines Mitgliedstaats übersteht — die härteste Bewährungsprobe für diese Doktrin. <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> verlangte später, dass nationale Gerichte entgegenstehendes nationales Recht selbst und sofort unangewendet lassen.<br><br>Auch fünfzig Jahre später ist die von Costa geschaffene Spannung noch lebendig. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> zeigt dieselbe Grundfrage, heute im Rahmen der Grundrechtecharta.<br><br>Strukturell ist der Vorrang eine von zwei Säulen der gesamten EU-Rechtsordnung, neben der unmittelbaren Wirkung. Keine von beiden ist als Artikel in die Verträge aufgenommen. Beide sind richterrechtlich geschaffen.`,
     citations:[
       {phrase:"konnte dem aus dem Vertrag hervorgegangenen Recht keine wie auch immer geartete innerstaatliche Vorschrift entgegengesetzt werden", paragraphs:"[1964] Slg. 585, S. 593-594 (dieses Urteil liegt vor der Randnummer-Nummerierung)", note:"Die zentrale Aussage zum Vorrang — nach Seite zitiert, da 1964 die Nummerierung nach Randnummern noch nicht üblich war.", primary:true}
     ]
   },
   it:{
     abstract:{
       issue:"L'Italia poteva, con una legge di nazionalizzazione successiva, far venir meno i propri obblighi anteriori derivanti dal trattato CEE?",
       rule:"Il diritto comunitario, una volta entrato in vigore, entra a far parte integrante degli ordinamenti giuridici degli Stati membri e prevale sul loro diritto nazionale, compresa la legislazione nazionale successiva.",
       application:"Il giudice italiano non poteva applicare la regola ordinaria «legge posteriore prevale» per far prevalere la legge di nazionalizzazione sul trattato CEE."},
     intermediate:{
       issue:"L'Italia nazionalizzò il settore elettrico nel 1962. Flaminio Costa deteneva azioni di una società coinvolta in quella nazionalizzazione.<br><br>Egli contestò una piccola fattura dell'ENEL, il nuovo ente statale monopolistico. Costa sosteneva che la legge di nazionalizzazione violasse diverse disposizioni del trattato CEE.<br><br>Secondo il diritto italiano ordinario, una legge successiva prevale semplicemente su una anteriore. La legge di nazionalizzazione del 1962 avrebbe quindi dovuto prevalere sulla legge italiana del 1957 di esecuzione del trattato CEE.",
       rule:"La Corte non condivise questo approccio ordinario. Il trattato CEE non era un trattato internazionale come gli altri.<br><br>Esso ha istituito un proprio ordinamento giuridico. Una volta entrato in vigore, tale ordinamento è divenuto parte integrante dell'ordinamento giuridico di ciascuno Stato membro. Esso vincolava direttamente i giudici nazionali.<br><br>Aderendo alla Comunità, gli Stati avevano rinunciato a una parte dei propri poteri sovrani, in un ambito sempre più esteso. Non potevano dunque adottare successivamente una legge che prevalesse su questo ordinamento comune.",
       application:"Il diritto comunitario non poteva essere accantonato da norme nazionali, quale che fosse la loro forma. Il giudice italiano non poteva quindi applicare la sua regola abituale «legge posteriore prevale». La legge di nazionalizzazione non poteva prevalere sul trattato anteriore."},
     detailed:{
       issue:"Flaminio Costa era un piccolo azionista della Edison Volta, società assorbita dalla nazionalizzazione del settore elettrico italiano disposta nel 1962 dalla legge n. 1643.<br><br>Costa contestò una modesta fattura dell'ENEL, il nuovo ente statale monopolistico, sostenendo che la legge di nazionalizzazione violasse disposizioni del trattato CEE in materia di concorrenza e di monopoli statali.<br><br>La Corte costituzionale italiana aveva già deciso, poche settimane prima, che si applicasse l'ordinaria interpretazione delle leggi: una legge italiana successiva sostituisce semplicemente una legge anteriore. La legge del 1962 avrebbe dunque dovuto prevalere sulla legge del 1957 di esecuzione del trattato.<br><br>Il giudice conciliatore di Milano rinviò comunque alla Corte di giustizia, ai sensi dell'articolo 177 CEE, questioni relative all'interpretazione degli articoli del trattato che si assumevano violati.",
       rule:`La risposta della Corte andò oltre quanto atteso. Essa affermò che la Comunità, istituita per una durata illimitata, dotata di proprie istituzioni e di poteri reali derivanti da una limitazione di competenza o da un trasferimento di attribuzioni degli Stati alla Comunità, comportava che gli Stati membri, sia pure entro ambiti circoscritti, avessero limitato i propri diritti sovrani, creando così un complesso di diritto vincolante sia per i loro cittadini sia per essi stessi.<br><br>Proprio in ragione di questa sua natura specifica e originale, il diritto nato dal trattato non poteva trovare un limite in qualsiasi provvedimento interno, senza perdere il proprio carattere comunitario e senza che ne risultasse scosso il fondamento giuridico della stessa Comunità.`,
       application:"Il giudice italiano non poteva applicare la sua regola «legge posteriore prevale» per far prevalere la legge di nazionalizzazione sul trattato in precedenza eseguito.<br><br>Un dettaglio degno di nota: il trattato di Lisbona non ha mai inserito il primato nei trattati come un articolo autonomo. Vi ha soltanto aggiunto una dichiarazione che richiama questa sentenza.<br><br>Il primato resta un principio elaborato dalla Corte stessa, mai codificato come regola del trattato."},
     holistic:`Costa contro ENEL fu decisa nel 1964, appena un anno dopo <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> (1963), che aveva stabilito che il diritto dell'Unione può creare diritti direttamente invocabili dai singoli. Insieme, queste due sentenze costituiscono i due pilastri gemelli del diritto costituzionale dell'Unione. Van Gend en Loos affermò che il diritto dell'Unione raggiunge direttamente le persone. Costa affermò che, in caso di conflitto tra diritto dell'Unione e diritto nazionale, prevale il primo.<br><br>Sentenze successive hanno spinto oltre il primato. <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> lo ha esteso fino a farlo resistere a un conflitto con i diritti fondamentali costituzionali propri di uno Stato membro — la prova più severa per questa dottrina. <a class="case-link" onclick="jumpToCase('simmenthal-ii')">Simmenthal II</a> ha poi imposto ai giudici nazionali di disapplicare essi stessi, immediatamente, il diritto nazionale contrastante, senza attendere che un giudice interno lo dichiarasse prima invalido.<br><br>Anche cinquant'anni dopo, la tensione creata da Costa resta viva. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> mostra la stessa questione fondamentale — diritto dell'Unione contro standard nazionali più elevati — riproporsi oggi nell'ambito della moderna Carta dei diritti fondamentali.<br><br>Sul piano strutturale, il primato è uno dei due pilastri su cui poggia l'intero ordinamento giuridico dell'Unione, accanto all'effetto diretto. Nessuno dei due è scritto nei trattati come articolo. Entrambi sono di origine pretoria.`,
     citations:[
       {phrase:"il diritto nato dal Trattato non potrebbe, in ragione appunto della sua specifica natura, trovare un limite in qualsiasi provvedimento interno senza perdere il proprio carattere comunitario e senza che ne risultasse scosso il fondamento giuridico della stessa Comunità", paragraphs:"[1964] Racc. 585, pp. 593-594 circa (sentenza anteriore alla numerazione per punti)", note:"Testo italiano autentico (l'italiano era la lingua della causa), reperito tramite fonte secondaria che cita la sentenza; il recupero diretto del testo primario su EUR-Lex non è riuscito (pagina restituita vuota) — segnalato secondo la convenzione adottata. Numero di pagina della Raccolta italiana non verificato autonomamente in questa sessione, ripreso per coerenza da quello usato nella versione francese.", primary:true}
     ]
   }
 }},

{id:"handelsgesellschaft", name:"Internationale Handelsgesellschaft", originalName:"Internationale Handelsgesellschaft mbH gegen Einfuhr- und Vorratsstelle für Getreide und Futtermittel", citation:"Case 11/70", jurisdiction:"CJCE", themes:["Fundamental rights","National constitutional identity","Legal order / primacy / direct effect"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Can a company challenge the validity of an EU measure by invoking fundamental rights guaranteed under its own national constitution?",
   rule:"The validity of EU measures can only be judged in the light of EU law itself, not national constitutional law — but respect for fundamental rights is itself part of EU law's general principles.",
   application:"Germany's constitutional fundamental-rights guarantees could not be used to override the validity of the EU licensing system, though the Court checked the system against fundamental rights as an EU-law matter anyway."},
 intermediate:{
   issue:"The Common Agricultural Policy required a licence to export cereals, backed by a deposit. If the export wasn't completed in time, the exporter lost the deposit.<br><br>Internationale Handelsgesellschaft lost its deposit this way. The company argued this system broke its right to freely run a business — a right protected by the German Basic Law, Germany's constitution.<br><br>A German court asked the Court of Justice a bigger question: can an EU rule be struck down for breaking a national constitution?",
   rule:"The Court said no, not directly. An EU measure's validity can only be judged against EU law itself.<br><br>Using national law, even constitutional law, would break the uniform and effective application of EU law. So national constitutions cannot invalidate EU rules on their own.<br><br>But the Court added something important: respect for fundamental rights is itself part of EU law's general principles, inspired by the constitutions common to member states. Fundamental rights protection didn't disappear — it just moved inside EU law itself.",
   application:"Germany's constitutional guarantees could not, by themselves, strike down the EU licensing system.<br><br>But the Court still checked the system against fundamental rights, as a matter of EU law, and found no violation. The deposit system was a proportionate way to manage agricultural markets."},
 detailed:{
   issue:"A German company, Internationale Handelsgesellschaft, exported cereals under the Common Agricultural Policy. This required an EU export licence, backed by a deposit.<br><br>The company failed to complete its exports within the licence's validity period, and forfeited its deposit as a result.<br><br>Before the Verwaltungsgericht Frankfurt, the company argued the system was disproportionate — that it broke its freedom to run a business and its freedom of disposition, both rights from the German Basic Law.<br><br>The German court referred the question of the EU measure's validity to the Court of Justice, under Article 177 EEC.",
   rule:`The Court held that EU law is an independent source of law. Because of its very nature, it cannot be overridden by national rules, however those rules are framed.<br><br>Doing so would strip EU law of its character as EU law, and call the Community's own legal basis into question. So the validity of an EU measure can only be judged against EU law itself — including against national fundamental rights, even ones written into a national constitution.<br><br>But the Court immediately balanced this: respect for fundamental rights is itself part of EU law's general principles, inspired by the constitutional traditions common to the member states. Protecting them must fit within the Community's own structure and goals.<br><br>This was the Court's first clear statement that primacy is not blind to fundamental rights. It built its own fundamental rights review directly into EU law — a move widely read as pre-empting national courts, especially Germany's own constitutional court, from claiming their own review power over EU measures.`,
   application:"The German court could not use the Basic Law's fundamental rights guarantees to directly challenge the EU system's validity.<br><br>But the Court of Justice still examined the deposit system against fundamental rights protected within EU law itself, and found it necessary and proportionate for managing agricultural markets — not a violation."},
 holistic:`This case came in 1970, six years after <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a> first established primacy. Handelsgesellschaft answered the question Costa left open: does primacy survive a clash with a state's own constitutional rights, not just an ordinary law?<br><br>Germany's own Constitutional Court didn't accept this straight away. In its <a class="case-link" onclick="jumpToCase('solange-i')">Solange I</a> and <a class="case-link" onclick="jumpToCase('solange-ii')">Solange II</a> decisions, it agreed to accept EU primacy only 'as long as' (Solange, in German) EU rights protection stayed adequate — later relaxing this once satisfied the EU offered real protection.<br><br>The tension this case raised never fully closed. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> revisits the exact same question decades later, this time under the Charter of Fundamental Rights rather than unwritten general principles.<br><br>This case effectively built the EU's own unwritten bill of rights — later written down properly in the Charter of Fundamental Rights, agreed in 2000 and made legally binding in 2009.`,
 citations:[
   {phrase:"respect for fundamental rights forms an integral part of the general principles of law protected by the Court of Justice", paragraphs:"para. 4", note:"The foundational statement that fundamental rights are themselves part of EU law's general principles — independently confirmed by later Advocate General opinions citing this exact paragraph.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Une entreprise peut-elle contester la validité d'une mesure de l'Union en invoquant des droits fondamentaux garantis par sa propre constitution nationale ?",
       rule:"La validité des actes de l'Union ne peut être appréciée qu'au regard du droit de l'Union lui-même, et non du droit constitutionnel national — mais le respect des droits fondamentaux fait lui-même partie des principes généraux du droit de l'Union.",
       application:"Les garanties constitutionnelles allemandes en matière de droits fondamentaux ne pouvaient être invoquées pour remettre en cause la validité du système de licences de l'Union, bien que la Cour ait néanmoins examiné ce système au regard des droits fondamentaux en tant que question relevant du droit de l'Union."},
     intermediate:{
       issue:"La politique agricole commune exigeait une licence pour exporter des céréales, garantie par une caution. Si l'exportation n'était pas réalisée dans les délais, l'exportateur perdait cette caution.<br><br>Internationale Handelsgesellschaft perdit sa caution de cette manière. L'entreprise soutint que ce système portait atteinte à sa liberté d'exercer une activité économique — un droit protégé par la Loi fondamentale allemande, la constitution de l'Allemagne.<br><br>Une juridiction allemande posa à la Cour de justice une question plus vaste : une règle de l'Union peut-elle être invalidée pour violation d'une constitution nationale ?",
       rule:"La Cour répondit par la négative, du moins directement. La validité d'un acte de l'Union ne peut être appréciée qu'au regard du droit de l'Union lui-même.<br><br>Recourir au droit national, fût-il constitutionnel, compromettrait l'application uniforme et effective du droit de l'Union. Les constitutions nationales ne peuvent donc, à elles seules, invalider des règles de l'Union.<br><br>Mais la Cour ajouta un élément essentiel : le respect des droits fondamentaux fait lui-même partie des principes généraux du droit de l'Union, inspirés des traditions constitutionnelles communes aux États membres. La protection des droits fondamentaux ne disparaissait pas — elle se déplaçait simplement à l'intérieur du droit de l'Union lui-même.",
       application:"Les garanties constitutionnelles allemandes ne pouvaient, à elles seules, invalider le système de licences de l'Union.<br><br>Mais la Cour examina néanmoins ce système au regard des droits fondamentaux, en tant que question de droit de l'Union, et ne constata aucune violation. Le système de caution constituait un moyen proportionné de gérer les marchés agricoles."},
     detailed:{
       issue:"Une entreprise allemande, Internationale Handelsgesellschaft, exportait des céréales dans le cadre de la politique agricole commune. Cette activité nécessitait une licence d'exportation de l'Union, garantie par une caution.<br><br>L'entreprise n'ayant pas réalisé ses exportations dans le délai de validité de la licence, elle perdit sa caution.<br><br>Devant le Verwaltungsgericht de Francfort, l'entreprise soutint que ce système était disproportionné — qu'il portait atteinte à sa liberté d'exercer une activité économique et à sa liberté de disposition, deux droits garantis par la Loi fondamentale allemande.<br><br>La juridiction allemande posa à la Cour de justice, sur le fondement de l'article 177 CEE, la question de la validité de la mesure de l'Union.",
       rule:`La Cour jugea que le droit de l'Union constitue une source de droit autonome. En raison même de sa nature, il ne saurait être primé par des règles nationales, quelle que soit la forme sous laquelle celles-ci se présentent.<br><br>Une telle solution priverait le droit communautaire de son caractère de droit communautaire et remettrait en cause le fondement juridique même de la Communauté. La validité d'un acte de l'Union ne peut donc être appréciée qu'au regard du droit de l'Union lui-même — y compris au regard de droits fondamentaux nationaux, fussent-ils inscrits dans une constitution nationale.<br><br>Mais la Cour tempéra aussitôt cette affirmation : le respect des droits fondamentaux fait partie intégrante des principes généraux du droit communautaire, dont la Cour assure le respect en s'inspirant des traditions constitutionnelles communes aux États membres. Leur protection doit s'inscrire dans le cadre de la structure et des objectifs propres de la Communauté.<br><br>Ce fut la première affirmation nette, par la Cour, que la primauté n'ignore pas les droits fondamentaux. Elle intégra ainsi son propre contrôle des droits fondamentaux directement au sein du droit de l'Union — une démarche largement interprétée comme visant à devancer les juridictions nationales, en particulier la Cour constitutionnelle allemande elle-même, dans toute prétention à exercer leur propre contrôle sur les actes de l'Union.`,
       application:"La juridiction allemande ne pouvait invoquer directement les garanties de droits fondamentaux de la Loi fondamentale pour contester la validité du système de l'Union.<br><br>Mais la Cour de justice examina néanmoins le système de caution au regard des droits fondamentaux protégés au sein du droit de l'Union lui-même, et le jugea nécessaire et proportionné à la gestion des marchés agricoles — non constitutif d'une violation."},
     holistic:`Cet arrêt fut rendu en 1970, six ans après que <a class="case-link" onclick="jumpToCase('costaenel')">Costa contre ENEL</a> eut établi pour la première fois le principe de primauté. Handelsgesellschaft répondit à la question que Costa avait laissée ouverte : la primauté résiste-t-elle à un conflit avec les droits constitutionnels propres d'un État, et non plus seulement avec une loi ordinaire ?<br><br>La Cour constitutionnelle allemande elle-même n'accepta pas cette solution d'emblée. Dans ses décisions <a class="case-link" onclick="jumpToCase('solange-i')">Solange I</a> et <a class="case-link" onclick="jumpToCase('solange-ii')">Solange II</a>, elle accepta la primauté du droit de l'Union seulement « tant que » (Solange, en allemand) la protection des droits fondamentaux par l'Union resterait adéquate — assouplissant plus tard cette position une fois convaincue que l'Union offrait une protection réelle.<br><br>La tension soulevée par cet arrêt ne s'est jamais entièrement résorbée. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> revient sur exactement la même question des décennies plus tard, cette fois sous l'empire de la Charte des droits fondamentaux plutôt que des principes généraux non écrits.<br><br>Cet arrêt a en pratique construit la propre déclaration des droits non écrite de l'Union — consignée plus tard, en bonne et due forme, dans la Charte des droits fondamentaux, adoptée en 2000 et rendue juridiquement contraignante en 2009.`,
     citations:[
       {phrase:"le respect des droits fondamentaux fait partie intégrante des principes généraux du droit dont la Cour de justice assure le respect", paragraphs:"point 4", note:"Traduction non officielle établie à partir du texte anglais vérifié (point 4). La langue de procédure de cette affaire était l'allemand ; ni le texte allemand authentique ni la version française officielle du Recueil n'ont pu être consultés dans cette session — à vérifier contre le texte officiel.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Kann sich ein Unternehmen auf Grundrechte berufen, die ihm seine eigene nationale Verfassung garantiert, um die Gültigkeit einer Unionsmaßnahme in Frage zu stellen?",
       rule:"Die Gültigkeit von Unionsmaßnahmen kann nur am Maßstab des Unionsrechts selbst beurteilt werden, nicht am Maßstab nationalen Verfassungsrechts — die Wahrung der Grundrechte gehört jedoch selbst zu den allgemeinen Rechtsgrundsätzen des Unionsrechts.",
       application:"Die grundrechtlichen Verbürgungen der deutschen Verfassung konnten nicht herangezogen werden, um die Gültigkeit des unionsrechtlichen Lizenzsystems in Frage zu stellen, obwohl der Gerichtshof dieses System dennoch am Maßstab der Grundrechte als unionsrechtliche Frage prüfte."},
     intermediate:{
       issue:"Die Gemeinsame Agrarpolitik verlangte für die Ausfuhr von Getreide eine Lizenz, die durch eine Kaution abgesichert war. Wurde die Ausfuhr nicht fristgerecht durchgeführt, verfiel die Kaution des Ausführers.<br><br>Die Internationale Handelsgesellschaft verlor auf diese Weise ihre Kaution. Das Unternehmen machte geltend, dieses System verletze seine Freiheit der wirtschaftlichen Betätigung — ein durch das deutsche Grundgesetz geschütztes Recht.<br><br>Ein deutsches Gericht legte dem Gerichtshof eine weiterreichende Frage vor: Kann eine unionsrechtliche Regelung wegen Verstoßes gegen eine nationale Verfassung für ungültig erklärt werden?",
       rule:"Der Gerichtshof verneinte dies, jedenfalls unmittelbar. Die Gültigkeit einer Unionsmaßnahme kann nur am Maßstab des Unionsrechts selbst beurteilt werden.<br><br>Der Rückgriff auf nationales Recht, selbst Verfassungsrecht, würde die einheitliche und wirksame Anwendung des Unionsrechts beeinträchtigen. Nationale Verfassungen können daher unionsrechtliche Regelungen nicht für sich allein ungültig machen.<br><br>Der Gerichtshof fügte jedoch etwas Wesentliches hinzu: Die Wahrung der Grundrechte gehört selbst zu den allgemeinen Rechtsgrundsätzen des Unionsrechts, inspiriert von den gemeinsamen Verfassungsüberlieferungen der Mitgliedstaaten. Der Grundrechtsschutz verschwand nicht — er verlagerte sich lediglich in das Unionsrecht selbst.",
       application:"Die grundrechtlichen Verbürgungen der deutschen Verfassung konnten das unionsrechtliche Lizenzsystem nicht für sich allein zu Fall bringen.<br><br>Der Gerichtshof prüfte das System dennoch als unionsrechtliche Frage am Maßstab der Grundrechte und stellte keinen Verstoß fest. Das Kautionssystem war ein verhältnismäßiges Mittel zur Steuerung der Agrarmärkte."},
     detailed:{
       issue:"Ein deutsches Unternehmen, die Internationale Handelsgesellschaft, exportierte Getreide im Rahmen der Gemeinsamen Agrarpolitik. Dies erforderte eine unionsrechtliche Ausfuhrlizenz, die durch eine Kaution abgesichert war.<br><br>Das Unternehmen führte seine Ausfuhren nicht innerhalb der Gültigkeitsdauer der Lizenz durch und verlor infolgedessen seine Kaution.<br><br>Vor dem Verwaltungsgericht Frankfurt machte das Unternehmen geltend, das System sei unverhältnismäßig — es verletze seine Freiheit der wirtschaftlichen Betätigung und seine Verfügungsfreiheit, beides Rechte aus dem deutschen Grundgesetz.<br><br>Das deutsche Gericht legte dem Gerichtshof gemäß Artikel 177 EWG die Frage der Gültigkeit der Unionsmaßnahme vor.",
       rule:`Der Gerichtshof entschied, dass das Gemeinschaftsrecht eine eigenständige Rechtsquelle darstellt. Aufgrund seiner Natur kann es nicht durch nationale Vorschriften, gleich welcher Art, verdrängt werden.<br><br>Andernfalls würde dem Gemeinschaftsrecht sein Rechtscharakter genommen und die Rechtsgrundlage der Gemeinschaft selbst in Frage gestellt. Die Gültigkeit einer Unionsmaßnahme kann daher nur am Maßstab des Unionsrechts selbst beurteilt werden — auch am Maßstab nationaler Grundrechte, selbst wenn diese in einer nationalen Verfassung verankert sind.<br><br>Der Gerichtshof relativierte dies jedoch sogleich: Die Wahrung der Grundrechte gehört zu den allgemeinen Rechtsgrundsätzen des Gemeinschaftsrechts, deren Wahrung der Gerichtshof zu sichern hat, wobei er sich von den gemeinsamen Verfassungsüberlieferungen der Mitgliedstaaten leiten lässt. Ihr Schutz muss sich in die Struktur und die Ziele der Gemeinschaft einfügen.<br><br>Dies war die erste klare Aussage des Gerichtshofs, dass der Vorrang des Unionsrechts die Grundrechte nicht ausblendet. Der Gerichtshof integrierte damit seine eigene Grundrechtsprüfung unmittelbar in das Unionsrecht — ein Schritt, der weithin als Versuch verstanden wurde, nationalen Gerichten, insbesondere dem deutschen Bundesverfassungsgericht selbst, zuvorzukommen, die eine eigene Prüfungsbefugnis über Unionsmaßnahmen beanspruchen könnten.`,
       application:"Das deutsche Gericht konnte die grundrechtlichen Verbürgungen des Grundgesetzes nicht unmittelbar heranziehen, um die Gültigkeit des Unionssystems anzugreifen.<br><br>Der Gerichtshof prüfte das Kautionssystem dennoch am Maßstab der im Unionsrecht selbst geschützten Grundrechte und hielt es für die Steuerung der Agrarmärkte für erforderlich und verhältnismäßig — nicht für einen Verstoß."},
     holistic:`Dieses Urteil erging 1970, sechs Jahre nachdem <a class="case-link" onclick="jumpToCase('costaenel')">Costa/ENEL</a> erstmals den Grundsatz des Vorrangs etabliert hatte. Handelsgesellschaft beantwortete die von Costa offengelassene Frage: Übersteht der Vorrang auch einen Konflikt mit den eigenen verfassungsrechtlichen Rechten eines Staates, nicht nur mit einem gewöhnlichen Gesetz?<br><br>Das deutsche Bundesverfassungsgericht selbst akzeptierte dies nicht sogleich. In seinen Entscheidungen <a class="case-link" onclick="jumpToCase('solange-i')">Solange I</a> und <a class="case-link" onclick="jumpToCase('solange-ii')">Solange II</a> erkannte es den Vorrang des Unionsrechts nur „solange" an, wie der unionsrechtliche Grundrechtsschutz angemessen blieb — eine Haltung, die es später lockerte, nachdem es von einem tatsächlichen Schutzniveau der Union überzeugt war.<br><br>Die durch dieses Urteil aufgeworfene Spannung löste sich nie vollständig auf. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> greift Jahrzehnte später genau dieselbe Frage wieder auf, diesmal unter der Charta der Grundrechte anstelle ungeschriebener allgemeiner Rechtsgrundsätze.<br><br>Dieses Urteil errichtete faktisch die eigene ungeschriebene Grundrechtecharta der Union — später ordentlich niedergelegt in der Charta der Grundrechte, die 2000 vereinbart und 2009 rechtsverbindlich wurde.`,
     citations:[
       {phrase:"die Wahrung der Grundrechte gehört zu den allgemeinen Rechtsgrundsätzen des Rechts, deren Wahrung der Gerichtshof zu sichern hat", paragraphs:"Randnr. 4", note:"Inoffizielle Übersetzung des verifizierten englischen Textes (Randnr. 4). Die Verfahrenssprache dieser Rechtssache war Deutsch; der authentische deutsche Wortlaut konnte in dieser Sitzung nicht eigenständig verifiziert werden — gegen den amtlichen Text zu prüfen.", primary:true}
     ]
   },
   it:{
     abstract:{
       issue:"Un'impresa può contestare la validità di un atto dell'Unione invocando diritti fondamentali garantiti dalla propria costituzione nazionale?",
       rule:"La validità degli atti dell'Unione può essere valutata soltanto alla luce del diritto dell'Unione stesso, non del diritto costituzionale nazionale — ma il rispetto dei diritti fondamentali fa esso stesso parte dei principi generali del diritto dell'Unione.",
       application:"Le garanzie costituzionali tedesche in materia di diritti fondamentali non potevano essere invocate per rimettere in discussione la validità del sistema di licenze dell'Unione, sebbene la Corte abbia comunque esaminato tale sistema alla luce dei diritti fondamentali quale questione di diritto dell'Unione."},
     intermediate:{
       issue:"La politica agricola comune richiedeva una licenza per esportare cereali, garantita da una cauzione. Se l'esportazione non veniva completata nei termini, l'esportatore perdeva la cauzione.<br><br>La Internationale Handelsgesellschaft perse la propria cauzione in questo modo. L'impresa sostenne che tale sistema violasse la sua libertà di svolgere un'attività economica — un diritto tutelato dalla Legge fondamentale tedesca, la costituzione della Germania.<br><br>Un giudice tedesco pose alla Corte di giustizia una questione più ampia: una norma dell'Unione può essere invalidata perché contraria a una costituzione nazionale?",
       rule:"La Corte rispose negativamente, almeno direttamente. La validità di un atto dell'Unione può essere valutata soltanto alla luce del diritto dell'Unione stesso.<br><br>Ricorrere al diritto nazionale, anche costituzionale, comprometterebbe l'applicazione uniforme ed effettiva del diritto dell'Unione. Le costituzioni nazionali non possono dunque, da sole, invalidare norme dell'Unione.<br><br>Ma la Corte aggiunse un elemento essenziale: il rispetto dei diritti fondamentali fa esso stesso parte dei principi generali del diritto dell'Unione, ispirati alle tradizioni costituzionali comuni agli Stati membri. La tutela dei diritti fondamentali non scompariva — si spostava semplicemente all'interno del diritto dell'Unione stesso.",
       application:"Le garanzie costituzionali tedesche non potevano, da sole, invalidare il sistema di licenze dell'Unione.<br><br>Ma la Corte esaminò comunque tale sistema alla luce dei diritti fondamentali, quale questione di diritto dell'Unione, e non riscontrò alcuna violazione. Il sistema della cauzione costituiva un mezzo proporzionato per gestire i mercati agricoli."},
     detailed:{
       issue:"Un'impresa tedesca, la Internationale Handelsgesellschaft, esportava cereali nell'ambito della politica agricola comune. Tale attività richiedeva una licenza di esportazione dell'Unione, garantita da una cauzione.<br><br>L'impresa non completò le proprie esportazioni entro il periodo di validità della licenza, perdendo di conseguenza la cauzione.<br><br>Dinanzi al Verwaltungsgericht di Francoforte, l'impresa sostenne che il sistema fosse sproporzionato — che violasse la sua libertà di svolgere un'attività economica e la sua libertà di disposizione, entrambi diritti garantiti dalla Legge fondamentale tedesca.<br><br>Il giudice tedesco sottopose alla Corte di giustizia, ai sensi dell'articolo 177 CEE, la questione della validità dell'atto dell'Unione.",
       rule:`La Corte dichiarò che il diritto dell'Unione costituisce una fonte di diritto autonoma. In ragione della sua stessa natura, esso non può essere subordinato a norme nazionali, qualunque sia la forma di queste ultime.<br><br>Una simile soluzione priverebbe il diritto comunitario del suo carattere di diritto comunitario e rimetterebbe in discussione lo stesso fondamento giuridico della Comunità. La validità di un atto dell'Unione può quindi essere valutata soltanto alla luce del diritto dell'Unione stesso — anche rispetto a diritti fondamentali nazionali, pur se sanciti da una costituzione nazionale.<br><br>Ma la Corte temperò immediatamente questa affermazione: il rispetto dei diritti fondamentali fa parte integrante dei principi generali del diritto comunitario, di cui la Corte garantisce l'osservanza ispirandosi alle tradizioni costituzionali comuni agli Stati membri. La loro tutela deve inserirsi nell'ambito della struttura e degli obiettivi propri della Comunità.<br><br>Questa fu la prima affermazione netta, da parte della Corte, che il primato non ignora i diritti fondamentali. Essa integrò così il proprio controllo dei diritti fondamentali direttamente all'interno del diritto dell'Unione — una mossa ampiamente interpretata come volta a prevenire i giudici nazionali, in particolare la stessa Corte costituzionale tedesca, dal rivendicare un proprio potere di controllo sugli atti dell'Unione.`,
       application:"Il giudice tedesco non poteva invocare direttamente le garanzie di diritti fondamentali della Legge fondamentale per contestare la validità del sistema dell'Unione.<br><br>Ma la Corte di giustizia esaminò comunque il sistema della cauzione alla luce dei diritti fondamentali tutelati all'interno del diritto dell'Unione stesso, e lo ritenne necessario e proporzionato per la gestione dei mercati agricoli — non costitutivo di una violazione."},
     holistic:`Questa causa risale al 1970, sei anni dopo che <a class="case-link" onclick="jumpToCase('costaenel')">Costa contro ENEL</a> aveva stabilito per la prima volta il principio del primato. Handelsgesellschaft rispose alla questione che Costa aveva lasciato aperta: il primato resiste anche a un conflitto con i diritti costituzionali propri di uno Stato, e non soltanto con una legge ordinaria?<br><br>La Corte costituzionale tedesca stessa non accettò subito questa soluzione. Nelle sue decisioni <a class="case-link" onclick="jumpToCase('solange-i')">Solange I</a> e <a class="case-link" onclick="jumpToCase('solange-ii')">Solange II</a>, essa accettò il primato del diritto dell'Unione solo «fintanto che» (Solange, in tedesco) la tutela dei diritti fondamentali da parte dell'Unione fosse rimasta adeguata — allentando poi questa posizione una volta convinta che l'Unione offrisse una tutela effettiva.<br><br>La tensione sollevata da questa causa non si è mai del tutto risolta. <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> torna esattamente sulla stessa questione decenni più tardi, questa volta sotto l'egida della Carta dei diritti fondamentali anziché di principi generali non scritti.<br><br>Questa causa costruì di fatto la propria carta dei diritti non scritta dell'Unione — messa poi per iscritto, in modo compiuto, nella Carta dei diritti fondamentali, adottata nel 2000 e resa giuridicamente vincolante nel 2009.`,
     citations:[
       {phrase:"il rispetto dei diritti fondamentali fa parte integrante dei principi generali del diritto di cui la Corte di giustizia garantisce l'osservanza", paragraphs:"punto 4", note:"Traduzione non ufficiale elaborata a partire dal testo inglese verificato (punto 4). La lingua processuale di questa causa era il tedesco; né il testo tedesco autentico né la versione italiana ufficiale della Raccolta sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true}
     ]
   }
 }},

{id:"melloni", name:"Melloni v Ministerio Fiscal", originalName:"Stefano Melloni contra Ministerio Fiscal", citation:"Case C-399/11", jurisdiction:"CJUE", themes:["Fundamental rights","National constitutional identity","Legal order / primacy / direct effect"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Can a member state refuse to execute a European Arrest Warrant by applying a higher national fundamental-rights standard than the EU one?",
   rule:"Article 53 of the Charter does not allow member states to apply a higher national standard of fundamental-rights protection where doing so would compromise the primacy, unity, and effectiveness of EU law.",
   application:"Spain could not refuse to surrender Melloni by relying on a Spanish constitutional right to be present at retrial, since the EU Framework Decision had already struck that balance."},
 intermediate:{
   issue:"Stefano Melloni was convicted in Italy without being present at his trial, though he had lawyers representing him throughout.<br><br>He later moved to Spain. Italy issued a European Arrest Warrant to get him back.<br><br>Spanish law normally required a guarantee of a retrial before surrendering someone convicted this way. But the EU's own rules on the Arrest Warrant had already removed that requirement, for cases where the person had legal representation.<br><br>Spain's Constitutional Court asked: can Spain still apply its own, stricter, standard?",
   rule:"The Court said no. The Charter's Article 53 lets states keep their own fundamental rights standards — but only in areas the EU hasn't already fully harmonised.<br><br>Here, the EU had already harmonised exactly this question, in the Arrest Warrant rules. Letting Spain apply a stricter standard would undermine EU law.<br><br>Different countries could then apply different levels of protection — breaking the uniform, EU-wide system the Arrest Warrant depends on.",
   application:"Spain could not demand a guaranteed retrial as a condition for surrendering Melloni.<br><br>The EU rules had already dealt with exactly this situation. There was no gap left for a stricter national rule to fill."},
 detailed:{
   issue:"Stefano Melloni was tried and convicted in Italy for bankruptcy fraud, in his absence. He had appointed lawyers who represented him throughout the trial.<br><br>Melloni later fled to Spain. Italy issued a European Arrest Warrant asking Spain to send him back.<br><br>Under Spanish constitutional case law, surrendering someone convicted in absentia normally required a guarantee of a retrial. But the EU's own Framework Decision on the Arrest Warrant, updated in 2009, had removed that ground for refusal — specifically when the person had chosen their own lawyers and been represented throughout.<br><br>Spain's Constitutional Court sent three questions to the Court of Justice. In essence: does Article 53 of the Charter let Spain apply its own, higher, constitutional standard instead of the EU one?",
   rule:`The Court said that where an area is fully harmonised at EU level, any fundamental rights check must stay inside that harmonised framework. It cannot fall back on a member state's own, potentially stricter, constitutional standard.<br><br>Here, the grounds for refusing to execute an Arrest Warrant were exactly that kind of fully harmonised area. Article 53 of the Charter, properly read, only lets states apply their own standards in areas still within their own competence — it is not a licence to override an already-harmonised EU rule.<br><br>Reading Article 53 the way Spain wanted would undermine the principle of primacy. Protection levels could then vary from state to state, threatening the uniform application of EU law and, ultimately, mutual trust between different countries' criminal justice systems — the whole basis the Arrest Warrant system runs on.`,
   application:"Spain could not demand a guaranteed retrial as a condition for surrendering Melloni. The Framework Decision had already dealt with this exact scenario: an in-absentia conviction, with prior legal representation. There was no gap left for a stricter Spanish rule to fill.<br><br>Many read this judgment as the Court drawing a firm line: Article 53 cannot become a back door for national courts resisting EU criminal justice cooperation. This sits in real tension with the more accommodating tone of Internationale Handelsgesellschaft, decided over 40 years earlier."},
 holistic:`Melloni was decided in 2013, the same year as <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, and shortly after the <a class="case-link" onclick="jumpToCase('fransson')">Åkerberg Fransson</a> judgment, which asked a related question about the Charter's reach.<br><br>This case continues the line running through <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>: how far can national fundamental rights push back against EU primacy? The difference is the legal source — Handelsgesellschaft relied on unwritten general principles, Melloni applies the same logic under the Charter, now written EU law in its own right.<br><br>The case also touches the EU's system of mutual trust — the assumption that every member state's courts meet a shared minimum standard, the same assumption underlying the European Arrest Warrant. That assumption was tested again later, in cases about whether mutual trust still holds when a member state's judiciary comes under political pressure.<br><br>Structurally, Melloni confirms a pattern: the more an area of EU law is harmonised, the less room member states keep for their own, higher, standards.`,
 citations:[
   {phrase:"would undermine the principle of primacy by allowing the level of protection to vary from state to state", paragraphs:"para. 60", note:"The Court's central holding on Article 53 — independently confirmed, since the later Åkerberg Fransson judgment cites Melloni at this exact paragraph.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Un État membre peut-il refuser d'exécuter un mandat d'arrêt européen en appliquant une norme nationale de protection des droits fondamentaux plus élevée que celle de l'Union ?",
       rule:"L'article 53 de la Charte ne permet pas aux États membres d'appliquer une norme nationale de protection des droits fondamentaux plus élevée lorsque cela compromettrait la primauté, l'unité et l'effectivité du droit de l'Union.",
       application:"L'Espagne ne pouvait refuser de remettre M. Melloni en invoquant un droit constitutionnel espagnol à être présent lors d'un nouveau procès, dès lors que la décision-cadre de l'Union relative au mandat d'arrêt avait déjà arbitré cette question."},
     intermediate:{
       issue:"Stefano Melloni fut condamné en Italie sans être présent à son procès, bien qu'il ait été représenté tout au long de celui-ci par des avocats.<br><br>Il s'installa ensuite en Espagne. L'Italie émit un mandat d'arrêt européen pour obtenir sa remise.<br><br>Le droit espagnol exigeait normalement une garantie de nouveau procès avant de remettre une personne condamnée dans ces conditions. Mais les règles propres de l'Union relatives au mandat d'arrêt avaient déjà supprimé cette exigence, pour les cas où la personne avait été représentée par un avocat.<br><br>La Cour constitutionnelle espagnole demanda : l'Espagne peut-elle néanmoins appliquer sa propre norme, plus stricte ?",
       rule:"La Cour répondit par la négative. L'article 53 de la Charte permet aux États de conserver leurs propres normes de protection des droits fondamentaux — mais seulement dans les domaines que l'Union n'a pas déjà pleinement harmonisés.<br><br>Or, l'Union avait déjà harmonisé précisément cette question, dans les règles relatives au mandat d'arrêt. Permettre à l'Espagne d'appliquer une norme plus stricte compromettrait le droit de l'Union.<br><br>Différents États pourraient alors appliquer des niveaux de protection différents — rompant le système uniforme, à l'échelle de l'Union, sur lequel repose le mandat d'arrêt.",
       application:"L'Espagne ne pouvait exiger la garantie d'un nouveau procès comme condition de la remise de M. Melloni.<br><br>Les règles de l'Union avaient déjà traité exactement cette situation. Il ne restait aucune marge pour qu'une règle nationale plus stricte s'y applique."},
     detailed:{
       issue:"Stefano Melloni fut jugé et condamné en Italie pour banqueroute frauduleuse, en son absence. Il avait désigné des avocats qui le représentèrent tout au long du procès.<br><br>M. Melloni se réfugia ensuite en Espagne. L'Italie émit un mandat d'arrêt européen demandant à l'Espagne de le lui remettre.<br><br>Selon la jurisprudence constitutionnelle espagnole, la remise d'une personne condamnée par défaut exigeait normalement la garantie d'un nouveau procès. Mais la décision-cadre de l'Union relative au mandat d'arrêt, modifiée en 2009, avait supprimé ce motif de refus — spécifiquement lorsque la personne avait choisi ses propres avocats et avait été représentée tout au long de la procédure.<br><br>La Cour constitutionnelle espagnole posa trois questions préjudicielles à la Cour de justice. En substance : l'article 53 de la Charte permet-il à l'Espagne d'appliquer sa propre norme constitutionnelle, plus élevée, au lieu de celle de l'Union ?",
       rule:`La Cour jugea que, lorsqu'un domaine est pleinement harmonisé au niveau de l'Union, tout contrôle au regard des droits fondamentaux doit demeurer à l'intérieur de ce cadre harmonisé. Il ne saurait se rabattre sur la norme constitutionnelle propre, potentiellement plus stricte, d'un État membre.<br><br>En l'espèce, les motifs de refus d'exécution d'un mandat d'arrêt relevaient précisément d'un tel domaine pleinement harmonisé. L'article 53 de la Charte, correctement interprété, ne permet aux États d'appliquer leurs propres normes que dans les domaines relevant encore de leur compétence propre — il ne constitue pas une licence permettant d'écarter une règle de l'Union déjà harmonisée.<br><br>Interpréter l'article 53 comme le souhaitait l'Espagne compromettrait le principe de primauté. Les niveaux de protection pourraient alors varier d'un État à l'autre, menaçant l'application uniforme du droit de l'Union et, en définitive, la confiance mutuelle entre les systèmes de justice pénale des différents États — le fondement même sur lequel repose le système du mandat d'arrêt.`,
       application:"L'Espagne ne pouvait exiger la garantie d'un nouveau procès comme condition de la remise de M. Melloni. La décision-cadre avait déjà traité exactement ce scénario : une condamnation par défaut, avec représentation par un avocat tout au long de la procédure. Il ne restait aucune marge pour qu'une règle espagnole plus stricte s'y applique.<br><br>Beaucoup ont lu cet arrêt comme la Cour traçant une ligne ferme : l'article 53 ne peut devenir une porte dérobée permettant aux juridictions nationales de résister à la coopération pénale de l'Union. Cette position est en tension réelle avec le ton plus conciliant d'Internationale Handelsgesellschaft, rendu plus de quarante ans auparavant."},
     holistic:`Melloni fut rendu en 2013, la même année que <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, et peu après l'arrêt <a class="case-link" onclick="jumpToCase('fransson')">Åkerberg Fransson</a>, qui posait une question voisine sur la portée de la Charte.<br><br>Cet arrêt prolonge la ligne jurisprudentielle amorcée par <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> : jusqu'où les droits fondamentaux nationaux peuvent-ils faire obstacle à la primauté du droit de l'Union ? La différence tient à la source juridique — Handelsgesellschaft s'appuyait sur des principes généraux non écrits, Melloni applique le même raisonnement sous l'empire de la Charte, désormais du droit de l'Union écrit à part entière.<br><br>L'affaire touche également au système de confiance mutuelle de l'Union — le postulat selon lequel les juridictions de chaque État membre respectent une norme minimale commune, le même postulat qui sous-tend le mandat d'arrêt européen. Ce postulat fut de nouveau mis à l'épreuve plus tard, dans des affaires portant sur la question de savoir si la confiance mutuelle subsiste lorsque le pouvoir judiciaire d'un État membre subit des pressions politiques.<br><br>Sur le plan structurel, Melloni confirme une tendance : plus un domaine du droit de l'Union est harmonisé, moins les États membres conservent de marge pour leurs propres normes, plus élevées soient-elles.`,
     citations:[
       {phrase:"compromettrait le principe de primauté en permettant au niveau de protection de varier d'un État à l'autre", paragraphs:"point 60", note:"Traduction non officielle établie à partir du texte anglais vérifié (point 60). La langue de procédure de cette affaire était l'espagnol ; ni le texte espagnol authentique ni la version française officielle du Recueil n'ont pu être consultés dans cette session — à vérifier contre le texte officiel.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Kann ein Mitgliedstaat die Vollstreckung eines Europäischen Haftbefehls verweigern, indem er einen höheren nationalen Grundrechtsstandard anwendet als den der Union?",
       rule:"Artikel 53 der Charta erlaubt es den Mitgliedstaaten nicht, einen höheren nationalen Grundrechtsschutzstandard anzuwenden, wenn dies den Vorrang, die Einheit und die Wirksamkeit des Unionsrechts beeinträchtigen würde.",
       application:"Spanien durfte die Übergabe von Herrn Melloni nicht unter Berufung auf ein spanisches Verfassungsrecht auf Anwesenheit bei einem neuen Verfahren verweigern, da der Rahmenbeschluss der Union über den Haftbefehl diese Abwägung bereits getroffen hatte."},
     intermediate:{
       issue:"Stefano Melloni wurde in Italien in seiner Abwesenheit verurteilt, obwohl er während des gesamten Verfahrens durch Rechtsanwälte vertreten war.<br><br>Er zog später nach Spanien. Italien erließ einen Europäischen Haftbefehl, um seine Rückführung zu erwirken.<br><br>Das spanische Recht verlangte normalerweise vor der Übergabe einer so verurteilten Person die Zusicherung eines neuen Verfahrens. Doch die eigenen Vorschriften der Union zum Haftbefehl hatten dieses Erfordernis bereits abgeschafft, für Fälle, in denen die Person anwaltlich vertreten war.<br><br>Das spanische Verfassungsgericht fragte: Darf Spanien dennoch seinen eigenen, strengeren Maßstab anwenden?",
       rule:"Der Gerichtshof verneinte dies. Artikel 53 der Charta erlaubt es den Staaten, ihre eigenen Grundrechtsstandards beizubehalten — jedoch nur in Bereichen, die die Union noch nicht vollständig harmonisiert hat.<br><br>Hier hatte die Union genau diese Frage bereits harmonisiert, in den Vorschriften über den Haftbefehl. Würde man Spanien einen strengeren Maßstab anwenden lassen, würde dies das Unionsrecht untergraben.<br><br>Verschiedene Staaten könnten dann unterschiedliche Schutzniveaus anwenden — was das einheitliche, unionsweite System, auf dem der Haftbefehl beruht, zerstören würde.",
       application:"Spanien durfte die Zusicherung eines neuen Verfahrens nicht als Bedingung für die Übergabe von Herrn Melloni verlangen.<br><br>Die Vorschriften der Union hatten genau diese Situation bereits geregelt. Es blieb kein Raum für eine strengere nationale Regel."},
     detailed:{
       issue:"Stefano Melloni wurde in Italien wegen betrügerischen Bankrotts in Abwesenheit verhandelt und verurteilt. Er hatte Rechtsanwälte beauftragt, die ihn während des gesamten Verfahrens vertraten.<br><br>Herr Melloni floh später nach Spanien. Italien erließ einen Europäischen Haftbefehl und ersuchte Spanien um seine Übergabe.<br><br>Nach spanischer Verfassungsrechtsprechung setzte die Übergabe einer in Abwesenheit verurteilten Person normalerweise die Zusicherung eines neuen Verfahrens voraus. Doch der 2009 geänderte Rahmenbeschluss der Union über den Haftbefehl hatte diesen Ablehnungsgrund abgeschafft — insbesondere dann, wenn die Person ihre eigenen Rechtsanwälte gewählt hatte und während des gesamten Verfahrens vertreten war.<br><br>Das spanische Verfassungsgericht legte dem Gerichtshof drei Fragen vor. Im Kern: Erlaubt Artikel 53 der Charta Spanien, seinen eigenen, höheren verfassungsrechtlichen Maßstab anstelle des unionsrechtlichen anzuwenden?",
