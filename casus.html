   de:{
     abstract:{
       issue:"Kann sich eine Einzelperson unmittelbar auf eine EU-Richtlinie gegenüber einem privaten Arbeitgeber berufen, ebenso wie gegenüber einer öffentlichen Stelle?",
       rule:"Eine Richtlinie kann aus sich heraus keine Verpflichtungen für einen Einzelnen begründen und kann ihm gegenüber nicht als solche geltend gemacht werden; sie kann nur unmittelbar gegenüber dem Staat geltend gemacht werden, gleich in welcher Eigenschaft — als Arbeitgeber oder als öffentliche Gewalt — dieser handelt.",
       application:"Da Frau Marshalls Arbeitgeberin eine öffentliche Gesundheitsbehörde und damit eine Emanation des Staates war, konnte sie sich unmittelbar auf die Gleichbehandlungsrichtlinie berufen, während eine Arbeitnehmerin in der Privatwirtschaft in derselben Lage die Richtlinie nicht gegenüber einem privaten Arbeitgeber hätte geltend machen können."},
     intermediate:{
       issue:"Helen Marshall arbeitete als leitende Diätassistentin für eine öffentliche Gesundheitsbehörde in England. Die Behörde verfolgte die Politik, Frauen mit 60 und Männer mit 65 Jahren in den Ruhestand zu versetzen, behielt sich jedoch vor, Beschäftigte auch darüber hinaus weiterzubeschäftigen.<br><br>Frau Marshall wurde über das 60. Lebensjahr hinaus weiterbeschäftigt, jedoch vier Wochen nach Vollendung des 62. Lebensjahres entlassen — im Wesentlichen, weil sie das Alter erreicht hatte, das die Behörde als reguläres Ruhestandsalter für Frauen ansah. Sie hatte den Wunsch geäußert, bis zum 65. Lebensjahr weiterzuarbeiten, wie es ein Mann in vergleichbarer Position gekonnt hätte.<br><br>Sie machte geltend, diese Entlassung verstoße gegen die europäische Gleichbehandlungsrichtlinie. Das britische Recht erlaubte damals noch unterschiedliche, an das staatliche Rentenalter geknüpfte Ruhestandsalter, sodass sie sich auf die Richtlinie selbst und nicht nur auf innerstaatliches Recht stützen musste.",
       rule:"Der Gerichtshof entschied, dass diese Entlassung von der in der Richtlinie garantierten Gleichbehandlung bei der Entlassung erfasst war und dass die Ausnahme für das staatliche Rentenalter diesen Fall nicht erfasste.<br><br>Er wandte sich sodann einer größeren Frage zu: Kann eine Richtlinie überhaupt unmittelbar geltend gemacht werden, und gegenüber wem? Der Gerichtshof entschied, dass sich eine Richtlinie an die Mitgliedstaaten richtet — sie kann aus sich heraus keine Verpflichtungen für einen Einzelnen begründen und ihm gegenüber nicht unmittelbar geltend gemacht werden.<br><br>Sie kann jedoch unmittelbar gegenüber dem Staat selbst geltend gemacht werden. Dazu zählt jede öffentliche Stelle, gleich in welcher Eigenschaft sie handelt — auch wenn sie schlicht als Arbeitgeberin auftritt, eine Rolle, die ebenso gut ein privates Unternehmen einnehmen könnte.",
       application:"Da Frau Marshalls Arbeitgeberin eine öffentliche Gesundheitsbehörde war, konnte sie sich unmittelbar auf die Richtlinie gegenüber dieser Behörde berufen, obwohl die Behörde bei der Entlassung lediglich als gewöhnliche Arbeitgeberin handelte.<br><br>Eine Arbeitnehmerin der Privatwirtschaft, die aus genau denselben diskriminierenden Gründen entlassen worden wäre, hätte sich die Richtlinie selbst nicht gegenüber ihrem Arbeitgeber berufen können — nur gegenüber dem Staat."},
     detailed:{
       issue:"Helen Marshall war als leitende Diätassistentin bei der Southampton and South West Hampshire Area Health Authority beschäftigt, einer öffentlichen Stelle, die in England für Gesundheitsdienste zuständig war.<br><br>Die allgemeine Politik der Behörde bestand darin, Frauen mit 60 und Männer mit 65 Jahren — den damals an die britische Staatsrente geknüpften Altersgrenzen — in den Ruhestand zu versetzen, wobei sie sich vorbehielt, Beschäftigte darüber hinaus weiterzubeschäftigen. Frau Marshall wurde über das 60. Lebensjahr hinaus weiterbeschäftigt, jedoch am 31. März 1980, etwa vier Wochen nach Vollendung des 62. Lebensjahres, entlassen — im Wesentlichen, weil sie das von der Behörde als regulär angesehene Ruhestandsalter für Frauen erreicht hatte. Sie hatte deutlich gemacht, dass sie bis zum 65. Lebensjahr weiterarbeiten wollte, wie es ein Mann in vergleichbarer Stellung gekonnt hätte.<br><br>Frau Marshall erhob Klage vor einem Arbeitsgericht und machte geltend, diese Entlassung verstoße gegen die Richtlinie 76/207/EWG des Rates zur Verwirklichung des Grundsatzes der Gleichbehandlung von Männern und Frauen, insbesondere gegen die in Artikel 5 Absatz 1 verankerte Gleichbehandlung hinsichtlich der Arbeitsbedingungen einschließlich der Entlassungsbedingungen. Das britische Sex Discrimination Act 1975 erlaubte zu dieser Zeit noch unterschiedliche, an das staatliche Rentenalter geknüpfte Ruhestandsalter, sodass das innerstaatliche Recht allein ihrer Klage nicht zum Erfolg verhelfen konnte.<br><br>Nach einem Verfahren vor dem Employment Appeal Tribunal legte die Court of Appeal dem Gerichtshof gemäß Artikel 177 EWG zwei Fragen vor: erstens, ob eine derart diskriminierende Ruhestandsalterspolitik von der Entlassungsgarantie der Richtlinie erfasst sei; zweitens, falls ja, ob sich Frau Marshall angesichts des Stands der britischen Umsetzung unmittelbar auf die Richtlinie gegenüber der Behörde berufen könne.",
       rule:`Zur ersten Frage entschied der Gerichtshof, dass eine mit einer allgemeinen Ruhestandsalterspolitik verbundene Entlassung von den „Entlassungsbedingungen“ im Sinne von Artikel 5 Absatz 1 der Richtlinie erfasst sei und dass die Ausnahme des Artikels 7 für das staatliche Rentenalter den Rentenanspruch, nicht aber die Festlegung eines diskriminierenden Entlassungsalters betreffe.<br><br>Zur zweiten, weiterreichenden Frage bestätigte der Gerichtshof, dass eine Richtlinie unmittelbare Wirkung entfalten kann, wenn ihre Bestimmungen unbedingt und hinreichend genau sind und die Umsetzungsfrist abgelaufen ist — zog jedoch sogleich eine scharfe Grenze, gegenüber wem diese unmittelbare Wirkung geltend gemacht werden kann. Nach Artikel 189 des EWG-Vertrags besteht die Verbindlichkeit einer Richtlinie nur gegenüber „jedem Mitgliedstaat, an den sie gerichtet wird“. Daraus folge, so der Gerichtshof, dass eine Richtlinie aus sich heraus keine Verpflichtungen für einen Einzelnen begründen könne und eine Bestimmung einer Richtlinie ihm gegenüber nicht als solche geltend gemacht werden könne.<br><br>Der Gerichtshof klärte sodann, wer zu diesem Zweck als Staat anzusehen sei. Könne sich eine Partei in einem Rechtsstreit gegenüber dem Staat auf eine Richtlinie berufen, so könne sie dies unabhängig davon tun, in welcher Eigenschaft der Staat handle, sei es als Arbeitgeber oder als öffentliche Gewalt — die Erwägung dahinter sei, dass der Staat aus seinem eigenen Versäumnis, das Gemeinschaftsrecht ordnungsgemäß umzusetzen, keinen Vorteil ziehen dürfe, gleich in welcher Eigenschaft er dabei handle.`,
       application:"Die Area Health Authority war eine öffentliche Stelle und daher zu diesem Zweck als Emanation des Staates anzusehen, obwohl sie bei der Entlassung von Frau Marshall lediglich als gewöhnliche Arbeitgeberin handelte.<br><br>Frau Marshall konnte sich daher unmittelbar auf die Gleichbehandlungsrichtlinie gegenüber der Behörde berufen, und die diskriminierende Ruhestandsalterspolitik durfte auf sie nicht angewendet werden.<br><br>Das Urteil ließ offen, wie weit der Begriff „Staat“ über die Zentralregierung und klassische öffentliche Stellen hinaus reicht — eine Lücke, die der Gerichtshof später mit dem vierteiligen Test in der Rechtssache Foster/British Gas (1990) schloss."},
     holistic:`Marshall erging 1986, dreiundzwanzig Jahre nachdem <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> erstmals entschied, dass Vertragsbestimmungen zugunsten Einzelner unmittelbare Wirkung entfalten können. Dieses Urteil beantwortete eine engere, schwierigere Frage: Gilt dies auch für Richtlinien, und gegenüber wem?<br><br>Der Gerichtshof hatte die unmittelbare Wirkung für Vertragsartikel bereits auf Beziehungen zwischen Privaten ausgedehnt, im Urteil <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne/Sabena</a>. Marshall zog eine klare Grenze, die diese Ausdehnung für Richtlinien verhinderte: Eine Richtlinie bindet die Mitgliedstaaten, nicht Privatpersonen; sie kann daher nicht horizontal, sondern nur vertikal gegenüber dem Staat geltend gemacht werden.<br><br>Diese Grenze warf eine eigene schwierige Frage auf: Was zählt als „Staat“? Marshall gab darauf eine erste, großzügige Antwort: jede öffentliche Stelle, in jeder Eigenschaft, auch als gewöhnliche Arbeitgeberin. Die spätere Entscheidung des Gerichtshofs in der Rechtssache <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Foster/British Gas</span> formte diese Antwort zu einem strukturierten vierteiligen Test.<br><br>Strukturell erklärt Marshall, warum zwei aus identischen diskriminierenden Gründen entlassene Beschäftigte — der eine bei einer öffentlichen Stelle, der andere bei einem privaten Unternehmen — sich allein nach Unionsrecht in unterschiedlichen Rechtslagen wiederfinden konnten, sofern nicht das nationale Recht diese Lücke selbst schloss. Diese Asymmetrie verstärkte später auch die parallele Doktrin der mittelbaren Wirkung, die nationale Gerichte verpflichtet, innerstaatliches Recht nach Möglichkeit im Lichte der Richtlinien auszulegen.`,
     citations:[
       {phrase:"eine Richtlinie könne aus sich heraus keine Verpflichtungen für einen Einzelnen begründen, und eine Bestimmung einer Richtlinie könne ihm gegenüber nicht als solche geltend gemacht werden", paragraphs:"Randnr. 48", note:"Inoffizielle Übersetzung des verifizierten englischen Passus (Randnr. 48) — der authentische (englische) Text und die amtliche deutsche Fassung der Sammlung konnten nicht eingesehen werden (EUR-Lex-Abruf fehlgeschlagen). Gegen den amtlichen Text zu prüfen.", primary:true}
     ]
   }
 }},

{id:"solange-i", name:"Solange I", originalName:"BVerfG, Beschluss vom 29. Mai 1974 – 2 BvL 52/71 (\"Solange I\")", citation:"BVerfGE 37, 271", jurisdiction:"BVerfGE", themes:["Fundamental rights","National constitutional identity"], articleIds:[],
 abstract:{
   issue:"Can Germany's Constitutional Court review EU secondary legislation against the fundamental rights guaranteed by Germany's own Basic Law?",
   rule:"As long as EU law lacks its own codified, parliament-adopted catalogue of fundamental rights equivalent to the Basic Law's, German courts may refer an EU measure to the Federal Constitutional Court if they consider it incompatible with a Basic Law fundamental right.",
   application:"The Court kept open its own power to review EU secondary law against German fundamental rights, at least until EU law developed an adequate rights catalogue of its own."},
 intermediate:{
   issue:"A German grain trading company challenged the forfeiture of an export deposit it lost after only partly using an EEC export licence. The underlying EEC rules had already been upheld by the Court of Justice, in the very case that became Internationale Handelsgesellschaft.<br><br>The German administrative court hearing the case wasn't satisfied. It thought the EEC licence-and-deposit system might breach fundamental rights guaranteed by Germany's own Basic Law — freedom to pursue an economic activity and the principle of proportionality among them.<br><br>It referred the matter to Germany's own Federal Constitutional Court, asking whether it could review an EU measure this way, even after the Court of Justice had already ruled the measure valid as a matter of EU law.",
   rule:"The Federal Constitutional Court said yes — for now. The European Communities, it noted, still lacked a parliament with direct democratic legitimation and still lacked their own codified catalogue of fundamental rights equivalent to the Basic Law's.<br><br>Until that changed, a gap remained. So long as it remained, a German court could — and, if it doubted an EU measure's compatibility with a Basic Law fundamental right, had to — refer the matter to the Federal Constitutional Court, even after obtaining a ruling on the same measure from the Court of Justice.<br><br>The key word was 'so long as' — Solange, in German, which gave the decision its nickname. The Court didn't say EU law could never bind Germany. It said its own review power stayed in reserve until EU law's own rights protection caught up.",
   application:"The German court could refer the EEC deposit system to the Federal Constitutional Court for review against Basic Law fundamental rights, despite the Court of Justice's own ruling on the same measure.<br><br>On the substance, though, the Federal Constitutional Court went on to find the deposit system did not actually violate the Basic Law's fundamental rights, so the EEC rules stood."},
 detailed:{
   issue:"A German import-export firm challenged the forfeiture of a deposit it had lodged under EEC Regulation No 120/67, after failing to use the full quantity covered by its maize export licence within the required time.<br><br>The Verwaltungsgericht Frankfurt, hearing the firm's challenge, had already referred questions on the deposit system's validity to the Court of Justice under Article 177 EEC. The Court of Justice answered in the case that became Internationale Handelsgesellschaft: EU law's own validity can only be tested against EU law, including fundamental rights recognised as general principles of EU law, not against a national constitution as such — and, applying that standard itself, it found the deposit system valid.<br><br>Unsatisfied, the Verwaltungsgericht referred a further, more fundamental question to Germany's own Federal Constitutional Court: could it, despite the Court of Justice's ruling, still test the EEC deposit system against fundamental rights guaranteed by Germany's Basic Law — specifically Article 2(1) (general freedom of action) and the constitutional principle of proportionality?",
   rule:`The Federal Constitutional Court held that, as things stood in 1974, the European Communities still lacked a parliament with direct democratic legitimation, elected by general suffrage and possessing legislative power, and still lacked a codified catalogue of fundamental rights, settled for all time, that could be considered adequate in comparison with the fundamental rights catalogue of the Basic Law.<br><br>Given that gap, the Court held: as long as the integration process of the European Communities has not progressed so far that Community law also contains an operative catalogue of fundamental rights, decided on by a parliament and of settled validity, which is adequate in comparison with the catalogue of fundamental rights contained in the Basic Law, a court of the Federal Republic of Germany, after obtaining a ruling from the Court of Justice under Article 177, is permitted — and required — to refer the matter to the Federal Constitutional Court in judicial review proceedings, if that court considers the relevant Community-law provision inapplicable because and to the extent that it conflicts with a fundamental right of the Basic Law.<br><br>The Court framed this as a conditional, temporary reservation rather than an outright rejection of EU law's authority: Article 24 of the Basic Law, which permits transfers of sovereign powers to international institutions, could not be read as opening the door to amending the Basic Law's own fundamental-rights core through ordinary Community legislation.`,
   application:"The Federal Constitutional Court accepted the reference and reviewed the deposit-and-forfeiture system against Basic Law fundamental rights.<br><br>On the merits, it found the system — designed to make export licences reliable instruments for managing the common agricultural market — did not disproportionately restrict the applicant's fundamental rights, and so did not breach the Basic Law.<br><br>The immediate result changed nothing for the exporter. The lasting result was a standing German claim to review power over EU law, on hold pending EU law's own development of fundamental rights protection."},
 holistic:`Solange I answered the German Constitutional Court's response to <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, decided by the Court of Justice in Luxembourg just months earlier, in the very same underlying dispute. Handelsgesellschaft said EU law's validity can only be judged by EU law itself, including fundamental rights as EU general principles. Solange I was Germany's answer: fine, but only once EU law's own rights protection is good enough — and until then, Karlsruhe keeps its own review power in reserve.<br><br>The case gave the whole line of decisions its name: Solange, German for 'as long as.' <a class="case-link" onclick="jumpToCase('solange-ii')">Solange II</a>, twelve years later, tested whether that condition had finally been met.<br><br>Structurally, this is one of the clearest early statements of what later scholarship calls constitutional pluralism — not one legal order simply commanding another, but two courts, in Luxembourg and Karlsruhe, each claiming ultimate authority within its own framework, coexisting through mutual conditions rather than a single clear hierarchy. The same structural standoff resurfaces, in a different guise, in <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> decades later.`,
 citations:[
   {phrase:"a court of the Federal Republic of Germany... is permitted – and required – to refer the matter to the Federal Constitutional Court in judicial review proceedings if the court in question considers the Court of Justice's interpretation of the relevant provision of Community law to be inapplicable on the grounds that... it conflicts with one of the fundamental rights enshrined in the Basic Law", paragraphs:"Headnote (Leitsatz)", note:"Official English translation, fetched directly from the Federal Constitutional Court's own website (bundesverfassungsgericht.de) — a primary source, successfully verified (unlike the EUR-Lex-sourced CJEU citations elsewhere in this batch, which failed to fetch directly).", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"La Cour constitutionnelle fédérale allemande peut-elle contrôler le droit dérivé de l'Union au regard des droits fondamentaux garantis par la Loi fondamentale allemande ?",
       rule:"Tant que le droit de l'Union ne dispose pas de son propre catalogue codifié de droits fondamentaux, adopté par un parlement et équivalent à celui de la Loi fondamentale, les juridictions allemandes peuvent saisir la Cour constitutionnelle fédérale d'une mesure de l'Union qu'elles estiment incompatible avec un droit fondamental garanti par la Loi fondamentale.",
       application:"La Cour conserva son propre pouvoir de contrôler le droit dérivé de l'Union au regard des droits fondamentaux allemands, du moins jusqu'à ce que le droit de l'Union développe un catalogue de droits adéquat."},
     intermediate:{
       issue:"Une entreprise allemande de négoce céréalier contesta la confiscation d'une caution qu'elle avait perdue après n'avoir utilisé que partiellement une licence d'exportation CEE. Les règles CEE en cause avaient déjà été validées par la Cour de justice, précisément dans l'affaire devenue Internationale Handelsgesellschaft.<br><br>La juridiction administrative allemande saisie de l'affaire n'était pas satisfaite. Elle estimait que le système de licence et de caution CEE pouvait violer des droits fondamentaux garantis par la Loi fondamentale allemande, notamment la liberté d'exercer une activité économique et le principe de proportionnalité.<br><br>Elle saisit la Cour constitutionnelle fédérale allemande, lui demandant si elle pouvait contrôler ainsi une mesure de l'Union, alors même que la Cour de justice avait déjà jugé cette mesure valide au regard du droit communautaire.",
       rule:"La Cour constitutionnelle fédérale répondit par l'affirmative — provisoirement. Elle releva que les Communautés européennes ne disposaient encore ni d'un parlement doté d'une légitimité démocratique directe, ni de leur propre catalogue codifié de droits fondamentaux équivalent à celui de la Loi fondamentale.<br><br>Tant que subsistait cette lacune, une juridiction allemande pouvait — et, en cas de doute sur la compatibilité d'une mesure de l'Union avec un droit fondamental de la Loi fondamentale, devait — saisir la Cour constitutionnelle fédérale, même après avoir obtenu une décision de la Cour de justice sur la même mesure.<br><br>Le mot clé était « tant que » — Solange, en allemand, qui donna son nom à la décision. La Cour ne jugea pas que le droit de l'Union ne pourrait jamais lier l'Allemagne. Elle jugea que son propre pouvoir de contrôle restait en réserve, tant que la protection des droits fondamentaux par le droit de l'Union n'avait pas rattrapé son retard.",
       application:"La juridiction allemande pouvait saisir la Cour constitutionnelle fédérale du système de caution CEE, malgré la décision déjà rendue par la Cour de justice sur la même mesure.<br><br>Sur le fond, la Cour constitutionnelle fédérale jugea toutefois que le système de caution ne violait pas les droits fondamentaux garantis par la Loi fondamentale, de sorte que les règles CEE furent maintenues."},
     detailed:{
       issue:"Une entreprise allemande d'import-export contesta la confiscation d'une caution constituée en vertu du règlement CEE n° 120/67, après ne pas avoir utilisé, dans le délai requis, la totalité de la quantité de maïs couverte par sa licence d'exportation.<br><br>Le Verwaltungsgericht de Francfort, saisi du litige, avait déjà posé à la Cour de justice, sur le fondement de l'article 177 CEE, des questions relatives à la validité du système de caution. La Cour de justice répondit dans l'affaire devenue Internationale Handelsgesellschaft : la validité du droit de l'Union ne peut être appréciée qu'au regard du droit de l'Union lui-même, y compris les droits fondamentaux reconnus comme principes généraux du droit de l'Union, et non au regard d'une constitution nationale en tant que telle — et, appliquant ce standard, elle jugea le système de caution valide.<br><br>Insatisfait, le Verwaltungsgericht posa une question plus fondamentale à la Cour constitutionnelle fédérale allemande : celle-ci pouvait-elle, malgré la décision de la Cour de justice, contrôler néanmoins le système de caution CEE au regard des droits fondamentaux garantis par la Loi fondamentale — en particulier la liberté générale d'action de l'article 2, alinéa 1, et le principe constitutionnel de proportionnalité ?",
       rule:`La Cour constitutionnelle fédérale jugea qu'en l'état, en 1974, les Communautés européennes ne disposaient encore ni d'un parlement doté d'une légitimité démocratique directe, élu au suffrage universel et titulaire du pouvoir législatif, ni d'un catalogue codifié de droits fondamentaux, définitivement arrêté, que l'on pourrait considérer comme adéquat par comparaison avec le catalogue de droits fondamentaux de la Loi fondamentale.<br><br>Compte tenu de cette lacune, la Cour jugea : tant que le processus d'intégration des Communautés européennes n'a pas progressé au point que le droit communautaire comporte lui aussi un catalogue de droits fondamentaux en vigueur, adopté par un parlement et de validité arrêtée, adéquat par comparaison avec le catalogue de droits fondamentaux de la Loi fondamentale, une juridiction de la République fédérale d'Allemagne, après avoir obtenu une décision de la Cour de justice sur le fondement de l'article 177, est habilitée — et tenue — de saisir la Cour constitutionnelle fédérale dans le cadre d'une procédure de contrôle de constitutionnalité, si elle estime que la disposition de droit communautaire concernée est inapplicable parce que, et dans la mesure où, elle est contraire à un droit fondamental de la Loi fondamentale.<br><br>La Cour présenta cette réserve comme conditionnelle et temporaire, plutôt que comme un rejet pur et simple de l'autorité du droit de l'Union : l'article 24 de la Loi fondamentale, qui autorise le transfert de droits de souveraineté à des institutions internationales, ne pouvait être interprété comme ouvrant la voie à une modification du noyau des droits fondamentaux de la Loi fondamentale par la voie du droit communautaire ordinaire.`,
       application:"La Cour constitutionnelle fédérale accepta la saisine et contrôla le système de caution et de confiscation au regard des droits fondamentaux de la Loi fondamentale.<br><br>Sur le fond, elle jugea que ce système — destiné à faire des licences d'exportation des instruments fiables de gestion du marché agricole commun — ne restreignait pas de manière disproportionnée les droits fondamentaux de la requérante, et ne violait donc pas la Loi fondamentale.<br><br>Le résultat immédiat ne changea rien pour l'exportateur. Le résultat durable fut la revendication, par l'Allemagne, d'un pouvoir de contrôle permanent sur le droit de l'Union, mis en réserve dans l'attente du développement propre de la protection des droits fondamentaux par ce dernier."},
     holistic:`Solange I répondit à l'arrêt <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, rendu par la Cour de justice à Luxembourg quelques mois plus tôt, dans ce même litige sous-jacent. Handelsgesellschaft jugeait que la validité du droit de l'Union ne pouvait être appréciée que par le droit de l'Union lui-même, y compris les droits fondamentaux en tant que principes généraux. Solange I fut la réponse allemande : soit, mais seulement une fois que la protection des droits fondamentaux par le droit de l'Union serait suffisante — et, en attendant, Karlsruhe conservait son propre pouvoir de contrôle en réserve.<br><br>Cette décision donna son nom à toute une lignée de jurisprudence : Solange, « tant que » en allemand. <a class="case-link" onclick="jumpToCase('solange-ii')">Solange II</a>, douze ans plus tard, vérifia si cette condition avait finalement été remplie.<br><br>Sur le plan structurel, il s'agit de l'une des formulations les plus claires de ce que la doctrine qualifiera plus tard de pluralisme constitutionnel — non pas un ordre juridique commandant simplement à un autre, mais deux juridictions, à Luxembourg et à Karlsruhe, revendiquant chacune l'autorité ultime dans son propre cadre, coexistant par des conditions réciproques plutôt que par une hiérarchie clairement établie. Le même face-à-face structurel réapparaît, sous une autre forme, dans <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, des décennies plus tard.`,
     citations:[
       {phrase:"une juridiction de la République fédérale d'Allemagne... est habilitée — et tenue — de saisir la Cour constitutionnelle fédérale... si elle estime que la disposition de droit communautaire concernée est inapplicable parce que, et dans la mesure où, elle est contraire à un droit fondamental de la Loi fondamentale", paragraphs:"Sentence directrice (Leitsatz)", note:"Traduction non officielle de la traduction anglaise officielle du Bundesverfassungsgericht (source primaire vérifiée) — le texte allemand original n'a pas été consulté séparément dans cette session.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Darf das Bundesverfassungsgericht abgeleitetes Gemeinschaftsrecht am Maßstab der im Grundgesetz verbürgten Grundrechte überprüfen?",
       rule:"Solange das Gemeinschaftsrecht noch keinen eigenen, von einem Parlament beschlossenen und mit dem Grundgesetz vergleichbaren Grundrechtskatalog besitzt, dürfen deutsche Gerichte eine gemeinschaftsrechtliche Maßnahme dem Bundesverfassungsgericht vorlegen, wenn sie diese für unvereinbar mit einem Grundrecht des Grundgesetzes halten.",
       application:"Das Bundesverfassungsgericht behielt sich seine eigene Prüfungsbefugnis über abgeleitetes Gemeinschaftsrecht vor, jedenfalls bis das Gemeinschaftsrecht einen angemessenen eigenen Grundrechtskatalog entwickelt hätte."},
     intermediate:{
       issue:"Ein deutsches Getreidehandelsunternehmen wandte sich gegen den Verfall einer Kaution, die es verloren hatte, weil es eine EWG-Ausfuhrlizenz nur teilweise ausgenutzt hatte. Die zugrundeliegenden EWG-Vorschriften waren zuvor bereits vom Gerichtshof bestätigt worden, und zwar genau in dem Verfahren, das als Internationale Handelsgesellschaft bekannt wurde.<br><br>Das mit der Sache befasste deutsche Verwaltungsgericht war damit nicht zufrieden. Es hielt es für möglich, dass das EWG-System aus Lizenz und Kaution Grundrechte des Grundgesetzes verletze — insbesondere die Freiheit wirtschaftlicher Betätigung und den Grundsatz der Verhältnismäßigkeit.<br><br>Es legte die Sache dem Bundesverfassungsgericht vor und fragte, ob dieses eine gemeinschaftsrechtliche Maßnahme auf diese Weise überprüfen dürfe, obwohl der Gerichtshof dieselbe Maßnahme bereits als gemeinschaftsrechtskonform beurteilt hatte.",
       rule:"Das Bundesverfassungsgericht bejahte dies — vorerst. Es stellte fest, dass die Europäischen Gemeinschaften noch über kein Parlament mit unmittelbarer demokratischer Legitimation und noch über keinen eigenen, kodifizierten Grundrechtskatalog verfügten, der dem des Grundgesetzes gleichwertig wäre.<br><br>Solange diese Lücke bestehe, dürfe — und müsse bei entsprechenden Zweifeln — ein deutsches Gericht die Sache dem Bundesverfassungsgericht vorlegen, auch nachdem es bereits eine Entscheidung des Gerichtshofs zu derselben Maßnahme eingeholt habe.<br><br>Das entscheidende Wort war 'solange' — es gab der Entscheidung ihren Namen. Das Gericht entschied nicht, dass Gemeinschaftsrecht Deutschland niemals binden könne. Es entschied, dass seine eigene Prüfungsbefugnis in Reserve bleibe, solange der Grundrechtsschutz des Gemeinschaftsrechts nicht aufgeholt habe.",
       application:"Das deutsche Gericht durfte das EWG-Kautionssystem dem Bundesverfassungsgericht zur Prüfung vorlegen, trotz der bereits ergangenen Entscheidung des Gerichtshofs zu derselben Maßnahme.<br><br>In der Sache selbst stellte das Bundesverfassungsgericht jedoch fest, dass das Kautionssystem die Grundrechte des Grundgesetzes nicht verletzte, sodass die EWG-Regelung bestehen blieb."},
     detailed:{
       issue:"Ein deutsches Import-Export-Unternehmen wandte sich gegen den Verfall einer Kaution, die es nach der Verordnung (EWG) Nr. 120/67 gestellt hatte, nachdem es die von seiner Ausfuhrlizenz erfasste Maismenge nicht fristgerecht vollständig ausgeführt hatte.<br><br>Das mit der Sache befasste Verwaltungsgericht Frankfurt hatte dem Gerichtshof bereits gemäß Artikel 177 EWG Fragen zur Gültigkeit des Kautionssystems vorgelegt. Der Gerichtshof antwortete in dem Verfahren, das als Internationale Handelsgesellschaft bekannt wurde: Die Gültigkeit von Gemeinschaftsrecht könne nur am Maßstab des Gemeinschaftsrechts selbst gemessen werden, einschließlich der als allgemeine Rechtsgrundsätze des Gemeinschaftsrechts anerkannten Grundrechte, nicht am Maßstab einer nationalen Verfassung als solcher — und stellte, diesen Maßstab anwendend, die Gültigkeit des Kautionssystems fest.<br><br>Unzufrieden legte das Verwaltungsgericht dem Bundesverfassungsgericht eine grundsätzlichere Frage vor: ob dieses, trotz der Entscheidung des Gerichtshofs, das EWG-Kautionssystem dennoch am Maßstab der im Grundgesetz verbürgten Grundrechte prüfen dürfe — insbesondere der allgemeinen Handlungsfreiheit aus Artikel 2 Absatz 1 und des verfassungsrechtlichen Verhältnismäßigkeitsgrundsatzes.",
       rule:`Das Bundesverfassungsgericht entschied, dass die Europäischen Gemeinschaften im Jahr 1974 noch über kein Parlament mit unmittelbarer demokratischer Legitimation verfügten, das durch allgemeine Wahlen gewählt wäre und Gesetzgebungsbefugnis besäße, und dass sie noch über keinen kodifizierten, endgültig feststehenden Grundrechtskatalog verfügten, der mit dem Grundrechtskatalog des Grundgesetzes als gleichwertig angesehen werden könnte.<br><br>Angesichts dieser Lücke entschied das Gericht: Solange der Integrationsprozess der Gemeinschaft nicht so weit fortgeschritten ist, dass das Gemeinschaftsrecht auch einen von einem Parlament beschlossenen und in Geltung stehenden Grundrechtskatalog enthält, der dem Grundrechtskatalog des Grundgesetzes adäquat ist, ist die Vorlage eines Gerichts der Bundesrepublik Deutschland an das Bundesverfassungsgericht im Normenkontrollverfahren nach Einholung der nach Artikel 177 vorgesehenen Entscheidung des Gerichtshofs zulässig und geboten, wenn das Gericht die für seine Entscheidung maßgebliche Vorschrift des Gemeinschaftsrechts in der vom Gerichtshof gegebenen Auslegung deshalb für unanwendbar hält, weil und soweit sie mit einem der Grundrechte des Grundgesetzes kollidiert.<br><br>Das Gericht stellte diese Reserve als bedingt und vorübergehend dar, nicht als grundsätzliche Ablehnung der Geltung des Gemeinschaftsrechts: Artikel 24 des Grundgesetzes, der die Übertragung von Hoheitsrechten auf zwischenstaatliche Einrichtungen erlaubt, könne nicht so verstanden werden, dass er den Weg zu einer Änderung des Grundrechtskerns des Grundgesetzes durch einfaches Gemeinschaftsrecht eröffne.`,
       application:"Das Bundesverfassungsgericht nahm die Vorlage an und prüfte das Kautions- und Verfallssystem am Maßstab der Grundrechte des Grundgesetzes.<br><br>In der Sache stellte es fest, dass dieses System — das Ausfuhrlizenzen zu verlässlichen Instrumenten der Verwaltung des gemeinsamen Agrarmarkts machen sollte — die Grundrechte der Beschwerdeführerin nicht unverhältnismäßig einschränkte und daher das Grundgesetz nicht verletzte.<br><br>Am unmittelbaren Ergebnis für das Exportunternehmen änderte sich nichts. Das bleibende Ergebnis war ein fortbestehender deutscher Anspruch auf Prüfungsbefugnis über das Gemeinschaftsrecht, zurückgestellt bis zu dessen eigener Entwicklung eines angemessenen Grundrechtsschutzes."},
     holistic:`Solange I war die Antwort auf <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, das der Gerichtshof in Luxemburg wenige Monate zuvor in demselben zugrundeliegenden Rechtsstreit entschieden hatte. Handelsgesellschaft besagte, dass die Gültigkeit des Gemeinschaftsrechts nur am Maßstab des Gemeinschaftsrechts selbst gemessen werden könne, einschließlich der Grundrechte als allgemeine Rechtsgrundsätze. Solange I war die deutsche Antwort darauf: einverstanden, aber erst, wenn der Grundrechtsschutz des Gemeinschaftsrechts ausreichend sei — und bis dahin behalte Karlsruhe seine eigene Prüfungsbefugnis in Reserve.<br><br>Die Entscheidung gab einer ganzen Rechtsprechungslinie ihren Namen: Solange. <a class="case-link" onclick="jumpToCase('solange-ii')">Solange II</a>, zwölf Jahre später, prüfte, ob diese Bedingung inzwischen erfüllt war.<br><br>Strukturell ist dies eine der klarsten frühen Formulierungen dessen, was die spätere Literatur als Verfassungspluralismus bezeichnet — nicht eine Rechtsordnung, die einer anderen schlicht befiehlt, sondern zwei Gerichte, in Luxemburg und in Karlsruhe, die jeweils in ihrem eigenen Rahmen letzte Autorität beanspruchen und durch wechselseitige Bedingungen koexistieren, statt durch eine klar festgelegte Hierarchie. Dieselbe strukturelle Konfrontation kehrt, in anderer Gestalt, Jahrzehnte später in <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> wieder.`,
     citations:[
       {phrase:"Solange der Integrationsprozeß der Gemeinschaft nicht so weit fortgeschritten ist, daß das Gemeinschaftsrecht auch einen von einem Parlament beschlossenen, in Geltung stehenden Grundrechtskatalog enthält, der dem Grundrechtskatalog des Grundgesetzes adäquat ist, ist... die Vorlage eines Gerichts der Bundesrepublik Deutschland an das Bundesverfassungsgericht im Normenkontrollverfahren zulässig und geboten", paragraphs:"Leitsatz", note:"Deutscher Originalwortlaut, wie in der Rechtsliteratur durchgehend zitiert; in dieser Sitzung wurde nur die englischsprachige Seite des Bundesverfassungsgerichts abgerufen, die deutschsprachige Originalquelle wurde nicht erneut abgeglichen.", primary:true}
     ]
   }
 }},

{id:"solange-ii", name:"Solange II", originalName:"BVerfG, Beschluss vom 22. Oktober 1986 – 2 BvR 197/83 (\"Solange II\")", citation:"BVerfGE 73, 339", jurisdiction:"BVerfGE", themes:["Fundamental rights","National constitutional identity"], articleIds:[],
 abstract:{
   issue:"Had EU law's protection of fundamental rights become good enough that Germany's Constitutional Court should stop reviewing EU secondary law against the Basic Law, as Solange I had left open?",
   rule:"As long as the European Communities, and in particular the case law of the Court of Justice, generally ensure effective protection of fundamental rights essentially equivalent to that required by the Basic Law, the Federal Constitutional Court will no longer exercise its jurisdiction to review derivative Community law against Basic Law fundamental rights.",
   application:"The Federal Constitutional Court found EU law's fundamental rights protection now adequate, and stood down its own review power over EU secondary legislation — while keeping that power in reserve, not surrendering it permanently."},
 intermediate:{
   issue:"A German company importing preserved mushrooms had an import licence application rejected under EU agricultural rules. The Bundesverwaltungsgericht, hearing its challenge, referred questions to the Court of Justice, which upheld the EU rules.<br><br>The company then complained to the Federal Constitutional Court, arguing the EU rules still breached its fundamental rights under the Basic Law — invoking the review power Solange I had kept in reserve twelve years earlier.<br><br>This gave the Federal Constitutional Court the chance to revisit its own Solange I condition: had EU law's fundamental rights protection finally caught up?",
   rule:"The Court held that it had. By 1986, the Court of Justice's own case law treated fundamental rights as general principles of Community law, member states had jointly declared their commitment to fundamental rights protection, and every member state had by then joined the European Convention on Human Rights.<br><br>Taken together, this amounted to a general standard of protection essentially equivalent to what the Basic Law itself required — even without a single written catalogue exactly matching the Basic Law's own.<br><br>So the Court changed its practice: as long as this equivalent protection continued, it would no longer review individual pieces of EU secondary legislation against Basic Law fundamental rights, and would no longer accept new referrals on that basis.",
   application:"The mushroom importer's constitutional complaint was declared inadmissible — not because its underlying argument was necessarily wrong, but because the Federal Constitutional Court had decided it would no longer entertain this kind of challenge at all, given EU law's now-adequate rights protection.<br><br>The Court's own reserve power did not disappear. It simply went dormant, conditional on EU rights protection staying adequate — the same 'so long as' logic as Solange I, now pointing the other way."},
 detailed:{
   issue:"A German company applied to import a shipment of preserved mushrooms from outside the Community, under an EU quota system for agricultural products, and had its licence application rejected.<br><br>The company challenged the rejection before the Bundesverwaltungsgericht, which referred questions on the quota system's compatibility with EU law to the Court of Justice. The Court of Justice upheld the system as compatible with EU law.<br><br>The company then brought a constitutional complaint before the Federal Constitutional Court, arguing that the EU quota rules, as interpreted and applied, still violated fundamental rights guaranteed by the Basic Law — invoking exactly the reserve power the Court had kept open in Solange I in 1974.<br><br>This gave the Federal Constitutional Court its first real opportunity to revisit the Solange I condition on its own terms: had European Community law's protection of fundamental rights developed enough, in the intervening twelve years, to satisfy the standard Solange I had set?",
   rule:`The Federal Constitutional Court held that it had. It pointed to the Court of Justice's own developed case law treating fundamental rights as general principles of Community law inspired by the constitutional traditions common to member states and by international human rights treaties; to the 1977 Joint Declaration of the European Parliament, Council, and Commission committing the Community institutions to respect fundamental rights; and to the fact that, by 1986, every member state had ratified the European Convention on Human Rights.<br><br>Taken together, the Court held, Community law — in particular through the case law of the Court of Justice — now generally ensured an effective protection of fundamental rights to be regarded, in substance, as essentially equivalent to the protection required unconditionally by the Basic Law, even though the standards did not have to be identical in every particular, and even though the Community still lacked a single codified rights catalogue of its own.<br><br>Given this, the Court reformulated its own position: as long as the European Communities, and in particular the case law of the Court of Justice, generally ensure an effective protection of fundamental rights as against the Community's own sovereign powers, essentially equivalent to the protection of fundamental rights required unconditionally by the Basic Law, and in so far as they generally safeguard the essential content of fundamental rights, the Federal Constitutional Court will no longer exercise its jurisdiction to decide on the applicability of secondary Community legislation cited as the legal basis for acts of German courts or authorities within German sovereign territory, and will no longer review such legislation against the standard of the Basic Law's fundamental rights; references to the Federal Constitutional Court under Article 100(1) of the Basic Law for that purpose are henceforth inadmissible.`,
   application:"The mushroom importer's constitutional complaint was rejected as inadmissible, since the Federal Constitutional Court had now withdrawn from reviewing individual EU measures of this kind against Basic Law fundamental rights.<br><br>The Court was careful to frame this as a standing, conditional withdrawal rather than a permanent surrender of jurisdiction: its own reserve power remained available in principle, should EU law's general level of fundamental rights protection ever fall back below the Basic Law's own standard.<br><br>In practice, Solange II marked a long truce. The Federal Constitutional Court would not seriously revisit the question until well after the Charter of Fundamental Rights became binding decades later."},
 holistic:`Solange II answered the question Solange I had left open twelve years earlier: had EU law's protection of fundamental rights finally become good enough for Germany's Constitutional Court to stand down? This time, the answer was yes.<br><br>The case didn't overrule <a class="case-link" onclick="jumpToCase('solange-i')">Solange I</a> — it fulfilled its condition. The reserve power Solange I claimed in 1974 was never renounced here; it was simply put to sleep, conditional on EU rights protection staying adequate. That structure — a national court's own review power, held in reserve rather than surrendered — proved durable. Variants of it resurfaced in later German constitutional case law testing the limits of EU integration, well beyond fundamental rights alone.<br><br>Read alongside <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, the two Solange decisions trace a full cycle: Handelsgesellschaft asserted that only EU law's own standards govern EU law's validity; Solange I said Germany would still check that assurance itself, for now; Solange II said the assurance had held up.<br><br>Structurally, this is the clearest working example of constitutional pluralism actually functioning as designed — not a single hierarchy resolving the conflict once and for all, but two courts maintaining a conditional truce, each retaining, in principle, the last word within its own legal order. The same underlying tension, unresolved by either side conceding supremacy outright, still runs through <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> today.`,
 citations:[
   {phrase:"as long as the European Communities, in particular the case law of the [Court of Justice], generally ensure an effective protection of fundamental rights... to be regarded as essentially equivalent to the protection of fundamental rights required unconditionally by the Basic Law... the Federal Constitutional Court will no longer exercise its jurisdiction to decide on the applicability of secondary Community legislation", paragraphs:"Headnote (Leitsatz) 2", note:"Official English translation, fetched directly from the Federal Constitutional Court's own website (bundesverfassungsgericht.de) — a primary source, successfully verified.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"La protection des droits fondamentaux par le droit de l'Union était-elle devenue suffisante pour que la Cour constitutionnelle fédérale allemande cesse de contrôler le droit dérivé de l'Union au regard de la Loi fondamentale, ainsi que Solange I l'avait envisagé ?",
       rule:"Tant que les Communautés européennes, et en particulier la jurisprudence de la Cour de justice, garantissent de manière générale une protection effective des droits fondamentaux substantiellement équivalente à celle exigée par la Loi fondamentale, la Cour constitutionnelle fédérale n'exercera plus son contrôle sur le droit communautaire dérivé au regard des droits fondamentaux de la Loi fondamentale.",
       application:"La Cour constitutionnelle fédérale jugea la protection des droits fondamentaux par le droit de l'Union désormais suffisante, et renonça à exercer son propre pouvoir de contrôle sur le droit dérivé de l'Union — tout en le conservant en réserve, sans y renoncer définitivement."},
     intermediate:{
       issue:"Une entreprise allemande important des champignons en conserve se vit refuser une licence d'importation en vertu de règles agricoles de l'Union. Le Bundesverwaltungsgericht, saisi du litige, posa des questions préjudicielles à la Cour de justice, qui valida les règles de l'Union.<br><br>L'entreprise saisit alors la Cour constitutionnelle fédérale, faisant valoir que ces règles violaient néanmoins ses droits fondamentaux garantis par la Loi fondamentale — invoquant le pouvoir de contrôle que Solange I avait mis en réserve douze ans plus tôt.<br><br>Cette affaire donna à la Cour constitutionnelle fédérale l'occasion de réexaminer sa propre condition posée dans Solange I : la protection des droits fondamentaux par le droit de l'Union avait-elle enfin atteint le niveau requis ?",
       rule:"La Cour jugea que oui. En 1986, la jurisprudence de la Cour de justice traitait les droits fondamentaux comme des principes généraux du droit communautaire, les États membres avaient conjointement déclaré leur attachement à la protection des droits fondamentaux, et chaque État membre avait entre-temps adhéré à la Convention européenne des droits de l'homme.<br><br>Pris ensemble, ces éléments constituaient un niveau général de protection substantiellement équivalent à celui exigé par la Loi fondamentale elle-même — même en l'absence d'un catalogue écrit unique correspondant exactement à celui de la Loi fondamentale.<br><br>La Cour modifia donc sa pratique : tant que cette protection équivalente perdurerait, elle ne contrôlerait plus les actes individuels de droit dérivé de l'Union au regard des droits fondamentaux de la Loi fondamentale, et n'accepterait plus de nouvelles saisines sur ce fondement.",
       application:"Le recours constitutionnel de l'importateur de champignons fut déclaré irrecevable — non que son argumentation fût nécessairement erronée sur le fond, mais parce que la Cour constitutionnelle fédérale avait décidé de ne plus connaître de ce type de contestation, compte tenu du niveau désormais adéquat de protection des droits fondamentaux par le droit de l'Union.<br><br>Le pouvoir de réserve de la Cour ne disparut pas pour autant. Il fut simplement mis en sommeil, sous condition du maintien d'une protection adéquate par le droit de l'Union — la même logique du « tant que » que dans Solange I, mais opérant désormais en sens inverse."},
     detailed:{
       issue:"Une entreprise allemande demanda à importer une cargaison de champignons en conserve en provenance de pays tiers, dans le cadre d'un système de contingents agricoles de l'Union, et se vit refuser sa demande de licence.<br><br>L'entreprise contesta ce refus devant le Bundesverwaltungsgericht, qui posa à la Cour de justice des questions sur la compatibilité du système de contingents avec le droit de l'Union. La Cour de justice valida le système au regard du droit de l'Union.<br><br>L'entreprise forma alors un recours constitutionnel devant la Cour constitutionnelle fédérale, soutenant que les règles de contingentement, telles qu'interprétées et appliquées, violaient néanmoins des droits fondamentaux garantis par la Loi fondamentale — invoquant précisément le pouvoir de réserve que la Cour avait maintenu ouvert dans Solange I en 1974.<br><br>Cette affaire donna à la Cour constitutionnelle fédérale sa première véritable occasion de réexaminer, à ses propres conditions, la condition posée par Solange I : la protection des droits fondamentaux par le droit communautaire avait-elle, au cours des douze années écoulées, atteint le niveau exigé par Solange I ?",
       rule:`La Cour constitutionnelle fédérale jugea que oui. Elle releva la jurisprudence désormais développée de la Cour de justice, traitant les droits fondamentaux comme des principes généraux du droit communautaire inspirés des traditions constitutionnelles communes aux États membres et des traités internationaux relatifs aux droits de l'homme ; la déclaration commune de 1977 du Parlement européen, du Conseil et de la Commission engageant les institutions communautaires à respecter les droits fondamentaux ; et le fait que, en 1986, chaque État membre avait ratifié la Convention européenne des droits de l'homme.<br><br>Pris ensemble, jugea la Cour, le droit communautaire — notamment à travers la jurisprudence de la Cour de justice — garantissait désormais, de manière générale, une protection effective des droits fondamentaux devant être regardée comme substantiellement équivalente à celle exigée inconditionnellement par la Loi fondamentale, même si les standards n'avaient pas à être identiques sur chaque point, et alors même que la Communauté ne disposait toujours pas d'un catalogue de droits codifié qui lui soit propre.<br><br>Sur cette base, la Cour reformula sa position : tant que les Communautés européennes, et en particulier la jurisprudence de la Cour de justice, garantissent de manière générale une protection effective des droits fondamentaux à l'égard des pouvoirs souverains de la Communauté, substantiellement équivalente à la protection des droits fondamentaux exigée inconditionnellement par la Loi fondamentale, et pour autant qu'elles garantissent de manière générale le contenu essentiel des droits fondamentaux, la Cour constitutionnelle fédérale n'exercera plus son contrôle sur l'applicabilité du droit communautaire dérivé invoqué comme fondement juridique d'actes des juridictions ou autorités allemandes sur le territoire de souveraineté allemand, et ne contrôlera plus un tel droit au regard des droits fondamentaux de la Loi fondamentale ; les saisines de la Cour constitutionnelle fédérale sur le fondement de l'article 100, alinéa 1, de la Loi fondamentale à cette fin sont désormais irrecevables.`,
       application:"Le recours constitutionnel de l'importateur de champignons fut rejeté comme irrecevable, la Cour constitutionnelle fédérale ayant désormais renoncé à contrôler des mesures individuelles de l'Union de ce type au regard des droits fondamentaux de la Loi fondamentale.<br><br>La Cour prit soin de présenter ce renoncement comme conditionnel et non comme un abandon définitif de compétence : son pouvoir de réserve demeurait disponible en principe, si le niveau général de protection des droits fondamentaux par le droit de l'Union venait à retomber en deçà du standard de la Loi fondamentale.<br><br>En pratique, Solange II marqua une longue trêve. La Cour constitutionnelle fédérale ne réexamina sérieusement cette question que des décennies plus tard, bien après l'entrée en vigueur de la Charte des droits fondamentaux."},
     holistic:`Solange II répondit à la question que Solange I avait laissée ouverte douze ans plus tôt : la protection des droits fondamentaux par le droit de l'Union était-elle enfin devenue suffisante pour que la Cour constitutionnelle allemande renonce à son contrôle ? Cette fois, la réponse fut positive.<br><br>Cet arrêt n'infirma pas <a class="case-link" onclick="jumpToCase('solange-i')">Solange I</a> — il en réalisa la condition. Le pouvoir de réserve revendiqué par Solange I en 1974 n'y fut jamais renié ; il fut simplement mis en sommeil, sous condition du maintien d'une protection adéquate par le droit de l'Union. Cette structure — un pouvoir de contrôle national conservé en réserve plutôt qu'abandonné — se révéla durable. Des variantes en réapparurent dans la jurisprudence constitutionnelle allemande ultérieure, testant les limites de l'intégration européenne bien au-delà des seuls droits fondamentaux.<br><br>Lu avec <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>, ce diptyque Solange trace un cycle complet : Handelsgesellschaft affirma que seul le droit de l'Union pouvait juger de sa propre validité ; Solange I répondit que l'Allemagne continuerait néanmoins à vérifier elle-même cette assurance ; Solange II constata que cette assurance avait tenu ses promesses.<br><br>Sur le plan structurel, il s'agit de l'exemple le plus net d'un pluralisme constitutionnel fonctionnant réellement comme conçu — non une hiérarchie unique réglant le conflit une fois pour toutes, mais deux juridictions maintenant une trêve conditionnelle, chacune conservant, en principe, le dernier mot au sein de son propre ordre juridique. La même tension sous-jacente, non résolue par une reconnaissance pure et simple de la primauté de l'un sur l'autre, traverse encore aujourd'hui <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>.`,
     citations:[
       {phrase:"tant que les Communautés européennes... garantissent de manière générale une protection effective des droits fondamentaux... substantiellement équivalente à celle exigée inconditionnellement par la Loi fondamentale, la Cour constitutionnelle fédérale n'exercera plus son contrôle", paragraphs:"2e phrase directrice (Leitsatz 2)", note:"Traduction non officielle de la traduction anglaise officielle du Bundesverfassungsgericht (source primaire vérifiée) — le texte allemand original n'a pas été consulté séparément dans cette session.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"War der unionsrechtliche Grundrechtsschutz inzwischen ausreichend geworden, sodass das Bundesverfassungsgericht, wie in Solange I offengelassen, seine Kontrolle abgeleiteten Gemeinschaftsrechts am Maßstab des Grundgesetzes einstellen sollte?",
       rule:"Solange die Europäischen Gemeinschaften, insbesondere die Rechtsprechung des Gerichtshofs, einen wirksamen Schutz der Grundrechte generell gewährleisten, der dem vom Grundgesetz gebotenen Schutz im Wesentlichen gleichzuachten ist, wird das Bundesverfassungsgericht seine Gerichtsbarkeit über abgeleitetes Gemeinschaftsrecht am Maßstab der Grundrechte des Grundgesetzes nicht mehr ausüben.",
       application:"Das Bundesverfassungsgericht befand den unionsrechtlichen Grundrechtsschutz nunmehr für ausreichend und stellte seine eigene Prüfungsbefugnis über abgeleitetes Gemeinschaftsrecht zurück — behielt sie jedoch in Reserve, statt endgültig darauf zu verzichten."},
     intermediate:{
       issue:"Einem deutschen Unternehmen, das Importe konservierter Pilze anmeldete, wurde eine Einfuhrlizenz nach unionsrechtlichen Agrarvorschriften versagt. Das Bundesverwaltungsgericht legte dem Gerichtshof entsprechende Fragen vor, der die Unionsvorschriften bestätigte.<br><br>Das Unternehmen erhob daraufhin Verfassungsbeschwerde beim Bundesverfassungsgericht und machte geltend, die Unionsvorschriften verletzten dennoch seine Grundrechte aus dem Grundgesetz — und berief sich damit auf die Prüfungsbefugnis, die Solange I zwölf Jahre zuvor in Reserve gehalten hatte.<br><br>Dies gab dem Bundesverfassungsgericht Gelegenheit, seine eigene Solange-I-Bedingung zu überprüfen: Hatte der unionsrechtliche Grundrechtsschutz inzwischen aufgeholt?",
       rule:"Das Gericht bejahte dies. Bis 1986 behandelte die Rechtsprechung des Gerichtshofs Grundrechte als allgemeine Grundsätze des Gemeinschaftsrechts, die Mitgliedstaaten hatten sich gemeinsam zum Grundrechtsschutz bekannt, und mittlerweile war jeder Mitgliedstaat der Europäischen Menschenrechtskonvention beigetreten.<br><br>Zusammengenommen entsprach dies einem allgemeinen Schutzniveau, das dem vom Grundgesetz selbst geforderten im Wesentlichen gleichzuachten war — auch ohne einen einzigen geschriebenen Katalog, der dem des Grundgesetzes genau entspräche.<br><br>Das Gericht änderte daher seine Praxis: Solange dieser gleichwertige Schutz fortbestehe, werde es einzelne Akte abgeleiteten Gemeinschaftsrechts nicht mehr am Maßstab der Grundrechte des Grundgesetzes prüfen und keine neuen Vorlagen auf dieser Grundlage mehr annehmen.",
       application:"Die Verfassungsbeschwerde des Pilzimporteurs wurde als unzulässig verworfen — nicht weil ihr Vorbringen in der Sache notwendig unbegründet war, sondern weil das Bundesverfassungsgericht entschieden hatte, derartige Rügen angesichts des nunmehr angemessenen unionsrechtlichen Grundrechtsschutzes generell nicht mehr zu prüfen.<br><br>Die eigene Reservebefugnis des Gerichts verschwand dadurch nicht. Sie wurde lediglich stillgelegt, unter der Bedingung, dass der unionsrechtliche Grundrechtsschutz angemessen bleibe — dieselbe 'Solange'-Logik wie in Solange I, nun in umgekehrter Richtung."},
     detailed:{
       issue:"Ein deutsches Unternehmen beantragte die Einfuhr einer Lieferung konservierter Pilze aus einem Drittland im Rahmen eines unionsrechtlichen Kontingentsystems für Agrarerzeugnisse und erhielt einen ablehnenden Bescheid.<br><br>Das Unternehmen focht die Ablehnung vor dem Bundesverwaltungsgericht an, das dem Gerichtshof Fragen zur Vereinbarkeit des Kontingentsystems mit dem Gemeinschaftsrecht vorlegte. Der Gerichtshof bestätigte das System als mit dem Gemeinschaftsrecht vereinbar.<br><br>Das Unternehmen erhob daraufhin Verfassungsbeschwerde beim Bundesverfassungsgericht und machte geltend, die Kontingentvorschriften verletzten, so wie ausgelegt und angewandt, dennoch Grundrechte des Grundgesetzes — und berief sich damit genau auf die Reservebefugnis, die das Gericht 1974 in Solange I offengehalten hatte.<br><br>Damit erhielt das Bundesverfassungsgericht erstmals wirklich Gelegenheit, die Solange-I-Bedingung aus eigener Sicht zu überprüfen: Hatte sich der gemeinschaftsrechtliche Grundrechtsschutz in den zwölf dazwischenliegenden Jahren so weit entwickelt, dass er dem von Solange I aufgestellten Maßstab genügte?",
       rule:`Das Bundesverfassungsgericht bejahte dies. Es verwies auf die inzwischen entwickelte Rechtsprechung des Gerichtshofs, die Grundrechte als allgemeine Grundsätze des Gemeinschaftsrechts behandelt, inspiriert von den gemeinsamen Verfassungsüberlieferungen der Mitgliedstaaten und von völkerrechtlichen Menschenrechtsverträgen; auf die Gemeinsame Erklärung von 1977 des Europäischen Parlaments, des Rates und der Kommission, mit der sich die Gemeinschaftsorgane zur Achtung der Grundrechte verpflichteten; sowie auf den Umstand, dass bis 1986 jeder Mitgliedstaat die Europäische Menschenrechtskonvention ratifiziert hatte.<br><br>Zusammengenommen, so das Gericht, gewährleiste das Gemeinschaftsrecht — insbesondere durch die Rechtsprechung des Gerichtshofs — nunmehr generell einen wirksamen Grundrechtsschutz, der im Wesentlichen dem vom Grundgesetz unabdingbar geforderten Schutz gleichzuachten sei, auch wenn die Maßstäbe nicht in jedem Einzelpunkt identisch sein müssten und die Gemeinschaft weiterhin über keinen eigenen kodifizierten Grundrechtskatalog verfüge.<br><br>Auf dieser Grundlage formulierte das Gericht seine Position neu: Solange die Europäischen Gemeinschaften, insbesondere die Rechtsprechung des Gerichtshofs, einen wirksamen Schutz der Grundrechte gegenüber der Hoheitsgewalt der Gemeinschaften generell gewährleisten, der dem vom Grundgesetz unabdingbar gebotenen Grundrechtsschutz im Wesentlichen gleichzuachten ist, und soweit sie den jeweiligen Wesensgehalt der Grundrechte generell verbürgen, wird das Bundesverfassungsgericht seine Gerichtsbarkeit über die Anwendbarkeit von abgeleitetem Gemeinschaftsrecht, das als Rechtsgrundlage für ein Verhalten deutscher Gerichte oder Behörden im Hoheitsgebiet der Bundesrepublik Deutschland angeführt wird, nicht mehr ausüben und dieses Recht nicht mehr am Maßstab der Grundrechte des Grundgesetzes messen; Vorlagen an das Bundesverfassungsgericht nach Artikel 100 Absatz 1 des Grundgesetzes zu diesem Zweck sind fortan unzulässig.`,
       application:"Die Verfassungsbeschwerde des Pilzimporteurs wurde als unzulässig verworfen, da das Bundesverfassungsgericht die Prüfung einzelner unionsrechtlicher Maßnahmen dieser Art am Maßstab der Grundrechte des Grundgesetzes nunmehr eingestellt hatte.<br><br>Das Gericht stellte dies ausdrücklich als bedingten, nicht als endgültigen Verzicht auf seine Zuständigkeit dar: Seine Reservebefugnis blieb grundsätzlich bestehen, sollte das allgemeine Schutzniveau der Grundrechte im Unionsrecht jemals wieder unter den Standard des Grundgesetzes fallen.<br><br>In der Praxis markierte Solange II einen langen Waffenstillstand. Das Bundesverfassungsgericht befasste sich ernsthaft erst Jahrzehnte später wieder mit dieser Frage, lange nachdem die Grundrechtecharta verbindlich geworden war."},
     holistic:`Solange II beantwortete die Frage, die Solange I zwölf Jahre zuvor offengelassen hatte: War der unionsrechtliche Grundrechtsschutz inzwischen ausreichend geworden, damit das deutsche Verfassungsgericht seine Kontrolle einstellt? Diesmal lautete die Antwort: ja.<br><br>Die Entscheidung hob <a class="case-link" onclick="jumpToCase('solange-i')">Solange I</a> nicht auf — sie erfüllte dessen Bedingung. Die 1974 in Solange I beanspruchte Reservebefugnis wurde hier niemals aufgegeben; sie wurde lediglich stillgelegt, unter der Bedingung, dass der unionsrechtliche Grundrechtsschutz angemessen bleibe. Diese Struktur — eine nationale Prüfungsbefugnis, die in Reserve gehalten statt aufgegeben wird — erwies sich als dauerhaft. Varianten davon tauchten in der späteren deutschen Verfassungsrechtsprechung wieder auf, die die Grenzen der europäischen Integration weit über den Grundrechtsschutz hinaus auslotete.<br><br>Zusammen mit <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> gelesen, zeichnen die beiden Solange-Entscheidungen einen vollständigen Kreis nach: Handelsgesellschaft behauptete, nur das Gemeinschaftsrecht selbst könne über seine eigene Gültigkeit urteilen; Solange I entgegnete, Deutschland werde diese Zusicherung vorerst dennoch selbst überprüfen; Solange II stellte fest, dass sich diese Zusicherung bewährt hatte.<br><br>Strukturell ist dies das klarste Beispiel eines tatsächlich funktionierenden Verfassungspluralismus — keine einzige Hierarchie, die den Konflikt endgültig löst, sondern zwei Gerichte, die einen bedingten Waffenstillstand aufrechterhalten und sich jeweils grundsätzlich das letzte Wort innerhalb der eigenen Rechtsordnung vorbehalten. Dieselbe zugrunde liegende Spannung, von keiner Seite durch einen uneingeschränkten Vorrangverzicht aufgelöst, durchzieht bis heute <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>.`,
     citations:[
       {phrase:"soweit die Europäischen Gemeinschaften, insbesondere die Rechtsprechung des Europäischen Gerichtshofes, einen wirksamen Schutz der Grundrechte gegenüber der Hoheitsgewalt der Gemeinschaften generell gewährleisten, der dem vom Grundgesetz als unabdingbar gebotenen Grundrechtsschutz im wesentlichen gleichzuachten ist... wird das Bundesverfassungsgericht seine Gerichtsbarkeit über die Anwendbarkeit von abgeleitetem Gemeinschaftsrecht... nicht mehr ausüben", paragraphs:"Leitsatz 2", note:"Deutscher Originalwortlaut, wie in der Rechtsliteratur durchgehend zitiert; in dieser Sitzung wurde nur die englischsprachige Seite des Bundesverfassungsgerichts abgerufen, die deutschsprachige Originalquelle wurde nicht erneut abgeglichen.", primary:true}
     ]

{id:"grzelczyk", name:"Grzelczyk", originalName:"Rudy Grzelczyk contre Centre public d'aide sociale d'Ottignies-Louvain-la-Neuve", citation:"Case C-184/99", jurisdiction:"CJCE", themes:["Citizenship / free movement"], legacyThemes:["Solidarity"], articleIds:["art18tfeu","art21tfeu","dir9396"],
 abstract:{
   issue:"Can a national of one member state, lawfully resident as a student in another, rely on EU citizenship to claim the same social assistance as the host state's own nationals?",
   rule:"Union citizenship is destined to be the fundamental status of nationals of the member states, entitling those who find themselves in the same situation to equal treatment under the law irrespective of nationality, subject only to the exceptions expressly provided for.",
   application:"Because Grzelczyk was lawfully resident in Belgium as a student, he could invoke the non-discrimination principle attached to that citizenship status, and Belgium could not deny him the minimex solely because he was not Belgian."},
 intermediate:{
   issue:"Rudy Grzelczyk, a French national, moved to Belgium in 1995 to study physical education at the Catholic University of Louvain-la-Neuve. He financed his first three years of study himself, through minor jobs and credit facilities, without relying on any Belgian social benefit.<br><br>His fourth and final year left him no comparable opportunity to work, so he applied to the local public social assistance centre (the CPAS) for the minimex, Belgium's minimum subsistence allowance. The CPAS granted it — but was then told by the responsible Belgian minister that it would not be reimbursed for the cost, since Grzelczyk, as a foreign student, did not fall within any category Belgian law recognised as entitled to the minimex. The CPAS withdrew the benefit on the same ground.<br><br>Grzelczyk challenged the withdrawal before a Belgian labour tribunal, which asked the Court of Justice whether EU citizenship and free-movement law required Belgium to treat him the same as a Belgian student in his position.",
   rule:"The Court held that a citizen of the Union lawfully resident in another member state, as Grzelczyk was, falls within the Treaty's protection against nationality discrimination without needing to show any separate economic link to the host state.<br><br>It went further, describing Union citizenship as 'destined to be the fundamental status of nationals of the Member States,' entitling those in the same situation to the same legal treatment regardless of nationality. On that basis, Belgium could not condition a benefit like the minimex, for a lawfully resident national of another member state, on qualifying as a 'worker' — a condition it did not impose on its own nationals.<br><br>The Directive governing Grzelczyk's right of residence as a student did not itself guarantee him the minimex, but nor did it stop him from turning to Belgian social assistance once genuine, temporary difficulties arose — the Directive itself accepted, in the Court's words, 'a certain degree of financial solidarity' between host-state nationals and nationals of other member states.",
   application:"Grzelczyk was entitled to the minimex on the same footing as a Belgian student in his position; his nationality alone could not justify the withdrawal.<br><br>The ruling did not give economically inactive citizens an unconditional claim on host-state welfare — states can still require proof of sufficient resources up front, and can still act once a student's recourse to public assistance stops looking merely temporary."},
 detailed:{
   issue:"Rudy Grzelczyk, a French national, began a course of university studies in physical education at the Catholic University of Louvain-la-Neuve in 1995, and took up residence in Belgium for that purpose. During his first three years of study he financed himself through a series of minor jobs and credit facilities, without recourse to any Belgian social benefit.<br><br>His fourth and final year of study, in 1998-99, was more demanding, leaving him no comparable opportunity to work. He applied to the Centre public d'aide sociale (CPAS) of Ottignies-Louvain-la-Neuve for the minimex, Belgium's non-contributory minimum subsistence allowance. The CPAS granted it from 5 October 1998.<br><br>Belgian law ordinarily entitled the CPAS to a 50% reimbursement from the federal state for minimex it paid out, but the competent minister refused reimbursement on the ground that Grzelczyk, as a foreign student, did not fall within any of the categories — Belgian nationals, stateless persons, refugees, or persons covered by Regulation No 1612/68 on the free movement of workers — that Belgian law required for entitlement to the minimex. Faced with that refusal, the CPAS itself decided to withdraw Grzelczyk's minimex, with effect from 1 January 1999, on the same ground.<br><br>Grzelczyk challenged the withdrawal before the Tribunal du travail de Nivelles, which stayed the proceedings and referred two questions to the Court of Justice under Article 234 EC, asking about the interpretation of Articles 6, 8 and 8a of the EC Treaty — respectively the general non-discrimination principle, Union citizenship, and the right to move and reside freely — together with Council Directive 93/96/EEC on the right of residence for students.",
   rule:`The Court began by confirming that a national of one member state lawfully residing in another, as Grzelczyk was under Directive 93/96, falls within the scope ratione materiae of the Treaty for the purposes of the non-discrimination principle in Article 6 EC, without needing to show any further economic link to the host state such as worker status.<br><br>It then set out what has become the case's defining statement: Union citizenship, introduced by Article 8 EC, "is destined to be the fundamental status of nationals of the Member States, enabling those who find themselves in the same situation to enjoy the same treatment in law irrespective of their nationality, subject to such exceptions as are expressly provided for" (para. 31). On that basis, Articles 6 and 8 EC precluded a member state from making entitlement to a non-contributory benefit like the minimex conditional, for nationals of other member states who are lawfully resident, on their falling within the scope of Regulation No 1612/68, when no equivalent condition applied to the host state's own nationals.<br><br>On Directive 93/96 specifically, the Court held that while the Directive itself confers no right to the minimex, nor does it preclude a student who is lawfully resident from subsequently having recourse to the host state's social assistance scheme. A member state may require, as a condition of the initial right of residence, a declaration that the student has sufficient resources not to become a burden — but that assessment falls to be made only at the moment the declaration is made, since a student's financial position may change over time for reasons beyond their control. Read together with the parallel Directives 90/364 and 90/365 on the right of residence for other economically inactive citizens, Directive 93/96 "thus accepts a certain degree of financial solidarity between nationals of a host Member State and nationals of other Member States, particularly if the difficulties which a beneficiary of the right of residence encounters are temporary" (para. 44).`,
   application:"Grzelczyk was entitled to the minimex on the same footing as a Belgian student in an identical position; the CPAS and the responsible minister could not withdraw it solely because he was French.<br><br>The judgment did not strip host states of every means of controlling the fiscal exposure of their welfare systems to non-national students — a state remains free to attach a sufficient-resources declaration to the initial grant of residence, and Directive 93/96 (like its 2004/38 successor) still allows a host state to draw consequences from a student's subsequent recourse to social assistance. What Grzelczyk forecloses is treating nationality itself, rather than an individualised assessment of resources or a change in circumstances, as the operative distinction."},
 holistic:`Grzelczyk was decided in September 2001, nine years after the Maastricht Treaty had introduced Union citizenship into Article 8 EC, without much sense at the time of how far the concept might reach. Until then, EU free-movement law had largely spoken the language of market participants — workers, the self-employed, providers and recipients of services — the same paradigm <a class="case-link" onclick="jumpToCase('konstantinidis')">Konstantinidis</a> had tested only eight years earlier through the narrower lens of freedom of establishment.<br><br>Grzelczyk broke from that paradigm directly: its holding does not depend on Grzelczyk being any kind of economic actor at all. He is a student, financially dependent for one year on the host state's own welfare system, and the Court's non-discrimination reasoning runs instead through citizenship itself. Paragraph 31's language — citizenship as the "fundamental status" of member state nationals — is now among the most quoted lines in the Court's entire case law, and supplied the doctrinal opening that later citizenship judgments, including <span class="case-link-pending" title="Not yet added to Casus">Zhu and Chen</span>, would build on in different factual settings.<br><br>The Court did not, however, hand economically inactive citizens an unconditional claim on host-state welfare systems. Its "certain degree of financial solidarity" formula in paragraph 44 draws a deliberately narrow line: solidarity is expected for temporary difficulties, not indefinitely, and Directive 93/96 (and its successors) still let host states reassess residence once that recourse to assistance stops looking temporary. That unresolved boundary — how much solidarity a host state owes a citizen who migrated for reasons unconnected to work — is what later welfare-tourism disputes under the Citizens' Rights Directive would go on to litigate.<br><br>Structurally, Grzelczyk sits alongside <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne</a> and <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> as another case where the Court read a Treaty provision as reaching further than its drafters' immediate expectations — there, into horizontal and vertical direct effect for equal treatment; here, into a citizenship-based equality right untethered from market participation.`,
