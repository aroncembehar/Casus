     holistic:`Kadi II fut rendu en 2013, cinq ans après <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>, la même année que <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>. Cette coïncidence de calendrier n'est pas anodine : la Cour défendait, la même année, à la fois l'autonomie de l'Union face à l'ONU (Kadi II) et sa propre primauté interne face aux normes constitutionnelles nationales (Melloni).<br><br>Cet arrêt constitue la suite directe de Kadi I. Là où Kadi I fixait la norme, Kadi II vérifie si les institutions de l'Union l'avaient effectivement respectée. Ce n'était pas le cas.<br><br>Des arrêts ultérieurs, dans le domaine des sanctions et du terrorisme, continuèrent d'affiner exactement quelle part de preuve doit être divulguée, et comment — ce domaine du droit de l'Union demeure vivant et en constante évolution.<br><br>Sur le plan structurel, Kadi I et Kadi II forment ensemble l'exemple le plus net de l'Union affirmant un contrôle des droits fondamentaux sur des mesures mettant en œuvre des obligations internationales contraignantes — sans doute la limite extrême de la portée de l'autonomie juridique de l'Union.`,
     citations:[
       {phrase:"n'est pas écartée par le caractère international ou sensible sur le plan sécuritaire de la mesure sous-jacente", paragraphs:"solution générale, paragraphe précis non confirmé de manière indépendante", note:"Traduction non officielle du texte anglais vérifié, dont la note d'origine signale déjà l'incertitude : aucun numéro de paragraphe précis n'a pu être corroboré par une source indépendante pour cet arrêt de 2013 — à traiter comme une référence non confirmée en attendant une vérification directe du texte du jugement.", primary:false}
     ]
   },
   de:{
     abstract:{
       issue:"Nachdem die Union versucht hatte, die von Kadi I festgestellten Verfahrensmängel zu beheben, war das überarbeitete Listungsverfahren nunmehr ausreichend?",
       rule:"Der Gerichtshof bekräftigte seinen in Kadi I aufgestellten Maßstab der vollständigen gerichtlichen Überprüfung und verlangte, dass zumindest gewisse Beweise, nicht nur eine unbelegte Zusammenfassung der Gründe, eine Listungsentscheidung tatsächlich stützen müssen.",
       application:"Die von der Kommission erneut vorgenommene Listung von Herrn Kadi wurde erneut für nichtig erklärt, da sie sich weiterhin auf unbelegte Behauptungen stützte, die er keine wirkliche Gelegenheit hatte zu widerlegen."},
     intermediate:{
       issue:"Nach Kadi I unternahm die Kommission einen neuen Versuch. Sie fror die Vermögenswerte von Herrn Kadi erneut ein, teilte ihm diesmal jedoch eine „Zusammenfassung der Gründe“ der UNO mit und gab ihm zuvor Gelegenheit zur Stellungnahme.<br><br>Herr Kadi focht auch diese neue Listung an, und das Gericht gab ihm erneut recht — es befand, die Zusammenfassung der Gründe sei weiterhin zu vage, und Herr Kadi könne sich weiterhin nicht ordnungsgemäß verteidigen.<br><br>Die Kommission, der Rat und das Vereinigte Königreich legten Rechtsmittel ein und machten geltend, die Gerichte verlangten angesichts des sicherheitsrelevanten Charakters dieses Bereichs zu viel.",
       rule:"Der Gerichtshof bestätigte seinen eigenen, in Kadi I aufgestellten Maßstab: Die Gerichte müssen unionsrechtliche Sanktionsmaßnahmen vollständig am Maßstab der Grundrechte überprüfen.<br><br>Dies gilt auch in sicherheitsrelevanten Fällen. Ein sicherheitsrelevanter Bereich senkt den Prüfungsmaßstab nicht, kann aber rechtfertigen, dass tatsächlich sensible Beweise nicht offengelegt werden.",
       application:"Die meisten konkreten Vorwürfe gegen Herrn Kadi wurden auch nach seiner Anfechtung nie durch tatsächliche Beweise belegt.<br><br>Die erneut vorgenommene Listung wurde daher erneut für nichtig erklärt — das zweite Mal, dass die Vermögenswerte von Herrn Kadi durch Unionsgerichte freigegeben wurden."},
     detailed:{
       issue:"Nachdem Kadi I das ursprüngliche Einfrieren aufgehoben hatte, unternahm die Kommission ein neues Verfahren. Sie teilte Herrn Kadi die vom UN-Sanktionsausschuss veröffentlichte „Zusammenfassung der Gründe“ mit und lud ihn zur Stellungnahme ein, bevor über die Aufrechterhaltung des Einfrierens auf Unionsebene entschieden wurde.<br><br>Herr Kadi focht auch diese zweite Listung an. 2010 erklärte das Gericht sie in einem gesonderten Urteil (Kadi/Kommission) erneut für nichtig. Es befand, die Zusammenfassung der Gründe sei weiterhin zu vage, sodass sich Herr Kadi weiterhin nicht ordnungsgemäß verteidigen könne, und erklärte, der sicherheitsrelevante Charakter von Terrorismusfällen senke diesen Prüfungsmaßstab nicht.<br><br>Die Kommission, der Rat und das Vereinigte Königreich legten beim Gerichtshof Rechtsmittel ein und machten geltend, der vom Gericht angelegte Maßstab sei angesichts der Abhängigkeit dieses Bereichs von internationaler Sicherheitszusammenarbeit unrealistisch.",
       rule:`Der Gerichtshof, tagend als Große Kammer, wies die Rechtsmittel zurück und bestätigte seinen eigenen Ansatz aus Kadi I.<br><br>Die Unionsgerichte müssen die Rechtmäßigkeit sämtlicher Unionsmaßnahmen am Maßstab der Grundrechte überprüfen, grundsätzlich vollständig — auch Maßnahmen im Bereich der Sanktionen und des Terrorismus. Diese Pflicht verringert sich nicht allein deshalb, weil die zugrunde liegende Maßnahme internationalen oder sicherheitsrelevanten Charakter hat.<br><br>Der Gerichtshof erkannte an, dass tatsächlich sensible Beweise der betroffenen Person nicht immer offengelegt werden müssen — die Gerichte können nichtöffentliche Verfahren nutzen, um solche Beweise vertraulich zu prüfen.<br><br>Zumindest der wesentliche Gehalt der Gründe und Beweise muss jedoch in einer Weise mitgeteilt werden, die es der betroffenen Person ermöglicht, sich tatsächlich zu verteidigen. Eine Listung kann nicht allein auf bloßen Behauptungen beruhen, die die Regierung oder der UN-Ausschuss bei Anfechtung nicht belegen wollen oder können.`,
       application:"Die meisten konkreten Vorwürfe, auf denen die Listung von Herrn Kadi beruhte, wurden auch nach seiner unmittelbaren Anfechtung nie durch offengelegte Beweise belegt.<br><br>Das erneut verhängte Einfrieren seiner Vermögenswerte wurde daher ein zweites Mal für nichtig erklärt. Zusammen gelesen bilden Kadi I und Kadi II eine zweiteilige Doktrin: Die Unionsrechtsordnung wird Sanktionen stets am Maßstab der Grundrechte überprüfen, ungeachtet internationalen Drucks (Kadi I), und diese Überprüfung hat echte Durchsetzungskraft — eine unbelegte Listung übersteht sie kein zweites Mal (Kadi II)."},
     holistic:`Kadi II erging 2013, fünf Jahre nach <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>, im selben Jahr wie <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>. Dieser zeitliche Zusammenhang ist bedeutsam: Der Gerichtshof verteidigte im selben Jahr sowohl die Autonomie der Union gegenüber der UNO (Kadi II) als auch ihren eigenen internen Vorrang gegenüber nationalen Verfassungsstandards (Melloni).<br><br>Dieses Urteil ist die unmittelbare Fortsetzung von Kadi I. Wo Kadi I den Maßstab festlegte, prüfte Kadi II, ob die Unionsorgane ihn tatsächlich erfüllt hatten. Das hatten sie nicht.<br><br>Spätere Urteile im Bereich der Sanktionen und des Terrorismus verfeinerten weiter, wie viele Beweise offengelegt werden müssen und wie — dieser Bereich des Unionsrechts bleibt lebendig und in Entwicklung.<br><br>Strukturell sind Kadi I und Kadi II zusammen das klarste Beispiel dafür, dass die Union eine Grundrechtsprüfung über Maßnahmen zur Umsetzung verbindlicher internationaler Verpflichtungen beansprucht — wohl die äußerste Grenze der Reichweite unionsrechtlicher Autonomie.`,
     citations:[
       {phrase:"wird nicht durch den internationalen oder sicherheitsrelevanten Charakter der zugrunde liegenden Maßnahme verdrängt", paragraphs:"allgemeine Feststellung, genaue Randnummer nicht eigenständig bestätigt", note:"Inoffizielle Übersetzung des verifizierten englischen Textes, dessen eigene Anmerkung die Unsicherheit bereits vermerkt: Für diesen Text des Gerichtshofs von 2013 konnte keine genaue Randnummer aus unabhängigen Quellen bestätigt werden — als unbestätigte Angabe zu behandeln, bis eine direkte Überprüfung anhand des Urteilstextes erfolgt.", primary:false}
     ]
   },
   it:{
     abstract:{
       issue:"Dopo che l'Unione aveva tentato di correggere i vizi procedurali rilevati in Kadi I, la procedura di iscrizione rivista era ora sufficiente?",
       rule:"La Corte riaffermò lo standard di controllo giurisdizionale completo fissato in Kadi I, ed esigette che almeno alcuni elementi di prova, e non un semplice riassunto non comprovato dei motivi, sostenessero effettivamente una decisione di iscrizione.",
       application:"La nuova iscrizione del sig. Kadi da parte della Commissione fu nuovamente annullata, poiché si fondava ancora su accuse non comprovate che egli non aveva avuto alcuna reale possibilità di contestare."},
     intermediate:{
       issue:"Dopo Kadi I, la Commissione riprovò. Essa congelò nuovamente i beni del sig. Kadi, comunicandogli questa volta un «riassunto dei motivi» proveniente dall'ONU e dandogli la possibilità di rispondere preventivamente.<br><br>Il sig. Kadi contestò anche questa nuova iscrizione, e il Tribunale gli diede nuovamente ragione — esso ritenne il riassunto dei motivi ancora troppo vago, e stimò che il sig. Kadi non potesse ancora difendersi correttamente.<br><br>La Commissione, il Consiglio e il Regno Unito proposero impugnazione, sostenendo che i giudici esigessero troppo, trattandosi di un settore sensibile in materia di sicurezza.",
       rule:"La Corte di giustizia confermò il proprio standard fissato in Kadi I: i giudici devono esercitare un controllo completo delle misure sanzionatorie dell'Unione alla luce dei diritti fondamentali.<br><br>Ciò vale anche nei casi sensibili in materia di sicurezza. Un settore sensibile sul piano della sicurezza non abbassa lo standard di controllo, anche se può giustificare la mancata divulgazione di elementi di prova effettivamente sensibili.",
       application:"La maggior parte delle accuse specifiche contro il sig. Kadi non fu mai suffragata da elementi di prova concreti, anche dopo che egli le aveva contestate.<br><br>L'iscrizione riadottata fu quindi annullata di nuovo — la seconda volta che i beni del sig. Kadi furono sbloccati grazie ai giudici dell'Unione."},
     detailed:{
       issue:"Dopo che Kadi I aveva annullato il congelamento originario, la Commissione tentò una nuova procedura. Essa comunicò al sig. Kadi il «riassunto dei motivi» pubblicato dal Comitato per le sanzioni dell'ONU, e lo invitò a presentare osservazioni prima di decidere se mantenere il congelamento a livello dell'Unione.<br><br>Il sig. Kadi contestò anche questa seconda iscrizione. Nel 2010, il Tribunale la annullò di nuovo, con una sentenza distinta (Kadi contro Commissione). Esso ritenne il riassunto dei motivi ancora troppo vago, il che significava che il sig. Kadi non poteva ancora difendersi correttamente, e affermò che la natura sensibile, sul piano della sicurezza, delle cause di terrorismo non abbassava questo standard di controllo.<br><br>La Commissione, il Consiglio e il Regno Unito proposero impugnazione dinanzi alla Corte di giustizia, sostenendo che lo standard adottato dal Tribunale fosse irrealistico, dato che questo settore dipende dalla cooperazione internazionale in materia di sicurezza.",
       rule:`La Corte di giustizia, riunita in grande sezione, respinse le impugnazioni, confermando il proprio approccio adottato in Kadi I.<br><br>I giudici dell'Unione devono controllare la legittimità di tutte le misure dell'Unione alla luce dei diritti fondamentali, in linea di principio integralmente — comprese le misure nel settore delle sanzioni e del terrorismo. Questo obbligo non si riduce per il solo fatto che la misura sottostante abbia carattere internazionale o sia sensibile sul piano della sicurezza.<br><br>La Corte ammise che elementi di prova effettivamente sensibili non devono sempre essere mostrati alla persona interessata — i giudici possono ricorrere a procedure riservate per valutare tali elementi in modo confidenziale.<br><br>Ma quantomeno la sostanza dei motivi e delle prove deve essere comunicata, in un modo che consenta alla persona di difendersi effettivamente. Un'iscrizione non può reggersi su semplici affermazioni che il governo o il comitato dell'ONU non vogliano o non possano suffragare una volta contestate.`,
       application:"La maggior parte delle accuse specifiche alla base dell'iscrizione del sig. Kadi non fu mai suffragata da alcuna prova divulgata, anche dopo che egli le aveva direttamente contestate.<br><br>Il congelamento riadottato dei suoi beni fu quindi annullato una seconda volta. Lette insieme, Kadi I e Kadi II formano una dottrina in due parti: l'ordinamento giuridico dell'Unione controllerà sempre le sanzioni alla luce dei diritti fondamentali, indipendentemente dalla pressione internazionale (Kadi I), e tale controllo ha una portata reale — un'iscrizione non comprovata non vi resiste due volte (Kadi II)."},
     holistic:`Kadi II fu decisa nel 2013, cinque anni dopo <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>, lo stesso anno di <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>. Questa coincidenza temporale non è casuale: la Corte difendeva, nello stesso anno, sia l'autonomia dell'Unione nei confronti dell'ONU (Kadi II) sia il proprio primato interno nei confronti degli standard costituzionali nazionali (Melloni).<br><br>Questa causa è il seguito diretto di Kadi I. Laddove Kadi I fissava lo standard, Kadi II verifica se le istituzioni dell'Unione l'avessero effettivamente rispettato. Non era così.<br><br>Cause successive nel settore delle sanzioni e del terrorismo hanno continuato ad affinare esattamente quante prove debbano essere divulgate, e come — questo settore del diritto dell'Unione resta vivo e in evoluzione.<br><br>Sul piano strutturale, Kadi I e Kadi II insieme costituiscono l'esempio più netto dell'Unione che rivendica un controllo dei diritti fondamentali su misure di attuazione di obblighi internazionali vincolanti — probabilmente il limite estremo della portata dell'autonomia giuridica dell'Unione.`,
     citations:[
       {phrase:"non è escluso dal carattere internazionale o sensibile sul piano della sicurezza della misura sottostante", paragraphs:"principio generale, punto preciso non confermato in modo indipendente", note:"Traduzione non ufficiale del testo inglese verificato, la cui nota originale segnala già l'incertezza: per questo testo della Corte di giustizia del 2013 non è stato possibile confermare un numero di punto preciso tramite fonti indipendenti — da trattare come riferimento non confermato in attesa di una verifica diretta sul testo della sentenza.", primary:false}
     ]
   }
 }},
{id:"vangend", name:"Van Gend en Loos", originalName:"N.V. Algemene Transport- en Expeditie Onderneming van Gend & Loos v Nederlandse Administratie der Belastingen", citation:"Case 26/62", jurisdiction:"CJCE", themes:["Competences / legal basis","Legal order / primacy / direct effect"], articleIds:["art30tfeu"],
 abstract:{
   issue:"Could a private company invoke a Treaty provision directly against the Dutch customs authority?",
   rule:"A Treaty provision that is clear, precise and unconditional produces direct effect regardless of implementing legislation.",
   application:"Van Gend en Loos could rely on the Treaty article directly against the state."},
 intermediate:{
   issue:"Van Gend en Loos imported a chemical product from Germany into the Netherlands. Dutch customs placed it in a tariff category carrying a higher duty than before the EEC Treaty took effect in 1958.<br><br>The company argued this breached Article 12 EEC. That article stopped member states introducing new duties, or raising existing ones, between themselves.<br><br>The Dutch tribunal asked the Court of Justice whether a private company could rely on this Treaty article directly, even though the Treaty seemed to bind only states.",
   rule:"The Court said the EEC Treaty was not an ordinary agreement between states. It created a new legal order.<br><br>States had limited their own sovereign rights under it, in certain fields. This new order didn't just bind states. It also had individuals as its subjects.<br><br>So a Treaty provision could give people rights directly, if it was clear, precise, and unconditional, and needed no further national law to work.",
   application:"Article 12 met that test. So Van Gend en Loos could rely on it directly before the Dutch tribunal, without waiting for Dutch implementing legislation."},
 detailed:{
   issue:"Van Gend en Loos, a Dutch company, imported a chemical product from Germany. Dutch customs reclassified it under the tariff, into a category with a higher duty than before the EEC Treaty took effect in 1958.<br><br>The company said this reclassification broke Article 12 EEC. That article was a standstill clause. It stopped member states raising customs duties between each other.<br><br>The referring tribunal asked the Court whether a private individual could invoke Article 12 directly. On its face, the Treaty seemed to impose obligations only on states, not individuals.",
   rule:`The Court's answer became the most famous passage in EU law. It held the EEC Treaty was more than an ordinary international agreement.<br><br>It created a new legal order of international law. For its benefit, states had limited their sovereign rights, in limited fields. This order's subjects were not just the member states. They included their nationals too.<br><br>So EU law could give people rights independently of national legislation. National courts had a duty to protect those rights. This depended on the provision being clear, precise, and unconditional, and leaving states no real room for discretion.<br><br>This single doctrine became the foundation for everything that followed. It was later extended to horizontally-applicable Treaty articles in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne v Sabena</a>. A narrower, vertical-only version was applied to directives in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>.`,
   application:"Article 12 was clear, precise, and unconditional. So Van Gend en Loos could invoke it directly, without any Dutch implementing legislation.<br><br>This judgment is widely seen as the single most important foundation of the EU's distinctive legal order."},
 holistic:`Van Gend en Loos was decided on 5 February 1963, a year before <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a>. Together, the two cases form the twin pillars of EU constitutional law: this one established that EU law reaches individuals directly, Costa established that it wins when it conflicts with national law.<br><br>The provision at issue, Article 12 EEC, no longer exists today. It was a transitional standstill clause, deleted once the customs union was completed. Its permanent successor sits in Article 30 TFEU, though that is a different, later provision, not simply a renumbering.<br><br>This case's direct-effect doctrine was extended to horizontal relationships between private parties in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne v Sabena</a>, then deliberately limited for directives in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>. Both cases exist because this one first asked whether a Treaty could reach individuals at all.<br><br>Structurally, this is the starting point for the entire EU legal order — everything else in this database, in a sense, is downstream of this single 1963 judgment.`,
 citations:[
   {phrase:"new legal order of international law", paragraphs:"[1963] ECR 1, at p. 12 (this judgment predates paragraph numbering)", note:"The most quoted passage in EU constitutional law, cited by page since 1963 judgments were not yet paragraph-numbered.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Une entreprise privée pouvait-elle invoquer directement une disposition du traité à l'encontre de l'administration douanière néerlandaise ?",
       rule:"Une disposition du traité claire, précise et inconditionnelle produit un effet direct, indépendamment de toute législation d'exécution.",
       application:"Van Gend en Loos pouvait invoquer directement l'article du traité à l'encontre de l'État."},
     intermediate:{
       issue:"Van Gend en Loos importa un produit chimique d'Allemagne aux Pays-Bas. La douane néerlandaise le classa dans une catégorie tarifaire soumise à un droit plus élevé qu'avant l'entrée en vigueur du traité CEE en 1958.<br><br>L'entreprise soutint que cela violait l'article 12 CEE. Cet article interdisait aux États membres d'introduire de nouveaux droits de douane, ou d'augmenter les droits existants, entre eux.<br><br>La juridiction néerlandaise demanda à la Cour de justice si une entreprise privée pouvait invoquer directement cet article du traité, alors même que le traité semblait ne lier que les États.",
       rule:"La Cour jugea que le traité CEE n'était pas un accord ordinaire entre États. Il instituait un nouvel ordre juridique.<br><br>Les États avaient limité, dans certains domaines, leurs propres droits souverains en vertu de ce traité. Ce nouvel ordre ne liait pas seulement les États. Il avait aussi les particuliers pour sujets.<br><br>Une disposition du traité pouvait donc conférer des droits directement aux particuliers, si elle était claire, précise et inconditionnelle, et ne nécessitait aucune mesure nationale supplémentaire pour produire ses effets.",
       application:"L'article 12 satisfaisait à ce critère. Van Gend en Loos pouvait donc l'invoquer directement devant la juridiction néerlandaise, sans attendre une mesure d'exécution néerlandaise."},
     detailed:{
       issue:"Van Gend en Loos, une entreprise néerlandaise, importa un produit chimique en provenance d'Allemagne. La douane néerlandaise le reclassa, au sein du tarif douanier, dans une catégorie soumise à un droit plus élevé qu'avant l'entrée en vigueur du traité CEE en 1958.<br><br>L'entreprise soutint que ce reclassement violait l'article 12 CEE. Cet article constituait une clause de statu quo. Il interdisait aux États membres d'augmenter les droits de douane entre eux.<br><br>La juridiction de renvoi demanda à la Cour si un particulier pouvait invoquer directement l'article 12. À première vue, le traité semblait n'imposer d'obligations qu'aux États, non aux particuliers.",
       rule:`La réponse de la Cour devint le passage le plus célèbre du droit de l'Union. Elle jugea que le traité CEE constituait davantage qu'un accord international ordinaire.<br><br>Il instituait un nouvel ordre juridique de droit international. À son profit, les États avaient limité, dans des domaines limités, leurs droits souverains. Les sujets de cet ordre n'étaient pas seulement les États membres. Il comprenait également leurs ressortissants.<br><br>Le droit de l'Union pouvait donc conférer aux particuliers des droits indépendamment de toute législation nationale. Les juridictions nationales avaient l'obligation de protéger ces droits. Cela supposait que la disposition fût claire, précise et inconditionnelle, et ne laissât aux États aucune marge d'appréciation réelle.<br><br>Cette doctrine unique devint le fondement de tout ce qui suivit. Elle fut plus tard étendue aux articles du traité produisant un effet horizontal dans l'arrêt <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne contre Sabena</a>. Une version plus étroite, à effet strictement vertical, fut appliquée aux directives dans l'arrêt <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>.`,
       application:"L'article 12 était clair, précis et inconditionnel. Van Gend en Loos pouvait donc l'invoquer directement, sans aucune législation d'exécution néerlandaise.<br><br>Cet arrêt est largement considéré comme le fondement le plus important de l'ordre juridique propre à l'Union."},
     holistic:`Van Gend en Loos fut rendu le 5 février 1963, un an avant <a class="case-link" onclick="jumpToCase('costaenel')">Costa contre ENEL</a>. Ensemble, ces deux arrêts forment les deux piliers jumeaux du droit constitutionnel de l'Union : celui-ci établit que le droit de l'Union atteint directement les particuliers, Costa établit qu'il l'emporte en cas de conflit avec le droit national.<br><br>La disposition en cause, l'article 12 CEE, n'existe plus aujourd'hui. C'était une clause de statu quo transitoire, supprimée une fois l'union douanière achevée. Sa version permanente, qui lui a succédé, figure à l'article 30 TFUE — une disposition distincte et ultérieure, non une simple renumérotation.<br><br>La doctrine de l'effet direct posée par cet arrêt fut étendue aux relations horizontales entre particuliers dans <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne contre Sabena</a>, puis délibérément limitée pour les directives dans <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>. Ces deux arrêts n'existent que parce que celui-ci posa d'abord la question de savoir si un traité pouvait atteindre les particuliers.<br><br>Sur le plan structurel, cet arrêt est le point de départ de tout l'ordre juridique de l'Union — tout le reste, dans un sens, découle de ce seul jugement de 1963.`,
     citations:[
       {phrase:"nouvel ordre juridique de droit international", paragraphs:"[1963] Rec. 1, p. 12 (cet arrêt est antérieur à la numérotation par points)", note:"Traduction non officielle établie à partir du texte anglais vérifié. La langue de procédure de cette affaire était le néerlandais ; ni le texte néerlandais authentique ni la version française officielle du Recueil n'ont pu être consultés dans cette session — à vérifier contre le texte officiel.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Konnte sich ein privates Unternehmen unmittelbar auf eine Vertragsbestimmung gegenüber der niederländischen Zollbehörde berufen?",
       rule:"Eine klare, eindeutige und nicht an Bedingungen geknüpfte Vertragsbestimmung entfaltet unmittelbare Wirkung, unabhängig von Durchführungsvorschriften.",
       application:"Van Gend en Loos konnte sich unmittelbar auf den Vertragsartikel gegenüber dem Staat berufen."},
     intermediate:{
       issue:"Van Gend en Loos importierte ein chemisches Erzeugnis aus Deutschland in die Niederlande. Der niederländische Zoll ordnete es einer Tarifkategorie mit einem höheren Zollsatz zu als vor Inkrafttreten des EWG-Vertrags 1958.<br><br>Das Unternehmen machte geltend, dies verstoße gegen Artikel 12 EWG. Diese Bestimmung untersagte den Mitgliedstaaten, untereinander neue Zölle einzuführen oder bestehende zu erhöhen.<br><br>Das niederländische Gericht fragte den Gerichtshof, ob sich ein privates Unternehmen unmittelbar auf diesen Vertragsartikel berufen könne, obwohl der Vertrag scheinbar nur die Staaten band.",
       rule:"Der Gerichtshof entschied, dass der EWG-Vertrag kein gewöhnliches Abkommen zwischen Staaten sei. Er habe eine neue Rechtsordnung geschaffen.<br><br>Die Staaten hätten in bestimmten Bereichen ihre eigenen Hoheitsrechte im Rahmen dieses Vertrags eingeschränkt. Diese neue Ordnung binde nicht nur die Staaten. Auch der Einzelne sei ihr Rechtssubjekt.<br><br>Eine Vertragsbestimmung könne daher dem Einzelnen unmittelbar Rechte verleihen, sofern sie klar, eindeutig und nicht an Bedingungen geknüpft sei und keine weitere nationale Regelung zu ihrer Durchführung erfordere.",
       application:"Artikel 12 erfüllte diese Voraussetzungen. Van Gend en Loos konnte sich daher unmittelbar darauf berufen, ohne eine niederländische Durchführungsvorschrift abzuwarten."},
     detailed:{
       issue:"Van Gend en Loos, ein niederländisches Unternehmen, importierte ein chemisches Erzeugnis aus Deutschland. Der niederländische Zoll ordnete es tarifrechtlich in eine Kategorie mit einem höheren Zollsatz ein als vor Inkrafttreten des EWG-Vertrags 1958.<br><br>Das Unternehmen machte geltend, diese Neueinordnung verstoße gegen Artikel 12 EWG. Diese Bestimmung war eine Stillhalteklausel. Sie untersagte den Mitgliedstaaten, untereinander die Zölle zu erhöhen.<br><br>Das vorlegende Gericht fragte den Gerichtshof, ob sich ein Einzelner unmittelbar auf Artikel 12 berufen könne. Dem Wortlaut nach schien der Vertrag nur den Staaten, nicht dem Einzelnen, Verpflichtungen aufzuerlegen.",
       rule:`Die Antwort des Gerichtshofs wurde zur berühmtesten Passage des Unionsrechts. Er entschied, dass der EWG-Vertrag mehr sei als ein gewöhnliches völkerrechtliches Abkommen.<br><br>Er habe eine neue Rechtsordnung des Völkerrechts geschaffen. Zu deren Gunsten hätten die Staaten, wenn auch in begrenzten Bereichen, ihre Hoheitsrechte eingeschränkt. Rechtssubjekte dieser Ordnung seien nicht nur die Mitgliedstaaten. Auch deren Angehörige gehörten dazu.<br><br>Das Unionsrecht könne dem Einzelnen daher unabhängig von nationalen Rechtsvorschriften Rechte verleihen. Die nationalen Gerichte seien verpflichtet, diese Rechte zu schützen. Voraussetzung sei, dass die Bestimmung klar, eindeutig und nicht an Bedingungen geknüpft sei und den Staaten keinen echten Ermessensspielraum belasse.<br><br>Diese eine Doktrin wurde zur Grundlage für alles Folgende. Sie wurde später auf horizontal anwendbare Vertragsartikel ausgedehnt, in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne/Sabena</a>. Eine engere, nur vertikal wirkende Fassung wurde in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> auf Richtlinien angewandt.`,
       application:"Artikel 12 war klar, eindeutig und nicht an Bedingungen geknüpft. Van Gend en Loos konnte sich daher unmittelbar darauf berufen, ohne jede niederländische Durchführungsvorschrift.<br><br>Dieses Urteil gilt weithin als die wichtigste Grundlage der eigenständigen Rechtsordnung der Union."},
     holistic:`Van Gend en Loos erging am 5. Februar 1963, ein Jahr vor <a class="case-link" onclick="jumpToCase('costaenel')">Costa/ENEL</a>. Zusammen bilden beide Urteile die beiden Grundpfeiler des Verfassungsrechts der Union: Dieses Urteil begründete, dass das Unionsrecht den Einzelnen unmittelbar erreicht, Costa begründete, dass es sich bei einem Konflikt mit nationalem Recht durchsetzt.<br><br>Die streitgegenständliche Bestimmung, Artikel 12 EWG, existiert heute nicht mehr. Es handelte sich um eine vorübergehende Stillhalteklausel, die nach Vollendung der Zollunion gestrichen wurde. Ihre dauerhafte Nachfolgeregelung findet sich in Artikel 30 AEUV — allerdings eine andere, spätere Bestimmung, nicht bloß eine Umnummerierung.<br><br>Die in diesem Urteil begründete Doktrin der unmittelbaren Wirkung wurde in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne/Sabena</a> auf horizontale Beziehungen zwischen Privaten ausgedehnt, dann in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> für Richtlinien bewusst eingeschränkt. Beide Urteile bestehen nur deshalb, weil dieses zuerst die Frage aufwarf, ob ein Vertrag den Einzelnen überhaupt erreichen kann.<br><br>Strukturell ist dies der Ausgangspunkt der gesamten Rechtsordnung der Union — alles andere in dieser Datenbank leitet sich in gewissem Sinne von diesem einen Urteil aus dem Jahr 1963 ab.`,
     citations:[
       {phrase:"neue Rechtsordnung des Völkerrechts", paragraphs:"[1963] Slg. 1, S. 12 (dieses Urteil ist älter als die Randnummerierung)", note:"Inoffizielle Übersetzung des verifizierten englischen Textes. Die Verfahrenssprache dieser Rechtssache war Niederländisch; weder der niederländische Originaltext noch die amtliche deutsche Fassung der Sammlung konnten in dieser Sitzung eingesehen werden — gegen den amtlichen Text zu prüfen.", primary:true}
     ]
   },
   it:{
     abstract:{
       issue:"Un'impresa privata poteva invocare direttamente una disposizione del trattato nei confronti dell'amministrazione doganale olandese?",
       rule:"Una disposizione del trattato chiara, precisa e incondizionata produce effetto diretto indipendentemente da qualsiasi normativa di attuazione.",
       application:"La Van Gend en Loos poteva invocare direttamente l'articolo del trattato nei confronti dello Stato."},
     intermediate:{
       issue:"La Van Gend en Loos importò un prodotto chimico dalla Germania nei Paesi Bassi. La dogana olandese lo classificò in una categoria tariffaria soggetta a un dazio più elevato rispetto a prima dell'entrata in vigore del trattato CEE nel 1958.<br><br>L'impresa sostenne che ciò violasse l'articolo 12 CEE. Tale articolo impediva agli Stati membri di introdurre nuovi dazi, o di aumentare quelli esistenti, tra loro.<br><br>Il giudice olandese chiese alla Corte di giustizia se un'impresa privata potesse invocare direttamente questo articolo del trattato, sebbene il trattato sembrasse vincolare soltanto gli Stati.",
       rule:"La Corte dichiarò che il trattato CEE non era un accordo ordinario tra Stati. Esso aveva istituito un nuovo ordinamento giuridico.<br><br>Gli Stati avevano limitato i propri diritti sovrani in base a esso, in determinati settori. Questo nuovo ordinamento non vincolava soltanto gli Stati. Esso aveva come soggetti anche i singoli.<br><br>Una disposizione del trattato poteva quindi conferire direttamente diritti alle persone, se era chiara, precisa e incondizionata, e non richiedeva alcuna ulteriore norma nazionale per funzionare.",
       application:"L'articolo 12 soddisfaceva tale criterio. La Van Gend en Loos poteva quindi invocarlo direttamente dinanzi al giudice olandese, senza attendere una normativa di attuazione olandese."},
     detailed:{
       issue:"La Van Gend en Loos, un'impresa olandese, importò un prodotto chimico dalla Germania. La dogana olandese lo riclassificò, nell'ambito della tariffa doganale, in una categoria con un dazio più elevato rispetto a prima dell'entrata in vigore del trattato CEE nel 1958.<br><br>L'impresa sostenne che tale riclassificazione violasse l'articolo 12 CEE. Tale articolo costituiva una clausola di standstill. Esso impediva agli Stati membri di aumentare i dazi doganali reciproci.<br><br>Il giudice del rinvio chiese alla Corte se un singolo potesse invocare direttamente l'articolo 12. A prima vista, il trattato sembrava imporre obblighi soltanto agli Stati, non ai singoli.",
       rule:`La risposta della Corte divenne il passaggio più celebre del diritto dell'Unione. Essa dichiarò che il trattato CEE costituiva qualcosa in più di un ordinario accordo internazionale.<br><br>Esso aveva istituito un nuovo ordinamento giuridico di diritto internazionale. A suo favore, gli Stati avevano limitato, in settori circoscritti, i propri diritti sovrani. Soggetti di tale ordinamento non erano soltanto gli Stati membri. Vi rientravano anche i loro cittadini.<br><br>Il diritto dell'Unione poteva quindi conferire ai singoli diritti indipendentemente dalla legislazione nazionale. I giudici nazionali avevano l'obbligo di tutelare tali diritti. Ciò presupponeva che la disposizione fosse chiara, precisa e incondizionata, e non lasciasse agli Stati alcun reale margine di discrezionalità.<br><br>Questa unica dottrina divenne il fondamento di tutto ciò che seguì. Essa fu successivamente estesa agli articoli del trattato ad effetto orizzontale nella sentenza <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne contro Sabena</a>. Una versione più ristretta, a effetto soltanto verticale, fu applicata alle direttive nella sentenza <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>.`,
       application:"L'articolo 12 era chiaro, preciso e incondizionato. La Van Gend en Loos poteva quindi invocarlo direttamente, senza alcuna normativa di attuazione olandese.<br><br>Questa sentenza è ampiamente considerata il fondamento più importante dell'ordinamento giuridico proprio dell'Unione."},
     holistic:`La sentenza Van Gend en Loos fu resa il 5 febbraio 1963, un anno prima di <a class="case-link" onclick="jumpToCase('costaenel')">Costa contro ENEL</a>. Insieme, queste due sentenze costituiscono i due pilastri gemelli del diritto costituzionale dell'Unione: questa stabilì che il diritto dell'Unione raggiunge direttamente i singoli, Costa stabilì che esso prevale in caso di conflitto con il diritto nazionale.<br><br>La disposizione in questione, l'articolo 12 CEE, non esiste più oggi. Era una clausola di standstill transitoria, soppressa una volta completata l'unione doganale. La sua versione permanente, che le è succeduta, si trova nell'articolo 30 TFUE — una disposizione distinta e successiva, non una semplice rinumerazione.<br><br>La dottrina dell'effetto diretto sancita da questa sentenza fu estesa alle relazioni orizzontali tra privati in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne contro Sabena</a>, poi deliberatamente limitata per le direttive in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>. Entrambe queste sentenze esistono soltanto perché questa pose per prima la questione se un trattato potesse raggiungere i singoli.<br><br>Sul piano strutturale, questa sentenza è il punto di partenza dell'intero ordinamento giuridico dell'Unione — tutto il resto, in un certo senso, discende da questa singola sentenza del 1963.`,
     citations:[
       {phrase:"nuovo ordinamento giuridico di diritto internazionale", paragraphs:"[1963] Racc. 1, p. 12 (sentenza anteriore alla numerazione per punti)", note:"Traduzione non ufficiale elaborata a partire dal testo inglese verificato. La lingua di procedura di questa causa era il neerlandese; né il testo neerlandese autentico né la versione italiana ufficiale della Raccolta sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true}
     ]
   }
 }},

{id:"defrenne", name:"Defrenne v Sabena (No 2)", originalName:"Gabrielle Defrenne contre Société anonyme belge de navigation aérienne Sabena", citation:"Case 43/75", jurisdiction:"CJCE", themes:["Fundamental rights","Legal order / primacy / direct effect"], legacyThemes:["Non-discrimination"], articleIds:["art157tfeu"],
 abstract:{
   issue:"Can an air hostess invoke Article 119 EEC directly against her private employer for pay discrimination?",
   rule:"Treaty provisions imposing a clear, unconditional obligation can have horizontal direct effect, reaching disputes between private parties.",
   application:"Defrenne could rely on the equal pay principle directly against Sabena, a private company."},
 intermediate:{
   issue:"Gabrielle Defrenne worked as an air hostess for Sabena, Belgium's national airline. Between 1963 and 1966, she was paid less than male cabin stewards doing identical work.<br><br>Both sides agreed the work was identical and the pay gap was real. Defrenne sued relying directly on Article 119 EEC, the Treaty's equal pay principle.<br><br>Belgium had no legislation putting this principle into domestic law. So the case turned on whether Article 119 could be enforced without one, and against a private employer specifically.",
   rule:"The Court held Article 119 was clear, precise, and unconditional enough to work without any implementing measures.<br><br>It went further than that. Direct discrimination, identifiable using only the criteria in Article 119 itself, could be relied on directly. This applied even more where men and women received unequal pay for equal work in the same workplace, public or private.<br><br>So this effect was not limited to disputes against the state. Because equal pay needed no state action to deliver, private employers were bound by it too.",
   application:"Defrenne could rely on Article 119 directly against Sabena, a private employer, despite the absence of any Belgian implementing law."},
 detailed:{
   issue:"Gabrielle Defrenne, an air hostess for Sabena, was paid substantially less than male cabin stewards doing broadly the same work. She also faced compulsory retirement at 40, well below the age applied to male staff.<br><br>She claimed under Article 119 EEC, the Treaty's equal pay guarantee. Belgium had not enacted legislation implementing it.<br><br>The case reached the Court via the Cour du Travail of Brussels, under Article 177 EEC. The central question: could Article 119 be enforced directly, against a private-sector employer, without waiting for national legislation?",
   rule:`Building on the direct-effect doctrine from <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, the Court held Article 119 imposed a clear, unconditional obligation. This applied at least to direct discrimination — the kind identifiable solely by reference to the criteria in Article 119 itself, without needing more detailed EU or national measures to flesh it out.<br><br>The Court went further than Van Gend en Loos in one key respect. It held this effect was not confined to disputes against the state. Because delivering equal pay required no intervening state act — an employer could simply pay equally — the obligation could reach private employers directly too.<br><br>This made Defrenne one of the clearest early examples of horizontal direct effect for a Treaty provision. The doctrine was later extended, far more controversially, to unwritten general principles of EU law in <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, where no such reference source existed.`,
   application:"Defrenne could rely on Article 119 directly against Sabena to claim equal pay, notwithstanding the total absence of Belgian implementing legislation.<br><br>The judgment became a foundation of EU gender-equality law, prompting further legislation and decades of litigation, including the later Barber judgment on pension-age discrimination."},
 holistic:`Decided on 8 April 1976, this case came thirteen years after <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> first established that Treaty provisions can create rights individuals can enforce. Defrenne answered a question Van Gend en Loos left open: can that effect reach disputes between two private parties, not just a citizen against the state?<br><br>The answer here — yes, for a sufficiently clear Treaty article — sits in deliberate contrast to <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>, decided a decade later, where the Court refused to extend the same horizontal reach to directives. Reading the two together shows the Court drawing a real line: Treaty articles can bind individuals directly, directives (on the Court's later view) generally cannot.<br><br>This case's reasoning was also the template later stretched, much more controversially, in <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, where the Court applied horizontal effect to an unwritten general principle rather than a Treaty article with express wording behind it.<br><br>Structurally, Defrenne sits at the foundation of two separate strands of EU law: the direct-effect architecture running from Van Gend en Loos, and the substantive equal-pay/non-discrimination law that followed it.`,
 citations:[
   {phrase:"unequal pay for equal work carried out in the same establishment or service, whether public or private", paragraphs:"para. 22", note:"The paragraph extending Article 119's direct effect to private-sector employers specifically.", primary:true},
   {phrase:"identifiable solely by reference to the criteria laid down by Article 119", paragraphs:"para. 21", note:"The Court's test for which kinds of pay discrimination are clear enough to be directly enforceable."}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Une hôtesse de l'air peut-elle invoquer directement l'article 119 CEE à l'encontre de son employeur privé pour discrimination salariale ?",
       rule:"Les dispositions du traité imposant une obligation claire et inconditionnelle peuvent produire un effet direct horizontal, atteignant les litiges entre particuliers.",
       application:"Mme Defrenne pouvait invoquer directement le principe de l'égalité des rémunérations à l'encontre de la Sabena, une société privée."},
     intermediate:{
       issue:"Gabrielle Defrenne travaillait comme hôtesse de l'air pour la Sabena, la compagnie aérienne nationale belge. Entre 1963 et 1966, elle fut rémunérée moins que les stewards masculins effectuant un travail identique.<br><br>Les deux parties reconnaissaient que le travail était identique et que l'écart de rémunération était réel. Mme Defrenne agit en justice en invoquant directement l'article 119 CEE, le principe d'égalité des rémunérations posé par le traité.<br><br>La Belgique n'avait adopté aucune législation transposant ce principe en droit interne. L'affaire portait donc sur le point de savoir si l'article 119 pouvait être appliqué sans une telle législation, et en particulier à l'encontre d'un employeur privé.",
       rule:"La Cour jugea que l'article 119 était suffisamment clair, précis et inconditionnel pour produire ses effets sans aucune mesure d'exécution.<br><br>Elle alla plus loin. Une discrimination directe, identifiable au seul regard des critères énoncés par l'article 119 lui-même, pouvait être invoquée directement. Cela valait a fortiori lorsque hommes et femmes percevaient une rémunération inégale pour un même travail accompli dans le même établissement, public ou privé.<br><br>Cet effet n'était donc pas limité aux litiges opposant un particulier à l'État. L'égalité des rémunérations ne nécessitant aucune intervention étatique pour être assurée, les employeurs privés y étaient également tenus.",
       application:"Mme Defrenne pouvait invoquer directement l'article 119 à l'encontre de la Sabena, employeur privé, malgré l'absence de toute législation belge d'exécution."},
     detailed:{
       issue:"Gabrielle Defrenne, hôtesse de l'air pour la Sabena, était rémunérée sensiblement moins que les stewards masculins accomplissant globalement le même travail. Elle était également soumise à une mise à la retraite obligatoire à 40 ans, un âge bien inférieur à celui appliqué au personnel masculin.<br><br>Elle fonda son action sur l'article 119 CEE, la garantie d'égalité des rémunérations posée par le traité. La Belgique n'avait adopté aucune législation le transposant.<br><br>L'affaire parvint à la Cour par la voie de la Cour du travail de Bruxelles, sur le fondement de l'article 177 CEE. Question centrale : l'article 119 pouvait-il être appliqué directement, à l'encontre d'un employeur du secteur privé, sans attendre une législation nationale ?",
       rule:`S'appuyant sur la doctrine de l'effet direct posée dans <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, la Cour jugea que l'article 119 imposait une obligation claire et inconditionnelle. Cela valait au moins pour la discrimination directe — celle identifiable au seul regard des critères énoncés par l'article 119 lui-même, sans qu'il soit besoin de mesures d'exécution européennes ou nationales plus détaillées.<br><br>La Cour alla plus loin que dans Van Gend en Loos sur un point essentiel. Elle jugea que cet effet n'était pas limité aux litiges opposant un particulier à l'État. La réalisation de l'égalité des rémunérations ne nécessitant l'intervention d'aucun acte étatique — un employeur pouvant simplement rémunérer également ses salariés —, l'obligation pouvait également atteindre directement les employeurs privés.<br><br>Cet arrêt fit de Defrenne l'un des exemples les plus nets, à cette époque précoce, d'effet direct horizontal d'une disposition du traité. Cette doctrine fut plus tard étendue, de façon bien plus controversée, à des principes généraux non écrits du droit de l'Union dans l'arrêt <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, où n'existait aucune source textuelle de référence comparable.`,
       application:"Mme Defrenne pouvait invoquer directement l'article 119 à l'encontre de la Sabena pour réclamer l'égalité de rémunération, malgré l'absence totale de législation belge d'exécution.<br><br>Cet arrêt devint un fondement du droit de l'Union relatif à l'égalité entre hommes et femmes, suscitant de nouvelles législations et des décennies de contentieux, y compris l'arrêt Barber ultérieur sur la discrimination liée à l'âge de la retraite."},
     holistic:`Rendu le 8 avril 1976, cet arrêt intervint treize ans après que <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> eut établi pour la première fois que des dispositions du traité pouvaient créer des droits que les particuliers peuvent faire valoir en justice. Defrenne répondit à une question que Van Gend en Loos avait laissée ouverte : cet effet peut-il atteindre des litiges entre deux particuliers, et non plus seulement un citoyen contre l'État ?<br><br>La réponse ici — oui, pour un article du traité suffisamment clair — contraste délibérément avec <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>, rendu une décennie plus tard, où la Cour refusa d'étendre cette même portée horizontale aux directives. Lus ensemble, ces deux arrêts montrent que la Cour trace une véritable ligne de partage : les articles du traité peuvent lier directement les particuliers, les directives (selon la position ultérieure de la Cour) ne le peuvent en général pas.<br><br>Le raisonnement de cet arrêt fut également le modèle étendu plus tard, de façon bien plus controversée, dans <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, où la Cour appliqua l'effet horizontal à un principe général non écrit plutôt qu'à un article du traité expressément rédigé.<br><br>Sur le plan structurel, Defrenne se situe au fondement de deux courants distincts du droit de l'Union : l'architecture de l'effet direct issue de Van Gend en Loos, et le droit matériel de l'égalité des rémunérations et de la non-discrimination qui en découla.`,
     citations:[
       {phrase:"une rémunération inégale pour un même travail accompli dans le même établissement ou service, qu'il soit public ou privé", paragraphs:"point 22", note:"Texte français authentique (le français était la langue de procédure de cette affaire), traduit ici à partir du texte anglais vérifié faute d'avoir pu consulter à nouveau le texte français officiel du Recueil dans cette session — à vérifier contre le texte officiel.", primary:true},
       {phrase:"identifiable au seul regard des critères énoncés par l'article 119", paragraphs:"point 21", note:"Traduction non officielle du texte anglais vérifié ; non vérifiée contre la version française officielle du Recueil dans cette session, bien que le français soit la langue de procédure authentique de cette affaire."}
     ]
   },
   de:{
     abstract:{
       issue:"Kann sich eine Flugbegleiterin wegen Lohndiskriminierung unmittelbar auf Artikel 119 EWG gegenüber ihrem privaten Arbeitgeber berufen?",
       rule:"Vertragsbestimmungen, die eine klare, nicht an Bedingungen geknüpfte Verpflichtung auferlegen, können horizontale unmittelbare Wirkung entfalten und damit auch Streitigkeiten zwischen Privaten erfassen.",
       application:"Frau Defrenne konnte sich unmittelbar auf den Grundsatz des gleichen Entgelts gegenüber der Sabena, einem privaten Unternehmen, berufen."},
     intermediate:{
       issue:"Gabrielle Defrenne arbeitete als Flugbegleiterin für die Sabena, die belgische nationale Fluggesellschaft. Zwischen 1963 und 1966 wurde sie geringer entlohnt als männliche Flugbegleiter, die dieselbe Arbeit verrichteten.<br><br>Beide Seiten waren sich einig, dass die Arbeit identisch war und das Lohngefälle real bestand. Frau Defrenne erhob Klage und stützte sich dabei unmittelbar auf Artikel 119 EWG, den im Vertrag verankerten Grundsatz des gleichen Entgelts.<br><br>Belgien hatte keine Rechtsvorschriften erlassen, die diesen Grundsatz in innerstaatliches Recht umsetzten. Der Fall drehte sich daher um die Frage, ob Artikel 119 ohne eine solche Umsetzung durchgesetzt werden konnte, und zwar gerade gegenüber einem privaten Arbeitgeber.",
       rule:"Der Gerichtshof entschied, dass Artikel 119 klar, eindeutig und hinreichend unbedingt sei, um ohne Durchführungsmaßnahmen zu wirken.<br><br>Er ging darüber hinaus. Eine unmittelbare Diskriminierung, die sich allein anhand der in Artikel 119 selbst festgelegten Kriterien feststellen lasse, könne unmittelbar geltend gemacht werden. Dies gelte erst recht, wenn Männer und Frauen für gleiche Arbeit am selben Arbeitsplatz, öffentlich oder privat, ungleich entlohnt würden.<br><br>Diese Wirkung war daher nicht auf Streitigkeiten gegenüber dem Staat beschränkt. Da die Verwirklichung gleichen Entgelts kein staatliches Handeln erforderte, waren auch private Arbeitgeber daran gebunden.",
       application:"Frau Defrenne konnte sich unmittelbar auf Artikel 119 gegenüber der Sabena berufen, trotz des völligen Fehlens belgischer Durchführungsvorschriften."},
     detailed:{
       issue:"Gabrielle Defrenne, Flugbegleiterin bei der Sabena, wurde erheblich geringer entlohnt als männliche Flugbegleiter, die im Wesentlichen dieselbe Arbeit verrichteten. Zudem galt für sie eine Zwangspensionierung mit 40 Jahren, einem Alter, das deutlich unter dem für männliches Personal geltenden lag.<br><br>Sie stützte ihre Klage auf Artikel 119 EWG, die im Vertrag verankerte Garantie des gleichen Entgelts. Belgien hatte keine Umsetzungsvorschriften erlassen.<br><br>Der Fall gelangte über die Cour du travail von Brüssel gemäß Artikel 177 EWG an den Gerichtshof. Zentrale Frage: Konnte Artikel 119 unmittelbar gegenüber einem Arbeitgeber der Privatwirtschaft durchgesetzt werden, ohne eine nationale Regelung abzuwarten?",
       rule:`Aufbauend auf der in <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> begründeten Doktrin der unmittelbaren Wirkung entschied der Gerichtshof, dass Artikel 119 eine klare, nicht an Bedingungen geknüpfte Verpflichtung auferlegte. Dies galt zumindest für unmittelbare Diskriminierung — solche, die sich allein anhand der in Artikel 119 selbst festgelegten Kriterien feststellen lässt, ohne dass weitere, detailliertere unions- oder nationalrechtliche Maßnahmen erforderlich wären.<br><br>Der Gerichtshof ging in einem entscheidenden Punkt über Van Gend en Loos hinaus. Er entschied, dass diese Wirkung nicht auf Streitigkeiten gegenüber dem Staat beschränkt sei. Da die Verwirklichung gleichen Entgelts keinen vermittelnden staatlichen Akt erforderte — ein Arbeitgeber konnte schlicht gleich entlohnen —, konnte die Verpflichtung auch private Arbeitgeber unmittelbar treffen.<br><br>Dies machte Defrenne zu einem der klarsten frühen Beispiele horizontaler unmittelbarer Wirkung einer Vertragsbestimmung. Die Doktrin wurde später, weitaus umstrittener, auf ungeschriebene allgemeine Grundsätze des Unionsrechts ausgedehnt, in der Rechtssache <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, wo keine vergleichbare geschriebene Bezugsquelle bestand.`,
       application:"Frau Defrenne konnte sich unmittelbar auf Artikel 119 gegenüber der Sabena berufen, um gleiches Entgelt einzufordern, ungeachtet des völligen Fehlens belgischer Durchführungsvorschriften.<br><br>Das Urteil wurde zu einer Grundlage des unionsrechtlichen Gleichstellungsrechts und gab weiteren Rechtsvorschriften sowie jahrzehntelangen Rechtsstreitigkeiten Auftrieb, einschließlich des späteren Barber-Urteils zur Diskriminierung beim Renteneintrittsalter."},
     holistic:`Dieses am 8. April 1976 ergangene Urteil folgte dreizehn Jahre nach <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, das erstmals feststellte, dass Vertragsbestimmungen Rechte begründen können, die der Einzelne gerichtlich durchsetzen kann. Defrenne beantwortete eine von Van Gend en Loos offengelassene Frage: Kann diese Wirkung auch Streitigkeiten zwischen zwei Privaten erfassen, nicht nur zwischen einem Bürger und dem Staat?<br><br>Die hier gegebene Antwort — ja, für einen hinreichend klaren Vertragsartikel — steht in bewusstem Gegensatz zu <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>, ein Jahrzehnt später entschieden, wo der Gerichtshof sich weigerte, dieselbe horizontale Reichweite auf Richtlinien auszudehnen. Liest man beide Urteile zusammen, zeigt sich, dass der Gerichtshof eine echte Grenze zieht: Vertragsartikel können den Einzelnen unmittelbar binden, Richtlinien (nach der späteren Auffassung des Gerichtshofs) grundsätzlich nicht.<br><br>Die Begründung dieses Urteils war auch die Vorlage, die später, weitaus umstrittener, in <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a> ausgedehnt wurde, wo der Gerichtshof horizontale Wirkung auf einen ungeschriebenen allgemeinen Grundsatz anwandte, statt auf einen ausdrücklich formulierten Vertragsartikel.<br><br>Strukturell steht Defrenne am Ursprung zweier getrennter Stränge des Unionsrechts: der von Van Gend en Loos ausgehenden Architektur der unmittelbaren Wirkung, und des daran anschließenden materiellen Rechts der Entgeltgleichheit und Nichtdiskriminierung.`,
     citations:[
       {phrase:"ungleiches Entgelt für gleiche Arbeit, die in derselben Betriebsstätte oder demselben Dienst verrichtet wird, ob öffentlich oder privat", paragraphs:"Randnr. 22", note:"Inoffizielle Übersetzung des verifizierten englischen Textes. Die Verfahrenssprache dieser Rechtssache war Französisch; weder der französische Originaltext noch die amtliche deutsche Fassung der Sammlung wurden in dieser Sitzung eingesehen — gegen den amtlichen Text zu prüfen.", primary:true},
       {phrase:"allein anhand der in Artikel 119 festgelegten Kriterien feststellbar", paragraphs:"Randnr. 21", note:"Inoffizielle Übersetzung des verifizierten englischen Textes; nicht gegen die amtliche deutsche Fassung der Sammlung abgeglichen, obwohl Französisch die authentische Verfahrenssprache dieser Rechtssache war."}
     ]
   },
   it:{
     abstract:{
       issue:"Un'assistente di volo può invocare direttamente l'articolo 119 CEE nei confronti del proprio datore di lavoro privato per discriminazione salariale?",
       rule:"Le disposizioni del trattato che impongono un obbligo chiaro e incondizionato possono produrre un effetto diretto orizzontale, raggiungendo controversie tra privati.",
       application:"La sig.ra Defrenne poteva invocare direttamente il principio della parità di retribuzione nei confronti della Sabena, una società privata."},
     intermediate:{
       issue:"Gabrielle Defrenne lavorava come assistente di volo per la Sabena, la compagnia aerea nazionale belga. Tra il 1963 e il 1966, fu retribuita meno degli assistenti di volo maschi che svolgevano un lavoro identico.<br><br>Entrambe le parti riconoscevano che il lavoro era identico e che il divario retributivo era reale. La sig.ra Defrenne agì in giudizio invocando direttamente l'articolo 119 CEE, il principio di parità retributiva sancito dal trattato.<br><br>Il Belgio non aveva adottato alcuna normativa che traducesse tale principio in diritto interno. La causa verteva quindi sulla questione se l'articolo 119 potesse essere applicato senza tale normativa, e in particolare nei confronti di un datore di lavoro privato.",
       rule:"La Corte dichiarò che l'articolo 119 era sufficientemente chiaro, preciso e incondizionato da produrre i propri effetti senza alcuna misura di attuazione.<br><br>Essa andò oltre. Una discriminazione diretta, identificabile facendo riferimento ai soli criteri enunciati dall'articolo 119 stesso, poteva essere invocata direttamente. Ciò valeva a maggior ragione quando uomini e donne percepivano una retribuzione diseguale per uno stesso lavoro svolto nello stesso stabilimento, pubblico o privato.<br><br>Tale effetto non era quindi limitato alle controversie tra un singolo e lo Stato. Poiché la parità retributiva non richiedeva alcun intervento statale per essere assicurata, anche i datori di lavoro privati vi erano vincolati.",
       application:"La sig.ra Defrenne poteva invocare direttamente l'articolo 119 nei confronti della Sabena, datore di lavoro privato, nonostante l'assenza di qualsiasi normativa belga di attuazione."},
     detailed:{
       issue:"Gabrielle Defrenne, assistente di volo per la Sabena, era retribuita sensibilmente meno degli assistenti di volo maschi che svolgevano complessivamente lo stesso lavoro. Era inoltre soggetta a un pensionamento obbligatorio a 40 anni, un'età ben inferiore a quella applicata al personale maschile.<br><br>Ella fondò la propria azione sull'articolo 119 CEE, la garanzia di parità retributiva sancita dal trattato. Il Belgio non aveva adottato alcuna normativa di attuazione.<br><br>La causa giunse alla Corte tramite la Cour du travail di Bruxelles, ai sensi dell'articolo 177 CEE. Questione centrale: l'articolo 119 poteva essere applicato direttamente nei confronti di un datore di lavoro del settore privato, senza attendere una normativa nazionale?",
       rule:`Basandosi sulla dottrina dell'effetto diretto stabilita in <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a>, la Corte dichiarò che l'articolo 119 imponeva un obbligo chiaro e incondizionato. Ciò valeva quantomeno per la discriminazione diretta — quella identificabile facendo riferimento ai soli criteri enunciati dall'articolo 119 stesso, senza che occorressero misure dell'Unione o nazionali più dettagliate per completarlo.<br><br>La Corte andò oltre Van Gend en Loos su un punto essenziale. Essa dichiarò che questo effetto non era limitato alle controversie nei confronti dello Stato. Poiché realizzare la parità retributiva non richiedeva alcun atto statale intermedio — un datore di lavoro poteva semplicemente retribuire in modo paritario —, l'obbligo poteva raggiungere direttamente anche i datori di lavoro privati.<br><br>Ciò rese Defrenne uno degli esempi più netti, in quella fase precoce, di effetto diretto orizzontale di una disposizione del trattato. Questa dottrina fu in seguito estesa, in modo assai più controverso, a principi generali non scritti del diritto dell'Unione nella causa <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, dove non esisteva alcuna fonte testuale di riferimento analoga.`,
       application:"La sig.ra Defrenne poteva invocare direttamente l'articolo 119 nei confronti della Sabena per rivendicare la parità retributiva, nonostante l'assenza totale di normativa belga di attuazione.<br><br>Questa sentenza divenne un fondamento del diritto dell'Unione in materia di parità tra uomini e donne, favorendo ulteriore legislazione e decenni di contenzioso, compresa la successiva sentenza Barber sulla discriminazione relativa all'età pensionabile."},
     holistic:`Decisa l'8 aprile 1976, questa causa giunse tredici anni dopo che <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> aveva stabilito per la prima volta che le disposizioni del trattato potevano creare diritti azionabili dai singoli. Defrenne rispose a una questione che Van Gend en Loos aveva lasciato aperta: tale effetto può raggiungere controversie tra due privati, e non soltanto tra un cittadino e lo Stato?<br><br>La risposta qui data — sì, per un articolo del trattato sufficientemente chiaro — contrasta deliberatamente con <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a>, decisa un decennio più tardi, dove la Corte rifiutò di estendere la stessa portata orizzontale alle direttive. Lette insieme, queste due sentenze mostrano la Corte tracciare una linea di demarcazione reale: gli articoli del trattato possono vincolare direttamente i singoli, le direttive (secondo la posizione successiva della Corte) generalmente non possono farlo.<br><br>Il ragionamento di questa sentenza fu anche il modello successivamente esteso, in modo assai più controverso, in <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a>, dove la Corte applicò l'effetto orizzontale a un principio generale non scritto anziché a un articolo del trattato espressamente formulato.<br><br>Sul piano strutturale, Defrenne si colloca al fondamento di due filoni distinti del diritto dell'Unione: l'architettura dell'effetto diretto derivante da Van Gend en Loos, e il diritto sostanziale della parità retributiva e della non discriminazione che ne seguì.`,
     citations:[
       {phrase:"una retribuzione diseguale per uno stesso lavoro svolto nello stesso stabilimento o servizio, sia esso pubblico o privato", paragraphs:"punto 22", note:"Testo italiano non ufficiale elaborato a partire dal testo inglese verificato. La lingua di procedura di questa causa era il francese; né il testo francese autentico né la versione italiana ufficiale della Raccolta sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true},
       {phrase:"identificabile facendo riferimento ai soli criteri enunciati dall'articolo 119", paragraphs:"punto 21", note:"Traduzione non ufficiale del testo inglese verificato; non verificata rispetto alla versione italiana ufficiale della Raccolta in questa sessione, sebbene il francese sia la lingua di procedura autentica di questa causa."}
     ]

{id:"dominguez", name:"Dominguez", originalName:"Maribel Dominguez contre Centre informatique du Centre Ouest Atlantique", citation:"Case C-282/10", jurisdiction:"CJUE", themes:["Citizenship / free movement","Secondary law / legal acts"], legacyThemes:["Non-discrimination","Worker's rights"], articleIds:["dir200388","art267tfeu"],
 abstract:{
   issue:"Can a worker rely on the Working Time Directive's paid-leave guarantee directly against her employer, a social security body?",
   rule:"A directive can be relied on directly against the state, or a body treated as an emanation of the state, once its deadline has passed and its terms are clear enough.",
   application:"Because her employer was a social security body, Dominguez could rely on the paid annual leave guarantee against it directly."},
 intermediate:{
   issue:"Maribel Dominguez worked for CICOA, a French social security body. She was off work for 14 months after an accident travelling to work.<br><br>Under French rules, paid annual leave depended on having actually worked a minimum period, 10 days or a month, within the reference year. Her long absence meant she fell short of that.<br><br>She argued this broke Article 7 of the Working Time Directive, which guarantees every worker at least four weeks' paid leave, with no such precondition attached.",
   rule:"The Court held Article 7(1) does not let states make the very existence of the leave right conditional on any minimum period of actual work. States can regulate how the right is exercised, but not whether it exists at all.<br><br>Where a directive's provision is clear enough, it can be relied on directly, once its transposition deadline has passed. But this direct effect only reaches the state, or a body treated as an emanation of the state.<br><br>A directive still cannot, by itself, impose an obligation directly on a purely private individual.",
   application:"CICOA was found to be a body operating in the field of social security. That made it capable of counting as an emanation of the state. So Dominguez could rely on Article 7 directly against it."},
 detailed:{
   issue:"Maribel Dominguez worked for the Centre informatique du Centre Ouest Atlantique (CICOA), a French social security body. She was unable to work for fourteen months following an accident on her journey to work.<br><br>Under the applicable French collective agreement and Code du travail, entitlement to paid annual leave required the worker to have actually worked a minimum qualifying period, ten days or one month, during the reference year. Dominguez's long absence meant she did not meet it.<br><br>She argued this precondition breached Article 7(1) of Directive 2003/88, the Working Time Directive, which guarantees every worker at least four weeks' paid annual leave. The Cour de cassation referred the question to the Court of Justice.",
   rule:`The Court held that while member states are free to set the conditions for exercising the right to paid annual leave, they cannot make the very existence of that right, for all workers, conditional on any precondition at all. A minimum-work requirement of the kind French law imposed went beyond regulating the right — it denied it altogether to some workers.<br><br>On the question of direct effect: since Article 7(1) was clear, precise, and unconditional, it could be relied on directly once the transposition deadline had passed. But the Court reaffirmed its settled position, tracing back through cases like Faccini Dori and Kücükdeveci, that a directive cannot of itself impose an obligation on a private individual and cannot be relied upon as such against one.<br><br>It could, however, be relied on against the state, in whatever capacity the state was acting — including as an employer. CICOA, as a body operating in the field of social security, was found capable of counting as an emanation of the state for this purpose, echoing the reasoning in <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> decades earlier.`,
   application:"Because CICOA counted as an emanation of the state, Dominguez could rely on Article 7(1) directly against it, disapplying the conflicting French precondition.<br><br>Had her employer been a genuinely private company instead, the same directive provision would not have been directly enforceable against it — she would have had to fall back on indirect effect, or a state liability claim under the Francovich line of cases, which the Court expressly flagged as a fallback route."},
 holistic:`Decided on 24 January 2012, Dominguez sits nearly four decades after <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> first drew the vertical-only line for directives, and applies that same distinction to a completely different subject matter: paid leave rather than sex discrimination in retirement age.<br><br>The case is a clean, modern illustration of exactly the gap Marshall created and <span class="case-link-pending" title="Not yet added to Casus">Francovich</span> was designed to soften. Dominguez could win directly because her employer happened to be a public body; a worker in an identical situation at a private company could not have relied on the directive the same way, and would have needed the state-liability route instead.<br><br>It also connects forward to <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a> in an interesting way: both cases are about employment rights reaching into disputes involving something less than a fully private, ordinary employer, though Mangold pushed further by binding a genuinely private party through an unwritten general principle rather than the emanation-of-the-state route used here.<br><br>Structurally, this case shows the vertical/horizontal directive distinction is still very much alive in modern EU social law, not just a historical relic of 1980s judgments.`,
 citations:[
   {phrase:"they are not entitled to make the very existence of that right subject to any preconditions whatsoever", paragraphs:"para. 17 (paraphrased holding; exact wording per case summary)", note:"The core holding on Article 7(1)'s guarantee of the right's existence, not merely its exercise.", primary:true},
   {phrase:"a body operating in the field of social security", paragraphs:"para. 36", note:"The Court's finding that CICOA's public social-security function made it capable of being an emanation of the state."}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Une salariée peut-elle invoquer directement la garantie de congé payé de la directive sur le temps de travail à l'encontre de son employeur, un organisme de sécurité sociale ?",
       rule:"Une directive peut être invoquée directement à l'encontre de l'État, ou d'un organisme assimilé à une émanation de l'État, une fois son délai de transposition expiré et ses termes suffisamment clairs.",
       application:"Son employeur étant un organisme de sécurité sociale, Mme Dominguez pouvait invoquer directement à son encontre la garantie de congé annuel payé."},
     intermediate:{
       issue:"Maribel Dominguez travaillait pour le CICOA, un organisme français de sécurité sociale. Elle fut arrêtée pendant 14 mois à la suite d'un accident survenu sur le trajet de son domicile à son travail.<br><br>Selon les règles françaises applicables, le droit au congé annuel payé était subordonné à l'exercice effectif d'une période minimale de travail, dix jours ou un mois, au cours de la période de référence. Son absence prolongée l'empêchait de remplir cette condition.<br><br>Elle soutint que cela violait l'article 7 de la directive sur le temps de travail, qui garantit à tout travailleur un congé payé annuel d'au moins quatre semaines, sans qu'aucune condition de ce type ne soit prévue.",
       rule:"La Cour jugea que l'article 7, paragraphe 1, ne permet pas aux États de subordonner l'existence même du droit au congé à une quelconque période minimale de travail effectif. Les États peuvent réglementer les modalités d'exercice de ce droit, mais non son existence même.<br><br>Lorsqu'une disposition d'une directive est suffisamment claire, elle peut être invoquée directement, une fois expiré son délai de transposition. Mais cet effet direct ne peut être invoqué qu'à l'encontre de l'État, ou d'un organisme assimilé à une émanation de l'État.<br><br>Une directive ne peut toujours pas, par elle-même, imposer une obligation directement à un particulier purement privé.",
       application:"Le CICOA fut jugé être un organisme opérant dans le domaine de la sécurité sociale. Cela lui permettait d'être regardé comme une émanation de l'État. Mme Dominguez pouvait donc invoquer directement l'article 7 à son encontre."},
     detailed:{
       issue:"Maribel Dominguez travaillait pour le Centre informatique du Centre Ouest Atlantique (CICOA), un organisme français de sécurité sociale. Elle se trouva dans l'incapacité de travailler pendant quatorze mois à la suite d'un accident survenu sur le trajet de son domicile à son lieu de travail.<br><br>En vertu de la convention collective applicable et du Code du travail, le droit au congé annuel payé exigeait que la salariée eût effectivement travaillé pendant une période minimale, dix jours ou un mois, au cours de la période de référence. L'absence prolongée de Mme Dominguez l'empêchait de remplir cette condition.<br><br>Elle soutint que cette condition préalable violait l'article 7, paragraphe 1, de la directive 2003/88, la directive sur le temps de travail, qui garantit à tout travailleur un congé annuel payé d'au moins quatre semaines. La Cour de cassation posa la question à la Cour de justice.",
       rule:`La Cour jugea que si les États membres sont libres de fixer les conditions d'exercice du droit au congé annuel payé, ils ne peuvent subordonner l'existence même de ce droit, pour l'ensemble des travailleurs, à une quelconque condition préalable. Une exigence de travail minimal telle que celle imposée par le droit français allait au-delà d'une simple réglementation du droit — elle le refusait purement et simplement à certains travailleurs.<br><br>Sur la question de l'effet direct : l'article 7, paragraphe 1, étant clair, précis et inconditionnel, il pouvait être invoqué directement une fois le délai de transposition expiré. Mais la Cour réaffirma sa position constante, remontant à des arrêts tels que Faccini Dori et Kücükdeveci, selon laquelle une directive ne peut, par elle-même, créer d'obligations à la charge d'un particulier et ne peut être invoquée en tant que telle à son encontre.<br><br>Elle pouvait en revanche être invoquée à l'encontre de l'État, quelle que soit la qualité en laquelle celui-ci agissait — y compris en tant qu'employeur. Le CICOA, en tant qu'organisme opérant dans le domaine de la sécurité sociale, fut jugé susceptible d'être regardé comme une émanation de l'État à cette fin, faisant écho au raisonnement retenu dans <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> des décennies plus tôt.`,
       application:"Le CICOA étant regardé comme une émanation de l'État, Mme Dominguez pouvait invoquer directement l'article 7, paragraphe 1, à son encontre, en écartant la condition préalable française contraire.<br><br>Si son employeur avait été une véritable entreprise privée, la même disposition de la directive n'aurait pas été directement invocable à son encontre — elle aurait dû se rabattre sur l'effet indirect, ou sur une action en responsabilité de l'État fondée sur la jurisprudence Francovich, voie de secours que la Cour mentionna expressément."},
     holistic:`Rendu le 24 janvier 2012, l'arrêt Dominguez intervient près de quatre décennies après que <a class="case-link" onclick="jumpToCase('marshall')">Marshall</a> eut tracé pour la première fois la ligne strictement verticale applicable aux directives, et applique cette même distinction à une matière entièrement différente : le congé payé plutôt que la discrimination sexuelle liée à l'âge de la retraite.<br><br>Cet arrêt illustre de façon nette et moderne exactement l'écart créé par Marshall, que <span class="case-link-pending" title="Pas encore ajouté à Casus">Francovich</span> visait à atténuer. Mme Dominguez put obtenir gain de cause directement parce que son employeur se trouvait être un organisme public ; une salariée placée dans une situation identique au sein d'une entreprise privée n'aurait pas pu invoquer la directive de la même manière, et aurait dû se tourner vers la voie de la responsabilité de l'État.<br><br>Cet arrêt se rattache également, de façon intéressante, à <a class="case-link" onclick="jumpToCase('mangold')">Mangold</a> : les deux arrêts portent sur des droits en matière d'emploi atteignant des litiges impliquant un employeur qui n'est pas pleinement privé et ordinaire, bien que Mangold soit allé plus loin en liant un particulier véritablement privé au moyen d'un principe général non écrit plutôt que par la voie de l'émanation de l'État suivie ici.<br><br>Sur le plan structurel, cet arrêt montre que la distinction verticale/horizontale applicable aux directives demeure bien vivante dans le droit social de l'Union contemporain, et non un simple vestige historique des arrêts des années 1980.`,
     citations:[
       {phrase:"ils ne sont pas en droit de subordonner l'existence même de ce droit à quelque condition préalable que ce soit", paragraphs:"point 17 (solution paraphrasée ; formulation exacte reprise d'un résumé de l'arrêt)", note:"Texte français authentique (le français était la langue de procédure de cette affaire), mais reconstitué ici à partir d'un résumé anglais paraphrasé plutôt que du texte exact du jugement, comme le signale déjà la note d'origine — à vérifier contre le texte officiel.", primary:true},
       {phrase:"un organisme opérant dans le domaine de la sécurité sociale", paragraphs:"point 36", note:"Traduction non officielle établie à partir du texte anglais vérifié ; non vérifiée contre la version française officielle du Recueil dans cette session, bien que le français soit la langue de procédure authentique de cette affaire."}
     ]
