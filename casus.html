       rule:`Der Gerichtshof entschied, dass in einem auf Unionsebene vollständig harmonisierten Bereich jede Grundrechtsprüfung innerhalb dieses harmonisierten Rahmens verbleiben muss. Sie kann nicht auf den eigenen, möglicherweise strengeren verfassungsrechtlichen Maßstab eines Mitgliedstaats zurückgreifen.<br><br>Hier gehörten die Gründe für die Ablehnung der Vollstreckung eines Haftbefehls genau zu einem solchen vollständig harmonisierten Bereich. Artikel 53 der Charta, richtig verstanden, erlaubt es den Staaten nur, ihre eigenen Maßstäbe in Bereichen anzuwenden, die noch in ihre eigene Zuständigkeit fallen — er ist keine Lizenz, eine bereits harmonisierte Unionsregel zu verdrängen.<br><br>Würde man Artikel 53 so auslegen, wie Spanien es wünschte, würde dies den Grundsatz des Vorrangs untergraben. Die Schutzniveaus könnten dann von Staat zu Staat variieren, was die einheitliche Anwendung des Unionsrechts und letztlich das gegenseitige Vertrauen zwischen den Strafjustizsystemen der verschiedenen Staaten gefährden würde — die gesamte Grundlage, auf der das System des Haftbefehls beruht.`,
       application:"Spanien durfte die Zusicherung eines neuen Verfahrens nicht als Bedingung für die Übergabe von Herrn Melloni verlangen. Der Rahmenbeschluss hatte genau dieses Szenario bereits geregelt: eine Verurteilung in Abwesenheit bei vorheriger anwaltlicher Vertretung. Es blieb kein Raum für eine strengere spanische Regel.<br><br>Viele lasen dieses Urteil als eine klare Grenzziehung des Gerichtshofs: Artikel 53 darf keine Hintertür werden, durch die sich nationale Gerichte der unionsrechtlichen Zusammenarbeit in Strafsachen widersetzen. Dies steht in echter Spannung zum entgegenkommenderen Ton von Internationale Handelsgesellschaft, das über 40 Jahre zuvor ergangen war."},
     holistic:`Melloni erging 2013, im selben Jahr wie <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, und kurz nach dem Urteil <a class="case-link" onclick="jumpToCase('fransson')">Åkerberg Fransson</a>, das eine verwandte Frage zur Reichweite der Charta aufwarf.<br><br>Dieses Urteil setzt die Linie fort, die mit <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a> begann: Wie weit können nationale Grundrechte dem Vorrang des Unionsrechts entgegenwirken? Der Unterschied liegt in der Rechtsquelle — Handelsgesellschaft stützte sich auf ungeschriebene allgemeine Rechtsgrundsätze, Melloni wendet dieselbe Logik unter der Charta an, nunmehr geschriebenes Unionsrecht aus eigenem Recht.<br><br>Der Fall berührt auch das System des gegenseitigen Vertrauens der Union — die Annahme, dass die Gerichte jedes Mitgliedstaats einen gemeinsamen Mindeststandard erfüllen, dieselbe Annahme, die dem Europäischen Haftbefehl zugrunde liegt. Diese Annahme wurde später erneut auf die Probe gestellt, in Fällen, die die Frage betrafen, ob gegenseitiges Vertrauen fortbesteht, wenn die Justiz eines Mitgliedstaats unter politischen Druck gerät.<br><br>Strukturell bestätigt Melloni ein Muster: Je stärker ein Bereich des Unionsrechts harmonisiert ist, desto weniger Raum behalten die Mitgliedstaaten für ihre eigenen, höheren Standards.`,
     citations:[
       {phrase:"würde den Grundsatz des Vorrangs untergraben, indem sie es zuließe, dass das Schutzniveau von Staat zu Staat variiert", paragraphs:"Randnr. 60", note:"Inoffizielle Übersetzung des verifizierten englischen Textes (Randnr. 60). Die Verfahrenssprache dieser Rechtssache war Spanisch; weder der spanische Originaltext noch die amtliche deutsche Fassung der Sammlung konnten in dieser Sitzung eingesehen werden — gegen den amtlichen Text zu prüfen.", primary:true}
     ]
   },
   it:{
     abstract:{
       issue:"Uno Stato membro può rifiutare l'esecuzione di un mandato d'arresto europeo applicando uno standard nazionale di tutela dei diritti fondamentali più elevato di quello dell'Unione?",
       rule:"L'articolo 53 della Carta non consente agli Stati membri di applicare uno standard nazionale di tutela dei diritti fondamentali più elevato, quando ciò comprometterebbe il primato, l'unità e l'effettività del diritto dell'Unione.",
       application:"La Spagna non poteva rifiutare la consegna del sig. Melloni invocando un diritto costituzionale spagnolo a essere presente a un nuovo processo, poiché la decisione quadro dell'Unione sul mandato d'arresto aveva già operato tale bilanciamento."},
     intermediate:{
       issue:"Stefano Melloni fu condannato in Italia senza essere presente al proprio processo, pur essendo stato rappresentato per l'intera durata dello stesso da avvocati.<br><br>Egli si trasferì poi in Spagna. L'Italia emise un mandato d'arresto europeo per ottenerne la consegna.<br><br>Il diritto spagnolo esigeva normalmente la garanzia di un nuovo processo prima di consegnare una persona condannata in tali condizioni. Ma le stesse norme dell'Unione sul mandato d'arresto avevano già eliminato tale requisito, per i casi in cui la persona fosse stata rappresentata da un difensore.<br><br>La Corte costituzionale spagnola chiese: la Spagna può comunque applicare il proprio standard, più rigoroso?",
       rule:"La Corte rispose negativamente. L'articolo 53 della Carta consente agli Stati di mantenere i propri standard di tutela dei diritti fondamentali — ma solo nei settori che l'Unione non ha già pienamente armonizzato.<br><br>Nel caso di specie, l'Unione aveva già armonizzato esattamente questa materia, nelle norme relative al mandato d'arresto. Consentire alla Spagna di applicare uno standard più rigoroso avrebbe compromesso il diritto dell'Unione.<br><br>Stati diversi avrebbero allora potuto applicare livelli di tutela differenti — rompendo il sistema uniforme, valido in tutta l'Unione, su cui si fonda il mandato d'arresto.",
       application:"La Spagna non poteva esigere la garanzia di un nuovo processo come condizione per la consegna del sig. Melloni.<br><br>Le norme dell'Unione avevano già disciplinato esattamente questa situazione. Non restava alcun margine perché una norma nazionale più rigorosa vi si applicasse."},
     detailed:{
       issue:"Stefano Melloni fu processato e condannato in Italia per bancarotta fraudolenta, in sua assenza. Egli aveva nominato avvocati che lo rappresentarono per l'intera durata del processo.<br><br>Il sig. Melloni si rifugiò poi in Spagna. L'Italia emise un mandato d'arresto europeo chiedendo alla Spagna di consegnarlo.<br><br>Secondo la giurisprudenza costituzionale spagnola, la consegna di una persona condannata in contumacia richiedeva normalmente la garanzia di un nuovo processo. Ma la decisione quadro dell'Unione sul mandato d'arresto, modificata nel 2009, aveva eliminato tale motivo di rifiuto — specificamente quando la persona aveva scelto i propri avvocati ed era stata rappresentata per l'intera procedura.<br><br>La Corte costituzionale spagnola sottopose tre questioni pregiudiziali alla Corte di giustizia. In sostanza: l'articolo 53 della Carta consente alla Spagna di applicare il proprio standard costituzionale, più elevato, anziché quello dell'Unione?",
       rule:`La Corte dichiarò che, in un settore pienamente armonizzato a livello dell'Unione, ogni controllo alla luce dei diritti fondamentali deve rimanere all'interno di tale quadro armonizzato. Esso non può ricadere sullo standard costituzionale proprio, potenzialmente più rigoroso, di uno Stato membro.<br><br>Nel caso di specie, i motivi di rifiuto dell'esecuzione di un mandato d'arresto rientravano precisamente in un simile settore pienamente armonizzato. L'articolo 53 della Carta, correttamente interpretato, consente agli Stati di applicare i propri standard solo nei settori ancora rientranti nella loro competenza — non costituisce una licenza per disapplicare una norma dell'Unione già armonizzata.<br><br>Interpretare l'articolo 53 nel senso voluto dalla Spagna comprometterebbe il principio del primato. I livelli di tutela potrebbero allora variare da uno Stato all'altro, minacciando l'applicazione uniforme del diritto dell'Unione e, in definitiva, la fiducia reciproca tra i sistemi di giustizia penale dei diversi Stati — il fondamento stesso su cui si regge il sistema del mandato d'arresto.`,
       application:"La Spagna non poteva esigere la garanzia di un nuovo processo come condizione per la consegna del sig. Melloni. La decisione quadro aveva già disciplinato esattamente questo scenario: una condanna in contumacia, con previa rappresentanza legale. Non restava alcun margine perché una norma spagnola più rigorosa vi si applicasse.<br><br>Molti hanno letto questa sentenza come la Corte che traccia una linea netta: l'articolo 53 non può diventare una porta di servizio che consenta ai giudici nazionali di resistere alla cooperazione penale dell'Unione. Ciò si pone in reale tensione con il tono più conciliante di Internationale Handelsgesellschaft, decisa oltre 40 anni prima."},
     holistic:`Melloni fu decisa nel 2013, lo stesso anno di <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, e poco dopo la sentenza <a class="case-link" onclick="jumpToCase('fransson')">Åkerberg Fransson</a>, che poneva una questione affine sulla portata della Carta.<br><br>Questa causa prosegue la linea tracciata da <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Internationale Handelsgesellschaft</a>: fino a che punto i diritti fondamentali nazionali possono opporsi al primato dell'Unione? La differenza sta nella fonte giuridica — Handelsgesellschaft si fondava su principi generali non scritti, Melloni applica la stessa logica sotto l'egida della Carta, ormai diritto dell'Unione scritto a pieno titolo.<br><br>La causa tocca anche il sistema di fiducia reciproca dell'Unione — il presupposto secondo cui i giudici di ogni Stato membro rispettano uno standard minimo comune, lo stesso presupposto su cui si fonda il mandato d'arresto europeo. Tale presupposto fu nuovamente messo alla prova più tardi, in cause riguardanti la questione se la fiducia reciproca resista quando la magistratura di uno Stato membro subisce pressioni politiche.<br><br>Sul piano strutturale, Melloni conferma una tendenza: quanto più un settore del diritto dell'Unione è armonizzato, tanto minore è il margine che gli Stati membri conservano per i propri standard, per quanto più elevati.`,
     citations:[
       {phrase:"comprometterebbe il principio del primato, consentendo al livello di tutela di variare da uno Stato all'altro", paragraphs:"punto 60", note:"Traduzione non ufficiale elaborata a partire dal testo inglese verificato (punto 60). La lingua di procedura di questa causa era lo spagnolo; né il testo spagnolo autentico né la versione italiana ufficiale della Raccolta sono stati consultati in questa sessione — da verificare rispetto al testo ufficiale.", primary:true}
     ]
   }
 }},

{id:"bavarianlager", name:"Commission v Bavarian Lager", citation:"Case C-28/08 P", jurisdiction:"CJUE", themes:["Institutional balance"], articleIds:[],
 abstract:{
   issue:"When someone requests an EU institution's documents and those documents contain other people's names, which EU rule governs — the access-to-documents rule or the data-protection rule?",
   rule:"Where a request for documents under the access-to-documents regulation would disclose personal data, the data-protection regulation applies in full, not merely as a general exception to be weighed case by case.",
   application:"The Commission was entitled to withhold the names of individuals who attended a meeting, since disclosure had to satisfy the data-protection regulation's own conditions, not just the access regulation's public-interest test."},
 intermediate:{
   issue:"Bavarian Lager, a UK beer importer, complained to the Commission about UK rules restricting its sales. This led to a Commission investigation, including a 1996 meeting.<br><br>Bavarian Lager later asked for the full minutes of that meeting, including the names of everyone who attended.<br><br>The Commission gave out the minutes but hid five names, citing EU data protection rules.<br><br>Which rule wins here: the right to see EU documents, or the right to data protection?",
   rule:"The Court said data protection isn't just one factor to weigh against openness. A request for documents containing personal data must follow the data protection rules in full — it's not a general balancing test, it's a direct handover to a different, stricter set of rules.<br><br>A name can count as personal data, even in a professional context, since the person can still be identified from it.",
   application:"The Commission was allowed to keep the five names hidden.<br><br>Bavarian Lager hadn't shown why it actually needed those specific names. Without that justification, the data protection rules meant the names could stay hidden."},
 detailed:{
   issue:"Bavarian Lager, a UK company importing German beer, complained to the Commission that UK tied-house rules stopped it selling to pubs.<br><br>This triggered an investigation, including a 1996 meeting between the Commission, UK officials, and industry representatives. Bavarian Lager later asked for the full minutes, including every attendee's name.<br><br>The Commission released almost everything, but hid five names — two people had objected to being named, three could not be reached for consent. The Commission cited the EU's Data Protection Regulation.<br><br>The General Court sided with Bavarian Lager, reasoning that just naming someone as a meeting attendee didn't meaningfully threaten their private life. The Commission appealed.",
   rule:`The Court rejected the General Court's approach. Personal data protection isn't just one interest to weigh against openness, case by case.<br><br>Instead, the Access to Documents Regulation works by direct referral: whenever a document request would reveal personal data, the full Data Protection Regulation applies, including its own strict test for whether sharing the data with someone else is actually necessary.<br><br>A name and forename can count as personal data, even when someone is acting in a professional role — the person is still identifiable.<br><br>Bavarian Lager hadn't given any real justification for needing those specific names. Without that justification, the Commission could not properly weigh the competing interests, so it was entitled, arguably required, to withhold them.`,
   application:"The Commission's refusal was upheld. The person asking for documents has to show why they actually need someone else's personal data — it's not the institution's job to justify hiding it by default.<br><br>This case set up a real hierarchy between two EU rules of equal legal rank. It's not about EU law beating national law, like the other cases in this group. It's about which EU rule takes priority when two of them point in different directions."},
 holistic:`Bavarian Lager was decided in 2010, while the older Data Protection Directive still governed EU privacy law — years before the GDPR replaced it in 2018.<br><br>This case sits apart from the others in this batch. <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a>, <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a>, <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, and the Kadi cases are all about EU law beating national or international law. Bavarian Lager is different: it's about two EU rules of equal rank, and which one controls when they clash.<br><br>Later cases picked up the same balancing act between openness and privacy, as EU data protection law grew much stronger under the GDPR. The 'right to be forgotten' line of cases, starting with <span class="case-link-pending" title="Not yet added to Casus">Google Spain</span>, extended this same tension into search engines and the wider internet.<br><br>Structurally, this case shows that 'primacy' questions in EU law aren't only about states versus Brussels. Sometimes the EU has to referee between its own rules.`,
 citations:[
   {phrase:"can constitute personal data even in a professional context, since the individual is identifiable", paragraphs:"para. 68", note:"The Court's holding that names of meeting attendees, even acting professionally, count as personal data.", primary:true},
   {phrase:"had not put forward any express, legitimate justification demonstrating the necessity", paragraphs:"para. 78", note:"The reasoning placing the burden of justifying necessity on the person requesting the data, not the institution withholding it."}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Lorsqu'une personne demande la communication de documents d'une institution de l'Union et que ces documents contiennent les noms d'autres personnes, quelle règle de l'Union s'applique — celle de l'accès aux documents ou celle de la protection des données ?",
       rule:"Lorsqu'une demande de documents présentée en vertu du règlement sur l'accès aux documents aboutirait à divulguer des données à caractère personnel, le règlement sur la protection des données s'applique intégralement, et non comme une simple exception générale à mettre en balance au cas par cas.",
       application:"La Commission était en droit de ne pas divulguer les noms des personnes ayant assisté à une réunion, la divulgation devant satisfaire aux conditions propres du règlement sur la protection des données, et non au seul critère d'intérêt public du règlement sur l'accès."},
     intermediate:{
       issue:"Bavarian Lager, une entreprise britannique important de la bière, se plaignit auprès de la Commission des règles britanniques restreignant ses ventes. Cela conduisit à une enquête de la Commission, incluant une réunion tenue en 1996.<br><br>Bavarian Lager demanda ensuite le compte rendu complet de cette réunion, y compris les noms de tous les participants.<br><br>La Commission communiqua le compte rendu mais occulta cinq noms, invoquant les règles de l'Union relatives à la protection des données.<br><br>Quelle règle l'emporte ici : le droit d'accès aux documents de l'Union, ou le droit à la protection des données ?",
       rule:"La Cour jugea que la protection des données n'est pas simplement un facteur à mettre en balance avec la transparence. Une demande de documents contenant des données à caractère personnel doit suivre intégralement les règles de protection des données — il ne s'agit pas d'un test de mise en balance générale, mais d'un renvoi direct vers un corps de règles distinct et plus strict.<br><br>Un nom peut constituer une donnée à caractère personnel, même dans un contexte professionnel, dès lors que la personne demeure identifiable.",
       application:"La Commission fut autorisée à maintenir l'occultation des cinq noms.<br><br>Bavarian Lager n'avait pas démontré en quoi elle avait réellement besoin de ces noms précis. En l'absence d'une telle justification, les règles de protection des données permettaient de maintenir les noms occultés."},
     detailed:{
       issue:"Bavarian Lager, une entreprise britannique important de la bière allemande, se plaignit auprès de la Commission que la réglementation britannique des « tied houses » l'empêchait de vendre aux pubs.<br><br>Cette plainte déclencha une enquête, incluant une réunion tenue en 1996 entre la Commission, des représentants britanniques et des représentants du secteur. Bavarian Lager demanda ensuite le compte rendu complet, y compris le nom de chaque participant.<br><br>La Commission communiqua la quasi-totalité du document, mais occulta cinq noms — deux personnes s'étaient opposées à être nommées, trois n'avaient pu être jointes pour recueillir leur consentement. La Commission invoqua le règlement de l'Union sur la protection des données.<br><br>Le Tribunal donna raison à Bavarian Lager, estimant que le simple fait de désigner quelqu'un comme participant à une réunion ne menaçait pas véritablement sa vie privée. La Commission forma un pourvoi.",
       rule:`La Cour rejeta le raisonnement du Tribunal. La protection des données à caractère personnel n'est pas un simple intérêt à mettre en balance avec la transparence, au cas par cas.<br><br>Le règlement sur l'accès aux documents fonctionne au contraire par renvoi direct : chaque fois qu'une demande de document révélerait des données à caractère personnel, le règlement sur la protection des données s'applique dans son intégralité, y compris son propre critère strict quant à la nécessité réelle de communiquer ces données à un tiers.<br><br>Un nom et un prénom peuvent constituer des données à caractère personnel, même lorsque la personne agit dans un cadre professionnel — elle demeure identifiable.<br><br>Bavarian Lager n'avait fourni aucune justification réelle de son besoin de ces noms précis. En l'absence d'une telle justification, la Commission ne pouvait mettre correctement en balance les intérêts en présence ; elle était donc en droit, sinon tenue, de ne pas les communiquer.`,
       application:"Le refus de la Commission fut confirmé. C'est à la personne qui demande les documents de démontrer pourquoi elle a réellement besoin des données personnelles d'autrui — il n'appartient pas à l'institution de justifier par défaut leur occultation.<br><br>Cet arrêt établit une véritable hiérarchie entre deux règles de l'Union de rang juridique égal. Il ne s'agit pas, comme dans les autres arrêts de ce groupe, du droit de l'Union l'emportant sur le droit national. Il s'agit de savoir laquelle de deux règles de l'Union prévaut lorsqu'elles pointent dans des directions différentes."},
     holistic:`Bavarian Lager fut rendu en 2010, alors que l'ancienne directive sur la protection des données régissait encore le droit de la vie privée de l'Union — des années avant que le RGPD ne la remplace en 2018.<br><br>Cet arrêt se distingue des autres arrêts de ce corpus. <a class="case-link" onclick="jumpToCase('costaenel')">Costa contre ENEL</a>, <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a>, <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>, et les arrêts Kadi traitent tous du droit de l'Union l'emportant sur le droit national ou international. Bavarian Lager est différent : il s'agit de deux règles de l'Union de rang égal, et de savoir laquelle prévaut lorsqu'elles entrent en conflit.<br><br>Des arrêts ultérieurs reprirent le même exercice de mise en balance entre transparence et vie privée, à mesure que le droit de l'Union de la protection des données se renforçait considérablement sous le RGPD. La lignée jurisprudentielle du « droit à l'oubli », débutant avec <span class="case-link-pending" title="Pas encore ajouté à Casus">Google Spain</span>, prolongea cette même tension jusqu'aux moteurs de recherche et à l'internet dans son ensemble.<br><br>Sur le plan structurel, cet arrêt montre que les questions de « primauté » en droit de l'Union ne concernent pas seulement les États face à Bruxelles. Il arrive que l'Union doive elle-même arbitrer entre ses propres règles.`,
     citations:[
       {phrase:"peut constituer une donnée à caractère personnel même dans un contexte professionnel, dès lors que la personne est identifiable", paragraphs:"point 68", note:"Traduction non officielle établie à partir du texte anglais vérifié (point 68) ; le texte anglais est la langue de procédure authentique de cette affaire, mais la version française officielle du Recueil n'a pas été consultée dans cette session — à vérifier contre le texte officiel.", primary:true},
       {phrase:"n'avait avancé aucune justification expresse et légitime démontrant la nécessité", paragraphs:"point 78", note:"Traduction non officielle du texte anglais vérifié ; non vérifiée contre la version française officielle du Recueil.", primary:false}
     ]

   de:{
     abstract:{
       issue:"Wenn jemand Dokumente eines Unionsorgans anfordert und diese Dokumente die Namen anderer Personen enthalten — welche Unionsregel ist maßgeblich: die über den Zugang zu Dokumenten oder die über den Datenschutz?",
       rule:"Würde ein auf die Zugangsverordnung gestützter Antrag auf Dokumente personenbezogene Daten offenlegen, gilt die Datenschutzverordnung uneingeschränkt und nicht lediglich als allgemeine, im Einzelfall abzuwägende Ausnahme.",
       application:"Die Kommission durfte die Namen von Personen, die an einer Sitzung teilgenommen hatten, zurückhalten, da die Offenlegung den eigenen Voraussetzungen der Datenschutzverordnung genügen musste und nicht nur dem Kriterium des öffentlichen Interesses aus der Zugangsverordnung."},
     intermediate:{
       issue:"Bavarian Lager, ein britisches Bierimportunternehmen, beschwerte sich bei der Kommission über britische Vorschriften, die seine Verkäufe einschränkten. Dies führte zu einer Untersuchung der Kommission, einschließlich einer Sitzung im Jahr 1996.<br><br>Bavarian Lager verlangte später das vollständige Protokoll dieser Sitzung, einschließlich der Namen aller Teilnehmer.<br><br>Die Kommission gab das Protokoll heraus, schwärzte jedoch fünf Namen unter Berufung auf die Datenschutzvorschriften der Union.<br><br>Welche Regel setzt sich hier durch: das Recht auf Zugang zu Unionsdokumenten oder das Recht auf Datenschutz?",
       rule:"Der Gerichtshof entschied, dass der Datenschutz nicht bloß ein gegen die Transparenz abzuwägender Faktor ist. Ein Antrag auf Dokumente, die personenbezogene Daten enthalten, muss den Datenschutzvorschriften vollständig folgen — es handelt sich nicht um eine allgemeine Abwägungsprüfung, sondern um eine unmittelbare Verweisung auf ein anderes, strengeres Regelwerk.<br><br>Ein Name kann personenbezogene Daten darstellen, selbst in einem beruflichen Zusammenhang, da die Person dadurch weiterhin identifizierbar bleibt.",
       application:"Der Kommission war es gestattet, die fünf Namen weiterhin zurückzuhalten.<br><br>Bavarian Lager hatte nicht dargelegt, weshalb es diese bestimmten Namen tatsächlich benötigte. Ohne eine solche Rechtfertigung erlaubten es die Datenschutzvorschriften, die Namen zurückzuhalten."},
     detailed:{
       issue:"Bavarian Lager, ein britisches Unternehmen, das deutsches Bier importierte, beschwerte sich bei der Kommission, dass britische Bierbezugsvorschriften ('tied houses') es daran hinderten, an Pubs zu verkaufen.<br><br>Dies löste eine Untersuchung aus, einschließlich einer Sitzung im Jahr 1996 zwischen der Kommission, britischen Beamten und Vertretern der Branche. Bavarian Lager verlangte später das vollständige Protokoll, einschließlich des Namens jedes Teilnehmers.<br><br>Die Kommission gab nahezu alles heraus, schwärzte jedoch fünf Namen — zwei Personen hatten der Namensnennung widersprochen, drei konnten nicht um ihre Zustimmung ersucht werden. Die Kommission berief sich auf die Datenschutzverordnung der Union.<br><br>Das Gericht gab Bavarian Lager recht und begründete dies damit, dass die bloße Nennung einer Person als Sitzungsteilnehmer deren Privatleben nicht ernsthaft bedrohe. Die Kommission legte Rechtsmittel ein.",
       rule:`Der Gerichtshof verwarf den Ansatz des Gerichts. Der Schutz personenbezogener Daten ist nicht lediglich ein Interesse, das im Einzelfall gegen die Transparenz abzuwägen ist.<br><br>Die Zugangsverordnung funktioniert stattdessen durch unmittelbare Verweisung: Immer wenn ein Dokumentenantrag personenbezogene Daten offenlegen würde, gilt die Datenschutzverordnung in vollem Umfang, einschließlich ihres eigenen strengen Kriteriums, ob die Weitergabe der Daten an einen Dritten tatsächlich erforderlich ist.<br><br>Ein Name und Vorname können personenbezogene Daten darstellen, selbst wenn die Person in einer beruflichen Rolle handelt — sie bleibt weiterhin identifizierbar.<br><br>Bavarian Lager hatte keine tatsächliche Rechtfertigung für die Notwendigkeit dieser bestimmten Namen vorgebracht. Ohne eine solche Rechtfertigung konnte die Kommission die widerstreitenden Interessen nicht ordnungsgemäß abwägen; sie war daher berechtigt, wenn nicht sogar verpflichtet, die Namen zurückzuhalten.`,
       application:"Die Weigerung der Kommission wurde bestätigt. Es obliegt der Person, die Dokumente anfordert, darzulegen, weshalb sie die personenbezogenen Daten einer anderen Person tatsächlich benötigt — es ist nicht Aufgabe des Organs, deren Zurückhaltung standardmäßig zu rechtfertigen.<br><br>Dieses Urteil errichtete eine echte Hierarchie zwischen zwei Unionsvorschriften gleichen Rangs. Es geht dabei nicht, wie bei den anderen Fällen dieser Gruppe, um den Vorrang des Unionsrechts vor nationalem Recht. Es geht darum, welche von zwei Unionsvorschriften den Vorrang hat, wenn sie in unterschiedliche Richtungen weisen."},
     holistic:`Bavarian Lager erging 2010, als die ältere Datenschutzrichtlinie das unionsrechtliche Datenschutzrecht noch regelte — Jahre bevor die DSGVO sie 2018 ablöste.<br><br>Dieses Urteil steht abseits der übrigen Fälle dieser Gruppe. <a class="case-link" onclick="jumpToCase('costaenel')">Costa/ENEL</a>, <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a>, <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> und die Kadi-Fälle betreffen alle den Vorrang des Unionsrechts vor nationalem oder internationalem Recht. Bavarian Lager ist anders gelagert: Es geht um zwei Unionsvorschriften gleichen Rangs und darum, welche von beiden bei einem Widerspruch maßgeblich ist.<br><br>Spätere Urteile griffen dieselbe Abwägung zwischen Transparenz und Datenschutz auf, während sich das unionsrechtliche Datenschutzrecht unter der DSGVO erheblich verstärkte. Die Rechtsprechungslinie zum „Recht auf Vergessenwerden", beginnend mit <span class="case-link-pending" title="Noch nicht bei Casus hinzugefügt">Google Spain</span>, dehnte dieselbe Spannung auf Suchmaschinen und das Internet insgesamt aus.<br><br>Strukturell zeigt dieses Urteil, dass „Vorrang"-Fragen im Unionsrecht nicht nur Staaten gegenüber Brüssel betreffen. Manchmal muss die Union selbst zwischen ihren eigenen Vorschriften vermitteln.`,
     citations:[
       {phrase:"kann personenbezogene Daten darstellen, selbst in einem beruflichen Zusammenhang, da die Person identifizierbar ist", paragraphs:"Randnr. 68", note:"Inoffizielle Übersetzung des verifizierten englischen Textes (Randnr. 68); Englisch ist die authentische Verfahrenssprache dieser Rechtssache, die amtliche deutsche Fassung der Sammlung wurde in dieser Sitzung nicht abgeglichen — gegen den amtlichen Text zu prüfen.", primary:true},
       {phrase:"habe keine ausdrückliche, legitime Rechtfertigung vorgebracht, die die Erforderlichkeit belege", paragraphs:"Randnr. 78", note:"Inoffizielle Übersetzung des verifizierten englischen Textes; nicht gegen die amtliche deutsche Fassung der Sammlung abgeglichen.", primary:false}
     ]
   },
   it:{
     abstract:{
       issue:"Quando qualcuno richiede documenti di un'istituzione dell'Unione e tali documenti contengono nomi di altre persone, quale norma dell'Unione prevale — quella sull'accesso ai documenti o quella sulla protezione dei dati?",
       rule:"Quando una richiesta di documenti presentata ai sensi del regolamento sull'accesso ai documenti comporterebbe la divulgazione di dati personali, il regolamento sulla protezione dei dati si applica integralmente, e non come semplice eccezione generale da bilanciare caso per caso.",
       application:"La Commissione era legittimata a non divulgare i nomi delle persone che avevano partecipato a una riunione, poiché la divulgazione doveva soddisfare le condizioni proprie del regolamento sulla protezione dei dati, e non il solo criterio dell'interesse pubblico previsto dal regolamento sull'accesso."},
     intermediate:{
       issue:"Bavarian Lager, un'impresa britannica importatrice di birra, si lamentò con la Commissione delle norme britanniche che limitavano le sue vendite. Ciò diede avvio a un'indagine della Commissione, comprendente una riunione tenutasi nel 1996.<br><br>Bavarian Lager chiese in seguito il verbale integrale di tale riunione, compresi i nomi di tutti i partecipanti.<br><br>La Commissione fornì il verbale ma occultò cinque nomi, invocando le norme dell'Unione sulla protezione dei dati.<br><br>Quale norma prevale in questo caso: il diritto di accesso ai documenti dell'Unione, o il diritto alla protezione dei dati?",
       rule:"La Corte dichiarò che la protezione dei dati non è semplicemente un fattore da bilanciare con la trasparenza. Una richiesta di documenti contenenti dati personali deve seguire integralmente le norme sulla protezione dei dati — non si tratta di un test di bilanciamento generale, bensì di un rinvio diretto verso un corpo di norme distinto e più rigoroso.<br><br>Un nome può costituire un dato personale anche in un contesto professionale, dal momento che la persona resta comunque identificabile.",
       application:"La Commissione fu autorizzata a mantenere l'occultamento dei cinque nomi.<br><br>Bavarian Lager non aveva dimostrato per quale motivo avesse effettivamente bisogno di quei nomi specifici. In assenza di tale giustificazione, le norme sulla protezione dei dati consentivano di mantenere i nomi occultati."},
     detailed:{
       issue:"Bavarian Lager, un'impresa britannica importatrice di birra tedesca, si lamentò con la Commissione che la normativa britannica sui «tied houses» le impediva di vendere ai pub.<br><br>Ciò diede avvio a un'indagine, comprendente una riunione tenutasi nel 1996 tra la Commissione, funzionari britannici e rappresentanti del settore. Bavarian Lager chiese in seguito il verbale integrale, compreso il nome di ciascun partecipante.<br><br>La Commissione comunicò quasi tutto, ma occultò cinque nomi — due persone si erano opposte a essere nominate, tre non avevano potuto essere contattate per ottenerne il consenso. La Commissione invocò il regolamento dell'Unione sulla protezione dei dati.<br><br>Il Tribunale diede ragione a Bavarian Lager, ritenendo che la semplice indicazione di qualcuno come partecipante a una riunione non minacciasse in modo significativo la sua vita privata. La Commissione propose impugnazione.",
       rule:`La Corte respinse l'impostazione del Tribunale. La protezione dei dati personali non è semplicemente un interesse da bilanciare con la trasparenza, caso per caso.<br><br>Il regolamento sull'accesso ai documenti funziona invece mediante rinvio diretto: ogniqualvolta una richiesta di documenti riveli dati personali, si applica integralmente il regolamento sulla protezione dei dati, compreso il proprio rigoroso criterio circa l'effettiva necessità di comunicare tali dati a un terzo.<br><br>Un nome e un cognome possono costituire dati personali anche quando la persona agisce in veste professionale — essa resta comunque identificabile.<br><br>Bavarian Lager non aveva fornito alcuna reale giustificazione della propria necessità di quei nomi specifici. In assenza di tale giustificazione, la Commissione non poteva bilanciare correttamente gli interessi in gioco; essa era pertanto legittimata, se non addirittura tenuta, a non comunicarli.`,
       application:"Il rifiuto della Commissione fu confermato. Spetta a chi richiede i documenti dimostrare per quale motivo abbia effettivamente bisogno dei dati personali altrui — non spetta all'istituzione giustificare per default il loro occultamento.<br><br>Questa causa istituì una vera e propria gerarchia tra due norme dell'Unione di pari rango giuridico. Non si tratta, come negli altri casi di questo gruppo, del diritto dell'Unione che prevale sul diritto nazionale. Si tratta di stabilire quale delle due norme dell'Unione prevalga quando esse indicano direzioni diverse."},
     holistic:`Bavarian Lager fu decisa nel 2010, quando la precedente direttiva sulla protezione dei dati regolava ancora il diritto alla riservatezza dell'Unione — anni prima che il RGPD la sostituisse nel 2018.<br><br>Questa causa si colloca a parte rispetto alle altre di questo gruppo. <a class="case-link" onclick="jumpToCase('costaenel')">Costa contro ENEL</a>, <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a>, <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a> e le cause Kadi riguardano tutte il diritto dell'Unione che prevale sul diritto nazionale o internazionale. Bavarian Lager è diversa: riguarda due norme dell'Unione di pari rango, e quale delle due prevalga in caso di contrasto.<br><br>Cause successive ripresero lo stesso esercizio di bilanciamento tra trasparenza e riservatezza, mentre il diritto dell'Unione in materia di protezione dei dati si rafforzava considerevolmente con il RGPD. Il filone giurisprudenziale sul «diritto all'oblio», a partire da <span class="case-link-pending" title="Non ancora aggiunto a Casus">Google Spain</span>, estese questa stessa tensione ai motori di ricerca e a internet nel suo complesso.<br><br>Sul piano strutturale, questa causa mostra che le questioni di «primato» nel diritto dell'Unione non riguardano soltanto gli Stati contro Bruxelles. A volte è l'Unione stessa a dover arbitrare tra le proprie norme.`,
     citations:[
       {phrase:"può costituire un dato personale anche in un contesto professionale, dal momento che l'individuo è identificabile", paragraphs:"punto 68", note:"Traduzione non ufficiale elaborata a partire dal testo inglese verificato (punto 68); l'inglese è la lingua di procedura autentica di questa causa, ma la versione italiana ufficiale della Raccolta non è stata consultata in questa sessione — da verificare rispetto al testo ufficiale.", primary:true},
       {phrase:"non aveva addotto alcuna giustificazione espressa e legittima che dimostrasse la necessità", paragraphs:"punto 78", note:"Traduzione non ufficiale del testo inglese verificato; non verificata rispetto alla versione italiana ufficiale della Raccolta.", primary:false}
     ]
   }
 }},

{id:"kadi1", name:"Kadi I", originalName:"Kadi and Al Barakaat International Foundation v Council and Commission", citation:"Joined Cases C-402/05 P & C-415/05 P", jurisdiction:"CJCE", themes:["Fundamental rights","Legal order / primacy / direct effect","External relations / international law"], articleIds:["art267tfeu"],
 abstract:{
   issue:"Must EU measures implementing binding UN Security Council resolutions still comply with EU fundamental rights?",
   rule:"EU courts must ensure full review of the lawfulness of EU acts in light of fundamental rights, including acts that implement UN Security Council resolutions.",
   application:"The regulation freezing Kadi's assets was annulled because it gave him no way to know or challenge the reasons for his listing, violating his rights of defence and to effective judicial protection."},
 intermediate:{
   issue:"Yassin Kadi, a Saudi businessman, had his assets frozen across the EU, under an EU rule implementing a UN Security Council resolution.<br><br>The UN wanted all countries to freeze funds linked to Al-Qaeda. Kadi was never told exactly why he was on the list, and had no real way to challenge it.<br><br>He argued this broke his rights: his right to defend himself, his right to a fair legal challenge, his right to property.<br><br>The lower EU court refused to even check this. It said reviewing the EU rule would indirectly review the UN resolution itself, and that was mostly off-limits.",
   rule:"The Court of Justice disagreed, strongly. EU courts must review the lawfulness of all EU measures against fundamental rights — in principle, full review.<br><br>This applies even to measures that carry out UN Security Council resolutions. Being legally required by a binding UN resolution doesn't exempt the EU's own rule from this check.",
   application:"Kadi was never given the grounds for his listing, and never had a genuine chance to be heard.<br><br>His rights of defence and to effective judicial protection had been broken. So the regulation freezing his assets was struck down, as it applied to him.<br><br>The Court let the rule stay in force briefly, just long enough for the Council to fix the problem."},
 detailed:{
   issue:"Yassin Kadi and the Al Barakaat International Foundation had their funds frozen across the EU, under a Council Regulation implementing UN Security Council resolutions.<br><br>Those resolutions required every country to freeze assets linked to Al-Qaeda, the Taliban, and Usama bin Laden. Kadi was placed on the relevant UN list, and was never told the specific reasons why.<br><br>He had no way to challenge his listing, not before the UN Sanctions Committee, not in any court. He challenged the EU regulation directly, arguing it broke his rights of defence, his right to effective judicial protection, and his right to property.<br><br>At first instance, the Court of First Instance refused to review the measure properly. It reasoned that checking the EU rule against fundamental rights would indirectly question the UN resolution behind it, and said EU courts had no power to do that except for the most extreme violations of international law (jus cogens norms).",
   rule:`The Court of Justice firmly rejected this reasoning. It said the Community is based on the rule of law: neither member states nor EU institutions can escape review of whether their own acts respect the Community's own constitutional foundations.<br><br>An international agreement cannot change how powers are divided under the Treaties, and cannot touch the autonomy of the EU's own legal system.<br><br>So EU courts must review the lawfulness of all EU acts against fundamental rights, in principle fully — including a regulation designed to carry out a binding UN Security Council resolution.<br><br>This didn't mean reviewing the UN resolution itself, only the EU's own implementing measure. But in practice, this came to the same thing: an EU act cannot escape EU fundamental rights review just because it's carrying out an international obligation.<br><br>The Court found Kadi's rights had clearly been broken. He was given no statement of reasons, and no genuine chance to be heard, before or after the freeze.`,
   application:"The regulation was struck down, as far as it applied to Kadi and Al Barakaat.<br><br>The Court paused the effect of this annulment for a short period, giving the Council a chance to fix the problems rather than letting the sanctions lapse entirely.<br><br>Many read this judgment as the Court's clearest statement yet that the EU legal order is autonomous, even from binding UN Security Council obligations. After this ruling, the Security Council itself started publishing a 'summary of reasons' for terrorism listings."},
 holistic:`Kadi I came in 2008, decades after <a class="case-link" onclick="jumpToCase('costaenel')">Costa v ENEL</a> and <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a> built the basic architecture of primacy inside the EU. This case took that same idea and pointed it outward, at international law rather than national law.<br><br>It set up a direct sequel: <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, five years later, tests whether the EU's fix actually worked.<br><br>The case also connects to <a class="case-link" onclick="jumpToCase('opinion213')">Opinion 2/13</a>, decided a few years later. Both are about defending the autonomy of the EU legal order against an outside legal system — here it's the UN framework, there it's the European Convention on Human Rights.<br><br>Structurally, Kadi I is arguably the boldest of the group. Costa asserted EU law beats national law. Kadi I asserted EU fundamental rights review applies even against the UN Security Council, one of the most powerful bodies in international law.`,
 citations:[
   {phrase:"neither its member states nor its institutions can avoid review of whether their acts are consistent with the Community's constitutional charter", paragraphs:"paras 281-285 (region)", note:"The Court's foundational statement on the EU as a rule-of-law based legal order not exempted by international obligations. Flagged with lower confidence: I could not independently corroborate this exact paragraph range against a second source, only the general holding.", primary:false},
   {phrase:"ensure the review, in principle the full review, of the lawfulness of all EU acts in the light of fundamental rights", paragraphs:"para. 326", note:"The central review-standard holding, corroborated across multiple academic sources discussing this judgment.", primary:true}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Les mesures de l'Union mettant en œuvre des résolutions contraignantes du Conseil de sécurité des Nations unies doivent-elles néanmoins respecter les droits fondamentaux de l'Union ?",
       rule:"Les juridictions de l'Union doivent assurer un contrôle complet de la légalité des actes de l'Union au regard des droits fondamentaux, y compris les actes mettant en œuvre des résolutions du Conseil de sécurité des Nations unies.",
       application:"Le règlement gelant les avoirs de M. Kadi fut annulé car il ne lui offrait aucun moyen de connaître ou de contester les motifs de son inscription sur la liste, en violation de ses droits de la défense et de son droit à une protection juridictionnelle effective."},
     intermediate:{
       issue:"Yassin Kadi, un homme d'affaires saoudien, vit ses avoirs gelés dans toute l'Union, en application d'une règle de l'Union mettant en œuvre une résolution du Conseil de sécurité des Nations unies.<br><br>L'ONU demandait à tous les pays de geler les fonds liés à Al-Qaida. M. Kadi ne fut jamais informé précisément des raisons de son inscription sur la liste, et ne disposait d'aucun moyen réel de la contester.<br><br>Il soutint que cela violait ses droits : son droit de se défendre, son droit à un recours juridictionnel effectif, son droit de propriété.<br><br>La juridiction de l'Union de première instance refusa même d'examiner cette question. Elle estima qu'un contrôle de la règle de l'Union reviendrait indirectement à contrôler la résolution de l'ONU elle-même, ce qui échappait pour l'essentiel à sa compétence.",
       rule:"La Cour de justice fut fermement en désaccord. Les juridictions de l'Union doivent contrôler la légalité de toute mesure de l'Union au regard des droits fondamentaux — en principe, un contrôle complet.<br><br>Cela vaut même pour les mesures mettant en œuvre des résolutions du Conseil de sécurité des Nations unies. Le fait d'être juridiquement requise par une résolution contraignante de l'ONU ne dispense pas la règle de l'Union de ce contrôle.",
       application:"M. Kadi ne s'était jamais vu communiquer les motifs de son inscription, et n'avait jamais eu de véritable occasion d'être entendu.<br><br>Ses droits de la défense et son droit à une protection juridictionnelle effective avaient été violés. Le règlement gelant ses avoirs fut donc annulé, en tant qu'il le concernait.<br><br>La Cour laissa la règle produire ses effets pendant une brève période, le temps nécessaire au Conseil pour corriger le problème."},
     detailed:{
       issue:"Yassin Kadi et la Al Barakaat International Foundation virent leurs fonds gelés dans toute l'Union, en application d'un règlement du Conseil mettant en œuvre des résolutions du Conseil de sécurité des Nations unies.<br><br>Ces résolutions imposaient à chaque pays de geler les avoirs liés à Al-Qaida, aux Talibans et à Oussama ben Laden. M. Kadi fut inscrit sur la liste de l'ONU concernée, sans jamais être informé des motifs précis de cette inscription.<br><br>Il n'avait aucun moyen de contester son inscription, ni devant le Comité des sanctions de l'ONU, ni devant une quelconque juridiction. Il contesta directement le règlement de l'Union, faisant valoir une violation de ses droits de la défense, de son droit à une protection juridictionnelle effective et de son droit de propriété.<br><br>En première instance, le Tribunal de première instance refusa d'exercer un contrôle véritable de la mesure. Il estima qu'apprécier la règle de l'Union au regard des droits fondamentaux reviendrait indirectement à remettre en cause la résolution de l'ONU qui la sous-tendait, et jugea que les juridictions de l'Union n'avaient pas ce pouvoir, sauf en cas de violation la plus extrême du droit international (les normes de jus cogens).",
       rule:`La Cour de justice rejeta fermement ce raisonnement. Elle jugea que la Communauté est fondée sur l'État de droit : ni les États membres ni les institutions de l'Union ne peuvent échapper au contrôle de la conformité de leurs propres actes avec les fondements constitutionnels de la Communauté elle-même.<br><br>Un accord international ne peut modifier la répartition des compétences opérée par les traités, ni porter atteinte à l'autonomie de l'ordre juridique de l'Union.<br><br>Les juridictions de l'Union doivent donc contrôler la légalité de tous les actes de l'Union au regard des droits fondamentaux, en principe de façon complète — y compris un règlement destiné à mettre en œuvre une résolution contraignante du Conseil de sécurité des Nations unies.<br><br>Cela ne signifiait pas contrôler la résolution de l'ONU elle-même, mais seulement la mesure d'exécution propre à l'Union. En pratique, cela revenait cependant au même : un acte de l'Union ne peut échapper au contrôle des droits fondamentaux de l'Union au seul motif qu'il met en œuvre une obligation internationale.<br><br>La Cour constata que les droits de M. Kadi avaient manifestement été violés. Aucun exposé des motifs ne lui avait été communiqué, et il n'avait eu aucune véritable occasion d'être entendu, ni avant ni après le gel de ses avoirs.`,
       application:"Le règlement fut annulé, en tant qu'il s'appliquait à M. Kadi et à Al Barakaat.<br><br>La Cour suspendit temporairement les effets de cette annulation, laissant au Conseil l'occasion de corriger les problèmes constatés plutôt que de laisser les sanctions s'éteindre entièrement.<br><br>Beaucoup ont lu cet arrêt comme l'affirmation la plus nette, à ce jour, de l'autonomie de l'ordre juridique de l'Union, y compris à l'égard d'obligations contraignantes émanant du Conseil de sécurité des Nations unies. À la suite de cet arrêt, le Conseil de sécurité lui-même commença à publier un « résumé des motifs » pour les inscriptions sur les listes de terrorisme."},
     holistic:`Kadi I fut rendu en 2008, des décennies après que <a class="case-link" onclick="jumpToCase('costaenel')">Costa contre ENEL</a> et <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a> eurent construit l'architecture de base de la primauté au sein de l'Union. Cet arrêt reprit cette même idée en la tournant vers l'extérieur, vers le droit international plutôt que vers le droit national.<br><br>Il ouvrit la voie à une suite directe : <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, cinq ans plus tard, vérifie si la solution retenue par l'Union a réellement fonctionné.<br><br>Cet arrêt se rattache également à l'<a class="case-link" onclick="jumpToCase('opinion213')">avis 2/13</a>, rendu quelques années plus tard. Tous deux portent sur la défense de l'autonomie de l'ordre juridique de l'Union face à un système juridique extérieur — ici le cadre onusien, là la Convention européenne des droits de l'homme.<br><br>Sur le plan structurel, Kadi I est sans doute l'arrêt le plus audacieux de ce corpus. Costa affirmait que le droit de l'Union prime le droit national. Kadi I affirma que le contrôle unioniste des droits fondamentaux s'impose même face au Conseil de sécurité des Nations unies, l'un des organes les plus puissants du droit international.`,
     citations:[
       {phrase:"ni ses États membres ni ses institutions ne peuvent échapper au contrôle de la conformité de leurs actes avec la charte constitutionnelle de la Communauté", paragraphs:"points 281-285 (zone approximative)", note:"Traduction non officielle du texte anglais vérifié, dont la note d'origine signale elle-même une confiance moindre : la fourchette exacte de paragraphes n'a pas pu être corroborée par une seconde source, seule la thèse générale l'a été. Ni le texte anglais authentique ni la version française officielle du Recueil n'ont été consultés dans cette session.", primary:false},
       {phrase:"assurer le contrôle, en principe complet, de la légalité de tous les actes de l'Union au regard des droits fondamentaux", paragraphs:"point 326", note:"Traduction non officielle du texte anglais vérifié (point 326) ; l'anglais est la langue de procédure authentique de la partie Kadi de cette affaire jointe, mais la version française officielle du Recueil n'a pas été consultée dans cette session — à vérifier contre le texte officiel.", primary:true}
     ]
   },
   de:{
     abstract:{
       issue:"Müssen unionsrechtliche Maßnahmen zur Umsetzung verbindlicher Resolutionen des UN-Sicherheitsrats dennoch die Grundrechte der Union wahren?",
       rule:"Die Unionsgerichte müssen eine vollständige Überprüfung der Rechtmäßigkeit von Unionsrechtsakten am Maßstab der Grundrechte sicherstellen, auch bei Rechtsakten, die Resolutionen des UN-Sicherheitsrats umsetzen.",
       application:"Die Verordnung, mit der die Vermögenswerte von Herrn Kadi eingefroren wurden, wurde für nichtig erklärt, da sie ihm keine Möglichkeit gab, die Gründe für seine Aufnahme in die Liste zu erfahren oder anzufechten, was seine Verteidigungsrechte und sein Recht auf effektiven gerichtlichen Rechtsschutz verletzte."},
     intermediate:{
       issue:"Yassin Kadi, ein saudischer Geschäftsmann, sah seine Vermögenswerte unionsweit eingefroren, aufgrund einer unionsrechtlichen Regelung zur Umsetzung einer Resolution des UN-Sicherheitsrats.<br><br>Die UNO verlangte von allen Staaten, mit Al-Qaida verbundene Gelder einzufrieren. Herrn Kadi wurde nie genau mitgeteilt, weshalb er auf der Liste stand, und er hatte keine wirkliche Möglichkeit, dies anzufechten.<br><br>Er machte geltend, dies verletze seine Rechte: sein Recht auf Verteidigung, sein Recht auf einen wirksamen Rechtsbehelf, sein Eigentumsrecht.<br><br>Das untere Unionsgericht weigerte sich, dies überhaupt zu prüfen. Es befand, eine Überprüfung der Unionsregel würde mittelbar die UN-Resolution selbst überprüfen, was weitgehend seiner Zuständigkeit entzogen sei.",
       rule:"Der Gerichtshof widersprach dem entschieden. Die Unionsgerichte müssen die Rechtmäßigkeit sämtlicher Unionsmaßnahmen am Maßstab der Grundrechte überprüfen — grundsätzlich vollständig.<br><br>Dies gilt auch für Maßnahmen, die Resolutionen des UN-Sicherheitsrats umsetzen. Die rechtliche Verpflichtung durch eine verbindliche UN-Resolution befreit die eigene Regelung der Union nicht von dieser Prüfung.",
       application:"Herrn Kadi waren die Gründe für seine Aufnahme in die Liste nie mitgeteilt worden, und er hatte nie eine echte Gelegenheit zur Anhörung erhalten.<br><br>Seine Verteidigungsrechte und sein Recht auf effektiven gerichtlichen Rechtsschutz waren verletzt worden. Die Verordnung, mit der seine Vermögenswerte eingefroren wurden, wurde daher für nichtig erklärt, soweit sie ihn betraf.<br><br>Der Gerichtshof ließ die Regelung für kurze Zeit weiter in Kraft, gerade lange genug, damit der Rat das Problem beheben konnte."},
     detailed:{
       issue:"Yassin Kadi und die Al Barakaat International Foundation sahen ihre Gelder unionsweit eingefroren, aufgrund einer Verordnung des Rates zur Umsetzung von Resolutionen des UN-Sicherheitsrats.<br><br>Diese Resolutionen verlangten von jedem Staat, mit Al-Qaida, den Taliban und Osama bin Laden verbundene Vermögenswerte einzufrieren. Herr Kadi wurde auf die entsprechende UN-Liste gesetzt und nie über die konkreten Gründe dafür informiert.<br><br>Er hatte keine Möglichkeit, seine Aufnahme in die Liste anzufechten, weder vor dem UN-Sanktionsausschuss noch vor einem Gericht. Er focht die Unionsverordnung unmittelbar an und machte eine Verletzung seiner Verteidigungsrechte, seines Rechts auf effektiven gerichtlichen Rechtsschutz und seines Eigentumsrechts geltend.<br><br>In erster Instanz weigerte sich das Gericht erster Instanz, die Maßnahme wirklich zu überprüfen. Es begründete dies damit, dass eine Prüfung der Unionsregel am Maßstab der Grundrechte mittelbar die zugrunde liegende UN-Resolution in Frage stellen würde, und erklärte, den Unionsgerichten fehle diese Befugnis, außer bei den schwerwiegendsten Verstößen gegen zwingendes Völkerrecht (ius-cogens-Normen).",
       rule:`Der Gerichtshof verwarf diese Begründung entschieden. Er erklärte, die Gemeinschaft beruhe auf dem Rechtsstaatsprinzip: Weder die Mitgliedstaaten noch die Unionsorgane könnten sich der Überprüfung entziehen, ob ihre eigenen Rechtsakte mit den verfassungsrechtlichen Grundlagen der Gemeinschaft selbst vereinbar seien.<br><br>Ein internationales Abkommen könne die durch die Verträge festgelegte Kompetenzverteilung nicht ändern und dürfe die Autonomie des Rechtssystems der Union nicht berühren.<br><br>Die Unionsgerichte müssen daher die Rechtmäßigkeit sämtlicher Unionsrechtsakte am Maßstab der Grundrechte überprüfen, grundsätzlich vollständig — einschließlich einer Verordnung, die eine verbindliche Resolution des UN-Sicherheitsrats umsetzen soll.<br><br>Dies bedeute nicht, die UN-Resolution selbst zu überprüfen, sondern nur die eigene Durchführungsmaßnahme der Union. In der Praxis laufe dies jedoch auf dasselbe hinaus: Ein Unionsrechtsakt könne sich der unionsrechtlichen Grundrechtsprüfung nicht allein deshalb entziehen, weil er eine internationale Verpflichtung umsetze.<br><br>Der Gerichtshof stellte fest, dass die Rechte von Herrn Kadi eindeutig verletzt worden waren. Ihm war weder eine Begründung mitgeteilt worden, noch hatte er, weder vor noch nach dem Einfrieren, eine echte Gelegenheit zur Anhörung erhalten.`,
       application:"Die Verordnung wurde für nichtig erklärt, soweit sie Herrn Kadi und Al Barakaat betraf.<br><br>Der Gerichtshof setzte die Wirkung dieser Nichtigerklärung für eine kurze Zeit aus, um dem Rat Gelegenheit zu geben, die Mängel zu beheben, anstatt die Sanktionen vollständig auslaufen zu lassen.<br><br>Viele lasen dieses Urteil als die bislang klarste Aussage des Gerichtshofs, dass die Rechtsordnung der Union autonom sei, selbst gegenüber verbindlichen Verpflichtungen des UN-Sicherheitsrats. Nach diesem Urteil begann der Sicherheitsrat selbst, eine „Zusammenfassung der Gründe“ für Terrorismus-Listungen zu veröffentlichen."},
     holistic:`Kadi I erging 2008, Jahrzehnte nachdem <a class="case-link" onclick="jumpToCase('costaenel')">Costa/ENEL</a> und <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a> die grundlegende Architektur des Vorrangs innerhalb der Union errichtet hatten. Dieses Urteil wandte dieselbe Idee nach außen, auf das Völkerrecht statt auf nationales Recht.<br><br>Es bereitete eine unmittelbare Fortsetzung vor: <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a> prüfte fünf Jahre später, ob die von der Union gefundene Lösung tatsächlich funktionierte.<br><br>Das Urteil steht auch im Zusammenhang mit dem <a class="case-link" onclick="jumpToCase('opinion213')">Gutachten 2/13</a>, das einige Jahre später erging. Beide betreffen die Verteidigung der Autonomie der Unionsrechtsordnung gegenüber einem äußeren Rechtssystem — hier dem UN-Rahmen, dort der Europäischen Menschenrechtskonvention.<br><br>Strukturell ist Kadi I wohl das kühnste Urteil dieser Gruppe. Costa behauptete, das Unionsrecht gehe dem nationalen Recht vor. Kadi I behauptete, die unionsrechtliche Grundrechtsprüfung gelte selbst gegenüber dem UN-Sicherheitsrat, einem der mächtigsten Organe des Völkerrechts.`,
     citations:[
       {phrase:"weder ihre Mitgliedstaaten noch ihre Organe könnten sich der Überprüfung entziehen, ob ihre Rechtsakte mit der Verfassungsurkunde der Gemeinschaft vereinbar sind", paragraphs:"Randnrn. 281-285 (ungefährer Bereich)", note:"Inoffizielle Übersetzung des verifizierten englischen Textes, dessen eigene Anmerkung bereits geringere Verlässlichkeit vermerkt: Der genaue Randnummernbereich konnte nicht durch eine zweite Quelle bestätigt werden, nur die allgemeine Aussage. Weder der authentische englische Text noch die amtliche deutsche Fassung der Sammlung wurden in dieser Sitzung eingesehen.", primary:false},
       {phrase:"die Überprüfung, grundsätzlich die vollständige Überprüfung, der Rechtmäßigkeit aller Unionsrechtsakte am Maßstab der Grundrechte sicherstellen", paragraphs:"Randnr. 326", note:"Inoffizielle Übersetzung des verifizierten englischen Textes (Randnr. 326); Englisch ist die authentische Verfahrenssprache des Kadi-Teils dieser verbundenen Rechtssache, die amtliche deutsche Fassung der Sammlung wurde in dieser Sitzung nicht abgeglichen — gegen den amtlichen Text zu prüfen.", primary:true}

   it:{
     abstract:{
       issue:"Le misure dell'Unione che attuano risoluzioni vincolanti del Consiglio di sicurezza delle Nazioni Unite devono comunque rispettare i diritti fondamentali dell'Unione?",
       rule:"I giudici dell'Unione devono garantire un controllo completo della legittimità degli atti dell'Unione alla luce dei diritti fondamentali, compresi gli atti che attuano risoluzioni del Consiglio di sicurezza delle Nazioni Unite.",
       application:"Il regolamento che congelava i beni del sig. Kadi fu annullato perché non gli offriva alcun modo di conoscere o contestare i motivi della sua iscrizione nell'elenco, in violazione dei suoi diritti della difesa e del suo diritto a una tutela giurisdizionale effettiva."},
     intermediate:{
       issue:"Yassin Kadi, un uomo d'affari saudita, si vide congelare i beni in tutta l'Unione, in applicazione di una norma dell'Unione che attuava una risoluzione del Consiglio di sicurezza delle Nazioni Unite.<br><br>L'ONU chiedeva a tutti i paesi di congelare i fondi collegati ad Al-Qaida. Al sig. Kadi non fu mai comunicato con precisione il motivo della sua iscrizione nell'elenco, né disponeva di alcun mezzo reale per contestarla.<br><br>Egli sostenne che ciò violasse i suoi diritti: il diritto di difendersi, il diritto a un ricorso giurisdizionale effettivo, il diritto di proprietà.<br><br>Il giudice dell'Unione di primo grado si rifiutò persino di esaminare la questione. Esso ritenne che un controllo della norma dell'Unione avrebbe comportato, indirettamente, un controllo della stessa risoluzione dell'ONU, il che esulava in gran parte dalla sua competenza.",
       rule:"La Corte di giustizia dissentì fermamente. I giudici dell'Unione devono controllare la legittimità di ogni misura dell'Unione alla luce dei diritti fondamentali — in linea di principio, un controllo completo.<br><br>Ciò vale anche per le misure che danno attuazione a risoluzioni del Consiglio di sicurezza delle Nazioni Unite. Il fatto di essere giuridicamente imposta da una risoluzione vincolante dell'ONU non esonera la norma dell'Unione da tale controllo.",
       application:"Al sig. Kadi non furono mai comunicati i motivi della sua iscrizione, né gli fu mai offerta una reale possibilità di essere ascoltato.<br><br>I suoi diritti della difesa e il suo diritto a una tutela giurisdizionale effettiva erano stati violati. Il regolamento che congelava i suoi beni fu quindi annullato, nella parte in cui lo riguardava.<br><br>La Corte lasciò in vigore la norma per un breve periodo, il tempo sufficiente perché il Consiglio potesse porre rimedio al problema."},
     detailed:{
       issue:"Yassin Kadi e la Al Barakaat International Foundation si videro congelare i fondi in tutta l'Unione, in applicazione di un regolamento del Consiglio che attuava risoluzioni del Consiglio di sicurezza delle Nazioni Unite.<br><br>Tali risoluzioni imponevano a ogni paese di congelare i beni collegati ad Al-Qaida, ai Talebani e a Osama bin Laden. Il sig. Kadi fu inserito nell'elenco ONU pertinente, senza che gli fossero mai comunicati i motivi specifici.<br><br>Egli non disponeva di alcun mezzo per contestare la propria iscrizione, né dinanzi al Comitato per le sanzioni dell'ONU, né dinanzi ad alcun giudice. Egli impugnò direttamente il regolamento dell'Unione, sostenendo che esso violasse i suoi diritti della difesa, il suo diritto a una tutela giurisdizionale effettiva e il suo diritto di proprietà.<br><br>In primo grado, il Tribunale di primo grado si rifiutò di esercitare un controllo effettivo della misura. Esso ritenne che valutare la norma dell'Unione alla luce dei diritti fondamentali avrebbe rimesso in discussione, indirettamente, la risoluzione dell'ONU sottostante, e affermò che i giudici dell'Unione non disponevano di tale potere, salvo per le violazioni più gravi del diritto internazionale (norme di jus cogens).",
       rule:`La Corte di giustizia respinse fermamente questo ragionamento. Essa affermò che la Comunità si fonda sullo Stato di diritto: né gli Stati membri né le istituzioni dell'Unione possono sottrarsi al controllo della conformità dei propri atti ai fondamenti costituzionali della Comunità stessa.<br><br>Un accordo internazionale non può modificare la ripartizione delle competenze stabilita dai trattati, né pregiudicare l'autonomia dell'ordinamento giuridico dell'Unione.<br><br>I giudici dell'Unione devono quindi controllare la legittimità di tutti gli atti dell'Unione alla luce dei diritti fondamentali, in linea di principio integralmente — compreso un regolamento destinato ad attuare una risoluzione vincolante del Consiglio di sicurezza delle Nazioni Unite.<br><br>Ciò non significava controllare la risoluzione dell'ONU in quanto tale, bensì soltanto la misura di attuazione propria dell'Unione. In pratica, tuttavia, ciò equivaleva allo stesso risultato: un atto dell'Unione non può sottrarsi al controllo unionale dei diritti fondamentali per il solo fatto di dare attuazione a un obbligo internazionale.<br><br>La Corte constatò che i diritti del sig. Kadi erano stati manifestamente violati. Non gli era stata comunicata alcuna motivazione, né gli era stata offerta una reale possibilità di essere ascoltato, né prima né dopo il congelamento.`,
       application:"Il regolamento fu annullato, nella parte in cui riguardava il sig. Kadi e Al Barakaat.<br><br>La Corte sospese temporaneamente gli effetti di tale annullamento, concedendo al Consiglio l'occasione di porre rimedio ai problemi riscontrati anziché lasciare che le sanzioni decadessero interamente.<br><br>Molti hanno letto questa sentenza come l'affermazione più netta, fino ad allora, dell'autonomia dell'ordinamento giuridico dell'Unione, anche rispetto a obblighi vincolanti del Consiglio di sicurezza delle Nazioni Unite. In seguito a questa sentenza, lo stesso Consiglio di sicurezza iniziò a pubblicare una «sintesi dei motivi» per le iscrizioni relative al terrorismo."},
     holistic:`Kadi I fu decisa nel 2008, decenni dopo che <a class="case-link" onclick="jumpToCase('costaenel')">Costa contro ENEL</a> e <a class="case-link" onclick="jumpToCase('handelsgesellschaft')">Handelsgesellschaft</a> avevano costruito l'architettura di base del primato all'interno dell'Unione. Questa causa riprese la medesima idea rivolgendola verso l'esterno, verso il diritto internazionale anziché il diritto nazionale.<br><br>Essa preparò il terreno per un seguito diretto: <a class="case-link" onclick="jumpToCase('kadi2')">Kadi II</a>, cinque anni dopo, verifica se la soluzione adottata dall'Unione abbia effettivamente funzionato.<br><br>La causa si ricollega inoltre all'<a class="case-link" onclick="jumpToCase('opinion213')">avviso 2/13</a>, reso qualche anno più tardi. Entrambe riguardano la difesa dell'autonomia dell'ordinamento giuridico dell'Unione nei confronti di un sistema giuridico esterno — qui il quadro delle Nazioni Unite, là la Convenzione europea dei diritti dell'uomo.<br><br>Sul piano strutturale, Kadi I è forse la sentenza più audace di questo gruppo. Costa affermò che il diritto dell'Unione prevale sul diritto nazionale. Kadi I affermò che il controllo unionale dei diritti fondamentali si impone persino nei confronti del Consiglio di sicurezza delle Nazioni Unite, uno degli organi più potenti del diritto internazionale.`,
     citations:[
       {phrase:"né i suoi Stati membri né le sue istituzioni possono sottrarsi al controllo della conformità dei loro atti alla carta costituzionale della Comunità", paragraphs:"punti 281-285 (zona approssimativa)", note:"Traduzione non ufficiale del testo inglese verificato, la cui nota originale segnala già una minore affidabilità: l'esatto intervallo di punti non ha potuto essere confermato da una seconda fonte, solo la tesi generale. Né il testo inglese autentico né la versione italiana ufficiale della Raccolta sono stati consultati in questa sessione.", primary:false},
       {phrase:"garantire il controllo, in linea di principio il controllo completo, della legittimità di tutti gli atti dell'Unione alla luce dei diritti fondamentali", paragraphs:"punto 326", note:"Traduzione non ufficiale del testo inglese verificato (punto 326); l'inglese è la lingua di procedura autentica della parte Kadi di questa causa riunita, la versione italiana ufficiale della Raccolta non è stata consultata in questa sessione — da verificare rispetto al testo ufficiale.", primary:true}
     ]
   }
 }},

{id:"kadi2", name:"Kadi II", originalName:"Commission and Others v Yassin Abdullah Kadi", citation:"Joined Cases C-584/10 P, C-593/10 P & C-595/10 P", jurisdiction:"CJUE", themes:["Legal order / primacy / direct effect","External relations / international law"], articleIds:["art267tfeu"],
 abstract:{
   issue:"After the EU tried to fix the procedural defects Kadi I identified, was the revised listing process now good enough?",
   rule:"The Court reaffirmed its Kadi I standard of full judicial review, and required that at least some evidence, not just an unsubstantiated summary of reasons, actually support a listing decision.",
   application:"The Commission's re-adopted listing of Kadi was annulled again, since it still relied on unsubstantiated allegations he had no real opportunity to rebut."},
 intermediate:{
   issue:"After Kadi I, the Commission tried again. It re-froze Kadi's assets, this time giving him a 'summary of reasons' from the UN and a chance to respond first.<br><br>Kadi challenged this new listing too, and the General Court agreed with him again — it said the summary of reasons was still too vague, and Kadi still couldn't properly defend himself.<br><br>The Commission, Council, and UK appealed, arguing the courts were demanding too much, given this was a sensitive security area.",
   rule:"The Court of Justice confirmed its own Kadi I standard: courts must fully review EU sanctions measures against fundamental rights.<br><br>This applies even in sensitive security cases. A security-sensitive area doesn't lower the standard, though it can justify hiding truly sensitive evidence.",
   application:"Most of the specific claims against Kadi were never backed up by actual evidence, even after he challenged them.<br><br>So the re-adopted listing was struck down again — the second time Kadi's assets were unfrozen through EU courts."},
 detailed:{
   issue:"After Kadi I struck down the original freeze, the Commission tried again with a new process. It gave Kadi the UN Sanctions Committee's published 'summary of reasons,' and invited his comments before deciding whether to keep the EU freeze.<br><br>Kadi challenged this second listing too. In 2010, the General Court annulled it again, in a separate judgment (Kadi v Commission). It found the summary of reasons still too vague, meaning Kadi still couldn't properly defend himself, and said the security-sensitive nature of terrorism cases doesn't lower this standard of review.<br><br>The Commission, Council, and UK appealed to the Court of Justice, arguing the General Court's standard was unrealistic given this area depends on international security cooperation.",
   rule:`The Court of Justice, sitting as a Grand Chamber, dismissed the appeals, confirming its own approach from Kadi I.<br><br>EU courts must review the lawfulness of all EU measures against fundamental rights, fully in principle — including measures in the sanctions and terrorism area. This obligation doesn't shrink just because the underlying measure is international or security-sensitive.<br><br>The Court accepted that genuinely sensitive evidence doesn't always need to be shown to the person affected — courts can use closed procedures to test such evidence privately.<br><br>But at least the substance of the reasons and evidence must be shared, in a way that lets the person actually defend themselves. A listing cannot survive on bare assertions alone, ones the government or UN committee won't or can't back up when challenged.`,
   application:"Most of the specific claims behind Kadi's listing were never backed by any disclosed evidence, even after he directly challenged them.<br><br>So the re-adopted freeze on his assets was struck down a second time. Read together, Kadi I and Kadi II form a two-part doctrine: the EU legal order will always review sanctions against fundamental rights, no matter the international pressure (Kadi I), and that review has real teeth — an unsubstantiated listing will not survive it twice (Kadi II)."},
 holistic:`Kadi II came in 2013, five years after <a class="case-link" onclick="jumpToCase('kadi1')">Kadi I</a>, the same year as <a class="case-link" onclick="jumpToCase('melloni')">Melloni</a>. This timing matters: the Court was, in the same year, defending both the EU's autonomy from the UN (Kadi II) and its own internal primacy against national constitutional standards (Melloni).<br><br>This case is the direct sequel to Kadi I. Where Kadi I set the standard, Kadi II tests whether the EU institutions had actually met it. They hadn't.<br><br>Later cases in the sanctions and terrorism space kept refining exactly how much evidence has to be disclosed, and how — this remains a live, developing area of EU law.<br><br>Structurally, Kadi I and Kadi II together are the clearest example of the EU asserting fundamental rights review over measures carrying out binding international obligations — arguably the outer edge of how far EU legal autonomy reaches.`,
 citations:[
   {phrase:"is not displaced by the international or security-sensitive character of the underlying measure", paragraphs:"general holding, precise paragraph not independently confirmed", note:"I could not corroborate a specific paragraph number for this 2013 Court of Justice text from independent sources — the paragraph citations I found for this stage of the Kadi saga trace to the related 2010 General Court judgment (T-85/09), not this appeal judgment itself. Treat this as an unconfirmed reference pending direct verification against the judgment text.", primary:false}
 ],
 translations:{
   fr:{
     abstract:{
       issue:"Après que l'Union eut tenté de corriger les vices de procédure relevés dans Kadi I, la procédure d'inscription révisée était-elle désormais suffisante ?",
       rule:"La Cour réaffirma la norme de contrôle juridictionnel complet posée dans Kadi I, et exigea qu'au moins certains éléments de preuve, et non un simple résumé non étayé des motifs, viennent réellement soutenir une décision d'inscription.",
       application:"La nouvelle inscription de M. Kadi par la Commission fut à nouveau annulée, dès lors qu'elle reposait toujours sur des allégations non étayées qu'il n'avait aucune possibilité réelle de contester."},
     intermediate:{
       issue:"Après Kadi I, la Commission tenta une nouvelle fois. Elle gela de nouveau les avoirs de M. Kadi, en lui communiquant cette fois un « résumé des motifs » émanant de l'ONU et en lui donnant l'occasion de répondre au préalable.<br><br>M. Kadi contesta également cette nouvelle inscription, et le Tribunal lui donna à nouveau raison — il jugea le résumé des motifs toujours trop vague, et estima que M. Kadi ne pouvait toujours pas se défendre correctement.<br><br>La Commission, le Conseil et le Royaume-Uni formèrent un pourvoi, faisant valoir que les juridictions exigeaient trop, s'agissant d'un domaine sensible touchant à la sécurité.",
       rule:"La Cour de justice confirma sa propre norme posée dans Kadi I : les juridictions doivent exercer un contrôle complet des mesures de sanction de l'Union au regard des droits fondamentaux.<br><br>Cela vaut même dans les affaires sensibles touchant à la sécurité. Un domaine sensible sur le plan sécuritaire n'abaisse pas la norme de contrôle, même s'il peut justifier de ne pas divulguer des éléments de preuve véritablement sensibles.",
       application:"La plupart des allégations précises formulées contre M. Kadi ne furent jamais étayées par des éléments de preuve concrets, même après qu'il les eut contestées.<br><br>La nouvelle inscription fut donc annulée à nouveau — la deuxième fois que les avoirs de M. Kadi furent débloqués grâce aux juridictions de l'Union."},
     detailed:{
       issue:"Après l'annulation du gel initial par Kadi I, la Commission tenta une nouvelle procédure. Elle communiqua à M. Kadi le « résumé des motifs » publié par le Comité des sanctions de l'ONU, et l'invita à présenter ses observations avant de décider de maintenir le gel au niveau de l'Union.<br><br>M. Kadi contesta également cette seconde inscription. En 2010, le Tribunal l'annula à nouveau, dans un arrêt distinct (Kadi contre Commission). Il jugea le résumé des motifs toujours trop vague, ce qui signifiait que M. Kadi ne pouvait toujours pas se défendre correctement, et affirma que la nature sensible, du point de vue sécuritaire, des affaires de terrorisme n'abaissait pas cette norme de contrôle.<br><br>La Commission, le Conseil et le Royaume-Uni formèrent un pourvoi devant la Cour de justice, soutenant que la norme retenue par le Tribunal était irréaliste compte tenu du fait que ce domaine dépend de la coopération internationale en matière de sécurité.",
       rule:`La Cour de justice, siégeant en grande chambre, rejeta les pourvois, confirmant sa propre approche retenue dans Kadi I.<br><br>Les juridictions de l'Union doivent contrôler la légalité de toutes les mesures de l'Union au regard des droits fondamentaux, en principe pleinement — y compris les mesures relevant du domaine des sanctions et du terrorisme. Cette obligation ne se réduit pas du seul fait que la mesure sous-jacente est de nature internationale ou sensible sur le plan sécuritaire.<br><br>La Cour admit que des éléments de preuve véritablement sensibles ne doivent pas nécessairement être communiqués à la personne concernée — les juridictions peuvent recourir à des procédures confidentielles pour apprécier de tels éléments à l'abri du contradictoire.<br><br>Mais la substance au moins des motifs et des preuves doit être communiquée, d'une manière qui permette à la personne concernée de réellement se défendre. Une inscription ne saurait subsister sur de simples affirmations, que le gouvernement ou le comité de l'ONU ne veulent ou ne peuvent étayer une fois contestées.`,
       application:"La plupart des allégations précises fondant l'inscription de M. Kadi ne furent jamais étayées par des éléments de preuve communiqués, même après qu'il les eut directement contestées.<br><br>Le gel réadopté de ses avoirs fut donc annulé une seconde fois. Lus ensemble, Kadi I et Kadi II forment une doctrine en deux volets : l'ordre juridique de l'Union contrôlera toujours les sanctions au regard des droits fondamentaux, quelle que soit la pression internationale (Kadi I), et ce contrôle a une réelle portée — une inscription non étayée n'y résistera pas deux fois (Kadi II)."},
