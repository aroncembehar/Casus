{id:"marshall", name:"Marshall", originalName:"M. H. Marshall v Southampton and South-West Hampshire Area Health Authority (Teaching)", citation:"Case 152/84", jurisdiction:"CJCE", themes:["Secondary law / legal acts","Preliminary reference"], articleIds:["dir76207","art267tfeu"],
 abstract:{
   issue:"Can an individual rely directly on an EU directive against a private employer, the same way she could against a public body?",
   rule:"A directive cannot of itself impose obligations on a private individual and cannot be relied upon as such against one; it can only be relied on directly against the State, regardless of the capacity — employer or public authority — in which the State is acting.",
   application:"Because Marshall's employer was a public health authority, an emanation of the State, she could rely on the Equal Treatment Directive directly against it, even though a private-sector employee in the same position could not have relied on the Directive against a private employer."},
 intermediate:{
   issue:"Helen Marshall worked as a senior dietitian for a public health authority in England. The authority's policy was to retire women at 60 and men at 65, though it had discretion to keep staff on past that age.<br><br>Marshall was kept on past 60, but dismissed four weeks after turning 62, essentially once she reached what the authority treated as the normal retiring age for a woman. She wanted to keep working until 65, as a man in her position could.<br><br>She argued this breached the EU's Equal Treatment Directive. UK law at the time still allowed different retirement ages tied to state pension age, so she needed to invoke the Directive itself, not just domestic law.",
   rule:"The Court agreed the dismissal fell within the Directive's guarantee of equal treatment in dismissal, and that the state-pension-age exception did not cover this.<br><br>But it then addressed a bigger question: can a directive be relied on directly at all, and against whom? The Court held that a directive is addressed to member states — it cannot by itself create obligations for a private individual, and cannot be invoked directly against one.<br><br>It can, however, be relied on directly against the State itself. And that includes any public body, whatever capacity it happens to be acting in — including when it is simply acting as an employer, a role a private company could equally occupy.",
   application:"Because Marshall's employer was a public health authority, she could rely on the Directive against it directly, even though the authority was acting only as an ordinary employer when it dismissed her.<br><br>A private-sector worker dismissed on exactly the same discriminatory grounds could not have relied on the Directive itself against her employer — only against the State."},
 detailed:{
   issue:"Helen Marshall was employed as a senior dietitian by the Southampton and South West Hampshire Area Health Authority, a public body responsible for health services in England.<br><br>The Authority's general policy was to require women to retire at 60 and men at 65 — the ages then attached to the UK state pension — though it retained discretion to keep an employee on past that age. Marshall was kept on past 60, but was dismissed on 31 March 1980, about four weeks after turning 62, essentially because she had reached what the Authority treated as the normal retiring age for a woman. She had made clear she wished to continue working until 65, as a man in an equivalent post could have done.<br><br>Marshall brought a claim before an Industrial Tribunal, arguing this breached Council Directive 76/207/EEC on equal treatment for men and women, in particular its Article 5(1) guarantee of equal treatment regarding working conditions, including the conditions governing dismissal. At the time, the UK's own Sex Discrimination Act 1975 still permitted different retirement ages linked to state pensionable age, so domestic law alone would not have helped her claim.<br><br>After proceedings before the Employment Appeal Tribunal, the Court of Appeal referred two questions to the Court of Justice under Article 177 EEC: first, whether a discriminatory retirement-age policy of this kind fell within the Directive's guarantee on dismissal; second, if so, whether Marshall could rely on the Directive directly against the Area Health Authority, given the state of UK implementing law at the time.",
   rule:`On the first question, the Court held that dismissal connected to a general retirement-age policy fell within "conditions governing dismissal" under Article 5(1) of the Directive, and that the exception in Article 7 for state pensionable age applied to pension entitlement, not to setting a discriminatory dismissal age.<br><br>On the second, larger question, the Court confirmed a directive can produce direct effect where its terms are unconditional and sufficiently precise, once the implementation deadline has passed — but it then drew a sharp limit on who that direct effect could run against. According to Article 189 of the EEC Treaty, a directive's binding nature exists only in relation to "each Member State to which it is addressed." It followed, in the Court's words, that a directive may not of itself impose obligations on an individual, and a provision of a directive may not be relied upon as such against such a person.<br><br>The Court then addressed who counts as the State for these purposes. Where a person involved in legal proceedings is able to rely on a directive as against the State, they may do so regardless of the capacity in which the State is acting, whether as employer or as public authority — the reasoning being that the State should not be able to take advantage of its own failure to implement EU law correctly, and it makes no difference in which capacity it is acting when it does so.`,
   application:"The Area Health Authority was a public body, and so counted as an emanation of the State for these purposes, even though in dismissing Marshall it was acting simply as an ordinary employer.<br><br>Marshall could therefore rely on the Equal Treatment Directive directly against the Authority, and the discriminatory retirement-age policy could not be applied to her.<br><br>The judgment left open exactly how far 'the State' extends beyond central government and traditional public authorities — a gap later filled by the Court's four-part test in Foster v British Gas (1990)."},
 holistic:`Marshall was decided in 1986, twenty-three years after <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> first held that Treaty provisions could take direct effect for individuals. This case answered a narrower, harder question: does the same hold for directives, and against whom?<br><br>The Court had already extended direct effect into relationships between private parties for Treaty articles, in <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne v Sabena</a>. Marshall drew a firm line stopping that same move for directives: a directive binds member states, not private individuals, so it cannot be invoked horizontally, only vertically, against the State.<br><br>That line created its own hard question — what counts as 'the State'? Marshall gave a first, generous answer: any public body, in any capacity, including as an ordinary employer. The Court's later decision in <span class="case-link-pending" title="Not yet added to Casus">Foster v British Gas</span> turned that answer into a structured four-part test.<br><br>Structurally, Marshall is why two workers dismissed on identical discriminatory grounds — one for a public authority, one for a private company — could end up in different legal positions under EU law alone, unless national law happened to close that gap itself. That asymmetry is also what later reinforced the Court's parallel doctrine of indirect effect, requiring national courts to interpret domestic law in light of directives wherever possible.`,
 citations:[
   {phrase:"a directive may not of itself impose obligations on an individual and... a provision of a directive may not be relied upon as such against such a person", paragraphs:"para. 48", note:"The core vertical-only holding. Verified via secondary source (cross-checked academic/case-law commentary); direct EUR-Lex fetch of the primary judgment text failed (page returned empty) — flagged per standing convention.", primary:true},

 ],
 translations:{
   fr:{
     abstract:{
       issue:"Un particulier peut-il invoquer directement une directive de l'UE à l'encontre d'un employeur privé, de la même manière qu'à l'encontre d'un organisme public ?",
       rule:"Une directive ne peut, par elle-même, créer d'obligations à la charge d'un particulier et ne peut être invoquée en tant que telle à son encontre ; elle ne peut être invoquée directement qu'à l'encontre de l'État, quelle que soit la qualité — employeur ou autorité publique — en laquelle celui-ci agit.",
       application:"L'employeur de Mme Marshall étant un organisme public de santé, une émanation de l'État, elle pouvait invoquer directement la directive sur l'égalité de traitement à son encontre, alors qu'une salariée du secteur privé placée dans la même situation n'aurait pas pu invoquer la directive contre un employeur privé."},
     intermediate:{
       issue:"Helen Marshall travaillait comme diététicienne principale pour un organisme public de santé en Angleterre. La politique de cet organisme consistait à mettre les femmes à la retraite à 60 ans et les hommes à 65 ans, tout en conservant la faculté de maintenir un salarié en poste au-delà de cet âge.<br><br>Mme Marshall fut maintenue en poste après 60 ans, mais licenciée quatre semaines après avoir atteint 62 ans, essentiellement parce qu'elle avait atteint l'âge que l'organisme considérait comme l'âge normal de départ à la retraite pour une femme. Elle souhaitait continuer à travailler jusqu'à 65 ans, comme aurait pu le faire un homme occupant un poste équivalent.<br><br>Elle soutint que ce licenciement violait la directive européenne sur l'égalité de traitement. Le droit britannique de l'époque autorisait encore des âges de départ à la retraite différenciés, liés à l'âge de la pension d'État ; elle devait donc invoquer la directive elle-même, et non le seul droit interne.",
       rule:"La Cour jugea que ce licenciement relevait de la garantie d'égalité de traitement en matière de licenciement prévue par la directive, et que l'exception relative à l'âge de la pension d'État ne couvrait pas cette situation.<br><br>Elle aborda ensuite une question plus large : une directive peut-elle être invoquée directement, et à l'encontre de qui ? La Cour jugea qu'une directive s'adresse aux États membres — elle ne peut, par elle-même, créer d'obligations à la charge d'un particulier, ni être invoquée directement à son encontre.<br><br>Elle peut en revanche être invoquée directement à l'encontre de l'État lui-même. Cela inclut tout organisme public, quelle que soit la qualité en laquelle il agit — y compris lorsqu'il agit simplement en tant qu'employeur, un rôle qu'une entreprise privée pourrait tout aussi bien occuper.",
       application:"L'employeur de Mme Marshall étant un organisme public de santé, elle pouvait invoquer directement la directive à son encontre, alors même que l'organisme n'agissait, en la licenciant, qu'en simple qualité d'employeur.<br><br>Une salariée du secteur privé licenciée exactement pour les mêmes motifs discriminatoires n'aurait pas pu invoquer la directive elle-même contre son employeur — seulement contre l'État."},
     detailed:{
       issue:"Helen Marshall était employée comme diététicienne principale par la Southampton and South West Hampshire Area Health Authority, un organisme public responsable des services de santé en Angleterre.<br><br>La politique générale de cet organisme consistait à imposer la retraite aux femmes à 60 ans et aux hommes à 65 ans — âges alors liés à la pension d'État britannique — tout en conservant la faculté de maintenir un salarié en poste au-delà. Mme Marshall fut maintenue en poste après 60 ans, mais licenciée le 31 mars 1980, environ quatre semaines après avoir atteint 62 ans, essentiellement parce qu'elle avait atteint l'âge que l'organisme considérait comme l'âge normal de départ à la retraite pour une femme. Elle avait clairement exprimé son souhait de continuer à travailler jusqu'à 65 ans, comme aurait pu le faire un homme occupant un poste équivalent.<br><br>Mme Marshall saisit un tribunal du travail, soutenant que ce licenciement violait la directive 76/207/CEE du Conseil relative à l'égalité de traitement entre hommes et femmes, en particulier la garantie d'égalité de traitement en matière de conditions de travail, y compris les conditions de licenciement, prévue à son article 5, paragraphe 1. À l'époque, le Sex Discrimination Act 1975 britannique autorisait encore des âges de départ à la retraite différenciés selon l'âge de la pension d'État, de sorte que le seul droit interne ne pouvait fonder sa demande.<br><br>Après une procédure devant l'Employment Appeal Tribunal, la Court of Appeal posa deux questions préjudicielles à la Cour de justice sur le fondement de l'article 177 CEE : premièrement, si une politique d'âge de départ à la retraite discriminatoire de ce type relevait de la garantie de la directive en matière de licenciement ; deuxièmement, dans l'affirmative, si Mme Marshall pouvait invoquer directement la directive à l'encontre de l'organisme, compte tenu de l'état de la transposition en droit britannique à l'époque.",
       rule:`Sur la première question, la Cour jugea qu'un licenciement lié à une politique générale d'âge de départ à la retraite relevait des « conditions de licenciement » au sens de l'article 5, paragraphe 1, de la directive, et que l'exception de l'article 7 relative à l'âge de la pension d'État concernait le droit à pension, non la fixation d'un âge de licenciement discriminatoire.<br><br>Sur la seconde question, plus large, la Cour confirma qu'une directive peut produire un effet direct lorsque ses termes sont inconditionnels et suffisamment précis, une fois le délai de transposition expiré — mais elle traça aussitôt une limite nette quant à la personne contre laquelle cet effet direct pouvait être invoqué. Selon l'article 189 du traité CEE, le caractère obligatoire d'une directive n'existe qu'à l'égard de « tout État membre destinataire ». Il en résulte, selon les termes de la Cour, qu'une directive ne peut, par elle-même, créer d'obligations à la charge d'un particulier, et qu'une disposition d'une directive ne peut être invoquée en tant que telle à l'encontre d'un tel particulier.<br><br>La Cour précisa ensuite qui devait être regardé comme l'État à cette fin. Lorsqu'un justiciable est en mesure d'invoquer une directive à l'encontre de l'État, il peut le faire quelle que soit la qualité en laquelle ce dernier agit, employeur ou autorité publique — le raisonnement étant que l'État ne saurait tirer avantage de son propre manquement à transposer correctement le droit communautaire, peu important à cet égard la qualité en laquelle il agit.`,
       application:"L'Area Health Authority était un organisme public et devait donc être regardée comme une émanation de l'État à cette fin, alors même qu'en licenciant Mme Marshall elle agissait en simple qualité d'employeur ordinaire.<br><br>Mme Marshall pouvait donc invoquer directement la directive sur l'égalité de traitement à l'encontre de l'organisme, et la politique discriminatoire d'âge de départ à la retraite ne pouvait lui être appliquée.<br><br>L'arrêt laissa ouverte la question de savoir jusqu'où s'étendait précisément la notion d'« État » au-delà du gouvernement central et des autorités publiques traditionnelles — une lacune comblée plus tard par le test à quatre critères dégagé par la Cour dans l'arrêt Foster contre British Gas (1990)."},
     holistic:`L'arrêt Marshall a été rendu en 1986, vingt-trois ans après que <a class="case-link" onclick="jumpToCase('vangend')">Van Gend en Loos</a> a jugé pour la première fois que des dispositions du traité pouvaient produire un effet direct au profit des particuliers. Cet arrêt répond à une question plus étroite et plus délicate : cela vaut-il également pour les directives, et à l'encontre de qui ?<br><br>La Cour avait déjà étendu l'effet direct aux relations entre particuliers s'agissant des articles du traité, dans l'arrêt <a class="case-link" onclick="jumpToCase('defrenne')">Defrenne contre Sabena</a>. L'arrêt Marshall traça une limite nette empêchant la même extension pour les directives : une directive lie les États membres, non les particuliers ; elle ne peut donc être invoquée horizontalement, mais seulement verticalement, à l'encontre de l'État.<br><br>Cette limite souleva sa propre difficulté : que recouvre la notion d'« État » ? L'arrêt Marshall y apporta une première réponse généreuse : tout organisme public, quelle que soit la qualité en laquelle il agit, y compris comme simple employeur. La décision ultérieure de la Cour dans <span class="case-link-pending" title="Pas encore ajouté à Casus">Foster contre British Gas</span> transforma cette réponse en un test structuré à quatre critères.<br><br>Sur le plan structurel, l'arrêt Marshall explique pourquoi deux salariés licenciés pour des motifs discriminatoires identiques — l'un par une autorité publique, l'autre par une entreprise privée — pouvaient se retrouver dans des situations juridiques différentes au regard du seul droit de l'Union, sauf si le droit national comblait lui-même cet écart. Cette asymétrie renforça aussi, par la suite, la doctrine parallèle de l'effet indirect, qui impose aux juridictions nationales d'interpréter le droit interne à la lumière des directives chaque fois que possible.`,
